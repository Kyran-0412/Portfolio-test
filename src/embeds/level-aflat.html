<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 9: Survival Waves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link data-include="lib/theme.css">
<link data-include="lib/level.css">
<style>
  #play { padding-top: 8px; }
  .arena { position: relative; width: 900px; max-width: 100%; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--accent); background: #121116; cursor: none; }
  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(18, 17, 22, 0.96); border-radius: 10px; text-align: center; padding: 16px;
  }
  .overlay.show { display: flex; animation: fade-in 0.3s ease-out both; }
  .overlay h2 { margin: 0; font: 600 34px var(--heading); letter-spacing: 0.02em; }
  .choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .choice {
    width: 220px; padding: 16px 14px; border-radius: 12px; cursor: pointer; text-align: left;
    background: linear-gradient(#2c2735, #211e28); border: 1px solid var(--mid); color: var(--text);
    display: flex; flex-direction: column; gap: 6px; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-3px); border-color: var(--glow); box-shadow: 0 0 18px rgba(200, 184, 255, 0.45); outline: none; }
  .choice .icon { font-size: 26px; }
  .choice strong { font: 600 19px var(--heading); letter-spacing: 0.03em; }
  .choice span { font-size: 13px; color: var(--quiet); line-height: 1.4; }
  .choice em { font: 500 11px var(--heading); letter-spacing: 0.14em; text-transform: uppercase; color: var(--bright); font-style: normal; }
  .controls-help { font-size: 13px; color: var(--quiet); }
  .controls-help kbd { font: 600 12px var(--heading); color: var(--glow); background: var(--panel); border: 1px solid var(--mid); border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<script data-include="lib/keys.js"></script>
<script data-include="lib/bridge.js"></script>
<script data-include="lib/sound.js"></script>
<script data-include="lib/piano.js"></script>
<script data-include="lib/level.js"></script>
<script>
  // Level 9, key of A♭: Survival Waves. A top-down zombie rush. Pick a
  // musical weapon, survive 5 waves from 4 speaker-stack spawners, and pick an
  // upgrade between waves. Every shot and kill plays notes in A♭ major.
  // WASD to move, aim with the mouse, left click (or hold) to attack.
  const W = 900, H = 540;
  const AB_ARP = [56, 60, 63, 68, 72, 75];           // A♭ major arpeggio, rising
  const AB_PENTA = [68, 70, 72, 75, 77, 80];         // A♭ major pentatonic for kills
  const ARP = Sound.instrument('arp', { release: 0.15 }); // the Arpeggiator's pluck (shared with the Final Boss's fans)
  // A drone in F minor (A♭'s relative minor) under the whole run: the Final
  // Boss's drone set, shifted to F. It carries on through upgrades and retries.
  const DRONE_ROOT = 53; // F
  let drone = null;
  window.__drone = () => drone; // for automatic tests
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  const WEAPONS = {
    arp: { name: 'Arpeggiator', icon: '♪♫', tag: 'Rapid fire',
      desc: 'Quick little notes that ripple up the A♭ arpeggio. 12 per clip, then a short reload.',
      rate: 0.16, damage: 1, speed: 450, size: 5, pierce: 0, clip: 12, reload: 1.6 },
    bass: { name: 'Sub Bass', icon: '〰', tag: 'Heavy, piercing',
      desc: 'A slow, wide wave of bass that rolls through every zombie in its path. 4 per clip.',
      rate: 0.8, damage: 4, speed: 300, size: 24, pierce: 99, clip: 4, reload: 2 },
    mic: { name: 'Mic Swing', icon: '🎤', tag: 'Melee',
      desc: 'Swing your mic in a wide arc: big damage, short reach. Special: hold E to charge a feedback blast from every speaker.',
      rate: 0.42, damage: 5, reach: 80, arc: 1.7 },
  };

  const ZOMBIES = {
    walker: { hp: 4, speed: 60, size: 14, damage: 10, body: '#7d7a8c', eye: '#ff8fa6' },
    brute: { hp: 18, speed: 42, size: 23, damage: 22, body: '#4a3566', eye: '#ff5d7a' },
    spitter: { hp: 6, speed: 55, size: 14, damage: 10, body: '#3f7a6e', eye: '#b9fff0', range: 230, fire: 2.2 },
    runner: { hp: 2, speed: 138, size: 11, damage: 8, body: '#a8566a', eye: '#ffe0e6' },
  };

  const WAVES = [
    { walker: 8, gap: 1.1 },
    { walker: 12, brute: 2, gap: 0.95 },
    { walker: 12, brute: 3, spitter: 3, gap: 0.85 },
    { walker: 14, brute: 3, spitter: 4, runner: 5, gap: 0.75 },
    { walker: 16, brute: 5, spitter: 5, runner: 8, gap: 0.6 },
  ];
  const SPAWNERS = [[60, 92], [W - 60, 92], [60, H - 58], [W - 60, H - 58]]; // clear of the HUD at the top

  // Mic Swing's special: Feedback. Hold E to charge (ear defenders go on),
  // release when the bar is full, and a moment later a shockwave rings out
  // of all four speaker stacks. Each ring hits every zombie once, for a share
  // of its health plus a little, so weak zombies drop and brutes survive.
  // The cooldown carries across waves.
  const FEEDBACK = {
    cooldown: 120,    // seconds between blasts
    readyAtStart: true,
    charge: 2,        // seconds of holding E to fill the bar
    windup: 1,        // seconds from release to the blast
    speed: 520,       // how fast the rings spread, pixels per second
    share: 0.14,      // each ring takes this share of a zombie's full health…
    flat: 0.6,        // …plus this much (raised by Louder)
    stun: 0.6,        // zombies stagger for this long when a ring hits
    push: 26,         // and get pushed back this far
  };
  const RING_END = Math.hypot(W, H) + 40;
  // The hidden heart: one speaker stack (a different one each visit) has a
  // faint crack. Hit it this many times and it bursts, dropping a heart.
  const CRACK_HITS = 8;

  // Upgrades offered between waves (three at random). Some only suit one weapon.
  const UPGRADES = [
    { id: 'damage', name: 'Louder', desc: '+30% damage', apply: (s) => { s.mods.damage *= 1.3; } },
    { id: 'rate', name: 'Faster Tempo', desc: '+20% attack speed', apply: (s) => { s.mods.rate *= 0.8; } },
    { id: 'speed', name: 'Light Feet', desc: '+15% move speed', apply: (s) => { s.player.speed *= 1.15; } },
    { id: 'maxhp', name: 'Bigger Headroom', desc: '+25 max health, and heal 25', apply: (s) => { s.player.maxHp += 25; s.player.hp = Math.min(s.player.maxHp, s.player.hp + 25); } },
    { id: 'heal', name: 'Encore', desc: 'Heal to full health', apply: (s) => { s.player.hp = s.player.maxHp; } },
    { id: 'regen', name: 'Sustain', desc: 'Regain 2 health every second', apply: (s) => { s.player.regen += 2; } },
    { id: 'extra', name: 'Harmony', desc: 'Fire one more note each shot', only: 'arp', apply: (s) => { s.mods.extra += 1; } },
    { id: 'pierce', name: 'Ring Out', desc: 'Notes pass through one more zombie', only: 'arp', apply: (s) => { s.mods.pierce += 1; } },
    { id: 'clip', name: 'Bigger Clip', desc: '+6 notes per clip', only: 'arp', apply: (s) => { s.mods.clip += 6; s.ammo = WEAPONS.arp.clip + s.mods.clip; } },
    { id: 'quickreload', name: 'Quick Reload', desc: 'Reload 30% faster', only: ['arp', 'bass'], apply: (s) => { s.mods.reload *= 0.7; } },
    { id: 'wide', name: 'Wider Wave', desc: '+40% wave size', only: 'bass', apply: (s) => { s.mods.size *= 1.4; } },
    { id: 'reach', name: 'Longer Cable', desc: '+30% swing reach', only: 'mic', apply: (s) => { s.mods.reach *= 1.3; } },
  ];

  let canvas, ctx, ui = {};
  let S = null;
  let keys = {};
  let mouse = { x: W / 2, y: H / 2 - 80, down: false };
  let last = 0, paused = false;

  Level.setup({
    description: 'They’re coming out of the speakers. Pick a weapon and survive five waves.',
    piano: false,
    start(stage) {
      stage.innerHTML = `
        <div class="arena">
          <canvas id="arena" width="${W}" height="${H}"></canvas>
          <div class="overlay show" id="choose">
            <h2>Pick your weapon</h2>
            <div class="choices" id="weapons"></div>
            <p class="controls-help"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · aim with the mouse · left click (or hold) to attack · <kbd>R</kbd> reload · <kbd>E</kbd> hold for the mic’s special</p>
          </div>
          <div class="overlay" id="upgrade">
            <h2 id="upgradeTitle"></h2>
            <p class="controls-help">Pick an upgrade for the next wave.</p>
            <div class="choices" id="upgrades"></div>
          </div>
          <div class="overlay" id="endCard">
            <h2 id="endTitle"></h2>
            <p id="endText"></p>
            <div class="buttons" id="endButtons"></div>
          </div>
        </div>`;
      Sound.preload(['arp', 'circle-drone']);
      canvas = stage.querySelector('#arena');
      ctx = canvas.getContext('2d');
      ui = {
        choose: stage.querySelector('#choose'), weapons: stage.querySelector('#weapons'),
        upgrade: stage.querySelector('#upgrade'), upgradeTitle: stage.querySelector('#upgradeTitle'), upgrades: stage.querySelector('#upgrades'),
        end: stage.querySelector('#endCard'), endTitle: stage.querySelector('#endTitle'), endText: stage.querySelector('#endText'), endButtons: stage.querySelector('#endButtons'),
      };
      for (const [id, w] of Object.entries(WEAPONS)) {
        ui.weapons.appendChild(choiceCard(w.icon, w.name, w.desc, w.tag, () => chooseWeapon(id), `weapon-${id}`));
      }
      // Mouse aim, in canvas coordinates
      const toCanvas = (e) => {
        const r = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - r.left) * (W / r.width);
        mouse.y = (e.clientY - r.top) * (H / r.height);
      };
      canvas.addEventListener('pointermove', toCanvas);
      canvas.addEventListener('pointerdown', (e) => { toCanvas(e); if (e.button === 0) { mouse.down = true; Sound.unlock(); } });
      window.addEventListener('pointerup', () => { mouse.down = false; });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      newState();
      requestAnimationFrame(loop);
    },
  });

  function choiceCard(icon, name, desc, tag, onPick, id) {
    const b = document.createElement('button');
    b.className = 'choice';
    if (id) b.id = id;
    b.innerHTML = `<span class="icon">${icon}</span><strong>${name}</strong><span>${desc}</span>${tag ? `<em>${tag}</em>` : ''}`;
    b.onclick = () => { b.blur(); onPick(); };
    return b;
  }

  // ---------- State ----------
  function newState() {
    S = {
      mode: 'choose', weapon: null, wave: 0, time: 0,
      player: { x: W / 2, y: H / 2, hp: 100, maxHp: 100, speed: 200, regen: 0, aim: -Math.PI / 2 },
      mods: { damage: 1, rate: 1, extra: 0, pierce: 0, size: 1, reach: 1, clip: 0, reload: 1 },
      ammo: 0, reloading: 0, // the Arpeggiator's clip
      zombies: [], shots: [], spits: [], sparks: [], texts: [], swings: [],
      queue: [], spawnIn: 0, fireCool: 0, note: 0, shake: 0, hurtFlash: 0, banner: null, spawnerGlow: [0, 0, 0, 0],
      waveStart: null, // upgrades and health at the start of the wave, for retries
      crack: { index: Math.floor(Math.random() * 4), hits: 0, open: false, heart: null, found: false },
      fb: { state: 'idle', cool: FEEDBACK.readyAtStart ? 0 : FEEDBACK.cooldown, charge: 0, t: 0, rings: [], flash: 0 },
    };
    window.__zombie = S; // for automatic tests
  }

  function chooseWeapon(id) {
    S.weapon = id;
    if (!drone) drone = Sound.trackNear('circle-drone', DRONE_ROOT, { fadeIn: 2 });
    S.ammo = clipSize();
    ui.choose.classList.remove('show');
    Sound.unlock();
    startWave(0);
  }

  function startWave(index) {
    S.wave = index;
    S.mode = 'fight';
    const w = WAVES[index];
    S.queue = [];
    for (const type of Object.keys(ZOMBIES)) for (let i = 0; i < (w[type] || 0); i++) S.queue.push(type);
    S.queue.sort(() => Math.random() - 0.5); // a random mix
    S.spawnIn = 1.5;
    S.zombies = []; S.spits = []; S.shots = [];
    S.banner = { text: `WAVE ${index + 1}${index === WAVES.length - 1 ? ' · FINAL WAVE' : ''}`, t: 2 };
    S.waveStart = { hp: S.player.hp, maxHp: S.player.maxHp, speed: S.player.speed, regen: S.player.regen, mods: { ...S.mods } };
    S.texts = S.texts.filter((t) => !t.big); // only one "New: …" label at a time
    const newType = { 1: 'Brutes', 2: 'Spitters', 3: 'Runners' }[index];
    if (newType) S.texts.push({ x: W / 2, y: H * 0.3 + 34, text: `New: ${newType}`, t: 2.2, big: true });
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && S && S.mode === 'fight') reload(); // reload early
    if (e.code === 'KeyE' && !e.repeat) startCharge();
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.code === 'KeyE') releaseCharge();
  });
  window.addEventListener('blur', () => { paused = true; keys = {}; mouse.down = false; cancelCharge(); });
  window.addEventListener('focus', () => { paused = false; last = performance.now(); });

  // ---------- Attacks ----------
  const clipSize = () => (WEAPONS[S.weapon].clip ? WEAPONS[S.weapon].clip + S.mods.clip : Infinity);
  function reload() {
    if (!WEAPONS[S.weapon].clip || S.reloading > 0 || S.ammo === clipSize()) return;
    S.reloading = WEAPONS[S.weapon].reload * S.mods.reload;
    Sound.whoosh();
  }
  function attack() {
    const p = S.player, w = WEAPONS[S.weapon], m = S.mods;
    if (S.reloading > 0) return;
    if (w.clip) {
      if (S.ammo <= 0) return reload();
      S.ammo -= 1;
      if (S.ammo === 0) reload(); // reload automatically when the clip runs dry
    }
    S.fireCool = w.rate * m.rate;
    const a = p.aim;
    if (S.weapon === 'mic') {
      S.swings.push({ a, t: 0.16 });
      const reach = w.reach * m.reach;
      let hit = false;
      for (const z of S.zombies) {
        const d = Math.hypot(z.x - p.x, z.y - p.y);
        let diff = Math.atan2(z.y - p.y, z.x - p.x) - a;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        if (d < reach + z.size && Math.abs(diff) < w.arc / 2) {
          hurtZombie(z, w.damage * m.damage);
          z.x += Math.cos(a) * 34; z.y += Math.sin(a) * 34; // knockback
          hit = true;
        }
      }
      // The cracked speaker can be hit too.
      const [cx, cy] = SPAWNERS[S.crack.index];
      let diff = Math.atan2(cy - p.y, cx - p.x) - a;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      if (Math.hypot(cx - p.x, cy - p.y) < reach + 30 && Math.abs(diff) < w.arc / 2) { hitCrack(); hit = true; }
      Sound.whoosh();
      if (hit) Sound.hit();
      return;
    }
    const count = S.weapon === 'arp' ? 1 + m.extra : 1;
    for (let i = 0; i < count; i++) {
      const spread = (i - (count - 1) / 2) * 0.14;
      S.shots.push({
        x: p.x + Math.cos(a) * 18, y: p.y + Math.sin(a) * 18, a: a + spread,
        speed: w.speed, size: w.size * (S.weapon === 'bass' ? m.size : 1), damage: w.damage * m.damage,
        pierce: w.pierce + m.pierce, hits: new Set(), kind: S.weapon, life: S.weapon === 'bass' ? 1.4 : 1.2,
      });
    }
    if (S.weapon === 'arp') ARP.note(AB_ARP[S.note++ % AB_ARP.length] + 12, 0, 0.18, 0.18);
    else Sound.chord([44 - 12, 44 - 5], 0, 0.45, 0.45); // a low A♭ fifth
  }

  // ---------- Feedback (Mic Swing special) ----------
  let whine = null; // the rising feedback tone while charging
  function startCharge() {
    const f = S && S.fb;
    if (!f || S.mode !== 'fight' || S.weapon !== 'mic' || f.state !== 'idle') return;
    if (f.cool > 0) { S.texts.push({ x: S.player.x, y: S.player.y - 30, text: `Feedback in ${formatTime(f.cool)}`, t: 1 }); return; }
    f.state = 'charging';
    f.charge = 0;
    const a = Sound.unlock();
    const osc = a.createOscillator(), wob = a.createOscillator(), wobGain = a.createGain(), gain = a.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2200, a.currentTime + FEEDBACK.charge);
    wob.frequency.value = 7; wobGain.gain.value = 30;
    wob.connect(wobGain).connect(osc.frequency);
    gain.gain.setValueAtTime(0.0001, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.05, a.currentTime + FEEDBACK.charge);
    osc.connect(gain).connect(a.destination);
    osc.start(); wob.start();
    whine = { osc, wob, gain, a };
  }
  function stopWhine() {
    if (!whine) return;
    const { osc, wob, gain, a } = whine;
    gain.gain.cancelScheduledValues(a.currentTime);
    gain.gain.setTargetAtTime(0.0001, a.currentTime, 0.04);
    osc.stop(a.currentTime + 0.3); wob.stop(a.currentTime + 0.3);
    whine = null;
  }
  // Letting go early cancels it, with no cooldown.
  function cancelCharge() {
    if (!S || !S.fb || !['charging', 'full'].includes(S.fb.state)) return;
    S.fb.state = 'idle';
    S.fb.charge = 0;
    stopWhine();
  }
  function releaseCharge() {
    const f = S && S.fb;
    if (!f) return;
    if (f.state === 'charging') return cancelCharge();
    if (f.state !== 'full') return;
    f.state = 'windup';
    f.t = FEEDBACK.windup;
    f.cool = FEEDBACK.cooldown;
    stopWhine();
    // The speakers swell: a low rumble rising into the blast.
    const a = Sound.unlock(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(32, t); o.frequency.exponentialRampToValueAtTime(52, t + FEEDBACK.windup);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(120, t); lp.frequency.exponentialRampToValueAtTime(900, t + FEEDBACK.windup);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + FEEDBACK.windup); g.gain.exponentialRampToValueAtTime(0.0001, t + FEEDBACK.windup + 0.1);
    o.connect(lp).connect(g).connect(a.destination);
    o.start(t); o.stop(t + FEEDBACK.windup + 0.15);
  }
  function blast() {
    const f = S.fb;
    f.state = 'blast';
    f.flash = 0.25;
    f.rings = SPAWNERS.map(([x, y]) => ({ x, y, r: 0, hit: new Set() }));
    S.shake = Math.max(S.shake, 0.6);
    Sound.chord([32, 44, 51, 56], 0, 2, 0.7); // a huge low A♭ chord
    Sound.hit();
    Sound.whoosh();
  }
  function updateFeedback(dt) {
    const f = S.fb;
    if (f.state === 'idle' || f.state === 'charging' || f.state === 'full') f.cool = Math.max(0, f.cool - dt);
    f.flash = Math.max(0, f.flash - dt);
    if (f.state === 'charging') {
      f.charge = Math.min(FEEDBACK.charge, f.charge + dt);
      if (f.charge >= FEEDBACK.charge) { f.state = 'full'; Sound.note(80, 0, 0.25, 0.2); }
    } else if (f.state === 'windup') {
      f.t -= dt;
      if (f.t <= 0) blast();
    } else if (f.state === 'blast') {
      for (const ring of f.rings) {
        ring.r += FEEDBACK.speed * dt;
        for (const z of S.zombies) {
          if (z.dead || ring.hit.has(z)) continue;
          const d = Math.hypot(z.x - ring.x, z.y - ring.y);
          if (d > ring.r) continue;
          ring.hit.add(z);
          hurtZombie(z, z.maxHp * FEEDBACK.share + FEEDBACK.flat * S.mods.damage);
          z.stun = FEEDBACK.stun;
          z.x += ((z.x - ring.x) / (d || 1)) * FEEDBACK.push;
          z.y += ((z.y - ring.y) / (d || 1)) * FEEDBACK.push;
          for (let i = 0; i < 4; i++) spark(z.x, z.y, '#E2D9FF');
        }
        for (const sp of S.spits) if (Math.hypot(sp.x - ring.x, sp.y - ring.y) < ring.r) sp.gone = true;
      }
      if (f.rings.every((r) => r.r > RING_END)) { f.state = 'idle'; f.rings = []; }
    }
  }
  // Ear defenders stay on from the first moment of charging to the last ring.
  const defended = () => S.fb.state !== 'idle';
  const fbLevel = () => (S.fb.state === 'charging' ? S.fb.charge / FEEDBACK.charge : ['full', 'windup'].includes(S.fb.state) ? 1 : 0);
  const formatTime = (sec) => { const t = Math.ceil(sec); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

  function hitCrack() {
    const c = S.crack;
    if (c.open) return;
    c.hits++;
    const [x, y] = SPAWNERS[c.index];
    for (let i = 0; i < 5; i++) spark(x + rand(-20, 20), y + rand(-24, 24), '#9A93A3');
    if (c.hits < CRACK_HITS) return;
    // It bursts open, and a heart drops out towards the middle.
    c.open = true;
    for (let i = 0; i < 30; i++) spark(x, y, i % 2 ? '#ff8fa6' : '#E2D9FF');
    c.heart = { x: x + (x < W / 2 ? 60 : -60), y: y + (y < H / 2 ? 50 : -50) };
    S.shake = Math.max(S.shake, 0.3);
    Sound.hit();
  }

  function hurtZombie(z, amount) {
    z.hp -= amount;
    z.flash = 0.1;
    if (z.hp <= 0 && !z.dead) {
      z.dead = true;
      for (let i = 0; i < 12; i++) spark(z.x, z.y, ZOMBIES[z.type].body);
      Sound.note(pick(AB_PENTA), 0, 0.3, 0.16);
    }
  }

  function hurtPlayer(amount) {
    const p = S.player;
    p.hp = Math.max(0, p.hp - amount);
    S.hurtFlash = 0.35;
    S.shake = 0.25;
    Sound.squeal();
    if (p.hp <= 0) overrun();
  }

  function spark(x, y, color) {
    const a = rand(0, Math.PI * 2), v = rand(50, 200);
    S.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.25, 0.6), color });
  }

  // ---------- Between waves ----------
  function waveCleared() {
    S.spits = []; S.hurtFlash = 0; S.shake = 0; // nothing left frozen behind the menu
    cancelCharge();
    if (S.fb.state !== 'idle') { S.fb.state = 'idle'; S.fb.rings = []; }
    if (S.wave === WAVES.length - 1) return win();
    S.mode = 'upgrade';
    mouse.down = false;
    Sound.chord([56, 60, 63, 68], 0, 1.4, 0.4);
    ui.upgradeTitle.textContent = `Wave ${S.wave + 1} cleared`;
    ui.upgrades.innerHTML = '';
    const options = UPGRADES.filter((u) => !u.only || [].concat(u.only).includes(S.weapon)).sort(() => Math.random() - 0.5).slice(0, 3);
    for (const u of options) {
      ui.upgrades.appendChild(choiceCard('⬆', u.name, u.desc, '', () => {
        u.apply(S);
        ui.upgrade.classList.remove('show');
        startWave(S.wave + 1);
      }, `upgrade-${u.id}`));
    }
    ui.upgrade.classList.add('show');
  }

  // Overrun: retry the same wave at full health, keeping your upgrades.
  function overrun() {
    S.mode = 'over';
    cancelCharge();
    if (S.fb.state !== 'idle') { S.fb.state = 'idle'; S.fb.rings = []; }
    mouse.down = false;
    ui.endTitle.textContent = 'Overrun';
    ui.endText.textContent = `The horde got you on wave ${S.wave + 1}. Try the wave again: you keep your upgrades.`;
    ui.endButtons.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'primary';
    b.textContent = 'Retry wave';
    b.onclick = () => {
      b.blur();
      const start = S.waveStart;
      Object.assign(S.player, { hp: start.maxHp, maxHp: start.maxHp, speed: start.speed, regen: start.regen, x: W / 2, y: H / 2 });
      S.mods = { ...start.mods };
      S.ammo = clipSize(); S.reloading = 0;
      ui.end.classList.remove('show');
      startWave(S.wave);
    };
    ui.endButtons.append(b);
    ui.end.classList.add('show');
  }

  function win() {
    S.mode = 'won';
    if (drone) { drone.stop(2.5); drone = null; }
    mouse.down = false;
    Sound.chord([44, 56, 60, 63, 68], 0, 2.4, 0.55);
    ui.endTitle.textContent = 'Survived';
    ui.endText.textContent = 'Five waves, and the speakers have finally gone quiet.';
    ui.endButtons.innerHTML = '';
    ui.end.classList.add('show');
    setTimeout(() => Level.win({ heart: S.crack.found }), 2200);
  }

  // ---------- Game loop ----------
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    if (S && S.mode === 'fight' && !paused) update(dt);
    if (S) draw();
  }

  function update(dt) {
    const p = S.player;
    S.time += dt;

    // Movement (WASD), kept inside the arena
    let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
    const slow = ['charging', 'full', 'windup'].includes(S.fb.state) ? 0.55 : 1; // charging slows you down
    p.x = Math.min(W - 16, Math.max(16, p.x + mx * p.speed * slow * dt));
    p.y = Math.min(H - 16, Math.max(16, p.y + my * p.speed * slow * dt));
    p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);
    p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);

    S.fireCool = Math.max(0, S.fireCool - dt);
    if (S.reloading > 0) {
      S.reloading -= dt;
      if (S.reloading <= 0) { S.reloading = 0; S.ammo = clipSize(); Sound.note(68, 0, 0.15, 0.2); }
    }
    updateFeedback(dt);
    if (mouse.down && S.fireCool <= 0 && slow === 1) attack();

    // Spawning
    S.spawnIn -= dt;
    if (S.queue.length && S.spawnIn <= 0) {
      const type = S.queue.shift();
      const i = Math.floor(Math.random() * SPAWNERS.length);
      const [sx, sy] = SPAWNERS[i];
      const z = ZOMBIES[type];
      S.zombies.push({ type, x: sx + rand(-10, 10), y: sy + rand(-10, 10), hp: z.hp, maxHp: z.hp, size: z.size, attackCool: 0, fireIn: rand(1, z.fire || 1), flash: 0, wobble: rand(0, 6) });
      S.spawnerGlow[i] = 0.5;
      S.spawnIn = WAVES[S.wave].gap * rand(0.7, 1.3);
    }
    S.spawnerGlow = S.spawnerGlow.map((g) => Math.max(0, g - dt));

    // Zombies: walk at you (spitters keep their distance), push apart a little
    for (const z of S.zombies) {
      const t = ZOMBIES[z.type];
      const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy) || 1;
      z.stun = Math.max(0, (z.stun || 0) - dt);
      let dir = z.stun > 0 ? 0 : 1; // staggered by the feedback blast
      if (t.range && !z.stun) dir = d < t.range - 30 ? -0.6 : d > t.range + 20 ? 1 : 0;
      z.x += (dx / d) * t.speed * dir * dt;
      z.y += (dy / d) * t.speed * dir * dt;
      for (const o of S.zombies) {
        if (o === z) continue;
        const ox = z.x - o.x, oy = z.y - o.y, od = Math.hypot(ox, oy);
        const min = z.size + o.size;
        if (od > 0 && od < min) { z.x += (ox / od) * (min - od) * 0.5; z.y += (oy / od) * (min - od) * 0.5; }
      }
      z.x = Math.min(W - 10, Math.max(10, z.x));
      z.y = Math.min(H - 10, Math.max(10, z.y));
      z.attackCool = Math.max(0, z.attackCool - dt);
      z.flash = Math.max(0, z.flash - dt);
      if (d < z.size + 14 && z.attackCool <= 0) { z.attackCool = 0.8; hurtPlayer(t.damage); if (S.mode !== 'fight') return; }
      if (t.fire) {
        z.fireIn -= dt;
        if (z.fireIn <= 0 && d < t.range + 80) {
          z.fireIn = t.fire * rand(0.85, 1.15);
          S.spits.push({ x: z.x, y: z.y, vx: (dx / d) * 170, vy: (dy / d) * 170, life: 3 });
          Sound.note(pick([57, 62, 67]), 0, 0.3, 0.14); // off-key notes: A, D, G aren't in A♭ major
        }
      }
    }

    // Your notes and waves
    for (const s of S.shots) {
      s.x += Math.cos(s.a) * s.speed * dt;
      s.y += Math.sin(s.a) * s.speed * dt;
      s.life -= dt;
      for (const z of S.zombies) {
        if (z.dead || s.hits.has(z) || s.gone) continue;
        if (Math.hypot(z.x - s.x, z.y - s.y) < z.size + s.size) {
          s.hits.add(z);
          hurtZombie(z, s.damage);
          if (s.hits.size > s.pierce) s.gone = true;
        }
      }
    }
    // Your shots can crack open the cracked speaker.
    if (!S.crack.open) {
      const [cx, cy] = SPAWNERS[S.crack.index];
      for (const s of S.shots) {
        if (s.gone || s.hits.has('crack')) continue;
        if (Math.abs(s.x - cx) < 26 + s.size && Math.abs(s.y - cy) < 30 + s.size) {
          s.hits.add('crack');
          hitCrack();
          if (s.kind !== 'bass') s.gone = true;
        }
      }
    }
    if (S.crack.heart && !S.crack.found && Math.hypot(S.crack.heart.x - p.x, S.crack.heart.y - p.y) < 26) {
      S.crack.found = true;
      S.crack.heart = null;
      Sound.chord([68, 72, 75, 80], 0, 1.4, 0.35);
      S.texts.push({ x: p.x, y: p.y - 30, text: 'Hidden heart!', t: 1.6 });
    }

    // Spitters' notes
    for (const sp of S.spits) {
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.life -= dt;
      if (Math.hypot(sp.x - p.x, sp.y - p.y) < 18) { sp.gone = true; hurtPlayer(ZOMBIES.spitter.damage); if (S.mode !== 'fight') return; }
    }

    S.sparks.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; });
    S.texts.forEach((t) => { t.t -= dt; if (!t.big) t.y -= 30 * dt; });
    S.swings.forEach((w) => { w.t -= dt; });
    S.shake = Math.max(0, S.shake - dt);
    S.hurtFlash = Math.max(0, S.hurtFlash - dt);
    if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }

    S.zombies = S.zombies.filter((z) => !z.dead);
    S.shots = S.shots.filter((s) => !s.gone && s.life > 0 && s.x > -40 && s.x < W + 40 && s.y > -40 && s.y < H + 40);
    S.spits = S.spits.filter((s) => !s.gone && s.life > 0);
    S.sparks = S.sparks.filter((s) => s.t > 0);
    S.texts = S.texts.filter((t) => t.t > 0);
    S.swings = S.swings.filter((w) => w.t > 0);

    if (!S.queue.length && !S.zombies.length) waveCleared();
  }

  // ---------- Drawing ----------
  function draw() {
    const p = S.player;
    ctx.save();
    if (S.shake > 0) ctx.translate(rand(-3, 3) * S.shake * 4, rand(-3, 3) * S.shake * 4);
    ctx.fillStyle = '#141219'; ctx.fillRect(-10, -10, W + 20, H + 20);
    // Floor: a dark stage grid
    ctx.strokeStyle = 'rgba(94, 62, 132, 0.12)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    const vignette = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, W * 0.6);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);

    // Spawners: speaker stacks in the corners
    const level = S.fb ? fbLevel() : 0;
    const windup = S.fb && S.fb.state === 'windup' ? 1 - S.fb.t / FEEDBACK.windup : 0;
    SPAWNERS.forEach(([sx, sy], i) => {
      const g = Math.max(S.spawnerGlow[i], level * 0.6 + windup * 0.5);
      const jig = level * 2 + windup * 4; // the stacks shake as the feedback builds
      const x = sx + rand(-jig, jig), y = sy + rand(-jig, jig);
      ctx.fillStyle = '#211e28'; ctx.strokeStyle = '#5E3E84'; ctx.lineWidth = 2;
      roundRect(x - 26, y - 30, 52, 60, 6); ctx.fill(); ctx.stroke();
      // The cracked one: faint at first, wider with every hit, then burst open
      if (i === S.crack.index) {
        const k = S.crack.open ? 1 : S.crack.hits / CRACK_HITS;
        ctx.strokeStyle = `rgba(200, 190, 210, ${0.18 + k * 0.6})`; ctx.lineWidth = 1.5 + k * 1.5;
        ctx.beginPath(); ctx.moveTo(x - 18, y - 28); ctx.lineTo(x - 8, y - 12); ctx.lineTo(x - 14, y + 2); ctx.lineTo(x - 2, y + 16);
        if (k > 0.4) { ctx.moveTo(x - 8, y - 12); ctx.lineTo(x + 10, y - 20); }
        if (k > 0.7) { ctx.moveTo(x - 14, y + 2); ctx.lineTo(x + 12, y + 8); }
        ctx.stroke();
      }
      for (const cy of [y - 13, y + 13]) {
        ctx.fillStyle = `rgba(154, 127, 224, ${0.35 + g})`;
        ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 6 + g * 40;
        ctx.beginPath(); ctx.arc(x, cy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    });

    drawRings();

    // The hidden heart, once it's dropped
    if (S.crack.heart) {
      const { x, y } = S.crack.heart, k = 1 + Math.sin(S.time * 6) * 0.08;
      ctx.save(); ctx.translate(x, y); ctx.scale(k * 1.2, k * 1.2);
      ctx.fillStyle = '#ff5d7a'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-10, -2, -10, -10, -5, -10); ctx.bezierCurveTo(-2, -10, 0, -8, 0, -6);
      ctx.bezierCurveTo(0, -8, 2, -10, 5, -10); ctx.bezierCurveTo(10, -10, 10, -2, 0, 6); ctx.fill();
      ctx.restore();
    }

    // Spitter notes
    for (const sp of S.spits) {
      ctx.fillStyle = '#7fe0c8'; ctx.shadowColor = '#7fe0c8'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Zombies
    for (const z of S.zombies) {
      const t = ZOMBIES[z.type];
      const bob = Math.sin(S.time * 8 + z.wobble) * 1.5;
      ctx.fillStyle = z.flash > 0 ? '#ffffff' : t.body;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y + bob, z.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (z.type === 'brute') { // headphones on the brutes
        ctx.strokeStyle = '#2a2236'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(z.x, z.y + bob, z.size + 2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      }
      // Eyes, looking at you
      const a = Math.atan2(p.y - z.y, p.x - z.x);
      ctx.fillStyle = t.eye; ctx.shadowColor = t.eye; ctx.shadowBlur = 6;
      for (const side of [-1, 1]) {
        const ex = z.x + Math.cos(a) * z.size * 0.45 + Math.cos(a + Math.PI / 2) * side * z.size * 0.35;
        const ey = z.y + bob + Math.sin(a) * z.size * 0.45 + Math.sin(a + Math.PI / 2) * side * z.size * 0.35;
        ctx.beginPath(); ctx.arc(ex, ey, Math.max(2, z.size * 0.16), 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (z.hp < z.maxHp) {
        ctx.fillStyle = '#26232d'; ctx.fillRect(z.x - z.size, z.y - z.size - 9, z.size * 2, 4);
        ctx.fillStyle = '#ff8fa6'; ctx.fillRect(z.x - z.size, z.y - z.size - 9, z.size * 2 * (z.hp / z.maxHp), 4);
      }
    }

    // Your notes: little notes for the arpeggiator, a wide arc for the bass
    for (const s of S.shots) {
      if (s.kind === 'bass') {
        ctx.strokeStyle = 'rgba(200, 184, 255, 0.85)'; ctx.lineWidth = 5; ctx.shadowColor = '#9A7FE0'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(s.x - Math.cos(s.a) * s.size, s.y - Math.sin(s.a) * s.size, s.size * 1.4, s.a - 0.9, s.a + 0.9); ctx.stroke();
      } else {
        ctx.fillStyle = '#C8B8FF'; ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    // Mic swings
    for (const w of S.swings) {
      const reach = WEAPONS.mic.reach * S.mods.reach;
      ctx.strokeStyle = `rgba(226, 217, 255, ${w.t / 0.16})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, reach, w.a - WEAPONS.mic.arc / 2, w.a + WEAPONS.mic.arc / 2); ctx.stroke();
    }

    drawPlayer(p);

    for (const s of S.sparks) { ctx.globalAlpha = Math.max(0, s.t * 1.8); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, t.t * 2);
      ctx.fillStyle = '#C8B8FF'; ctx.font = t.big ? '600 20px Oswald, sans-serif' : '600 15px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (S.hurtFlash > 0) {
      const k = S.hurtFlash / 0.35;
      const rim = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.6);
      rim.addColorStop(0, 'rgba(255, 40, 70, 0)'); rim.addColorStop(1, `rgba(255, 40, 70, ${0.6 * k})`);
      ctx.fillStyle = rim; ctx.fillRect(0, 0, W, H);
    }
    drawFeedbackScreen();
    drawHud();
    if (S.mode === 'fight') drawCrosshair();
  }

  // The shockwaves: a bright front with colour fringes, and the picture
  // behind it torn and pushed outwards, like the air is distorting.
  function drawRings() {
    if (!S.fb || S.fb.state !== 'blast') return;
    for (const ring of S.fb.rings) {
      if (ring.r > RING_END) continue;
      const fade = Math.max(0, 1 - ring.r / RING_END);
      // Distortion trailing behind the front
      for (let i = 0; i < 26; i++) {
        const a = rand(0, Math.PI * 2), back = rand(8, 70);
        const rr = ring.r - back;
        if (rr <= 0) continue;
        const x = ring.x + Math.cos(a) * rr, y = ring.y + Math.sin(a) * rr;
        if (x < 0 || y < 0 || x > W - 40 || y > H - 16) continue;
        const push = (1 - back / 70) * 9;
        ctx.drawImage(canvas, x, y, 40, 14, x + Math.cos(a) * push, y + Math.sin(a) * push, 40, 14);
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // where rings cross in the middle, they add up
      const grad = ctx.createRadialGradient(ring.x, ring.y, Math.max(0, ring.r - 60), ring.x, ring.y, ring.r);
      grad.addColorStop(0, 'rgba(154, 127, 224, 0)');
      grad.addColorStop(1, `rgba(154, 127, 224, ${0.22 * fade})`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.fill();
      for (const [off, color, width] of [[4, `rgba(255, 93, 122, ${0.5 * fade})`, 4], [-4, `rgba(127, 224, 200, ${0.45 * fade})`, 4], [0, `rgba(240, 235, 255, ${0.9 * fade})`, 6], [-22, `rgba(200, 184, 255, ${0.35 * fade})`, 3], [-44, `rgba(200, 184, 255, ${0.18 * fade})`, 2]]) {
        if (ring.r + off <= 0) continue;
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = off === 0 ? 18 : 0;
        ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r + off, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Charging: the edges hum and glitch, and a bar fills in the middle.
  function drawFeedbackScreen() {
    if (!S.fb) return;
    const f = S.fb, level = fbLevel();
    if (level > 0 || f.state === 'windup') {
      const pulse = 0.75 + 0.25 * Math.sin(S.time * (f.state === 'charging' ? 10 : 22));
      const k = f.state === 'windup' ? 1 : level;
      const edge = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.62);
      edge.addColorStop(0, 'rgba(200, 184, 255, 0)');
      edge.addColorStop(1, `rgba(200, 184, 255, ${0.5 * k * pulse})`);
      ctx.fillStyle = edge; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < Math.round(3 + k * 10); i++) {
        const h = rand(2, 7), y = Math.random() < 0.5 ? rand(0, 50 * k) : rand(H - 50 * k, H - h);
        ctx.drawImage(canvas, 0, y, W, h, rand(-8, 8) * k, y, W, h);
      }
    }
    if (f.flash > 0) { ctx.fillStyle = `rgba(240, 235, 255, ${f.flash * 2})`; ctx.fillRect(0, 0, W, H); }
    if (f.state === 'charging' || f.state === 'full') {
      const bw = 280, bx = W / 2 - bw / 2, by = H * 0.3;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E6E1EC'; ctx.font = '600 16px Oswald, sans-serif';
      ctx.fillText(f.state === 'full' ? 'RELEASE E' : 'CHARGING FEEDBACK', W / 2, by - 12);
      ctx.fillStyle = '#26232d'; roundRect(bx, by, bw, 14, 7); ctx.fill();
      const bar = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      bar.addColorStop(0, '#9A7FE0'); bar.addColorStop(1, f.state === 'full' ? '#ffffff' : '#C8B8FF');
      ctx.fillStyle = bar;
      ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = f.state === 'full' ? 10 + 10 * Math.sin(S.time * 16) : 6;
      roundRect(bx, by, bw * level, 14, 7); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawPlayer(p) {
    if (S.reloading > 0) {
      const k = 1 - S.reloading / (WEAPONS[S.weapon].reload * S.mods.reload);
      ctx.strokeStyle = 'rgba(200, 184, 255, 0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
    }
    // Top-down headphones, facing where you aim
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.aim + Math.PI / 2);
    ctx.fillStyle = '#2a2433'; ctx.strokeStyle = '#9A7FE0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#C8B8FF'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 2, 13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    const ear = S.fb && defended();
    ctx.fillStyle = ear ? '#E2D9FF' : '#9A7FE0';
    if (ear) { ctx.shadowColor = '#E2D9FF'; ctx.shadowBlur = 12; }
    // Ear defenders: bigger, padded cups while the feedback is going
    roundRect(ear ? -20 : -17, ear ? -5 : -2, ear ? 10 : 7, ear ? 17 : 12, 4); ctx.fill();
    roundRect(10, ear ? -5 : -2, ear ? 10 : 7, ear ? 17 : 12, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#E2D9FF';
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(5, -15); ctx.lineTo(-5, -15); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCrosshair() {
    ctx.strokeStyle = 'rgba(226, 217, 255, 0.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x - 13, mouse.y); ctx.lineTo(mouse.x - 4, mouse.y); ctx.moveTo(mouse.x + 4, mouse.y); ctx.lineTo(mouse.x + 13, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 13); ctx.lineTo(mouse.x, mouse.y - 4); ctx.moveTo(mouse.x, mouse.y + 4); ctx.lineTo(mouse.x, mouse.y + 13); ctx.stroke();
  }

  function drawHud() {
    const p = S.player;
    ctx.textAlign = 'left'; ctx.font = '600 14px Oswald, sans-serif';
    ctx.fillStyle = '#E6E1EC'; ctx.fillText('HEALTH', 16, 24);
    ctx.fillStyle = '#26232d'; roundRect(74, 13, 220, 12, 6); ctx.fill();
    const hp = ctx.createLinearGradient(74, 0, 294, 0);
    hp.addColorStop(0, '#ff5d7a'); hp.addColorStop(1, '#ff8fa6');
    ctx.fillStyle = hp; roundRect(74, 13, 220 * (p.hp / p.maxHp), 12, 6); ctx.fill();
    ctx.fillStyle = '#9A93A3'; ctx.font = '500 12px Oswald, sans-serif';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, 302, 24);
    if (S.weapon && WEAPONS[S.weapon].clip) {
      const size = clipSize();
      for (let i = 0; i < size; i++) {
        ctx.fillStyle = i < S.ammo && S.reloading <= 0 ? '#C8B8FF' : '#2c2934';
        const big = size <= 6; // the bass's few big waves get bigger pips
        ctx.beginPath(); ctx.arc(80 + i * (big ? 16 : 11), 40, big ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.textAlign = 'left'; ctx.fillStyle = '#9A93A3'; ctx.font = '500 11px Oswald, sans-serif';
      ctx.fillText(S.reloading > 0 ? 'RELOADING' : S.weapon === 'bass' ? 'WAVES' : 'NOTES', 16, 44);
    }
    if (S.weapon === 'mic') {
      const f = S.fb, ready = f.cool <= 0 && f.state === 'idle';
      ctx.textAlign = 'left'; ctx.font = '500 11px Oswald, sans-serif';
      ctx.fillStyle = ready ? '#E2D9FF' : '#9A93A3';
      ctx.fillText('FEEDBACK', 16, 44);
      ctx.fillStyle = '#26232d'; roundRect(74, 36, 120, 8, 4); ctx.fill();
      ctx.fillStyle = ready ? '#E2D9FF' : '#5E3E84';
      if (ready) { ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 8 + 6 * Math.sin(S.time * 4); }
      roundRect(74, 36, 120 * (1 - f.cool / FEEDBACK.cooldown), 8, 4); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = ready ? '#E2D9FF' : '#9A93A3';
      ctx.fillText(ready ? 'READY · HOLD E' : f.state !== 'idle' ? 'IN USE' : formatTime(f.cool), 202, 44);
    }
    if (S.weapon) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#E6E1EC'; ctx.font = '600 14px Oswald, sans-serif';
      ctx.fillText(`WAVE ${S.wave + 1} / ${WAVES.length}`, W - 16, 24);
      ctx.fillStyle = '#9A93A3'; ctx.font = '500 12px Oswald, sans-serif';
      ctx.fillText(`${S.zombies.length + S.queue.length} left · ${WEAPONS[S.weapon].name.toUpperCase()}`, W - 16, 42);
    }
    if (S.banner && S.mode === 'fight') {
      ctx.globalAlpha = Math.min(1, S.banner.t * 1.5);
      ctx.textAlign = 'center'; ctx.font = '600 40px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText(S.banner.text, W / 2, H * 0.3); // above the player, who starts in the middle
      ctx.globalAlpha = 1;
    }
    if (paused && S.mode === 'fight') {
      ctx.textAlign = 'center'; ctx.font = '600 20px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText('Paused: click the game to carry on', W / 2, H / 2 + 70);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, Math.max(0, h), r) : ctx.rect(x, y, w, Math.max(0, h));
  }
</script>

  if (typeof Bridge === 'undefined') {
    document.body.innerHTML = '<div style="font:16px/1.5 system-ui,sans-serif;color:#ffb3c0;background:#2a1418;border:1px solid #c46a7a;border-radius:10px;padding:16px 18px;margin:16px">'
      + '<b>Wrong file.</b> This box has the working copy from <code>src/embeds</code>. Paste the file with the same name from <b><code>wix/embeds</code></b> instead.</div>';
  }
</script>
