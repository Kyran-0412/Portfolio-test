<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link data-include="lib/theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .stage { height: 100%; display: grid; place-items: center; }
  .floor {
    position: absolute; left: 50%; bottom: -10px; width: 210px; height: 18px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55), transparent 70%); pointer-events: none;
  }
  .door.open .floor, .door.opening .floor { background: radial-gradient(ellipse at center, rgba(154, 127, 224, 0.35), transparent 70%); }

  .door {
    position: relative; width: 160px; height: 260px; perspective: 700px; cursor: pointer;
    opacity: 0.3; transition: opacity 0.6s, filter 0.4s; outline: none;
  }
  /* Before the page code answers, the door shows dim with no letter. If it
     stays like that in Preview, the page code or the box ID needs checking. */
  .plaque:empty { display: none; }
  /* Locked doors stay faint so they don't stand out on the page. */
  .door.locked { opacity: 0.3; }
  .door.locked:hover, .door.locked:focus-visible { opacity: 0.45; }
  .door.open, .door.done { opacity: 1; }
  /* The door is drawn at 240 × 340 and always shown at a third of that size,
     centred, so the box around it leaves room for the glow. */
  .fit { width: 240px; height: 340px; display: grid; place-items: center; flex: none; zoom: 0.34; }

  .frame {
    position: absolute; inset: -8px -8px 0; pointer-events: none;
    border: 6px solid var(--accent); border-bottom: 0; border-radius: 88px 88px 0 0;
    transition: border-color 0.4s;
  }
  .doorway {
    position: absolute; inset: 0; border-radius: 80px 80px 0 0; opacity: 0; transition: opacity 0.4s;
    background: radial-gradient(circle at 50% 62%, var(--glow), var(--bright) 30%, var(--mid) 65%, var(--violet));
  }
  .leaf {
    position: absolute; inset: 0; border-radius: 80px 80px 0 0;
    background: linear-gradient(180deg, #2a2731, #1d1b22); background-size: cover; background-position: center;
    border: 2px solid var(--accent); transform-origin: left center; backface-visibility: hidden;
    transition: transform 0.75s cubic-bezier(0.3, 0.7, 0.2, 1), border-color 0.4s;
  }
  .plaque {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
    min-width: 58px; padding: 2px 12px; text-align: center; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--accent);
    font: 600 24px/1.3 var(--heading); color: var(--quiet); letter-spacing: 0.03em;
    transition: color 0.4s, background 0.4s, border-color 0.4s, text-shadow 0.4s;
  }
  .panel { position: absolute; left: 28px; right: 28px; border: 2px solid #2f2b37; border-radius: 6px; }
  .panel.upper { top: 108px; height: 52px; }
  .panel.lower { top: 172px; height: 66px; }
  .keyhole { position: absolute; right: 10px; top: 150px; width: 12px; height: 22px; }
  .keyhole::before, .keyhole::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); background: #0c0b0f; transition: background 0.4s, box-shadow 0.4s; }
  .keyhole::before { top: 0; width: 10px; height: 10px; border-radius: 50%; }
  .keyhole::after { top: 7px; width: 5px; height: 12px; border-radius: 0 0 2px 2px; }

  /* Custom door art replaces the drawn details. */
  .door.art .plaque, .door.art .panel, .door.art .keyhole { display: none; }

  /* Open: you hold the right key, so the door breathes. */
  .door.open .frame { border-color: var(--mid); }
  .door.open .leaf { border-color: var(--bright); }
  .door.open .plaque { color: var(--glow); border-color: var(--mid); text-shadow: 0 0 10px rgba(200, 184, 255, 0.8); }
  .door.open .keyhole::before, .door.open .keyhole::after { background: var(--glow); box-shadow: 0 0 8px var(--glow); }
  .door.open { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(154, 127, 224, 0.3)); }
    50% { filter: drop-shadow(0 0 18px rgba(200, 184, 255, 0.65)); }
  }
  .door.open:hover, .door.open:focus-visible { filter: drop-shadow(0 0 22px rgba(200, 184, 255, 0.85)); animation: none; }

  /* Done: beaten, steady lit trim. */
  .door.done .frame { border-color: var(--bright); }
  .door.done .leaf { border-color: var(--mid); }
  .door.done .plaque { background: var(--bright); border-color: var(--bright); color: var(--bg); }
  .door.done { filter: drop-shadow(0 0 8px rgba(154, 127, 224, 0.45)); }

  /* Locked: quiet, and it rattles when tried. */
  .door.locked .leaf { filter: brightness(0.85); }
  .door.rattle { animation: rattle 0.45s ease-out; }
  @keyframes rattle {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-4px) rotate(-1deg); }
    30% { transform: translateX(4px) rotate(1deg); }
    45% { transform: translateX(-3px) rotate(-0.5deg); }
    60% { transform: translateX(3px); }
    80% { transform: translateX(-1px); }
  }

  .door.opening .leaf { transform: rotateY(-80deg); }
  .door.opening .doorway { opacity: 1; }
</style>
</head>
<body>
<div class="stage">
 <div class="fit" id="fit">
  <div class="door" id="door" role="button" tabindex="0" aria-label="Door">
    <div class="doorway"></div>
    <div class="leaf" id="leaf">
      <div class="plaque" id="plaque"></div>
      <div class="panel upper"></div>
      <div class="panel lower"></div>
      <div class="keyhole"></div>
    </div>
    <div class="frame"></div>
    <div class="floor"></div>
  </div>
 </div>
</div>

<script data-include="lib/keys.js"></script>
<script data-include="lib/bridge.js"></script>
<script data-include="lib/sound.js"></script>
<script>
  // Your door art: PNG links for each look. Leave empty to use the drawn door.
  const DOOR_ART = { locked: '', open: '', done: '' };

  const door = document.getElementById('door');

  const leaf = document.getElementById('leaf');
  let state = null;
  let opening = false;

  function render() {
    door.className = 'door ' + state + (DOOR_ART[state] ? ' art' : '');
    leaf.style.backgroundImage = DOOR_ART[state] ? `url("${DOOR_ART[state]}")` : '';
    door.setAttribute('aria-label', state === 'locked' ? 'Locked door' : `Door in ${keyLabel(key)}`);
  }

  let key = null;
  Bridge.on('door', (message) => {
    key = message.key;
    state = message.state;
    opening = false;
    document.getElementById('plaque').textContent = keyLabel(key);
    render();
  });

  function tryDoor() {
    if (!state || opening) return;
    Sound.unlock();
    if (state === 'locked') {
      door.classList.remove('rattle');
      void door.offsetWidth; // restart the animation
      door.classList.add('rattle');
      Sound.locked();
      return;
    }
    opening = true;
    door.classList.add('opening');
    Sound.whoosh();
    setTimeout(() => Bridge.send({ type: 'enter' }), 750);
    // If the page didn't move on (e.g. it said no), close the door again.
    setTimeout(() => { if (opening) { opening = false; render(); } }, 4000);
  }

  door.addEventListener('click', tryDoor);
  door.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tryDoor(); }
  });

  Bridge.start(); // first: the page tells the door whether it's open
  // Then get the door's sounds ready, so the first click is instant. Sound
  // problems can never stop the door working.
  try { Sound.noPiano(); Sound.preload(['door-locked']); Sound.warm(); } catch (err) { /* sound stays off until a click */ }
</script>
<script>
  // If this shows, the file was pasted from src/embeds (whose shared code isn't
  // built in). The built files in wix/embeds never show it.
  if (typeof Bridge === 'undefined') {
    document.body.innerHTML = '<div style="font:16px/1.5 system-ui,sans-serif;color:#ffb3c0;background:#2a1418;border:1px solid #c46a7a;border-radius:10px;padding:16px 18px;margin:16px">'
      + '<b>Wrong file.</b> This box has the working copy from <code>src/embeds</code>. Paste the file with the same name from <b><code>wix/embeds</code></b> instead.</div>';
  }
</script>
</body>
</html>
