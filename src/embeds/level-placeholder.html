<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link data-include="lib/theme.css">
<link data-include="lib/level.css">
</head>
<body>
<script data-include="lib/keys.js"></script>
<script data-include="lib/bridge.js"></script>
<script data-include="lib/sound.js"></script>
<script data-include="lib/piano.js"></script>
<script data-include="lib/level.js"></script>
<script>
  // Stand-in for levels that aren't built yet: the piano works. In Wix
  // Preview a test button finishes the level; on the live site it can't be won.
  Level.setup({
    description: 'This level is still being built.',
    start(stage) {
      stage.innerHTML = Level.testMode
        ? `<h1>Coming soon</h1>
           <p>Have a play on the keyboard, then use the test button to finish the level.</p>
           <div class="buttons"><button class="primary" id="winBtn">Win level (test)</button></div>`
        : `<h1>Coming soon</h1>
           <p>This level is still being built. Have a play on the keyboard, and come back soon.</p>
           <div class="buttons"><button id="backBtn">Back</button></div>`;
      const win = stage.querySelector('#winBtn');
      if (win) win.onclick = () => Level.win();
      const back = stage.querySelector('#backBtn');
      if (back) back.onclick = () => Level.back();
    },
  });
</script>
<script>
  // If this shows, the file was pasted from src/embeds (whose shared code isn't
  // built in). The built files in wix/embeds never show it.
  if (typeof Bridge === 'undefined') {
    document.body.innerHTML = '<div style="font:16px/1.5 system-ui,sans-serif;color:#ffb3c0;background:#2a1418;border:1px solid #c46a7a;border-radius:10px;padding:16px 18px;margin:16px">'
      + '<b>Wrong file.</b> This box has the working copy from <code>src/embeds</code>. Paste the file with the same name from <b><code>wix/embeds</code></b> instead.</div>';
  }
</script>
</body>
</html>
