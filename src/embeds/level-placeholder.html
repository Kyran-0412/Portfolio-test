<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link data-include="lib/theme.css">
<link data-include="lib/level.css">
</head>
<body>
<script data-include="lib/keys.js"></script>
<script data-include="lib/bridge.js"></script>
<script data-include="lib/sound.js"></script>
<script data-include="lib/piano.js"></script>
<script data-include="lib/level.js"></script>
<script>
  // Stand-in for levels that aren't built yet: the piano works, and a test
  // button finishes the level.
  Level.setup({
    description: 'This level is still being built.',
    start(stage) {
      stage.innerHTML = `
        <h1>Coming soon</h1>
        <p>Have a play on the keyboard, then use the test button to finish the level.</p>
        <div class="buttons"><button class="primary" id="winBtn">Win level (test)</button></div>`;
      stage.querySelector('#winBtn').onclick = () => Level.win();
    },
  });
</script>
</body>
</html>
