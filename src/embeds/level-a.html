<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 4: Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link data-include="lib/theme.css">
<link data-include="lib/level.css">
<style>
  #play { padding-top: 8px; }
  .arena { position: relative; width: 900px; max-width: 100%; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--accent); background: #121116; }
  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(18, 17, 22, 0.94); border-radius: 10px; text-align: center; padding: 16px;
  }
  .overlay.show { display: flex; animation: fade-in 0.3s ease-out both; }
  .overlay h2 { margin: 0; font: 600 34px var(--heading); letter-spacing: 0.02em; }
  .how { display: grid; grid-template-columns: auto auto; gap: 6px 18px; text-align: left; font-size: 14px; color: var(--text); }
  .how kbd { font: 600 13px var(--heading); color: var(--glow); background: var(--panel); border: 1px solid var(--mid); border-radius: 5px; padding: 1px 7px; }
  .piano.scale-mode { --white-w: 58px; }
  .piano.scale-mode .piano-keys { height: 112px; }
  .piano.scale-mode .piano-name { font-size: 13px; color: #362d40; opacity: 1; }
  .piano.scale-mode .piano-help { visibility: hidden; }
</style>
</head>
<body>
<script data-include="lib/keys.js"></script>
<script data-include="lib/bridge.js"></script>
<script data-include="lib/sound.js"></script>
<script data-include="lib/piano.js"></script>
<script data-include="lib/level.js"></script>
<script>
  // Level 4, key of A: boss fight against Feedback, a squealing speaker.
  // You're at the bottom (← → move, Space dash), it's at the top. A–J fire the
  // notes of A major upwards. Matching an incoming note's pitch cancels it.
  const W = 900, H = 400;
  const ROOT = 57; // A3
  // The boss's own synth (your attacks stay on the piano). Long, washy release.
  const BOSS = Sound.instrument('feedback', { release: 1.2, gain: 1.35 }); // gain: its level next to the piano
  const BOSS_NOTE = 0.9, BOSS_CHORD = 1.1; // how long its notes and triads hold before the release
  // Backing: a drone in F♯ minor (A's relative minor) under the whole fight.
  const DRONE = 'feedback-drone';
  let drone = null;
  const SCALE = [0, 2, 4, 5, 7, 9, 11, 12].map((s) => ROOT + s);
  const TRIADS = [ // diatonic chords of A major, as MIDI notes
    { name: 'A', notes: [57, 61, 64], major: true }, { name: 'D', notes: [62, 66, 69], major: true },
    { name: 'E', notes: [64, 68, 71], major: true }, { name: 'Bm', notes: [59, 62, 66], major: false },
    { name: 'C♯m', notes: [61, 64, 68], major: false }, { name: 'F♯m', notes: [66, 69, 73], major: false },
  ];
  // Phases start at these boss health levels; each is faster and harder.
  const PHASES = [
    { from: 100, speed: 260, warn: 0.75, gap: 1.6, chords: 0, labels: true, lead: 0, drift: 85, name: 'Phase 1: root only' },
    { from: 75, speed: 320, warn: 0.65, gap: 1.3, chords: 0.45, labels: false, lead: 0, drift: 115, name: 'Fifth unlocked! Hold A + E for a power shot' },
    { from: 30, speed: 375, warn: 0.55, gap: 1.05, chords: 0.5, labels: false, lead: 0.55, drift: 145, name: 'Phase 3: full volume' },
  ];

  // You build A major's triad over the fight: root (A), then fifth (E), then
  // third (C♯). The boss always has the whole scale.
  const ROOT_PC = 9, THIRD_PC = 1, FIFTH_PC = 4;
  const UNLOCKS = [[ROOT_PC], [ROOT_PC, FIFTH_PC], [ROOT_PC, FIFTH_PC, THIRD_PC]];
  const CHORD_WINDOW = 0.09;  // keys pressed this close together count as one chord
  const SHOT_GAP = 0.25;      // seconds between attacks
  // Every attack adds to your own volume meter, so mashing makes you clip.
  // Cancelling an incoming note with the same pitch refunds that note.
  const ATTACKS = {
    single: { cost: 7, damage: 1.5, speed: 560, refund: 7 },  // one note
    power: { cost: 16, damage: 5, speed: 820, refund: 8 },    // root + fifth
    triad: { cost: 24, damage: 3, speed: 600, refund: 8 },    // root + third + fifth: three notes, damage each
  };
  const BOSS_SIZE = 0.72;     // drawing and hitbox scale
  const BOSS_HEALTH = 1.5;    // damage is divided by this: higher = tougher boss
  const MUZZLE = 44 * BOSS_SIZE; // where notes leave the speaker, below its centre
  const HEARTS = 3;           // hits you can take before losing the fight
  const TRANSITION = 3;       // seconds of calm between phases
  const CLIP_STUN = 2;        // seconds you're stunned after clipping
  // The aim line follows you while it warns, lagging behind, then the shot
  // flies straight from wherever it was pointing when it fired.
  // follow: how quickly it catches up; maxSpeed: px/s; miss: each shot aims up to this far to one side.
  const TRACK = { on: true, follow: 2.2, maxSpeed: 220, miss: 35 };
  const CLIP_RESET = 70;      // your volume meter drops to this after clipping
  const NOTE_SPEED = 1.25;    // the boss's single notes fly this much faster than its chords
  const CANCEL_DAMAGE = 3;    // cancelling a note reflects some back
  const CUT_DAMAGE = 14;      // playing the held chord's missing note
  let thirdFound = false;     // found in phase 3; reset when the fight restarts
  const name = (midi) => Piano.noteName(midi);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  let canvas, ctx, ui = {};
  let S = null;            // the fight's state
  let keys = {};           // arrow keys held
  let last = 0, paused = false, frame = 0;

  Level.setup({
    description: 'Feedback is screaming through the speakers. Cut it before your ears give out.',
    start(stage) {
      stage.innerHTML = `
        <div class="arena">
          <canvas id="arena" width="${W}" height="${H}"></canvas>
          <div class="overlay show" id="howTo">
            <h2>Feedback</h2>
            <div class="how">
              <span><kbd>←</kbd> <kbd>→</kbd></span><span>Move</span>
              <span><kbd>Space</kbd></span><span>Dash (briefly untouchable)</span>
              <span><kbd>A</kbd></span><span>Fire the root, A. More notes unlock as the fight goes on</span>
              <span>Hearts</span><span>Each hit takes one. Lose them all and the fight starts again</span>
              <span>Your volume</span><span>Every attack adds to it. Spam and you clip (stunned for a moment)</span>
              <span>Same note</span><span>Fire the note coming at you to cancel it (only notes you have)</span>
              <span>Ear defenders</span><span>Catch them to block hits for a few seconds</span>
            </div>
            <div class="buttons"><button class="primary" id="fightBtn">Fight</button></div>
          </div>
          <div class="overlay" id="endCard">
            <h2 id="endTitle"></h2>
            <p id="endText"></p>
            <div class="buttons" id="endButtons"></div>
          </div>
        </div>`;
      Sound.preload(['feedback', DRONE]);
      Sound.reverb({ mix: 0.32, seconds: 2.2, piano: 1.7, instruments: 1 }); // space on the boss synth, more on your piano
      canvas = stage.querySelector('#arena');
      ctx = canvas.getContext('2d');
      ui = {
        howTo: stage.querySelector('#howTo'), end: stage.querySelector('#endCard'),
        endTitle: stage.querySelector('#endTitle'), endText: stage.querySelector('#endText'),
        endButtons: stage.querySelector('#endButtons'),
      };
      Level.piano.useScale(ROOT);
      Level.piano.setAllowed(UNLOCKS[0]);
      stage.querySelector('#fightBtn').onclick = (e) => { e.currentTarget.blur(); ui.howTo.classList.remove('show'); begin(0); };
      newState(0);
      requestAnimationFrame(loop);
    },
  });

  // ---------- State ----------
  function newState(phase) {
    S = {
      phase, running: false, over: false, time: 0,
      boss: { x: W / 2, y: 82, hp: PHASES[phase].from, target: W / 2, stun: 0, flash: 0, warn: 0 },
      player: { x: W / 2, y: H - 34, dash: 0, dashCool: 0, safe: 0, shield: 0, dir: 0, stun: 0 },
      meter: 0, shake: 0, shotGap: 0, warnedClip: false, pending: null, moment: null,
      hearts: HEARTS + Level.extraHearts, maxHearts: HEARTS + Level.extraHearts, hurtFlash: 0, heartPop: 0,
      unlocked: new Set(phase === 2 && !thirdFound ? UNLOCKS[1] : UNLOCKS[phase]),
      shots: [], notes: [], warnings: [], pickups: [], sparks: [], texts: [],
      held: null, attackIn: 1.2, holdIn: 7, pickupIn: 9, banner: { text: PHASES[phase].name, t: 2 },
      firstHold: true,
    };
    window.__boss = S; // for automatic tests
  }

  // ---------- Music ----------
  function startMusic() {
    stopMusic(0.3);
    drone = Sound.track(DRONE, { fadeIn: 1.5 });
  }
  function stopMusic(fade = 1.2) {
    if (drone) drone.stop(fade);
    drone = null;
  }
  window.__drone = () => drone; // for automatic tests

  function begin(phase) {
    Level.attempted(); // unlocks this boss's attacks in the Tutorial's practice mode
    newState(phase);
    startMusic();
    S.running = true;
    ui.end.classList.remove('show');
    Level.piano.setEnabled(true);
    Level.piano.setAllowed([...S.unlocked]);
    if (phase === 2 && !thirdFound) startMoment();
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') {
      e.preventDefault();
      keys[e.code] = true;
      if (e.code === 'Space' && !e.repeat) dash();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.code === 'Space') e.preventDefault(); // so Space never clicks a focused button
  });
  window.addEventListener('blur', () => { paused = true; keys = {}; });
  window.addEventListener('focus', () => { paused = false; last = performance.now(); });

  function dash() {
    const p = S && S.player;
    if (!p || !S.running || p.dashCool > 0 || p.stun > 0) return;
    p.dash = 0.18;
    p.dashCool = 0.9;
    p.safe = Math.max(p.safe, 0.3);
    // Read the arrows directly, so ← + Space together always dashes left.
    p.dashDir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0) || p.dir || 1;
    Sound.whoosh();
  }

  // Keys pressed within CHORD_WINDOW of each other are gathered, then fired
  // together as one attack.
  Level.piano.onNoteOn((midi) => {
    if (!S || !S.running) return;
    const pc = midi % 12;
    if (S.moment) return guessThird(pc);
    // Cutting the feedback: the held chord's missing note (free, no gap).
    if (S.player.stun > 0) return; // clipped: can't play
    if (S.held && pc === S.held.missing % 12) return cutFeedback();
    if (!S.unlocked.has(pc)) return;
    if (!S.pending) S.pending = { notes: new Map(), t: CHORD_WINDOW };
    S.pending.notes.set(pc, midi);
  });

  function release(notes) {
    if (S.shotGap > 0) return;
    const p = S.player;
    const has = (pc) => notes.has(pc);
    let kind = 'single';
    if (S.unlocked.has(THIRD_PC) && has(ROOT_PC) && has(THIRD_PC) && has(FIFTH_PC)) kind = 'triad';
    else if (has(ROOT_PC) && has(FIFTH_PC)) kind = 'power';
    const a = ATTACKS[kind];
    const shot = (midi, angle, extra = {}) => S.shots.push({
      x: p.x, y: p.y - 22, vx: Math.sin(angle) * a.speed, vy: -Math.cos(angle) * a.speed,
      midi, pcs: [midi % 12], kind, damage: a.damage, refund: a.refund, ...extra,
    });
    let cost = a.cost;
    if (kind === 'power') {
      shot(notes.get(ROOT_PC), 0, { pcs: [ROOT_PC, FIFTH_PC], label: 'A+E' });
    } else if (kind === 'triad') {
      [[ROOT_PC, -0.2], [THIRD_PC, 0], [FIFTH_PC, 0.2]].forEach(([pc, angle]) => shot(notes.get(pc), angle));
    } else {
      cost = a.cost * notes.size;
      notes.forEach((midi) => shot(midi, 0));
    }
    S.shotGap = SHOT_GAP;
    S.meter = Math.min(100, S.meter + cost);
    if (S.meter >= 60 && !S.warnedClip) {
      S.warnedClip = true;
      playerText('Too much noise! Slow down.', 1.6);
    }
    if (S.meter >= 100) clip();
  }

  // The third unlocks in a moment: the boss holds A and E, and you find the
  // missing note. Every key works while you search.
  function startMoment() {
    S.moment = { tries: 0, sounds: [57, 64].map((m) => BOSS.hold(m, 0.18)) };
    S.banner = { text: 'It’s holding A and E. Find the missing note!', t: 3 };
    Level.piano.setAllowed(null);
  }

  function endMoment() {
    if (!S.moment) return;
    S.moment.sounds.forEach((s) => s.stop());
    S.moment = null;
  }

  function guessThird(pc) {
    const p = S.player;
    if (pc === THIRD_PC) {
      endMoment();
      S.texts = S.texts.filter((x) => !x.player); // clear any hint
      thirdFound = true;
      S.unlocked.add(THIRD_PC);
      Level.piano.setAllowed([...S.unlocked]);
      Sound.chord([57, 61, 64, 69], 0, 1.8, 0.55);
      S.boss.stun = 1.4;
      S.banner = { text: 'Third unlocked! Hold A + C♯ + E for a triad', t: 3.2 };
      for (let i = 0; i < 24; i++) spark(S.boss.x, S.boss.y + 20, '#E2D9FF');
      return;
    }
    if (pc === ROOT_PC || pc === FIFTH_PC) {
      playerText('It already has that one.', 1.2);
      return;
    }
    Sound.buzz();
    S.moment.tries++;
    playerText(S.moment.tries >= 3 ? 'Hint: the third note of the A major scale (the D key).' : 'Not that one.', 1.6);
  }

  // ---------- Boss attacks ----------
  function aimX() {
    const ph = PHASES[S.phase];
    const p = S.player;
    return Math.min(W - 20, Math.max(20, p.x + p.dir * 300 * ph.lead));
  }

  function attack() {
    const ph = PHASES[S.phase];
    const chord = Math.random() < ph.chords;
    const tx = aimX();
    if (chord) {
      const triad = pick(TRIADS.filter((t) => t !== S.lastTriad)); // never the same chord twice in a row
      S.lastTriad = triad;
      S.warnings.push({ t: ph.warn + 0.15, total: ph.warn + 0.15, tx, kind: 'chord', triad });
    } else {
      S.warnings.push({ t: ph.warn, total: ph.warn, tx, kind: 'note', midi: pick(SCALE.slice(0, 7)) });
    }
  }

  function fire(w) {
    const ph = PHASES[S.phase];
    const ox = S.boss.x, oy = S.boss.y + MUZZLE;
    const base = Math.atan2(S.player.y - oy, w.tx - ox);
    const launch = (midi, angle, kind) => {
      const speed = ph.speed * (kind === 'note' ? NOTE_SPEED : 1);
      S.notes.push({
      x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      midi, pc: midi % 12, kind, label: ph.labels,
      });
    };
    if (w.kind === 'note') {
      launch(w.midi, base, 'note');
      BOSS.note(w.midi, 0, BOSS_NOTE, 0.4);
    } else {
      const spread = w.triad.major ? 0.3 : 0.14; // major chords spread wide, minor narrow
      w.triad.notes.forEach((m, i) => launch(m, base + (i - 1) * spread, 'chord'));
      // It sounds just the chord's root and third (A + C♯ for A major); the
      // projectiles are still all three of the triad's notes.
      BOSS.chord([w.triad.notes[0], w.triad.notes[1]], 0, BOSS_CHORD, 0.5);
    }
  }

  // The boss holds a chord with one note missing.
  function hold() {
    const triad = TRIADS[0]; // A major: every note of it is yours by now
    const missing = Math.floor(Math.random() * 3);
    S.held = {
      triad, missing: triad.notes[missing], index: missing, t: 4.5,
      sounds: triad.notes.filter((_, i) => i !== missing).map((m) => BOSS.hold(m, 0.18)),
    };
    if (S.firstHold) {
      S.firstHold = false;
      S.banner = { text: 'It’s holding a chord. Play the missing note!', t: 2.6 };
    }
  }

  function endHold() {
    if (!S.held) return;
    S.held.sounds.forEach((s) => s.stop());
    S.held = null;
  }

  function cutFeedback() {
    const triad = S.held.triad;
    endHold();
    damage(CUT_DAMAGE);
    S.boss.stun = 1.6;
    S.warnings = [];
    Sound.chord(triad.notes, 0, 1.4, 0.55);
    S.texts.push({ x: S.boss.x, y: S.boss.y + 70, text: 'Feedback cut!', t: 1.4 });
    for (let i = 0; i < 24; i++) spark(S.boss.x, S.boss.y + 20, '#C8B8FF');
  }

  // Missing the held chord: it squeals out a fan of notes.
  function squealBurst() {
    const ph = PHASES[S.phase];
    const ox = S.boss.x, oy = S.boss.y + MUZZLE;
    [-0.6, -0.3, 0, 0.3, 0.6].forEach((off, i) => {
      const a = Math.PI / 2 + off;
      const midi = SCALE[i + 1];
      S.notes.push({ x: ox, y: oy, vx: Math.cos(a) * ph.speed * 0.9, vy: Math.sin(a) * ph.speed * 0.9, midi, pc: midi % 12, kind: 'chord', label: ph.labels });
    });
    Sound.squeal();
  }

  // ---------- Damage ----------
  function damage(amount) {
    const b = S.boss;
    if (S.transition) return; // the boss can't be hurt while it upgrades
    b.hp = Math.max(0, b.hp - amount / BOSS_HEALTH);
    b.flash = 0.15;
    Sound.hit();
    if (b.hp <= 0) return win();
    const next = PHASES.findIndex((ph, i) => i > S.phase && b.hp <= ph.from);
    if (next > S.phase) startTransition(next);
  }

  // Between phases: attacks stop, notes in flight burst harmlessly, and the
  // boss upgrades for a few seconds before the next phase begins.
  function startTransition(next) {
    S.phase = next;
    S.transition = { t: TRANSITION, next };
    endHold();
    S.warnings = [];
    for (const n of S.notes) for (let i = 0; i < 3; i++) spark(n.x, n.y, '#8fc4ff');
    S.notes = [];
    S.banner = null;
    Sound.chord([rootMidi('A') - 12, rootMidi('A') - 5], 0, TRANSITION, 0.25);
  }

  function endTransition() {
    const next = S.transition.next;
    S.transition = null;
    S.banner = { text: PHASES[next].name, t: 2.6 };
    if (next === 1) { S.unlocked.add(FIFTH_PC); Level.piano.setAllowed([...S.unlocked]); }
    if (next === 2 && !thirdFound) startMoment();
    S.attackIn = 1;
  }

  function hurt() {
    const p = S.player;
    if (p.safe > 0) return;
    if (p.shield > 0) { Sound.block(); spark(p.x, p.y - 10, '#E2D9FF'); return; }
    S.hearts -= 1;
    p.safe = 1.1;
    S.shake = 0.4;
    S.hurtFlash = 0.5;
    S.heartPop = 0.6;
    Sound.squeal();
    for (let i = 0; i < 14; i++) spark(p.x, p.y - 8, '#ff5d7a');
    if (S.hearts <= 0) lose();
  }

  // A message above the player; a new one replaces the last.
  function playerText(text, t = 1.4) {
    S.texts = S.texts.filter((x) => !x.player);
    S.texts.push({ x: S.player.x, y: S.player.y - 46, text, t, player: true });
  }

  function spark(x, y, color) {
    const a = rand(0, Math.PI * 2), v = rand(60, 220);
    S.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.3, 0.7), color });
  }

  // ---------- Endings ----------
  function finish(title, text, buttons) {
    S.running = false;
    stopMusic();
    endHold();
    endMoment();
    Level.piano.setEnabled(false);
    ui.endTitle.textContent = title;
    ui.endText.textContent = text;
    ui.endButtons.innerHTML = '';
    buttons.forEach(([label, fn, primary]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (primary) b.className = 'primary';
      b.onclick = fn;
      ui.endButtons.append(b);
    });
    ui.end.classList.add('show');
  }

  // Firing too much: you're stunned for a moment instead of losing.
  function clip() {
    const p = S.player;
    p.stun = CLIP_STUN;
    p.dash = 0;
    S.meter = CLIP_RESET;
    S.pending = null;
    S.shake = 0.35;
    S.banner = { text: 'You clipped!', t: 1.8, big: true };
    Sound.squeal();
    Level.piano.setEnabled(false);
    setTimeout(() => { if (S && S.running && S.player === p) Level.piano.setEnabled(true); }, CLIP_STUN * 1000);
  }

  // Out of hearts: the whole fight starts again.
  function lose() {
    finish('Out of hearts', 'Feedback got the better of you. The fight starts again from the top.', [
      ['Try again', () => { thirdFound = false; begin(0); }, true],
    ]);
  }

  function win() {
    S.over = true;
    S.running = false;
    stopMusic(2);
    endHold();
    endMoment();
    S.notes = [];
    S.warnings = [];
    for (let i = 0; i < 40; i++) spark(S.boss.x, S.boss.y + 20, i % 2 ? '#C8B8FF' : '#9A7FE0');
    Sound.chord([45, 57, 61, 64, 69], 0.1, 2.6, 0.6);
    setTimeout(() => finish('Feedback cut', 'Silence, finally. The speaker’s calmed down.', []), 900);
    setTimeout(() => Level.win(), 2600);
  }

  // ---------- Game loop ----------
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    frame++;
    if (S && S.running && !paused) update(dt);
    if (S) draw();
  }

  function update(dt) {
    const ph = PHASES[S.phase];
    const b = S.boss, p = S.player;
    S.time += dt;

    // Player movement
    p.stun = Math.max(0, p.stun - dt);
    p.dir = p.stun > 0 ? 0 : (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    const speed = p.dash > 0 ? 1300 : 380;
    const dir = p.dash > 0 ? p.dashDir : p.dir;
    p.x = Math.min(W - 24, Math.max(24, p.x + dir * speed * dt));
    p.dash = Math.max(0, p.dash - dt);
    p.dashCool = Math.max(0, p.dashCool - dt);
    p.safe = Math.max(0, p.safe - dt);
    p.shield = Math.max(0, p.shield - dt);

    // Boss drifts to a new spot now and then; in phase 3 it follows you.
    if (Math.abs(b.target - b.x) < 4 || Math.random() < dt * 0.5) b.target = rand(110, W - 110);
    if (S.phase === 2) b.target = b.target * 0.98 + p.x * 0.02;
    if (b.stun <= 0) b.x += Math.sign(b.target - b.x) * Math.min(Math.abs(b.target - b.x), ph.drift * dt);
    b.stun = Math.max(0, b.stun - dt);
    b.flash = Math.max(0, b.flash - dt);

    // Between phases: nothing attacks until the upgrade finishes.
    if (S.transition) {
      S.transition.t -= dt;
      if (S.transition.t <= 0) endTransition();
    }

    // Attacks, held chords and pickups
    if (b.stun <= 0 && !S.transition) {
      S.attackIn -= dt * (S.held || S.moment ? 0.5 : 1);
      if (S.attackIn <= 0) { attack(); S.attackIn = ph.gap * rand(0.85, 1.15); }
      if (S.phase >= 2 && thirdFound && !S.held && !S.moment) {
        S.holdIn -= dt;
        if (S.holdIn <= 0) { hold(); S.holdIn = rand(8, 11); }
      }
    }
    if (S.held) {
      S.held.t -= dt;
      if (S.held.t <= 0) { endHold(); squealBurst(); }
    }
    S.pickupIn -= dt;
    if (S.pickupIn <= 0) { S.pickups.push({ x: rand(60, W - 60), y: -20 }); S.pickupIn = rand(12, 16); }

    // Warnings count down, then fire.
    S.warnings.forEach((w) => {
      w.t -= dt;
      if (TRACK.on && w.tx !== undefined) {
        if (w.miss === undefined) w.miss = rand(-TRACK.miss, TRACK.miss);
        const want = aimX() + w.miss - w.tx;
        const step = want * (1 - Math.exp(-TRACK.follow * dt));
        w.tx += Math.sign(step) * Math.min(Math.abs(step), TRACK.maxSpeed * dt);
      }
    });
    S.warnings.filter((w) => w.t <= 0).forEach(fire);
    S.warnings = S.warnings.filter((w) => w.t > 0);
    b.warn = S.warnings.length ? 1 - Math.min(...S.warnings.map((w) => w.t / w.total)) : 0;

    // Movement of everything else
    S.notes.forEach((n) => { n.x += n.vx * dt; n.y += n.vy * dt; });
    S.shots.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; });
    S.pickups.forEach((k) => { k.y += 70 * dt; });
    S.sparks.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; });
    S.texts.forEach((t) => { t.y -= 30 * dt; t.t -= dt; });
    S.meter = Math.max(0, S.meter - 6 * dt);
    S.shotGap = Math.max(0, S.shotGap - dt);
    if (S.pending) {
      S.pending.t -= dt;
      if (S.pending.t <= 0) { const notes = S.pending.notes; S.pending = null; release(notes); if (!S.running) return; }
    }
    S.shake = Math.max(0, S.shake - dt);
    S.hurtFlash = Math.max(0, S.hurtFlash - dt);
    S.heartPop = Math.max(0, S.heartPop - dt);
    if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }

    // Your note meets an incoming note of the same pitch: both cancel.
    for (const s of S.shots) {
      for (const n of S.notes) {
        if (!n.gone && !s.gone && s.pcs.includes(n.pc) && Math.hypot(n.x - s.x, n.y - s.y) < (s.kind === 'power' ? 34 : 26)) {
          n.gone = s.gone = true;
          for (let i = 0; i < 8; i++) spark(n.x, n.y, '#C8B8FF');
          Sound.note(n.midi + 12, 0, 0.25, 0.18);
          S.meter = Math.max(0, S.meter - s.refund); // refunded
          damage(CANCEL_DAMAGE);
          if (!S.running) return;
        }
      }
      if (!s.gone && Math.abs(s.x - b.x) < 74 * BOSS_SIZE && s.y < b.y + 48 * BOSS_SIZE && s.y > b.y - 40 * BOSS_SIZE) {
        s.gone = true;
        damage(s.damage);
        spark(s.x, b.y + 40, '#9A7FE0');
      }
    }
    if (!S.running) return;

    // Incoming notes hitting you
    for (const n of S.notes) {
      if (!n.gone && Math.hypot(n.x - p.x, n.y - (p.y - 6)) < 22) { n.gone = true; hurt(); if (!S.running) return; }
    }
    for (const k of S.pickups) {
      if (!k.gone && Math.abs(k.x - p.x) < 30 && Math.abs(k.y - p.y) < 30) {
        k.gone = true;
        p.shield = 5;
        Sound.note(ROOT + 24, 0, 0.6, 0.25);
        playerText('Ear defenders!', 1.2);
      }
    }

    S.notes = S.notes.filter((n) => !n.gone && n.y < H + 20 && n.x > -20 && n.x < W + 20);
    S.shots = S.shots.filter((s) => !s.gone && s.y > -20 && s.x > -20 && s.x < W + 20);
    S.pickups = S.pickups.filter((k) => !k.gone && k.y < H + 20);
    S.sparks = S.sparks.filter((s) => s.t > 0);
    S.texts = S.texts.filter((t) => t.t > 0);
  }

  // ---------- Drawing ----------
  function draw() {
    const b = S.boss, p = S.player;
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (S.shake > 0) ctx.translate(rand(-4, 4) * S.shake * 3, rand(-3, 3) * S.shake * 3);

    // Stage: faint floor lines and two light beams
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#16141c'); bg.addColorStop(1, '#0f0e13');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(94, 62, 132, 0.18)'; ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + (i - 4.5) * 40, H * 0.55); ctx.lineTo(W / 2 + (i - 4.5) * 150, H); ctx.stroke(); }
    for (const lx of [W * 0.18, W * 0.82]) {
      const beam = ctx.createLinearGradient(lx, 0, lx, H);
      beam.addColorStop(0, 'rgba(154, 127, 224, 0.10)'); beam.addColorStop(1, 'rgba(154, 127, 224, 0)');
      ctx.fillStyle = beam;
      ctx.beginPath(); ctx.moveTo(lx - 10, 0); ctx.lineTo(lx + 10, 0); ctx.lineTo(lx + 90, H); ctx.lineTo(lx - 90, H); ctx.fill();
    }

    // Warnings: aim lines from the speaker to where it's aiming
    for (const w of S.warnings) {
      const k = 1 - w.t / w.total;
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = `rgba(200, 184, 255, ${0.15 + k * 0.45})`;
      ctx.lineWidth = 2;
      const ox = b.x, oy = b.y + MUZZLE;
      const base = Math.atan2(p.y - oy, w.tx - ox);
      const angles = w.kind === 'chord' ? [-1, 0, 1].map((i) => base + i * (w.triad.major ? 0.3 : 0.14)) : [base];
      for (const a of angles) { ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(a) * 420, oy + Math.sin(a) * 420); ctx.stroke(); }
      ctx.setLineDash([]);
    }

    drawBoss(b);

    // Held chord, shown above the boss's head... well, under it
    if (S.held) {
      const h = S.held;
      const y = b.y + 74;
      ctx.font = '600 12px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#9A93A3'; ctx.fillText(`${h.triad.name} chord · play the missing note`, b.x, y - 14);
      h.triad.notes.forEach((m, i) => {
        const x = b.x + (i - 1) * 40;
        const missing = i === h.index;
        ctx.fillStyle = missing ? `rgba(200, 184, 255, ${0.35 + 0.35 * Math.sin(S.time * 8)})` : '#5E3E84';
        roundRect(x - 16, y - 2, 32, 24, 6); ctx.fill();
        ctx.fillStyle = missing ? '#181818' : '#E6E1EC';
        ctx.font = '600 15px Oswald, sans-serif';
        ctx.fillText(missing ? '?' : name(m), x, y + 15);
      });
      ctx.fillStyle = 'rgba(200, 184, 255, 0.6)';
      ctx.fillRect(b.x - 60, y + 28, 120 * (h.t / 4.5), 3);
    }

    // The third-unlock moment: A ? E
    if (S.moment) {
      const y = b.y + 74;
      ctx.font = '600 12px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#9A93A3'; ctx.fillText('Find the missing note', b.x, y - 14);
      ['A', '?', 'E'].forEach((label, i) => {
        const x = b.x + (i - 1) * 40;
        const missing = i === 1;
        ctx.fillStyle = missing ? `rgba(226, 217, 255, ${0.4 + 0.35 * Math.sin(S.time * 8)})` : '#5E3E84';
        roundRect(x - 16, y - 2, 32, 24, 6); ctx.fill();
        ctx.fillStyle = missing ? '#181818' : '#E6E1EC';
        ctx.font = '600 15px Oswald, sans-serif';
        ctx.fillText(label, x, y + 15);
      });
    }

    // Incoming notes: blue for single notes, violet for chords
    for (const n of S.notes) {
      const color = n.kind === 'note' ? '#8fc4ff' : '#C8B8FF';
      ctx.shadowColor = color; ctx.shadowBlur = 14;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (n.label) {
        ctx.fillStyle = '#181818'; ctx.font = '600 11px Oswald, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(name(n.midi), n.x, n.y + 4);
      }
    }

    // Your notes
    for (const s of S.shots) {
      const power = s.kind === 'power';
      const color = power ? '#E2D9FF' : s.kind === 'triad' ? '#C8B8FF' : '#9A7FE0';
      const w = power ? 44 : 24, h = power ? 24 : 18;
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = power ? 22 : 10;
      roundRect(s.x - w / 2, s.y - h / 2, w, h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#181818'; ctx.font = `600 ${power ? 13 : 11}px Oswald, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(s.label || name(s.midi), s.x, s.y + 4);
    }

    // Ear defenders pickups
    for (const k of S.pickups) drawHeadphones(k.x, k.y, 0.7, '#E2D9FF', true);

    drawPlayer(p);

    for (const s of S.sparks) { ctx.globalAlpha = Math.max(0, s.t * 1.6); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, t.t * 2);
      ctx.fillStyle = '#C8B8FF'; ctx.font = '600 16px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawDistortion();
    drawHurt();
    drawTransition();
    drawHud();
  }

  // Loudness you can see: past 40% the edges glitch and glow, stronger as the
  // meter rises; while clipped, the whole screen breaks up.
  function drawDistortion() {
    const clipped = S.player.stun > 0;
    // Rises quickly at first so it's noticeable early: 65% already shows clearly.
    const level = clipped ? 1 : Math.pow(Math.max(0, (S.meter - 40) / 60), 0.6);
    if (level <= 0) return;
    const pulse = S.meter > 85 || clipped ? 0.75 + 0.25 * Math.sin(S.time * 18) : 1;

    // Torn strips: copy slices of the picture back slightly out of place.
    const strips = clipped ? 14 : Math.round(2 + level * 6);
    for (let i = 0; i < strips; i++) {
      const h = rand(3, clipped ? 26 : 10);
      const y = clipped ? rand(0, H - h) : (Math.random() < 0.5 ? rand(0, 60 * level) : rand(H - 60 * level, H - h));
      const dx = rand(-1, 1) * (clipped ? 36 : 14 * level);
      ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
    }
    if (!clipped) {
      for (let i = 0; i < strips; i++) {
        const w = rand(3, 8 + 24 * level), y = rand(0, H);
        const x = Math.random() < 0.5 ? rand(0, 50 * level) : rand(W - 50 * level, W - w);
        ctx.drawImage(canvas, x, y, w, 40, x + rand(-6, 6) * level, y + rand(-8, 8) * level, w, 40);
      }
    }

    // Glow creeping in from the edges: violet static, turning pink just
    // before you clip (red is kept for getting hit).
    const hot = clipped ? 1 : Math.max(0, (level - 0.7) / 0.3);
    const [r, g, bl] = [200 + 55 * hot, 184 - 64 * hot, 255 - 95 * hot].map(Math.round);
    const edge = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
    edge.addColorStop(0, `rgba(${r}, ${g}, ${bl}, 0)`);
    edge.addColorStop(1, `rgba(${r}, ${g}, ${bl}, ${0.7 * level * pulse})`);
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, W, H);

    // Static lines
    ctx.fillStyle = `rgba(255, 255, 255, ${0.06 + 0.12 * level})`;
    for (let i = 0; i < (clipped ? 40 : 6 + 18 * level); i++) {
      const y = rand(0, H);
      const near = clipped ? 1 : 0.18;
      const x = Math.random() < 0.5 ? rand(0, W * near) : rand(W * (1 - near), W);
      ctx.fillRect(x, y, rand(10, clipped ? 160 : 50), 1);
    }
    if (clipped) {
      // Colour split across the whole screen
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.18;
      ctx.drawImage(canvas, 6, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(255, 120, 160, ${0.1 * pulse})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Getting hit: a red flash and a red rim.
  function drawHurt() {
    if (S.hurtFlash <= 0) return;
    const k = S.hurtFlash / 0.5;
    ctx.fillStyle = `rgba(255, 40, 70, ${0.28 * k})`;
    ctx.fillRect(0, 0, W, H);
    const rim = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.6);
    rim.addColorStop(0, 'rgba(255, 40, 70, 0)');
    rim.addColorStop(1, `rgba(255, 40, 70, ${0.7 * k})`);
    ctx.fillStyle = rim;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHeart(x, y, size, full) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 20, size / 20);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-10, -2, -10, -10, -5, -10);
    ctx.bezierCurveTo(-2, -10, 0, -8, 0, -6);
    ctx.bezierCurveTo(0, -8, 2, -10, 5, -10);
    ctx.bezierCurveTo(10, -10, 10, -2, 0, 6);
    ctx.closePath();
    if (full) {
      ctx.fillStyle = '#ff5d7a'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 8;
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255, 93, 122, 0.45)'; ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBoss(b) {
    const glow = S.transition ? 0.6 + 0.4 * Math.sin(S.time * 14) : b.warn;
    const wobble = b.stun > 0 ? Math.sin(S.time * 30) * 3 : 0;
    ctx.save();
    ctx.translate(b.x + wobble, b.y);
    ctx.scale(BOSS_SIZE, BOSS_SIZE);
    const x = 0, y = 0;
    // Mic leaning into the speaker: the cause of the feedback
    ctx.strokeStyle = '#5E3E84'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x + 96, y + 52); ctx.lineTo(x + 82, y + 2); ctx.stroke();
    ctx.fillStyle = '#9A93A3';
    ctx.beginPath(); ctx.ellipse(x + 80, y - 4, 7, 11, -0.4, 0, Math.PI * 2); ctx.fill();
    // Feedback rings between mic and speaker
    if (S.running && b.stun <= 0) {
      ctx.strokeStyle = `rgba(200, 184, 255, ${0.25 + glow * 0.6})`; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const r = 8 + ((S.time * 30 + i * 9) % 26);
        ctx.beginPath(); ctx.arc(x + 70, y + 4, r, Math.PI * 0.6, Math.PI * 1.3); ctx.stroke();
      }
    }
    // Cabinet
    ctx.fillStyle = b.flash > 0 ? '#5E3E84' : '#26232d';
    ctx.strokeStyle = '#5E3E84'; ctx.lineWidth = 2;
    roundRect(x - 62, y - 36, 124, 86, 10); ctx.fill(); ctx.stroke();
    // Cone, glowing brighter as it gets ready to fire
    const cone = ctx.createRadialGradient(x, y + 10, 2, x, y + 10, 30);
    cone.addColorStop(0, `rgba(226, 217, 255, ${0.4 + glow * 0.6})`);
    cone.addColorStop(0.5, `rgba(154, 127, 224, ${0.5 + glow * 0.5})`);
    cone.addColorStop(1, '#1b1a20');
    ctx.fillStyle = cone;
    ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 10 + glow * 30;
    ctx.beginPath(); ctx.arc(x, y + 10, 26 + Math.sin(S.time * 40) * (S.running ? 1.5 : 0), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#121116';
    ctx.beginPath(); ctx.arc(x, y - 24, 6, 0, Math.PI * 2); ctx.fill();
    if (b.stun > 0) {
      ctx.fillStyle = '#E2D9FF'; ctx.font = '600 13px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('STUNNED', x, y - 46);
    }
    ctx.restore();
  }

  function drawHeadphones(x, y, scale, color, defenders) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.strokeStyle = color; ctx.lineWidth = defenders ? 7 : 5; ctx.lineCap = 'round';
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(0, 0, 18, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    ctx.fillStyle = color;
    roundRect(-24, -6, 12, defenders ? 22 : 18, 4); ctx.fill();
    roundRect(12, -6, 12, defenders ? 22 : 18, 4); ctx.fill();
    ctx.restore();
  }

  function drawPlayer(p) {
    const blink = p.safe > 0 && Math.floor(S.time * 20) % 2 === 0;
    if (blink) return;
    if (p.shield > 0) {
      ctx.strokeStyle = `rgba(226, 217, 255, ${0.4 + 0.3 * Math.sin(S.time * 10)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y - 6, 30, 0, Math.PI * 2); ctx.stroke();
    }
    drawHeadphones(p.x, p.y - 4, 1, p.stun > 0 ? '#5d5866' : p.shield > 0 ? '#E2D9FF' : '#9A7FE0', p.shield > 0);
    if (p.stun > 0) {
      // Static crackling round the stunned headphones
      ctx.strokeStyle = 'rgba(255, 93, 122, 0.8)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const a = S.time * 9 + i * 2.1;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * 26, p.y - 6 + Math.sin(a) * 18);
        ctx.lineTo(p.x + Math.cos(a + 0.3) * 34, p.y - 6 + Math.sin(a + 0.3) * 24);
        ctx.stroke();
      }
    }
  }

  // "PHASE 2 COMMENCING" with the boss's upgrade bar filling.
  function drawTransition() {
    if (!S.transition) return;
    const k = 1 - S.transition.t / TRANSITION;
    const fade = Math.min(1, (TRANSITION - S.transition.t) * 3, S.transition.t * 3);
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(12, 11, 16, 0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#E6E1EC'; ctx.font = '600 40px Oswald, sans-serif';
    ctx.fillText(`PHASE ${S.transition.next + 1} COMMENCING`, W / 2, H / 2 - 8);
    ctx.fillStyle = '#9A93A3'; ctx.font = '500 12px Oswald, sans-serif';
    ctx.fillText('BOSS UPGRADING', W / 2, H / 2 + 22);
    ctx.fillStyle = '#26232d'; roundRect(W / 2 - 160, H / 2 + 34, 320, 10, 5); ctx.fill();
    const bar = ctx.createLinearGradient(W / 2 - 160, 0, W / 2 + 160, 0);
    bar.addColorStop(0, '#5E3E84'); bar.addColorStop(1, '#ff5d7a');
    ctx.fillStyle = bar; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 12;
    roundRect(W / 2 - 160, H / 2 + 34, 320 * k, 10, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    const b = S.boss;
    ctx.textAlign = 'left'; ctx.font = '600 14px Oswald, sans-serif';
    ctx.fillStyle = '#E6E1EC'; ctx.fillText('FEEDBACK', 16, 24);
    ctx.fillStyle = '#26232d'; roundRect(96, 13, 260, 12, 6); ctx.fill();
    ctx.fillStyle = '#9A7FE0'; roundRect(96, 13, 260 * (b.hp / 100), 12, 6); ctx.fill();
    // Volume meter (your health), top right
    ctx.textAlign = 'right'; ctx.fillStyle = '#E6E1EC'; ctx.font = '600 14px Oswald, sans-serif';
    ctx.fillText('VOLUME', W - 236, 24);
    ctx.fillStyle = '#26232d'; roundRect(W - 216, 13, 200, 12, 6); ctx.fill();
    const meter = ctx.createLinearGradient(W - 216, 0, W - 16, 0);
    meter.addColorStop(0, '#9A7FE0'); meter.addColorStop(0.7, '#c46a7a'); meter.addColorStop(1, '#ff5d7a');
    ctx.fillStyle = meter; roundRect(W - 216, 13, 200 * (S.meter / 100), 12, 6); ctx.fill();
    if (S.player.shield > 0) {
      ctx.fillStyle = '#E2D9FF'; ctx.font = '500 12px Oswald, sans-serif';
      ctx.fillText(`EAR DEFENDERS ${Math.ceil(S.player.shield)}`, W - 16, 42);
    }
    // Hearts, bottom left. The one just lost pops.
    for (let i = 0; i < S.maxHearts; i++) {
      const lost = i === S.hearts && S.heartPop > 0;
      const size = lost ? 22 + 14 * (S.heartPop / 0.6) : 22;
      drawHeart(28 + i * 30, H - 22, size, i < S.hearts || lost && Math.floor(S.time * 16) % 2 === 0);
    }
    // Your moves, bottom right: locked ones are dim.
    const moves = [['A', true], ['A+E', S.unlocked.has(FIFTH_PC)], ['A+C♯+E', S.unlocked.has(THIRD_PC)]];
    ctx.textAlign = 'right'; ctx.font = '600 12px Oswald, sans-serif';
    let mx = W - 16;
    for (const [label, on] of moves.reverse()) {
      const text = on ? label : `${label} (locked)`;
      ctx.fillStyle = on ? '#C8B8FF' : 'rgba(154, 147, 163, 0.35)';
      ctx.fillText(text, mx, H - 14);
      mx -= ctx.measureText(text).width + 18;
    }
    ctx.fillStyle = '#9A93A3'; ctx.fillText('MOVES', mx, H - 14);
    if (S.banner && S.running) {
      ctx.globalAlpha = Math.min(1, S.banner.t * 1.5);
      ctx.textAlign = 'center';
      ctx.font = S.banner.big ? '600 44px Oswald, sans-serif' : '600 26px Oswald, sans-serif';
      ctx.fillStyle = S.banner.big ? '#ff5d7a' : '#C8B8FF';
      ctx.fillText(S.banner.text, W / 2, H / 2 + 48);
      ctx.globalAlpha = 1;
    }
    if (paused && S.running) {
      ctx.textAlign = 'center'; ctx.font = '600 20px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText('Paused: click the game to carry on', W / 2, H / 2 + 90);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, Math.max(0, h), r) : ctx.rect(x, y, w, Math.max(0, h));
  }
</script>
