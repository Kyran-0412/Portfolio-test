/* lib/keys.js */
// Facts about the 12 keys, shared by the embed boxes.
const KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

const KEY_INFO = {
  C:    { label: 'C',  minor: 'Am',  signature: 'No sharps or flats', level: 'Tutorial',           semitones: 0 },
  G:    { label: 'G',  minor: 'Em',  signature: '1 sharp',            level: 'Wrong Note',         semitones: 7 },
  D:    { label: 'D',  minor: 'Bm',  signature: '2 sharps',           level: 'Key Signature Lock', semitones: 2 },
  A:    { label: 'A',  minor: 'F♯m', signature: '3 sharps',           level: 'Feedback',           semitones: 9 },
  E:    { label: 'E',  minor: 'C♯m', signature: '4 sharps',           level: 'Melody Memory',      semitones: 4 },
  B:    { label: 'B',  minor: 'G♯m', signature: '5 sharps',           level: 'Fix the Mix',        semitones: 11 },
  'F#': { label: 'F♯', minor: 'D♯m', signature: '6 sharps (or 6 flats as G♭)', level: 'The Tritone', semitones: 6, alt: 'G♭' },
  Db:   { label: 'D♭', minor: 'B♭m', signature: '5 flats',            level: 'Chord Progression',  semitones: 1 },
  Ab:   { label: 'A♭', minor: 'Fm',  signature: '4 flats',            level: 'Survival Waves',     semitones: 8 },
  Eb:   { label: 'E♭', minor: 'Cm',  signature: '3 flats',            level: 'Beat Rebuild',       semitones: 3 },
  Bb:   { label: 'B♭', minor: 'Gm',  signature: '2 flats',            level: 'Arpeggio Rush',      semitones: 10 },
  F:    { label: 'F',  minor: 'Dm',  signature: '1 flat',             level: 'Final Boss',         semitones: 5 },
};

const keyLabel = (key) => KEY_INFO[key].label;

// Root note of a key as a MIDI number, kept between F#3 and F#4.
function rootMidi(key) {
  const s = KEY_INFO[key].semitones;
  return 60 + (s > 6 ? s - 12 : s);
}

<script>
/* lib/bridge.js */
// Talks to the Wix page code around this embed box.
// Keeps saying "ready" until the page answers, in case the page code
// starts listening after the box loads.
const Bridge = (() => {
  const handlers = {};
  const standalone = window.parent === window;
  let answered = false;

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message.type !== 'string' || message.type === 'ready') return;
    answered = true;
    if (handlers[message.type]) handlers[message.type](message);
  });

  function send(message) {
    if (!standalone) window.parent.postMessage(message, '*');
  }

  function start() {
    if (standalone) return;
    let tries = 0;
    const timer = setInterval(() => {
      if (answered || ++tries > 40) clearInterval(timer);
      else send({ type: 'ready' });
    }, 400);
    send({ type: 'ready' });
  }

  return { on: (type, fn) => { handlers[type] = fn; }, send, start, standalone };
})();
</script>

    // With no laser samples at all, the synth tritone carries straight through.
    if (!chargeParts) { const held = synth(); return { live() {}, stop() { held.forEach((v) => v.stop()); } }; }
    parts.push(...chargeParts);
    let isLive = false, stopped = false;
    return {
      live() {
        if (isLive || stopped) return; // a laser stopped already never comes back on
        isLive = true;
        chargeParts.forEach((v) => v.stop(0.04));
        if (hit) parts.push(playBuffer(hit, { volume: LASER_GAIN }));
        if (loops) { const n = nearestIn(loops, root); parts.push(playBuffer(n.buf, { rate: n.rate, loop: true, volume: LASER_GAIN })); }
        else parts.push(...synth());
      },
      stop() { stopped = true; parts.forEach((v) => (v.fadeOut ? v.fadeOut(LASER_FADE) : v.stop(LASER_FADE))); },
    };
  }

  return {
    unlock: audio,
    reverb(options) { reverbWanted = options || {}; if (ctx && !reverbIn) buildReverb(reverbWanted); },
    get hasReverb() { return !!reverbIn; },
    // Preview only: 'normal', 'wet' (just the reverb, loud enough to judge) or 'off'.
    reverbTest(mode) {
      if (!reverbIn) return;
      const t = ctx.currentTime, mix = (reverbWanted && reverbWanted.mix) || 0.22;
      dry.gain.setTargetAtTime(mode === 'wet' ? 0 : 1, t, 0.02);
      reverbWet.gain.setTargetAtTime(mode === 'off' ? 0 : mode === 'wet' ? 1 : mix, t, 0.02);
    },
    laser,
    instrument,
    track,
    trackNear,
    // A one-shot effect as recorded; null if it isn't loaded.
    sfx(name, volume = SFX_GAIN) { const b = named[name]; return b && b.getChannelData ? playBuffer(b, { volume }) : null; },
    // A seamless loop from a pitched set, shifted to `midi`; null if it isn't loaded.
    loopNear(name, midi, volume = SFX_GAIN) {
      const set = named[name];
      if (!set || set.getChannelData || !Object.keys(set).length) return null;
      const n = nearestIn(set, midi);
      return playBuffer(n.buf, { rate: n.rate, loop: true, volume });
    },
    // Levels list the named sounds they use, so others don't download them.
    preload(names) { names.forEach((n) => { if (!wanted.has(n)) { wanted.add(n); if (ctx) loadNamed(n); } }); },
    has: (name) => !!named[name],
    // Sample loading progress: { total, loaded, blocked, broken, done }.
    get samples() { return { ...status }; },
    onSamples(fn) { onStatus = fn; fn(status); },
    note,
    hold,
    chord,
    // A wrong note: a soft low buzz.
    buzz() {
      const a = audio();
      const t = a.currentTime + 0.02;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = 'square';
      osc.frequency.value = 98;
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(filter).connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.3);
    },
    // Locked door: two dull knocks.
    locked() {
      thump(0, 120, 55, 0.18, 0.5);
      noise(0, 0.08, 900, 200, 0.25);
      thump(0.11, 110, 50, 0.16, 0.35);
    },
    // Getting hit in a fight: a short, quiet feedback squeal.
    squeal() {
      const a = audio();
      const t = a.currentTime + 0.01;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, t);
      osc.frequency.exponentialRampToValueAtTime(3200, t + 0.25);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.06, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.32);
      noise(0, 0.12, 3000, 800, 0.12);
    },
    // A note landing on the boss.
    hit() { thump(0, 190, 90, 0.12, 0.28); },
    // Ear defenders blocking a note.
    block() { noise(0, 0.1, 5000, 1500, 0.18); },
    // A lock springing open: two clicks and a soft thud.
    unlocked() {
      noise(0, 0.03, 6000, 3000, 0.35);
      noise(0.07, 0.03, 7000, 3500, 0.3);
      thump(0.1, 160, 70, 0.2, 0.35);
    },
    // Door swinging open.
    whoosh() {
      noise(0, 0.6, 300, 2400, 0.12);
    },
    // A key going into the circle: its perfect fifth, then its major triad.
    insert(root) {
      chord([root, root + 7], 0, 0.9, 0.5);
      chord([root, root + 4, root + 7, root + 12], 0.55, 2.4, 0.55);
    },
    // Clicking a lit key once the circle is complete.
    fifth(root) {
      chord([root, root + 7], 0, 1.1, 0.45);
    },
    // Finding a key at the end of a level: a rising arpeggio.
    keyFound(root) {
      [0, 4, 7, 12, 16].forEach((step, i) => note(root + step, i * 0.12, 1.4, 0.35));
    },
  };
})();
</script>
<script>
/* lib/piano.js */
// On-screen piano, played with the computer keyboard (the same layout as
// Ableton's and FL Studio's computer-keyboard piano) or by clicking.
//   W E   T Y U   O P
//  A S D F G H J K L ; '      Z / X shift the octave
// Boss fights switch to scale mode: A S D F G H J K play the 8 notes of the
// level's scale, so one hand can play while the other moves.
// Levels listen with onNoteOn / onNoteOff and can mark keys with
// mark(midi, 'target' | 'good' | 'bad').
const Piano = (() => {
  const CHROMATIC_CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY',
    'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote'];
  const CHROMATIC_LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"];
  const SCALE_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK'];
  const SCALE_LETTERS = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K'];
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const BLACK = [1, 3, 6, 8, 10];

  const noteName = (midi) => NAMES[((midi % 12) + 12) % 12];
  const octaveOf = (midi) => Math.floor(midi / 12) - 1;

  function create(container, { octave: startOctave = 4 } = {}) {
    const listeners = { on: [], off: [] };
    const held = new Map(); // midi → sound
    const pressedCodes = new Map(); // keyboard code → midi
    const targetPitches = new Set();
    let enabled = true;
    let shift = 0; // octaves up or down from the starting layout
    let layout = []; // [{ code, letter, midi, black, el }]
    let scaleMode = false;
    let allowed = null; // null = every key works; otherwise a Set of note names (0–11)
    let names = null;   // optional names to show on the keys, e.g. spelled with flats
    let chromaticBase = (startOctave + 1) * 12;

    container.classList.add('piano');
    container.innerHTML = `
      <div class="piano-bar">
        <span class="piano-octave">Octave <b></b></span>
        <span class="piano-help">Z / X change octave</span>
      </div>
      <div class="piano-keys"></div>`;
    const keysEl = container.querySelector('.piano-keys');
    const octaveEl = container.querySelector('.piano-octave b');

    const midiOf = (entry) => entry.midi + shift * 12;
    const entryFor = (midi) => layout.find((k) => midiOf(k) === midi) || null;

    function render() {
      keysEl.innerHTML = '';
      let whiteIndex = 0;
      layout.forEach((k) => {
        const el = document.createElement('div');
        el.className = 'piano-key ' + (k.black ? 'black' : 'white');
        el.innerHTML = `<span class="piano-letter">${k.letter}</span><span class="piano-name"></span>`;
        if (k.black) el.style.left = `calc(${whiteIndex} * var(--white-w) - var(--black-w) / 2)`;
        else whiteIndex++;
        keysEl.appendChild(el);
        k.el = el;
      });
      container.style.setProperty('--whites', whiteIndex);
      container.classList.toggle('scale-mode', scaleMode);
      relabel();
    }

    function relabel() {
      octaveEl.textContent = octaveOf(midiOf(layout[0]));
      layout.forEach((k, i) => {
        const midi = midiOf(k);
        k.el.dataset.midi = midi;
        const name = names ? names[i] : scaleMode ? noteName(midi) : (midi % 12 === 0 ? `C${octaveOf(midi)}` : '');
        k.el.querySelector('.piano-name').textContent = name;
        k.el.classList.toggle('mark-target', targetPitches.has(midi % 12));
        k.el.classList.toggle('locked', allowed !== null && !allowed.has(midi % 12));
        k.el.classList.remove('mark-good', 'mark-bad');
      });
    }

    function chromatic() {
      scaleMode = false;
      layout = CHROMATIC_CODES.map((code, i) => ({
        code, letter: CHROMATIC_LETTERS[i], midi: chromaticBase + i, black: BLACK.includes(i % 12),
      }));
      render();
    }

    function down(midi, source) {
      if (!enabled || held.has(midi)) return;
      if (allowed !== null && !allowed.has(midi % 12)) return; // greyed out
      held.set(midi, Sound.hold(midi));
      const entry = entryFor(midi);
      if (entry) entry.el.classList.add('down');
      listeners.on.forEach((fn) => fn(midi, source));
    }

    function up(midi) {
      const sound = held.get(midi);
      if (!sound) return;
      sound.stop();
      held.delete(midi);
      const entry = entryFor(midi);
      if (entry) entry.el.classList.remove('down');
      listeners.off.forEach((fn) => fn(midi));
    }

    function releaseAll() {
      [...held.keys()].forEach(up);
      pressedCodes.clear();
    }

    function setOctave(n) {
      const nextShift = shift + (n - octaveOf(midiOf(layout[0])));
      const lowest = midiOf(layout[0]) + (nextShift - shift) * 12;
      if (lowest < 36 || lowest > 84) return; // keep between C2 and C6
      releaseAll();
      shift = nextShift;
      relabel();
    }

    // Computer keyboard
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === 'KeyZ' || e.code === 'KeyX') {
        e.preventDefault();
        if (!e.repeat) setOctave(octaveOf(midiOf(layout[0])) + (e.code === 'KeyZ' ? -1 : 1));
        return;
      }
      const entry = layout.find((k) => k.code === e.code);
      if (!entry) return;
      e.preventDefault();
      if (e.repeat || pressedCodes.has(e.code)) return;
      Sound.unlock();
      const midi = midiOf(entry);
      pressedCodes.set(e.code, midi);
      down(midi, 'keyboard');
    });
    window.addEventListener('keyup', (e) => {
      if (!pressedCodes.has(e.code)) return;
      up(pressedCodes.get(e.code));
      pressedCodes.delete(e.code);
    });
    window.addEventListener('blur', releaseAll);

    // Mouse and touch
    keysEl.addEventListener('pointerdown', (e) => {
      const key = e.target.closest('.piano-key');
      if (!key) return;
      e.preventDefault();
      Sound.unlock();
      const midi = Number(key.dataset.midi);
      down(midi, 'pointer');
      const release = () => {
        up(midi);
        window.removeEventListener('pointerup', release);
        window.removeEventListener('pointercancel', release);
      };
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
    });

    chromatic();

    return {
      onNoteOn: (fn) => listeners.on.push(fn),
      onNoteOff: (fn) => listeners.off.push(fn),
      held: () => [...held.keys()],
      // Marks a key: 'target' glows (play this), 'good' and 'bad' flash.
      mark(midi, kind) {
        const entry = entryFor(midi);
        if (!entry) return;
        const el = entry.el;
        if (kind === 'target') return el.classList.add('mark-target');
        el.classList.remove('mark-good', 'mark-bad');
        void el.offsetWidth;
        el.classList.add('mark-' + kind);
        setTimeout(() => el.classList.remove('mark-' + kind), 600);
      },
      // Marks every key with this note name (in any octave) as a target.
      markPitch(pitchClass) {
        targetPitches.add(((pitchClass % 12) + 12) % 12);
        relabel();
      },
      clearMarks() {
        targetPitches.clear();
        relabel();
      },
      // Scale mode: A S D F G H J play root + each step of the major scale, one
      // key per note (no repeated octave on K, so nothing looks like a second root).
      useScale(root, steps = [0, 2, 4, 5, 7, 9, 11]) {
        releaseAll();
        scaleMode = true;
        shift = 0;
        layout = steps.map((step, i) => ({ code: SCALE_CODES[i], letter: SCALE_LETTERS[i], midi: root + step, black: false }));
        render();
      },
      useChromatic() { releaseAll(); shift = 0; names = null; chromatic(); },
      // Shows these names on the keys instead (scale mode), e.g. E♯ or G♭.
      setNames(list) { names = list; relabel(); },
      setEnabled(on) { enabled = on; if (!on) releaseAll(); },
      // Greys out every key except these note names (0–11). null unlocks all.
      setAllowed(pitchClasses) {
        allowed = pitchClasses ? new Set(pitchClasses.map((pc) => ((pc % 12) + 12) % 12)) : null;
        relabel();
      },
      get octave() { return octaveOf(midiOf(layout[0])); },
      setOctave,
    };
  }

  return { create, noteName, octaveOf };
})();
</script>
<script>
/* lib/level.js */
// The frame every level sits in: intro screen, play screen with the piano,
// the key-found screen and the phone message. A level calls Level.setup()
// with what to do when play starts, and Level.win() when it's beaten.
const Level = (() => {
  const $ = (id) => document.getElementById(id);
  let key = null;
  let testMode = false;
  let extraHearts = 0;
  let status = 'new';
  let tried = [];
  let onStart = () => {};
  let usesPiano = true;
  let finishing = false;

  document.body.insertAdjacentHTML('beforeend', `
    <section class="screen" id="phone">
      <div class="eyebrow">Hidden level</div>
      <h1>Best played on a computer</h1>
      <p>This level needs a keyboard and a bigger screen. Come back on a laptop or desktop to play.</p>
    </section>
    <section class="screen" id="intro">
      <div class="eyebrow" id="introEyebrow"></div>
      <h1 id="introTitle"></h1>
      <p id="introText"></p>
      <p id="introBeaten" hidden>You've already found this key. Play again for fun.</p>
      <div class="buttons"><button class="primary" id="startBtn">Start</button></div>
    </section>
    <section class="screen" id="play">
      <div class="focus-banner" id="focusBanner">Click here to keep playing with your keyboard</div>
      <button class="skip" id="skipBtn" hidden>Skip level (test)</button>
      <div class="preview-tools">
        <div class="sample-status" id="sampleStatus" hidden></div>
        <button class="reverb-test" id="reverbTest" hidden>Reverb: normal</button>
      </div>
      <div class="stage" id="stage"></div>
      <div id="piano"></div>
    </section>
    <section class="screen" id="found">
      <svg class="key-art" viewBox="0 0 120 240" aria-hidden="true">
        <defs>
          <linearGradient id="keyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C8B8FF"/><stop offset="1" stop-color="#9A7FE0"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="52" r="40" fill="none" stroke="url(#keyFill)" stroke-width="12"/>
        <text id="keyArtLabel" x="60" y="64" text-anchor="middle" fill="#C8B8FF" font-family="Oswald, sans-serif" font-weight="600" font-size="32"></text>
        <rect x="53" y="90" width="14" height="128" rx="4" fill="url(#keyFill)"/>
        <rect x="66" y="176" width="26" height="12" rx="3" fill="url(#keyFill)"/>
        <rect x="66" y="200" width="18" height="12" rx="3" fill="url(#keyFill)"/>
      </svg>
      <div class="text">
        <h1 id="foundTitle"></h1>
        <p class="lead" id="foundText"></p>
        <div class="heart-found" id="heartFound" hidden>
          <svg viewBox="-12 -12 24 20" aria-hidden="true"><path d="M0 6C-10-2-10-10-5-10C-2-10 0-8 0-6C0-8 2-10 5-10C10-10 10-2 0 6Z"/></svg>
          <span>You found a hidden heart. You’ll start every boss fight with one more.</span>
        </div>
        <div class="buttons" id="foundButtons"></div>
      </div>
    </section>`);

  const piano = Piano.create($('piano'));
  piano.setEnabled(false);

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('show', s.id === id));
    piano.setEnabled(id === 'play' && usesPiano);
  }

  function button(text, onClick, primary) {
    const b = document.createElement('button');
    b.textContent = text;
    if (primary) b.className = 'primary';
    b.onclick = onClick;
    return b;
  }

  // The game only hears the keyboard while it has focus.
  window.addEventListener('blur', () => $('focusBanner').classList.add('show'));
  window.addEventListener('focus', () => $('focusBanner').classList.remove('show'));
  $('focusBanner').onclick = () => { window.focus(); $('focusBanner').classList.remove('show'); };

  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

  Bridge.on('level', (message) => {
    key = message.key;
    testMode = message.testMode === true;
    extraHearts = Number(message.extraHearts) || 0;
    status = message.status === 'beaten' ? 'beaten' : 'new';
    tried = Array.isArray(message.tried) ? message.tried : [];
    if (touchOnly) return show('phone');
    $('introEyebrow').textContent = `Level ${KEYS.indexOf(key) + 1} · Key of ${keyLabel(key)}`;
    $('introTitle').textContent = KEY_INFO[key].level;
    $('introBeaten').hidden = message.status !== 'beaten';
    show('intro');
  });

  $('startBtn').onclick = () => {
    Sound.unlock();
    window.focus();
    show('play');
    // Preview only: lets you skip a level while testing the site.
    $('skipBtn').hidden = !testMode;
    $('skipBtn').onclick = () => Level.win();
    // Preview only: whether your audio samples loaded.
    if (testMode) {
      Sound.onSamples((st) => {
        if (!st.total) return;
        const el = $('sampleStatus');
        el.hidden = false;
        el.className = 'sample-status' + (st.blocked || st.broken ? ' bad' : '');
        el.textContent = !st.done ? `Samples: loading ${st.loaded} / ${st.total}…`
          : st.blocked ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.blocked} blocked by the site (using the synth)`
          : st.broken ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.broken} not playable (check the file type)`
          : `Samples: ${st.loaded} / ${st.total} loaded`;
      });
    }
    onStart($('stage'));
    // Preview only: hear the reverb on its own, or without it.
    if (testMode && Sound.hasReverb) { // the level has just turned its reverb on
      const modes = ['normal', 'wet', 'off'], labels = { normal: 'Reverb: normal', wet: 'Reverb: 100% wet', off: 'Reverb: off' };
      let m = 0;
      $('reverbTest').hidden = false;
      $('reverbTest').onclick = (e) => { e.currentTarget.blur(); m = (m + 1) % 3; Sound.reverbTest(modes[m]); $('reverbTest').textContent = labels[modes[m]]; };
    }
  };

  Bridge.on('levelSaved', (message) => {
    const label = keyLabel(key);
    $('keyArtLabel').textContent = label;
    const buttons = $('foundButtons');
    buttons.innerHTML = '';
    $('foundTitle').textContent = message.gotKey ? `You found the key of ${label}.`
      : message.gotHeart ? 'Hidden heart found' : 'Level complete';
    if (message.gotKey) Sound.keyFound(rootMidi(key));
    $('heartFound').hidden = !message.gotHeart;
    if (message.gotHeart) Sound.chord([rootMidi(key) + 12, rootMidi(key) + 16, rootMidi(key) + 19], 1.2, 1.6, 0.35);

    // The tutorial is the only time the player is told what to do.
    if (message.firstKey) {
      $('foundText').textContent = 'You just discovered your first key. Take it to the circle of fifths to continue.';
      buttons.append(button('Go to the circle of fifths', () => Bridge.send({ type: 'navigate', to: 'circle' }), true));
    } else {
      $('foundText').textContent = message.gotKey || message.gotHeart ? '' : 'You already have this key.';
    }
    buttons.append(button('Back', () => Bridge.send({ type: 'navigate', to: 'back' }), !message.firstKey));
    show('found');
  });

  return {
    piano,
    get key() { return key; },
    // True in Wix Preview: levels may show test shortcuts.
    get testMode() { return testMode; },
    // Hidden hearts found so far: boss fights add these to the starting hearts.
    get extraHearts() { return extraHearts; },
    // 'beaten' if this level's key is already won, otherwise 'new'.
    get status() { return status; },
    // Boss fights attempted so far, e.g. ['A', 'F#'] (unlocks practice attacks).
    get tried() { return tried; },
    // A boss fight calls this when it starts, so the attempt is remembered.
    attempted() { Bridge.send({ type: 'attempted' }); },
    back() { Bridge.send({ type: 'navigate', to: 'back' }); },
    // description: the line under the title on the intro screen.
    // piano: false hides the on-screen piano for levels that don't use it.
    setup({ description, start, piano: showPiano = true }) {
      $('introText').textContent = description;
      onStart = start;
      usesPiano = showPiano;
      $('piano').hidden = !showPiano;
      Bridge.start();
    },
    // Reveals the piano partway through a level that started without it.
    showPiano() {
      usesPiano = true;
      $('piano').hidden = false;
      piano.setEnabled(true);
    },
    // win({ heart: true }) also reports finding this level's hidden heart.
    win(options = {}) {
      if (finishing) return;
      finishing = true;
      piano.setEnabled(false);
      Bridge.send({ type: 'levelComplete', heart: options.heart === true });
    },
  };
})();
</script>
<script>
  // Level 1, key of C: the Tutorial. Learn the keyboard and the scale, then
  // every move the boss fights use: moving, dashing, the power shot, the
  // triad, resolving a laser, the sus4 shockwave and catching ear defenders.
  // Each move fires from your player above the keyboard and fades out. Once
  // it's all done you can keep playing, and COLLECT KEY finishes the level.
  const SCALE = [0, 2, 4, 5, 7, 9, 11, 0]; // C D E F G A B C, as note names (0 = C)
  const LETTER = { 0: 'A', 2: 'S', 4: 'D', 5: 'F', 7: 'G', 9: 'H', 11: 'J' };
  const C = 0, E = 4, F = 5, G = 7;
  const name = (pc) => Piano.noteName(pc);
  const W = 900;
  let H = 210, FLOOR = H - 26; // the arena grows taller in practice mode
  let mode = 'tutorial';       // 'tutorial', 'free', 'menu' or 'practice'
  const CHORD_WINDOW = 0.09;
  const rand = (a, b) => a + Math.random() * (b - a);
  let ui = {}, canvas, ctx;

  // The practice arena: you, your shots and the practice targets.
  const P = { x: W / 2, dir: 0, face: 1, dash: 0, dashCool: 0, dashDir: 1, shield: 0, trail: [] };
  let fx = [], rings = [], sparks = [], texts = [], markers = [], laser = null, floaters = [], pickup = null;
  let pending = null, keys = {}, last = 0, time = 0;
  let free = false, freeLaserIn = 6, freePickupIn = 9;
  // Each step can listen for a move: onMove(kind) gets 'single', 'power', 'triad', 'resolve', 'sus4', 'dash'.
  let onNote = () => {}, onMove = () => {};

  const STEPS = 9;
  window.__tut = { get P() { return P; }, get free() { return free; }, get mode() { return mode; }, get laser() { return laser; }, get floaters() { return floaters; }, get pickup() { return pickup; } };

  Level.setup({
    description: 'Your computer keyboard is a piano. Learn to play it, and every move you’ll need in the fights ahead.',
    start(stage) {
      stage.innerHTML = `
        <div class="step tut" id="step"></div>
        <h1 class="tut" id="instruction"></h1>
        <p class="tut" id="hint"></p>
        <div class="dots tut" id="dots"></div>
        <canvas id="arena" width="${W}" height="${H}"></canvas>
        <div class="menu" id="menu" hidden>
          <h2>Practice mode</h2>
          <p>Pick the attacks the practice dummy uses, as many as you like. You can’t lose here: every move works, and your hearts never run out.</p>
          <div class="groups" id="groups"></div>
          <div class="actions"><button class="primary" id="goBtn">Practise</button><button id="menuBack">Back to free play</button></div>
        </div>
        <p class="tut" id="feedback"></p>
        <div class="actions" id="actions" hidden>
          <button id="collect">COLLECT KEY</button>
          <span class="tip-wrap" id="practiceWrap"><button id="practiceBtn">Practice mode</button></span>
          <button id="redoBtn">Redo tutorial</button>
        </div>
        <div class="practice-bar" id="practiceBar" hidden><button id="backFree">Return to free play</button><button id="changeBtn">Change attacks</button></div>`;
      ui = {
        step: stage.querySelector('#step'), instruction: stage.querySelector('#instruction'),
        hint: stage.querySelector('#hint'), dots: stage.querySelector('#dots'), feedback: stage.querySelector('#feedback'),
        collect: stage.querySelector('#collect'), actions: stage.querySelector('#actions'),
        menu: stage.querySelector('#menu'), groups: stage.querySelector('#groups'), go: stage.querySelector('#goBtn'),
        practiceBar: stage.querySelector('#practiceBar'), practiceWrap: stage.querySelector('#practiceWrap'),
        practiceBtn: stage.querySelector('#practiceBtn'), tut: [...stage.querySelectorAll('.tut')],
      };
      canvas = stage.querySelector('#arena');
      ctx = canvas.getContext('2d');
      // Already have C: the big button goes home; otherwise it collects the key.
      ui.collect.onclick = () => { ui.collect.blur(); if (Level.status === 'beaten') Level.back(); else Level.win(); };
      stage.querySelector('#redoBtn').onclick = (e) => { e.currentTarget.blur(); redoTutorial(); };
      ui.practiceBtn.onclick = (e) => { e.currentTarget.blur(); openMenu(); };
      stage.querySelector('#menuBack').onclick = (e) => { e.currentTarget.blur(); showFree(); };
      ui.go.onclick = (e) => { e.currentTarget.blur(); startPractice(); };
      stage.querySelector('#backFree').onclick = (e) => { e.currentTarget.blur(); Practice.stop(); showFree(); };
      stage.querySelector('#changeBtn').onclick = (e) => { e.currentTarget.blur(); Practice.stop(); openMenu(); };
      requestAnimationFrame(loop);
      // Done the tutorial before (C already won): straight to free play.
      if (Level.status === 'beaten') freePlay(); else stepOne();
    },
  });

  const piano = Level.piano;

  // ---------- Input ----------
  piano.onNoteOn((midi) => {
    if (mode === 'practice') Practice.noteOn(midi % 12);
    onNote(midi % 12, midi);
    if (!pending) pending = { notes: new Map(), t: CHORD_WINDOW };
    pending.notes.set(midi % 12, midi);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') {
      e.preventDefault();
      keys[e.code] = true;
      if (e.code === 'Space' && !e.repeat) dash();
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { keys = {}; });

  function dash() {
    if (P.dashCool > 0) return;
    P.dash = 0.18;
    P.dashCool = 0.9;
    P.dashDir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0) || P.face;
    Sound.whoosh();
    if (mode === 'practice') Practice.dashed();
    onMove('dash');
  }

  // Notes pressed within a moment of each other count as one chord, as in the fights.
  function release(notes) {
    if (mode === 'practice') return Practice.release(notes);
    if (mode === 'menu') return;
    const has = (pc) => notes.has(pc);
    let kind = 'single';
    if (has(C) && has(F) && has(G)) kind = 'sus4';
    else if (has(C) && has(E) && has(G)) kind = 'triad';
    else if (has(C) && has(G)) kind = 'power';
    else if (has(C) && has(E) && laser) kind = 'resolve';
    const shot = (midi, angle, extra = {}) => fx.push({ x: P.x, y: FLOOR - 24, vx: Math.sin(angle) * 520, vy: -Math.cos(angle) * 520, t: 0.9, life: 0.9, midi, ...extra });
    if (kind === 'power') shot(notes.get(C), 0, { kind, label: 'C+G' });
    else if (kind === 'triad') [[C, -0.25], [E, 0], [G, 0.25]].forEach(([pc, a]) => shot(notes.get(pc), a, { kind }));
    else if (kind === 'sus4') sus4();
    else if (kind === 'resolve') resolve();
    else notes.forEach((midi) => shot(midi, 0, { kind: 'single' }));
    onMove(kind);
  }

  function sus4() {
    rings.push({ x: P.x, y: FLOOR - 14, r: 12, t: 0.45 });
    let cleared = 0;
    for (const f of floaters) if (Math.hypot(f.x - P.x, f.y - FLOOR) < 190) { f.gone = true; cleared++; burst(f.x, f.y, '#8fc4ff', 8); }
    floaters = floaters.filter((f) => !f.gone);
    Sound.whoosh();
    pop(cleared ? `Sus4! Cleared ${cleared}` : 'Sus4!');
  }

  function resolve() {
    for (let i = 0; i < 16; i++) burst(laser.x + rand(-6, 6), rand(0, FLOOR), '#C8B8FF', 1);
    laser.sound.forEach((s) => s.stop());
    laser = null;
    Sound.chord([64, 72], 0, 1.2, 0.5); // E + C: the tritone resolves
    pop('Resolved!');
  }

  // A harmless violet laser charging above you, to practise resolving.
  function spawnLaser() {
    laser = { x: Math.min(W - 80, Math.max(80, P.x + rand(-120, 120))), t: 0, sound: [] }; // silent: it's only practice
  }
  function spawnPickup() { pickup = { x: rand(80, W - 80), y: -20 }; }

  function pop(text) { texts.push({ x: P.x, y: FLOOR - 60, text, t: 1.2 }); }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(60, 220);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.3, 0.6), color });
    }
  }

  // ---------- Steps ----------
  function say(text, bad) {
    ui.feedback.textContent = text;
    ui.feedback.className = bad ? 'bad' : '';
  }
  function wrong(midi, text) {
    Sound.buzz();
    piano.mark(midi, 'bad');
    say(text, true);
  }
  function setStep(n, instruction, hint) {
    ui.step.textContent = `Step ${n} of ${STEPS}`;
    ui.instruction.textContent = instruction;
    ui.hint.textContent = hint;
    ui.dots.innerHTML = '';
    say('');
    piano.clearMarks();
    onNote = () => {};
    onMove = () => {};
  }
  const next = (fn, delay = 900) => { onNote = () => {}; onMove = () => {}; setTimeout(fn, delay); };
  const markAll = (...pcs) => pcs.forEach((pc) => piano.markPitch(pc));

  function stepOne() {
    setStep(1, 'Press A to play C', 'The keys A to K are the white keys. W, E, T, Y and U are the black keys.');
    markAll(C);
    onNote = (pc, midi) => {
      if (pc !== C) return wrong(midi, `That’s ${name(pc)}. C is the A key, on the far left.`);
      piano.mark(midi, 'good');
      say('Nice. That’s C, and it fires from your player.');
      next(stepTwo);
    };
  }

  function stepTwo() {
    let index = 0;
    setStep(2, 'Play the C major scale', 'Follow the glowing keys from C up to the next C. It uses only the white keys.');
    ui.dots.innerHTML = SCALE.map(() => '<span class="dot"></span>').join('');
    const target = () => { piano.clearMarks(); piano.markPitch(SCALE[index]); };
    target();
    onNote = (pc, midi) => {
      const want = SCALE[index];
      if (pc !== want) return wrong(midi, `Not quite. Next is ${name(want)} (the ${index === SCALE.length - 1 ? 'K' : LETTER[want]} key).`);
      piano.mark(midi, 'good');
      ui.dots.children[index].classList.add('on');
      say('');
      index++;
      if (index < SCALE.length) return target();
      piano.clearMarks();
      say('That’s the C major scale.');
      next(stepThree, 1100);
    };
  }

  function stepThree() {
    setStep(3, 'Move with ← and →', 'Walk to the glowing marker. In the fights, moving is how you dodge.');
    markers = [{ x: 160 }, { x: W - 160 }];
    ui.dots.innerHTML = markers.map(() => '<span class="dot"></span>').join('');
    let done = 0;
    const check = () => {
      if (!markers.length) return;
      const m = markers[0];
      if (Math.abs(P.x - m.x) < 34 || (done === 0 && P.x < m.x) || (done === 1 && P.x > m.x)) {
        markers.shift();
        ui.dots.children[done].classList.add('on');
        done++;
        Sound.note(72 + done * 4, 0, 0.3, 0.25);
        if (!markers.length) { say('Good. Now the dash.'); next(stepFour, 700); }
      }
    };
    stepThree.check = check;
  }

  function stepFour() {
    stepThree.check = null;
    setStep(4, 'Dash with Space', 'A quick burst of speed. You can’t be hit mid-dash, so it’s how you cross a laser.');
    onMove = (kind) => { if (kind === 'dash') { say('Dashed! It needs a moment to recharge.'); next(stepFive); } };
  }

  function stepFive() {
    setStep(5, 'Power shot: hold A + G', 'C and G together, a perfect fifth. Your strongest single shot.');
    markAll(C, G);
    onMove = (kind) => { if (kind === 'power') { say('That’s a perfect fifth: the sound that holds the circle together.'); next(stepSix, 1300); } };
    onNote = (pc, midi) => { if (pc !== C && pc !== G) say(`That’s ${name(pc)}. Press A and G together.`, true); };
  }

  function stepSix() {
    setStep(6, 'Triad: hold A + D + G', 'C, E and G together: the C major triad. Three notes, fanned out.');
    markAll(C, E, G);
    onMove = (kind) => { if (kind === 'triad') { say('A full triad.'); next(stepSeven); } };
  }

  function stepSeven() {
    setStep(7, 'Resolve the laser: A + D', 'Violet lasers are tritones. Play the root and third (C + E) to resolve one before it hits. This one can’t hurt you.');
    markAll(C, E);
    spawnLaser();
    onMove = (kind) => { if (kind === 'resolve') { say('Resolved. Red lasers can’t be resolved: dash through those.'); next(stepEight, 1500); } };
  }

  function stepEight() {
    setStep(8, 'Sus4 shockwave: A + F + G', 'C, F and G: a suspended chord. It clears notes around you, then needs to recharge.');
    markAll(C, F, G);
    floaters = Array.from({ length: 5 }, (_, i) => ({ x: P.x + (i - 2) * 60, y: FLOOR - 50 - (i % 2) * 30 }));
    onMove = (kind) => { if (kind === 'sus4') { say('Shockwave! It clears notes, but not lasers.'); next(stepNine, 1300); } };
  }

  function stepNine() {
    setStep(9, 'Catch the ear defenders', 'When these fall, walk under them. For a few seconds they block notes that hit you.');
    spawnPickup();
    stepNine.active = true;
  }

  function caught() {
    P.shield = 5;
    Sound.note(84, 0, 0.6, 0.25);
    pop('Ear defenders!');
    if (stepNine.active) {
      stepNine.active = false;
      say('Got them.');
      next(freePlay, 1000);
    }
  }

  // Everything learned: keep playing for as long as you like.
  function freePlay() {
    free = true;
    piano.clearMarks();
    onNote = () => {}; onMove = () => {};
    const back = Level.status === 'beaten';
    ui.step.textContent = back ? 'Free play' : 'Tutorial complete';
    ui.instruction.textContent = back ? 'Welcome back' : 'You know every move';
    ui.hint.textContent = 'A + G power shot · A + D + G triad · A + D resolve · A + F + G sus4 · Space dash. Every shot is loud: play too much in a fight and you’ll clip.';
    ui.dots.innerHTML = '';
    say('Practise as long as you like.');
    ui.collect.textContent = back ? 'RETURN HOME' : 'COLLECT KEY';
    // Practice mode opens once Feedback, the first boss, has been attempted.
    const open = Level.tried.includes('A');
    ui.practiceBtn.disabled = !open;
    ui.practiceWrap.classList.toggle('locked', !open);
    ui.practiceWrap.dataset.tip = 'Unlocks after level “Feedback” has been attempted';
    showFree();
  }

  // Shows the free-play arena (from the menu or practice too).
  function showFree() {
    mode = 'free';
    pianoEl().hidden = false;
    setArena(210);
    canvas.hidden = false;
    ui.menu.hidden = true;
    ui.practiceBar.hidden = true;
    ui.tut.forEach((el) => { el.hidden = false; });
    ui.actions.hidden = false;
    piano.setEnabled(true);
  }

  function setArena(h) {
    H = h; FLOOR = H - 26;
    if (canvas.height !== h) canvas.height = h;
  }

  function clearArena() {
    fx = []; rings = []; sparks = []; texts = []; markers = []; floaters = []; pickup = null;
    if (laser) { laser.sound.forEach((x) => x.stop()); laser = null; }
  }

  function redoTutorial() {
    free = false;
    mode = 'tutorial';
    clearArena();
    stepNine.active = false; stepThree.check = null;
    ui.actions.hidden = true;
    P.x = W / 2;
    stepOne();
  }

  // ---------- Practice mode: the attack picker ----------
  const BOSS_NAMES = { A: 'Feedback', 'F#': 'The Tritone', F: 'The Final Boss' };
  const ATTACKS = [
    { id: 'note', boss: 'A', name: 'Single notes', desc: 'Aimed notes that follow you a little.' },
    { id: 'triad', boss: 'A', name: 'Triads', desc: 'Three notes fanned out.' },
    { id: 'held', boss: 'A', name: 'Held chord', desc: 'It holds two notes of a chord: play the missing one.' },
    { id: 'fifth', boss: 'F#', name: 'Perfect fifths', desc: 'Two notes as one faster shot.' },
    { id: 'violet', boss: 'F#', name: 'Violet lasers', desc: 'Resolve with A + D, or dash through.' },
    { id: 'red', boss: 'F#', name: 'Red lasers', desc: 'Can’t be resolved: dash through.' },
    { id: 'bomb', boss: 'F', name: 'Power-chord bombs', desc: 'Split into ground waves: dash or sus4 them.' },
    { id: 'arp', boss: 'F', name: 'Arpeggio fans', desc: 'A chord sprayed across the floor.' },
  ];
  const chosen = new Set(['note']);

  const pianoEl = () => document.getElementById('piano');
  function openMenu() {
    mode = 'menu';
    pianoEl().hidden = true; // not needed while picking, and it frees the space
    canvas.hidden = true;
    ui.tut.forEach((el) => { el.hidden = true; });
    ui.actions.hidden = true;
    ui.practiceBar.hidden = true;
    ui.menu.hidden = false;
    ui.groups.innerHTML = '';
    for (const boss of ['A', 'F#', 'F']) {
      const unlocked = Level.tried.includes(boss);
      const group = document.createElement('div');
      group.className = 'group';
      group.innerHTML = `<h3>${BOSS_NAMES[boss]}</h3>`;
      for (const a of ATTACKS.filter((x) => x.boss === boss)) {
        if (!unlocked) chosen.delete(a.id);
        const b = document.createElement('button');
        b.className = 'pcard' + (chosen.has(a.id) ? ' on' : '');
        b.id = `attack-${a.id}`;
        b.disabled = !unlocked;
        b.innerHTML = `<strong>${a.name}</strong><span>${a.desc}</span>${unlocked ? '' : `<em>Unlocks after “${BOSS_NAMES[boss]}” has been attempted</em>`}`;
        b.onclick = () => {
          b.blur();
          chosen.has(a.id) ? chosen.delete(a.id) : chosen.add(a.id);
          b.classList.toggle('on', chosen.has(a.id));
          ui.go.disabled = !chosen.size;
        };
        group.append(b);
      }
      ui.groups.append(group);
    }
    ui.go.disabled = !chosen.size;
  }

  function startPractice() {
    if (!chosen.size) return;
    mode = 'practice';
    pianoEl().hidden = false;
    clearArena();
    ui.menu.hidden = true;
    canvas.hidden = false;
    ui.practiceBar.hidden = false;
    setArena(330);
    Practice.start([...chosen]);
  }

  // ---------- The arena ----------
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    time += dt;
    if (mode === 'menu') return;
    if (mode === 'practice') { movePlayer(dt); Practice.update(dt); Practice.draw(); return; }
    update(dt);
    draw();
  }

  // Moving and dashing, shared by the tutorial arena and practice mode.
  function movePlayer(dt) {
    P.dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    if (P.dir) P.face = P.dir;
    const speed = P.dash > 0 ? 1300 : 380, dir = P.dash > 0 ? P.dashDir : P.dir;
    P.x = Math.min(W - 24, Math.max(24, P.x + dir * speed * dt));
    if (P.dash > 0) P.trail.push({ x: P.x, t: 0.25 });
    P.dash = Math.max(0, P.dash - dt);
    P.dashCool = Math.max(0, P.dashCool - dt);
    P.shield = Math.max(0, P.shield - dt);
    P.trail.forEach((p) => { p.t -= dt; });
    P.trail = P.trail.filter((p) => p.t > 0);
    if (pending) {
      pending.t -= dt;
      if (pending.t <= 0) { const n = pending.notes; pending = null; release(n); }
    }
  }

  function update(dt) {
    movePlayer(dt);
    if (stepThree.check) stepThree.check();
    if (laser) laser.t += dt;
    if (pickup) {
      pickup.y += 90 * dt;
      if (Math.abs(pickup.x - P.x) < 32 && pickup.y > FLOOR - 40) { pickup = null; caught(); }
      else if (pickup.y > H + 20) pickup = null;
    }
    if (stepNine.active && !pickup) spawnPickup(); // missed it: another one falls
    if (free) {
      freeLaserIn -= dt; freePickupIn -= dt;
      if (freeLaserIn <= 0 && !laser) { spawnLaser(); freeLaserIn = rand(7, 10); }
      if (freePickupIn <= 0 && !pickup) { spawnPickup(); freePickupIn = rand(10, 14); }
      if (laser && laser.t > 6) { laser.sound.forEach((s) => s.stop()); laser = null; } // ignored lasers fizzle out
    }

    fx.forEach((f) => { f.x += f.vx * dt; f.y += f.vy * dt; f.t -= dt; });
    fx = fx.filter((f) => f.t > 0);
    rings.forEach((r) => { r.r += 420 * dt; r.t -= dt; });
    rings = rings.filter((r) => r.t > 0);
    sparks.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; });
    sparks = sparks.filter((s) => s.t > 0);
    texts.forEach((t) => { t.y -= 30 * dt; t.t -= dt; });
    texts = texts.filter((t) => t.t > 0);
  }

  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#16141c'); bg.addColorStop(1, '#0f0e13');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(94, 62, 132, 0.35)'; ctx.fillRect(0, FLOOR + 10, W, 2);

    for (const m of markers.slice(0, 1)) {
      const k = 0.6 + 0.4 * Math.sin(time * 5);
      ctx.fillStyle = `rgba(200, 184, 255, ${0.25 * k})`;
      ctx.beginPath(); ctx.ellipse(m.x, FLOOR + 10, 34, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(200, 184, 255, ${0.8 * k})`; ctx.lineWidth = 2; ctx.stroke();
    }

    if (laser) {
      const k = Math.min(1, laser.t / 1.2), pulse = 0.7 + 0.3 * Math.sin(time * 12);
      ctx.strokeStyle = `rgba(200, 184, 255, ${(0.2 + 0.35 * k) * pulse})`;
      ctx.lineWidth = 6 + 10 * k;
      ctx.beginPath(); ctx.moveTo(laser.x, 0); ctx.lineTo(laser.x, FLOOR + 10); ctx.stroke();
      ctx.fillStyle = '#C8B8FF'; ctx.font = '600 12px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('C + F♯  ·  TRITONE', laser.x, 16);
    }

    for (const f of floaters) {
      ctx.fillStyle = '#8fc4ff'; ctx.shadowColor = '#8fc4ff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(f.x, f.y + Math.sin(time * 3 + f.x) * 4, 9, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    for (const r of rings) {
      ctx.strokeStyle = `rgba(226, 217, 255, ${r.t / 0.45})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }

    // Your shots, fading as they rise
    for (const f of fx) {
      ctx.globalAlpha = Math.max(0, f.t / f.life);
      const power = f.kind === 'power';
      const color = power ? '#E2D9FF' : f.kind === 'triad' ? '#C8B8FF' : '#9A7FE0';
      const w = power ? 50 : 26, h = power ? 24 : 18;
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = power ? 22 : 10;
      roundRect(f.x - w / 2, f.y - h / 2, w, h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#181818'; ctx.font = `600 ${power ? 12 : 11}px Oswald, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(f.label || name(f.midi % 12), f.x, f.y + 4);
    }
    ctx.globalAlpha = 1;

    if (pickup) drawHeadphones(pickup.x, pickup.y, 0.7, '#E2D9FF', true);

    // You: headphones, with a dash trail and the ear defenders' glow
    for (const t of P.trail) { ctx.globalAlpha = t.t / 0.25 * 0.4; drawHeadphones(t.x, FLOOR - 4, 1, '#9A7FE0', false); }
    ctx.globalAlpha = 1;
    if (P.shield > 0) {
      ctx.strokeStyle = `rgba(226, 217, 255, ${0.4 + 0.3 * Math.sin(time * 10)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P.x, FLOOR - 6, 30, 0, Math.PI * 2); ctx.stroke();
    }
    drawHeadphones(P.x, FLOOR - 4, 1, P.shield > 0 ? '#E2D9FF' : '#9A7FE0', P.shield > 0);

    for (const s of sparks) { ctx.globalAlpha = Math.max(0, s.t * 1.8); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, t.t * 2);

<script>
  // ---------- Practice mode: a dummy boss with the attacks you picked ----------

  // A + D + G triad, A + D resolves violet lasers, A + F + G sus4, Space dash.
  // Your hearts never run out; hits are counted instead.
  const Practice = (() => {
    const SCALE_M = [60, 62, 64, 65, 67, 69, 71];
    const deg = (d) => 60 + [0, 2, 4, 5, 7, 9, 11][d % 7] + 12 * Math.floor(d / 7);

    const FAN = { notes: 6, gap: 0.12, fan: 1.0, warn: 0.7 };
    const BOMB_HIT = 0.6;
    const FAN_SYNTH = Sound.instrument('arp', { release: 0.2 });
    let Q = null, on = new Set();

    const py = () => FLOOR - 4; // the player's height in the arena

    function start(attacks) {
      on = new Set(attacks);
      Sound.preload(['arp', 'red-charge', 'red-hit', 'red-beam', 'violet-charge', 'violet-hit', 'violet-beam', 'bomb-drop', 'bomb-impact', 'wave-roll']);
      Q = {
        boss: { x: W / 2, y: 58, target: W / 2, flash: 0, stun: 0, warn: 0 },
        notes: [], shots: [], warnings: [], lasers: [], waves: [], rolls: [], fan: [], rings: [], sparks: [], texts: [], pickups: [],
        held: null, meter: 0, stun: 0, safe: 0, sus4Cool: 0, hurtFlash: 0, banner: { text: 'Practice dummy: try your moves', t: 2.4 },
        timers: { attack: 1.2, laser: 3, bomb: 4.5, fan: 3.5, held: 6, pickup: 8 },

    }

    function stop() {
      if (!Q) return;
      Q.lasers.forEach(endLaser);
      Q.warnings.forEach((w) => w.drop && w.drop.stop(0.1));
      Q.rolls.forEach((r) => r.sound && r.sound.stop(0.3));
      if (Q.held) Q.held.sounds.forEach((x) => x.stop());
      piano.setEnabled(true);
      Q = null;
      window.__practice = null;
    }

    // ---------- Your moves ----------
    function release(notes) {
      if (!Q || Q.stun > 0) return;
      const has = (pc) => notes.has(pc);
      if (has(C) && has(E) && !has(G) && Q.lasers.some((l) => l.cancellable && !l.gone)) return resolve();
      if (has(C) && has(F) && has(G)) return sus4();

      if (has(C) && has(E) && has(G)) kind = 'triad';
      else if (has(C) && has(G)) kind = 'power';
      const a = SHOTS[kind];
      const shot = (midi, angle, extra = {}) => Q.shots.push({ x: P.x, y: py() - 22, vx: Math.sin(angle) * a.speed, vy: -Math.cos(angle) * a.speed, midi, pcs: [midi % 12], kind, damage: a.damage, ...extra });

      else if (kind === 'triad') [[C, -0.2], [E, 0], [G, 0.2]].forEach(([pc, ang]) => shot(notes.get(pc), ang));

    }
    function addVolume(n) {

    }
    function clip() {
      Q.stun = 2;
      Q.meter = 70;
      Q.banner = { text: 'You clipped!', t: 1.8, big: true };

    }
    function sus4() {

    }

    }
    function noteOn(pc) {

      Q.held = null;
      Q.boss.stun = 1.6;
      Sound.chord(Q.heldChord, 0, 1.4, 0.5);
      Q.texts.push({ x: Q.boss.x, y: Q.boss.y + 60, text: 'Feedback cut!', t: 1.4 });
      spark(Q.boss.x, Q.boss.y + 20, '#C8B8FF', 20);
    }
    function dashed() { if (Q) Q.safe = Math.max(Q.safe, 0.3); }
    function say2(text) { Q.texts = Q.texts.filter((t) => !t.player); Q.texts.push({ x: P.x, y: py() - 46, text, t: 1.2, player: true }); }
    function spark(x, y, color, n = 1) {
      for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(60, 220); Q.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.3, 0.6), color }); }
    }
    function hurt() {
      if (Q.safe > 0) return;
      if (P.shield > 0) { Sound.block(); spark(P.x, py() - 10, '#E2D9FF', 3); return; }
      Q.stats.hits++;
      Q.safe = 1.1;
      Q.hurtFlash = 0.4;
      Sound.squeal();

    }

    // ---------- The dummy's attacks ----------
    const muzzle = () => ({ x: Q.boss.x, y: Q.boss.y + MUZZLE });
    function attack() {
      const kinds = ['note', 'triad', 'fifth'].filter((k) => on.has(k));
      if (!kinds.length) return;
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      const t = WARN + (kind === 'triad' ? 0.15 : kind === 'fifth' ? 0.1 : 0);
      Q.warnings.push({ kind, t, total: t, tx: P.x, miss: rand(-TRACK.miss, TRACK.miss),
        midi: SCALE_M[Math.floor(Math.random() * 7)], notes: kind === 'triad' ? TRIADS[Math.floor(Math.random() * 5)] : FIFTHS[Math.floor(Math.random() * 6)] });
    }
    function fire(w) {
      const m = muzzle(), base = Math.atan2(py() - m.y, w.tx - m.x);
      const launch = (notes, kind, speed, angle = base) => Q.notes.push({ x: m.x, y: m.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, midi: notes[0], notes, pcs: notes.map((x) => x % 12), kind });
      if (w.kind === 'note') { launch([w.midi], 'note', NOTE_SPEED); Sound.note(w.midi, 0, 0.45, 0.4); }
      else if (w.kind === 'triad') { w.notes.forEach((x, i) => launch([x], 'note', NOTE_SPEED * 0.9, base + (i - 1) * 0.24)); Sound.chord(w.notes, 0, 0.5, 0.45); }
      else { launch(w.notes, 'fifth', NOTE_SPEED * 1.4); Sound.chord(w.notes, 0, 0.5, 0.5); }
    }
    function laserAngle(x) { const m = muzzle(); return Math.atan2(py() - m.y, x - m.x); }
    function startLasers() {
      const kinds = ['violet', 'red'].filter((k) => on.has(k));
      const red = kinds[Math.floor(Math.random() * kinds.length)] === 'red';
      const make = (fromX, toX, cancellable, silent) => ({ e: 0, dur: 2, a0: laserAngle(fromX), a1: laserAngle(toX), cancellable, stage: 'warn', sound: silent ? [] : [Sound.laser(cancellable ? 'violet' : 'red', 48, cancellable ? 0.09 : 0.12)] });
      if (red) Q.lasers.push(make(20, P.x + 30, false), make(W - 20, P.x - 30, false, true));
      else {
        const dir = Math.random() < 0.5 ? 1 : -1;
        Q.lasers.push(make(Math.min(W - 20, Math.max(20, P.x - dir * 280)), Math.min(W - 20, Math.max(20, P.x + dir * 280)), true));
      }
    }
    function endLaser(l) { l.gone = true; l.sound.forEach((x) => x.stop()); }
    function beamDistance(l, x, y) {
      const m = muzzle(), dx = Math.cos(l.a), dy = Math.sin(l.a), px = x - m.x, pyy = y - m.y;
      if (px * dx + pyy * dy < 0) return Infinity;
      return Math.abs(px * dy - pyy * dx);
    }
    function startBomb() {
      const x = Math.min(W - 60, Math.max(60, P.x + rand(-60, 60)));
      Q.warnings.push({ kind: 'ground', t: 1.1, total: 1.1, x, drop: Sound.sfx('bomb-drop') });
    }
    function slam(w) {
      if (w.drop) w.drop.stop(0.03);
      const roll = { sound: Sound.loopNear('wave-roll', 36, BOMB_HIT) };
      Q.rolls.push(roll);
      Q.waves.push({ x: w.x, dir: -1, roll }, { x: w.x, dir: 1, roll });
      if (!Sound.sfx('bomb-impact', BOMB_HIT)) Sound.hit();
      Sound.chord([48, 55], 0, 0.7, 0.45);
    }
    function startFan() {
      const m = muzzle();
      Q.warnings.push({ kind: 'fan', t: FAN.warn, total: FAN.warn, chord: TRIADS[Math.floor(Math.random() * 5)], dir: Math.random() < 0.5 ? 1 : -1, centre: Math.atan2(py() - m.y, P.x - m.x) });
    }
    function fanOut(w) {
      const up = [...w.chord, w.chord[0] + 12];
      const run = [...up, ...up.slice(1, -1).reverse()].slice(0, FAN.notes);
      run.forEach((midi, i) => Q.fan.push({ t: i * FAN.gap, midi, angle: w.centre + w.dir * FAN.fan * (i / (FAN.notes - 1) - 0.5) }));
    }
    function startHeld() {
      const chord = TRIADS[0]; // C major
      const missing = Math.floor(Math.random() * 3);

      Q.held = { missing: chord[missing] % 12, t: 4.5, sounds: chord.filter((_, i) => i !== missing).map((x) => Sound.hold(x, 0.15)) };
      const names = chord.map((x, i) => (i === missing ? '?' : name(x % 12))).join(' ');
      Q.banner = { text: `It’s holding a chord: ${names}. Play the missing note!`, t: 3 };
    }

    // ---------- Update ----------
    function update(dt) {
      if (!Q) return;
      const b = Q.boss;
      Q.stun = Math.max(0, Q.stun - dt);
      if (Q.stun <= 0) piano.setEnabled(true);
      Q.safe = Math.max(0, Q.safe - dt);
      Q.sus4Cool = Math.max(0, Q.sus4Cool - dt);
      Q.meter = Math.max(0, Q.meter - 6 * dt);
      Q.hurtFlash = Math.max(0, Q.hurtFlash - dt);
      b.flash = Math.max(0, b.flash - dt);
      b.stun = Math.max(0, b.stun - dt);
      const holding = Q.lasers.length > 0 || Q.fan.length > 0;
      if (Math.abs(b.target - b.x) < 4 || Math.random() < dt * 0.4) b.target = rand(140, W - 140);
      if (b.stun <= 0 && !holding) b.x += Math.sign(b.target - b.x) * Math.min(Math.abs(b.target - b.x), 90 * dt);

      const T = Q.timers;
      for (const k of Object.keys(T)) T[k] -= dt * (holding && k === 'attack' ? 0.4 : 1);
      if (b.stun <= 0) {
        if (T.attack <= 0) { attack(); T.attack = 1.4 * rand(0.85, 1.15); }
        if (T.laser <= 0 && !holding && (on.has('violet') || on.has('red'))) { startLasers(); T.laser = 8 * rand(0.85, 1.15); }
        if (T.bomb <= 0 && !holding && on.has('bomb')) { startBomb(); T.bomb = 6.5 * rand(0.85, 1.15); }
        if (T.fan <= 0 && !holding && on.has('arp')) { startFan(); T.fan = 6 * rand(0.85, 1.15); }

      for (const w of Q.waves) { w.x += w.dir * 300 * dt; if (!w.gone && Math.abs(w.x - P.x) < 16) { w.gone = true; hurt(); } }
      Q.waves = Q.waves.filter((w) => !w.gone && w.x > -20 && w.x < W + 20);
      Q.rolls = Q.rolls.filter((r) => { if (Q.waves.some((w) => w.roll === r)) return true; if (r.sound) r.sound.stop(0.4); return false; });

      Q.notes.forEach((n) => { n.x += n.vx * dt; n.y += n.vy * dt; });
      Q.shots.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; });
      Q.pickups.forEach((k) => { k.y += 70 * dt; });
      Q.sparks.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; });
      Q.texts.forEach((t) => { t.y -= 30 * dt; t.t -= dt; });

      if (Q.banner) { Q.banner.t -= dt; if (Q.banner.t <= 0) Q.banner = null; }

      for (const s of Q.shots) {
        for (const n of Q.notes) {
          if (n.gone || s.gone) continue;

    // ---------- Drawing ----------

        const color = l.cancellable ? '200, 184, 255' : '255, 70, 100';

          ctx.strokeStyle = `rgba(${color}, ${0.15 + 0.25 * k})`; ctx.lineWidth = 6 + 10 * k;
          ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(ex, ey); ctx.stroke();

        }
        ctx.shadowColor = `rgb(${color})`; ctx.shadowBlur = 24;
        ctx.strokeStyle = `rgba(${color}, 0.55)`; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // The dummy: a practice speaker with a target on it
      ctx.save();
      ctx.translate(b.x + (b.stun > 0 ? Math.sin(time * 30) * 3 : 0), b.y);
      ctx.fillStyle = b.flash > 0 ? '#E2D9FF' : '#26232d';
      ctx.strokeStyle = '#9A7FE0'; ctx.lineWidth = 3; ctx.shadowColor = '#9A7FE0'; ctx.shadowBlur = 8 + b.warn * 18;
      roundRect(-40, -34, 80, 68, 10); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      for (const [r, c] of [[24, '#ff8fa6'], [16, '#E2D9FF'], [8, '#ff8fa6']]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#9A93A3'; ctx.font = '600 11px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.stun > 0 ? 'STUNNED' : 'DUMMY', 0, -42);
      ctx.restore();

      for (const w of Q.waves) {
        ctx.fillStyle = 'rgba(255, 93, 122, 0.85)'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.moveTo(w.x - 12, FLOOR + 10); ctx.quadraticCurveTo(w.x, FLOOR - 28, w.x + 12, FLOOR + 10); ctx.fill();
        ctx.shadowBlur = 0;
      }
      for (const n of Q.notes) {
        const fifth = n.kind === 'fifth', color = n.kind === 'arp' ? '#d9c27a' : fifth ? '#C8B8FF' : '#8fc4ff';
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = fifth ? 22 : 14;
        if (fifth) { roundRect(n.x - 22, n.y - 11, 44, 22, 11); ctx.fill(); } else { ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI * 2); ctx.fill(); }
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#181818'; ctx.font = '600 10px Oswald, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(n.notes.map((x) => name(x % 12)).join('+'), n.x, n.y + 4);
      }
      for (const s of Q.shots) {
        const power = s.kind === 'power', color = power ? '#E2D9FF' : s.kind === 'triad' ? '#C8B8FF' : '#9A7FE0';
        const w = power ? 50 : 24, h = power ? 24 : 18;
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = power ? 22 : 10;
        roundRect(s.x - w / 2, s.y - h / 2, w, h, 6); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = '#181818'; ctx.font = '600 11px Oswald, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(s.label || name(s.midi % 12), s.x, s.y + 4);
      }
      for (const r of Q.rings) { ctx.strokeStyle = `rgba(226, 217, 255, ${r.t / 0.4})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
      for (const k of Q.pickups) drawHeadphones(k.x, k.y, 0.7, '#E2D9FF', true);

      // You
      for (const t of P.trail) { ctx.globalAlpha = t.t / 0.25 * 0.4; drawHeadphones(t.x, py(), 1, '#9A7FE0', false); }
      ctx.globalAlpha = (Q.safe > 0 && Math.floor(time * 20) % 2 === 0) ? 0.35 : 1;
      if (P.shield > 0) { ctx.strokeStyle = `rgba(226, 217, 255, ${0.4 + 0.3 * Math.sin(time * 10)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, py() - 6, 30, 0, Math.PI * 2); ctx.stroke(); }
      ctx.strokeStyle = Q.sus4Cool <= 0 ? 'rgba(226, 217, 255, 0.7)' : 'rgba(154, 147, 163, 0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(P.x, py() - 6, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - Q.sus4Cool / SUS4.cooldown)); ctx.stroke();
      drawHeadphones(P.x, py(), 1, Q.stun > 0 ? '#5d5866' : P.shield > 0 ? '#E2D9FF' : '#9A7FE0', P.shield > 0);
      ctx.globalAlpha = 1;

      for (const s of Q.sparks) { ctx.globalAlpha = Math.max(0, s.t * 1.6); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
      ctx.globalAlpha = 1;
      for (const t of Q.texts) { ctx.globalAlpha = Math.min(1, t.t * 2); ctx.fillStyle = '#C8B8FF'; ctx.font = '600 15px Oswald, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t.text, t.x, t.y); }
      ctx.globalAlpha = 1;
      if (Q.hurtFlash > 0) { ctx.fillStyle = `rgba(255, 40, 70, ${0.25 * Q.hurtFlash / 0.4})`; ctx.fillRect(0, 0, W, H); }

      // HUD
      ctx.textAlign = 'left'; ctx.font = '600 13px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText('PRACTICE', 14, 22);
      ctx.font = '500 11px Oswald, sans-serif'; ctx.fillStyle = '#9A93A3';
      ctx.fillText(`HITS TAKEN ${Q.stats.hits}  ·  CANCELLED ${Q.stats.cancelled}  ·  RESOLVED ${Q.stats.resolved}`, 14, 40);
      ctx.fillStyle = '#ff5d7a'; ctx.font = '600 18px Oswald, sans-serif'; ctx.fillText('♥ ∞', 14, H - 12);
      ctx.textAlign = 'right'; ctx.fillStyle = '#E6E1EC'; ctx.font = '600 13px Oswald, sans-serif';
      ctx.fillText('VOLUME', W - 186, 22);
      ctx.fillStyle = '#26232d'; roundRect(W - 176, 12, 160, 11, 5); ctx.fill();
      const mg = ctx.createLinearGradient(W - 176, 0, W - 16, 0);
      mg.addColorStop(0, '#9A7FE0'); mg.addColorStop(0.7, '#c46a7a'); mg.addColorStop(1, '#ff5d7a');
      ctx.fillStyle = mg; roundRect(W - 176, 12, 160 * Q.meter / 100, 11, 5); ctx.fill();
      if (P.shield > 0) { ctx.fillStyle = '#E2D9FF'; ctx.font = '500 11px Oswald, sans-serif'; ctx.fillText(`EAR DEFENDERS ${Math.ceil(P.shield)}`, W - 16, 40); }
      if (Q.banner) {
        ctx.globalAlpha = Math.min(1, Q.banner.t * 1.5); ctx.textAlign = 'center';
        ctx.font = Q.banner.big ? '600 38px Oswald, sans-serif' : '600 20px Oswald, sans-serif';
        ctx.fillStyle = Q.banner.big ? '#ff5d7a' : '#C8B8FF';
        ctx.fillText(Q.banner.text, W / 2, H / 2 + 20);
        ctx.globalAlpha = 1;
      }
    }

    return { start, stop, update, draw, release, noteOn, dashed, get state() { return Q; } };
  })();
</script>
