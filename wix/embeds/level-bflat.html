/* lib/keys.js */
// Facts about the 12 keys, shared by the embed boxes.
const KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

const KEY_INFO = {
  C:    { label: 'C',  minor: 'Am',  signature: 'No sharps or flats', level: 'Tutorial',           semitones: 0 },
  G:    { label: 'G',  minor: 'Em',  signature: '1 sharp',            level: 'Wrong Note',         semitones: 7 },
  D:    { label: 'D',  minor: 'Bm',  signature: '2 sharps',           level: 'Key Signature Lock', semitones: 2 },
  A:    { label: 'A',  minor: 'F♯m', signature: '3 sharps',           level: 'Feedback',           semitones: 9 },
  E:    { label: 'E',  minor: 'C♯m', signature: '4 sharps',           level: 'Melody Memory',      semitones: 4 },
  B:    { label: 'B',  minor: 'G♯m', signature: '5 sharps',           level: 'Fix the Mix',        semitones: 11 },
  'F#': { label: 'F♯', minor: 'D♯m', signature: '6 sharps (or 6 flats as G♭)', level: 'The Tritone', semitones: 6, alt: 'G♭' },
  Db:   { label: 'D♭', minor: 'B♭m', signature: '5 flats',            level: 'Chord Progression',  semitones: 1 },
  Ab:   { label: 'A♭', minor: 'Fm',  signature: '4 flats',            level: 'Survival Waves',     semitones: 8 },
  Eb:   { label: 'E♭', minor: 'Cm',  signature: '3 flats',            level: 'Beat Rebuild',       semitones: 3 },
  Bb:   { label: 'B♭', minor: 'Gm',  signature: '2 flats',            level: 'Arpeggio Rush',      semitones: 10 },
  F:    { label: 'F',  minor: 'Dm',  signature: '1 flat',             level: 'Final Boss',         semitones: 5 },
};

const keyLabel = (key) => KEY_INFO[key].label;

// Root note of a key as a MIDI number, kept between F#3 and F#4.
function rootMidi(key) {
  const s = KEY_INFO[key].semitones;
  return 60 + (s > 6 ? s - 12 : s);
}

<script>
/* lib/bridge.js */
// Talks to the Wix page code around this embed box.
// Keeps saying "ready" until the page answers, in case the page code
// starts listening after the box loads.
const Bridge = (() => {
  const handlers = {};
  const standalone = window.parent === window;
  let answered = false;

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message.type !== 'string' || message.type === 'ready') return;
    answered = true;
    if (handlers[message.type]) handlers[message.type](message);
  });

  function send(message) {
    if (!standalone) window.parent.postMessage(message, '*');
  }

  function start() {
    if (standalone) return;
    let tries = 0;
    const timer = setInterval(() => {
      if (answered || ++tries > 40) clearInterval(timer);
      else send({ type: 'ready' });
    }, 400);
    send({ type: 'ready' });
  }

  return { on: (type, fn) => { handlers[type] = fn; }, send, start, standalone };
})();

    play,
    // For pages with no piano: call before any sound plays.
    noPiano() { pianoWanted = false; status.total -= Object.keys(SAMPLES).length; },
    // Starts loading straight away, before the first click (it stays silent until then).
    warm() { audio(); },
    reverb(options) { reverbWanted = options || {}; if (ctx && !reverbIn) buildReverb(reverbWanted); },
    get hasReverb() { return !!reverbIn; },
    // Preview only: 'normal', 'wet' (just the reverb, loud enough to judge) or 'off'.
    reverbTest(mode) {
      if (!reverbIn) return;
      const t = ctx.currentTime, mix = (reverbWanted && reverbWanted.mix) || 0.22;
      dry.gain.setTargetAtTime(mode === 'wet' ? 0 : 1, t, 0.02);
      reverbWet.gain.setTargetAtTime(mode === 'off' ? 0 : mode === 'wet' ? 1 : mix, t, 0.02);
    },
    laser,
    instrument,
    track,
    trackNear,
    // A one-shot effect as recorded; null if it isn't loaded.
    sfx(name, volume = SFX_GAIN) { const b = named[name]; return b && b.getChannelData ? playBuffer(b, { volume }) : null; },
    // A seamless loop from a pitched set, shifted to `midi`; null if it isn't loaded.
    loopNear(name, midi, volume = SFX_GAIN) {
      const set = named[name];
      if (!set || set.getChannelData || !Object.keys(set).length) return null;
      const n = nearestIn(set, midi);
      return playBuffer(n.buf, { rate: n.rate, loop: true, volume });
    },
    // Levels list the named sounds they use, so others don't download them.
    preload(names) { names.forEach((n) => { if (!wanted.has(n)) { wanted.add(n); if (ctx) loadNamed(n); } }); },
    has: (name) => !!named[name],
    // Sample loading progress: { total, loaded, blocked, broken, done }.
    get samples() { return { ...status }; },
    onSamples(fn) { onStatus = fn; fn(status); },
    note,
    hold,
    chord,
    // A wrong note: a soft low buzz.
    buzz() {
      const a = audio();
      const t = a.currentTime + 0.02;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = 'square';
      osc.frequency.value = 98;
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(filter).connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.3);
    },
    // Locked door: two dull knocks.
    locked() {
      if (play('door-locked', { volume: 0.38 })) return; // about 2.5 dB under where it started
      thump(0, 120, 55, 0.18, 0.5);
      noise(0, 0.08, 900, 200, 0.25);
      thump(0.11, 110, 50, 0.16, 0.35);
    },
    // Getting hit in a fight: a short, quiet feedback squeal.
    squeal() {
      const a = audio();
      const t = a.currentTime + 0.01;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, t);
      osc.frequency.exponentialRampToValueAtTime(3200, t + 0.25);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.06, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.32);
      noise(0, 0.12, 3000, 800, 0.12);
    },
    // A note landing on the boss.
    hit() { thump(0, 190, 90, 0.12, 0.28); },
    // Ear defenders blocking a note.
    block() { noise(0, 0.1, 5000, 1500, 0.18); },
    // A lock springing open: two clicks and a soft thud.
    unlocked() {
      noise(0, 0.03, 6000, 3000, 0.35);
      noise(0.07, 0.03, 7000, 3500, 0.3);
      thump(0.1, 160, 70, 0.2, 0.35);
    },
    // Door swinging open.
    whoosh() {
      noise(0, 0.6, 300, 2400, 0.12);
    },
    // A key going into the circle: its perfect fifth, then its major triad.
    insert(root) {
      chord([root, root + 7], 0, 0.9, 0.5);
      chord([root, root + 4, root + 7, root + 12], 0.55, 2.4, 0.55);
    },
    // Clicking a lit key once the circle is complete.
    fifth(root) {
      chord([root, root + 7], 0, 1.1, 0.45);
    },
    // Finding a key at the end of a level: a rising arpeggio.
    keyFound(root) {
      [0, 4, 7, 12, 16].forEach((step, i) => note(root + step, i * 0.12, 1.4, 0.35));
    },
  };
})();
</script>
<script>
/* lib/piano.js */
// On-screen piano, played with the computer keyboard (the same layout as
// Ableton's and FL Studio's computer-keyboard piano) or by clicking.
//   W E   T Y U   O P
//  A S D F G H J K L ; '      Z / X shift the octave
// Boss fights switch to scale mode: A S D F G H J K play the 8 notes of the
// level's scale, so one hand can play while the other moves.
// Levels listen with onNoteOn / onNoteOff and can mark keys with
// mark(midi, 'target' | 'good' | 'bad').
const Piano = (() => {
  const CHROMATIC_CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY',
    'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote'];
  const CHROMATIC_LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"];
  const SCALE_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK'];
  const SCALE_LETTERS = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K'];
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const BLACK = [1, 3, 6, 8, 10];

  const noteName = (midi) => NAMES[((midi % 12) + 12) % 12];
  const octaveOf = (midi) => Math.floor(midi / 12) - 1;

  function create(container, { octave: startOctave = 4 } = {}) {
    const listeners = { on: [], off: [] };
    const held = new Map(); // midi → sound
    const pressedCodes = new Map(); // keyboard code → midi
    const targetPitches = new Set();
    let enabled = true;
    let shift = 0; // octaves up or down from the starting layout
    let layout = []; // [{ code, letter, midi, black, el }]
    let scaleMode = false;
    let allowed = null; // null = every key works; otherwise a Set of note names (0–11)
    let names = null;   // optional names to show on the keys, e.g. spelled with flats
    let chromaticBase = (startOctave + 1) * 12;

    container.classList.add('piano');
    container.innerHTML = `
      <div class="piano-bar">
        <span class="piano-octave">Octave <b></b></span>
        <span class="piano-help">Z / X change octave</span>
      </div>
      <div class="piano-keys"></div>`;
    const keysEl = container.querySelector('.piano-keys');
    const octaveEl = container.querySelector('.piano-octave b');

    const midiOf = (entry) => entry.midi + shift * 12;
    const entryFor = (midi) => layout.find((k) => midiOf(k) === midi) || null;

    function render() {
      keysEl.innerHTML = '';
      let whiteIndex = 0;
      layout.forEach((k) => {
        const el = document.createElement('div');
        el.className = 'piano-key ' + (k.black ? 'black' : 'white');
        el.innerHTML = `<span class="piano-letter">${k.letter}</span><span class="piano-name"></span>`;
        if (k.black) el.style.left = `calc(${whiteIndex} * var(--white-w) - var(--black-w) / 2)`;
        else whiteIndex++;
        keysEl.appendChild(el);
        k.el = el;
      });
      container.style.setProperty('--whites', whiteIndex);
      container.classList.toggle('scale-mode', scaleMode);
      relabel();
    }

    function relabel() {
      octaveEl.textContent = octaveOf(midiOf(layout[0]));
      layout.forEach((k, i) => {
        const midi = midiOf(k);
        k.el.dataset.midi = midi;
        const name = names ? names[i] : scaleMode ? noteName(midi) : (midi % 12 === 0 ? `C${octaveOf(midi)}` : '');
        k.el.querySelector('.piano-name').textContent = name;
        k.el.classList.toggle('mark-target', targetPitches.has(midi % 12));
        k.el.classList.toggle('locked', allowed !== null && !allowed.has(midi % 12));
        k.el.classList.remove('mark-good', 'mark-bad');
      });
    }

    function chromatic() {
      scaleMode = false;
      layout = CHROMATIC_CODES.map((code, i) => ({
        code, letter: CHROMATIC_LETTERS[i], midi: chromaticBase + i, black: BLACK.includes(i % 12),
      }));
      render();
    }

    function down(midi, source) {
      if (!enabled || held.has(midi)) return;
      if (allowed !== null && !allowed.has(midi % 12)) return; // greyed out
      held.set(midi, Sound.hold(midi));
      const entry = entryFor(midi);
      if (entry) entry.el.classList.add('down');
      listeners.on.forEach((fn) => fn(midi, source));
    }

    function up(midi) {
      const sound = held.get(midi);
      if (!sound) return;
      sound.stop();
      held.delete(midi);
      const entry = entryFor(midi);
      if (entry) entry.el.classList.remove('down');
      listeners.off.forEach((fn) => fn(midi));
    }

    function releaseAll() {
      [...held.keys()].forEach(up);
      pressedCodes.clear();
    }

    function setOctave(n) {
      const nextShift = shift + (n - octaveOf(midiOf(layout[0])));
      const lowest = midiOf(layout[0]) + (nextShift - shift) * 12;
      if (lowest < 36 || lowest > 84) return; // keep between C2 and C6
      releaseAll();
      shift = nextShift;
      relabel();
    }

    // Computer keyboard
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === 'KeyZ' || e.code === 'KeyX') {
        e.preventDefault();
        if (!e.repeat) setOctave(octaveOf(midiOf(layout[0])) + (e.code === 'KeyZ' ? -1 : 1));
        return;
      }
      const entry = layout.find((k) => k.code === e.code);
      if (!entry) return;
      e.preventDefault();
      if (e.repeat || pressedCodes.has(e.code)) return;
      Sound.unlock();
      const midi = midiOf(entry);
      pressedCodes.set(e.code, midi);
      down(midi, 'keyboard');
    });
    window.addEventListener('keyup', (e) => {
      if (!pressedCodes.has(e.code)) return;
      up(pressedCodes.get(e.code));
      pressedCodes.delete(e.code);
    });
    window.addEventListener('blur', releaseAll);

    // Mouse and touch
    keysEl.addEventListener('pointerdown', (e) => {
      const key = e.target.closest('.piano-key');
      if (!key) return;
      e.preventDefault();
      Sound.unlock();
      const midi = Number(key.dataset.midi);
      down(midi, 'pointer');
      const release = () => {
        up(midi);
        window.removeEventListener('pointerup', release);
        window.removeEventListener('pointercancel', release);
      };
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
    });

    chromatic();

    return {
      onNoteOn: (fn) => listeners.on.push(fn),
      onNoteOff: (fn) => listeners.off.push(fn),
      held: () => [...held.keys()],
      // Marks a key: 'target' glows (play this), 'good' and 'bad' flash.
      mark(midi, kind) {
        const entry = entryFor(midi);
        if (!entry) return;
        const el = entry.el;
        if (kind === 'target') return el.classList.add('mark-target');
        el.classList.remove('mark-good', 'mark-bad');
        void el.offsetWidth;
        el.classList.add('mark-' + kind);
        setTimeout(() => el.classList.remove('mark-' + kind), 600);
      },
      // Marks every key with this note name (in any octave) as a target.
      markPitch(pitchClass) {
        targetPitches.add(((pitchClass % 12) + 12) % 12);
        relabel();
      },
      clearMarks() {
        targetPitches.clear();
        relabel();
      },
      // Scale mode: A S D F G H J play root + each step of the major scale, one
      // key per note (no repeated octave on K, so nothing looks like a second root).
      useScale(root, steps = [0, 2, 4, 5, 7, 9, 11]) {
        releaseAll();
        scaleMode = true;
        shift = 0;
        layout = steps.map((step, i) => ({ code: SCALE_CODES[i], letter: SCALE_LETTERS[i], midi: root + step, black: false }));
        render();
      },
      useChromatic() { releaseAll(); shift = 0; names = null; chromatic(); },
      // Shows these names on the keys instead (scale mode), e.g. E♯ or G♭.
      setNames(list) { names = list; relabel(); },
      setEnabled(on) { enabled = on; if (!on) releaseAll(); },
      // Greys out every key except these note names (0–11). null unlocks all.
      setAllowed(pitchClasses) {
        allowed = pitchClasses ? new Set(pitchClasses.map((pc) => ((pc % 12) + 12) % 12)) : null;
        relabel();
      },
      get octave() { return octaveOf(midiOf(layout[0])); },
      setOctave,
    };
  }

  return { create, noteName, octaveOf };
})();
</script>
<script>
/* lib/level.js */
// The frame every level sits in: intro screen, play screen with the piano,
// the key-found screen and the phone message. A level calls Level.setup()
// with what to do when play starts, and Level.win() when it's beaten.
const Level = (() => {
  const $ = (id) => document.getElementById(id);
  let key = null;
  let testMode = false;
  let extraHearts = 0;
  let status = 'new';
  let tried = [];
  let onStart = () => {};
  let usesPiano = true;
  let finishing = false;

  document.body.insertAdjacentHTML('beforeend', `
    <section class="screen" id="phone">
      <div class="eyebrow">Hidden level</div>
      <h1>Best played on a computer</h1>
      <p>This level needs a keyboard and a bigger screen. Come back on a laptop or desktop to play.</p>
    </section>
    <section class="screen" id="intro">
      <div class="eyebrow" id="introEyebrow"></div>
      <h1 id="introTitle"></h1>
      <p id="introText"></p>
      <p id="introBeaten" hidden>You've already found this key. Play again for fun.</p>
      <div class="buttons"><button class="primary" id="startBtn">Start</button></div>
    </section>
    <section class="screen" id="play">
      <div class="focus-banner" id="focusBanner">Click here to keep playing with your keyboard</div>
      <button class="skip" id="skipBtn" hidden>Skip level (test)</button>
      <div class="preview-tools">
        <div class="sample-status" id="sampleStatus" hidden></div>
        <button class="reverb-test" id="reverbTest" hidden>Reverb: normal</button>
      </div>
      <div class="stage" id="stage"></div>
      <div id="piano"></div>
    </section>
    <section class="screen" id="found">
      <svg class="key-art" viewBox="0 0 120 240" aria-hidden="true">
        <defs>
          <linearGradient id="keyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C8B8FF"/><stop offset="1" stop-color="#9A7FE0"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="52" r="40" fill="none" stroke="url(#keyFill)" stroke-width="12"/>
        <text id="keyArtLabel" x="60" y="64" text-anchor="middle" fill="#C8B8FF" font-family="Oswald, sans-serif" font-weight="600" font-size="32"></text>
        <rect x="53" y="90" width="14" height="128" rx="4" fill="url(#keyFill)"/>
        <rect x="66" y="176" width="26" height="12" rx="3" fill="url(#keyFill)"/>
        <rect x="66" y="200" width="18" height="12" rx="3" fill="url(#keyFill)"/>
      </svg>
      <div class="text">
        <h1 id="foundTitle"></h1>
        <p class="lead" id="foundText"></p>
        <div class="heart-found" id="heartFound" hidden>
          <svg viewBox="-12 -12 24 20" aria-hidden="true"><path d="M0 6C-10-2-10-10-5-10C-2-10 0-8 0-6C0-8 2-10 5-10C10-10 10-2 0 6Z"/></svg>
          <span>You found a hidden heart. You’ll start every boss fight with one more.</span>
        </div>
        <div class="buttons" id="foundButtons"></div>
      </div>
    </section>`);

  const piano = Piano.create($('piano'));
  piano.setEnabled(false);

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('show', s.id === id));
    piano.setEnabled(id === 'play' && usesPiano);
  }

  function button(text, onClick, primary) {
    const b = document.createElement('button');
    b.textContent = text;
    if (primary) b.className = 'primary';
    b.onclick = onClick;
    return b;
  }

  // The game only hears the keyboard while it has focus.
  window.addEventListener('blur', () => $('focusBanner').classList.add('show'));
  window.addEventListener('focus', () => $('focusBanner').classList.remove('show'));
  $('focusBanner').onclick = () => { window.focus(); $('focusBanner').classList.remove('show'); };

  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

  Bridge.on('level', (message) => {
    key = message.key;
    testMode = message.testMode === true;
    extraHearts = Number(message.extraHearts) || 0;
    status = message.status === 'beaten' ? 'beaten' : 'new';
    tried = Array.isArray(message.tried) ? message.tried : [];
    if (touchOnly) return show('phone');
    $('introEyebrow').textContent = `Level ${KEYS.indexOf(key) + 1} · Key of ${keyLabel(key)}`;
    $('introTitle').textContent = KEY_INFO[key].level;
    $('introBeaten').hidden = message.status !== 'beaten';
    show('intro');
  });

  $('startBtn').onclick = () => {
    Sound.unlock();
    window.focus();
    show('play');
    // Preview only: lets you skip a level while testing the site.
    $('skipBtn').hidden = !testMode;
    $('skipBtn').onclick = () => Level.win();
    // Preview only: whether your audio samples loaded.
    if (testMode) {
      Sound.onSamples((st) => {
        if (!st.total) return;
        const el = $('sampleStatus');
        el.hidden = false;
        el.className = 'sample-status' + (st.blocked || st.broken ? ' bad' : '');
        el.textContent = !st.done ? `Samples: loading ${st.loaded} / ${st.total}…`
          : st.blocked ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.blocked} blocked by the site (using the synth)`
          : st.broken ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.broken} not playable (check the file type)`
          : `Samples: ${st.loaded} / ${st.total} loaded`;
      });
    }
    onStart($('stage'));
    // Preview only: hear the reverb on its own, or without it.
    if (testMode && Sound.hasReverb) { // the level has just turned its reverb on
      const modes = ['normal', 'wet', 'off'], labels = { normal: 'Reverb: normal', wet: 'Reverb: 100% wet', off: 'Reverb: off' };
      let m = 0;
      $('reverbTest').hidden = false;
      $('reverbTest').onclick = (e) => { e.currentTarget.blur(); m = (m + 1) % 3; Sound.reverbTest(modes[m]); $('reverbTest').textContent = labels[modes[m]]; };
    }
  };

  Bridge.on('levelSaved', (message) => {
    const label = keyLabel(key);
    $('keyArtLabel').textContent = label;
    const buttons = $('foundButtons');
    buttons.innerHTML = '';
    $('foundTitle').textContent = message.gotKey ? `You found the key of ${label}.`
      : message.gotHeart ? 'Hidden heart found' : 'Level complete';
    if (message.gotKey) Sound.keyFound(rootMidi(key));
    $('heartFound').hidden = !message.gotHeart;
    if (message.gotHeart) Sound.chord([rootMidi(key) + 12, rootMidi(key) + 16, rootMidi(key) + 19], 1.2, 1.6, 0.35);

    // The tutorial is the only time the player is told what to do.
    if (message.firstKey) {
      $('foundText').textContent = 'You just discovered your first key. Take it to the circle of fifths to continue.';
      buttons.append(button('Go to the circle of fifths', () => Bridge.send({ type: 'navigate', to: 'circle' }), true));
    } else {
      $('foundText').textContent = message.gotKey || message.gotHeart ? '' : 'You already have this key.';
    }
    buttons.append(button('Back', () => Bridge.send({ type: 'navigate', to: 'back' }), !message.firstKey));
    show('found');
  });

  return {
    piano,
    get key() { return key; },
    // True in Wix Preview: levels may show test shortcuts.
    get testMode() { return testMode; },
    // Hidden hearts found so far: boss fights add these to the starting hearts.
    get extraHearts() { return extraHearts; },
    // 'beaten' if this level's key is already won, otherwise 'new'.
    get status() { return status; },
    // Boss fights attempted so far, e.g. ['A', 'F#'] (unlocks practice attacks).
    get tried() { return tried; },
    // A boss fight calls this when it starts, so the attempt is remembered.
    attempted() { Bridge.send({ type: 'attempted' }); },
    back() { Bridge.send({ type: 'navigate', to: 'back' }); },
    // description: the line under the title on the intro screen.
    // piano: false hides the on-screen piano for levels that don't use it.
    setup({ description, start, piano: showPiano = true }) {
      $('introText').textContent = description;
      onStart = start;
      usesPiano = showPiano;
      $('piano').hidden = !showPiano;
      Bridge.start();
    },
    // Reveals the piano partway through a level that started without it.
    showPiano() {
      usesPiano = true;
      $('piano').hidden = false;
      piano.setEnabled(true);
    },
    // win({ heart: true }) also reports finding this level's hidden heart.
    win(options = {}) {
      if (finishing) return;
      finishing = true;
      piano.setEnabled(false);
      Bridge.send({ type: 'levelComplete', heart: options.heart === true });
    },
  };
})();
</script>
<script>
  // Level 11, key of B♭: a rhythm game. Notes fall down four lanes and you hit
  // them on the line with D F J K. The lanes are the current chord's root, 3rd,
  // 5th and octave, so every pattern is an arpeggio; when the chord changes,
  // the lanes change note. Lose the crowd and you retry the section.
  const W = 900, H = 560;
  const BPM = 96;
  const BEAT = 60 / BPM, BAR = BEAT * 4, STEP = BEAT / 2; // backing runs in 8ths
  const LANE_KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
  const LANE_LABELS = ['D', 'F', 'J', 'K'];
  const LANE_COLOURS = ['#C8B8FF', '#9A7FE0', '#ff8fa6', '#d9c27a'];
  const LEAD = 1.7;               // seconds a note takes to fall to the line
  const PERFECT = 0.06, GOOD = 0.13, LATE = 0.17; // timing windows, seconds
  const LANE_W = 96, HX = (W - LANE_W * 4) / 2, HIT_Y = H - 122, KEY_Y = HIT_Y + 46;
  const SPEED = (HIT_Y + 20) / LEAD;

  // I–vi–IV–V in B♭. Lane pitches (MIDI) and names for each chord.
  const CHORDS = {
    Bb: { name: 'B♭', midi: [58, 62, 65, 70], names: ['B♭', 'D', 'F', 'B♭'] },
    Gm: { name: 'Gm', midi: [55, 58, 62, 67], names: ['G', 'B♭', 'D', 'G'] },
    Eb: { name: 'E♭', midi: [63, 67, 70, 75], names: ['E♭', 'G', 'B♭', 'E♭'] },
    F:  { name: 'F',  midi: [53, 57, 60, 65], names: ['F', 'A', 'C', 'F'] },
  };
  const LOOP = ['Bb', 'Gm', 'Eb', 'F'];

  // Each pattern is a list of bars (used in turn): [beat, lane or [lanes]].
  const PATTERNS = {
    verse: [[[0, 0], [1, 1], [2, 2], [3, 3]]],
    chorus: [
      [[0, 0], [0.5, 1], [1, 2], [2, 3], [2.5, 2], [3, 1]],
      [[0, 3], [1, 2], [1.5, 1], [2, 0], [3, 1], [3.5, 2]],
    ],
    bridge: [
      [[0, [0, 2]], [1.5, 1], [2, 3], [3, 2]],
      [[0, [0, 3]], [1, 2], [2.5, 1], [3, 2]],
    ],
    solo: [
      [[0, 0], [0.25, 1], [0.5, 2], [0.75, 3], [2, 2], [2.5, 1], [3, 0]],
      [[0, 3], [0.5, 2], [1, 1], [1.5, 0], [2, [0, 2]], [3, 3]],
    ],
    finale: [[[0, [0, 1, 2, 3]]], []],
  };
  const SECTIONS = [
    { name: 'Count-in', bars: 2 },
    { name: 'Verse', bars: 4, pattern: 'verse' },
    { name: 'Chorus', bars: 8, pattern: 'chorus' },
    { name: 'Bridge', bars: 8, pattern: 'bridge' },
    { name: 'Solo', bars: 4, pattern: 'solo' },
    { name: 'Finale', bars: 2, pattern: 'finale', chord: 'Bb' },
  ];

  // ---------- Build the song ----------
  const bars = [];   // { chord, section }
  const notes = [];  // { t, lane, midi, name, bar, judged }
  SECTIONS.forEach((sec, si) => {
    sec.start = bars.length * BAR;
    sec.index = si;
    for (let b = 0; b < sec.bars; b++) {
      const barNo = bars.length;
      const chord = si === 0 ? null : (sec.chord || LOOP[(barNo - SECTIONS[0].bars) % 4]);
      bars.push({ chord, section: si });
      if (!sec.pattern) continue;
      const pat = PATTERNS[sec.pattern];
      for (const [beat, lanes] of pat[b % pat.length]) {
        for (const lane of [].concat(lanes)) {
          notes.push({ t: barNo * BAR + beat * BEAT, lane, midi: CHORDS[chord].midi[lane], name: CHORDS[chord].names[lane], bar: barNo, judged: null });
        }
      }
    }
  });
  const SONG_END = bars.length * BAR;

  // ---------- State ----------
  let canvas, g, ui = {};
  let actx = null, out = null, songStart = 0, nextStep = 0, scheduler = null;
  let state = 'ready'; // ready, playing, failed, done
  let paused = false, section = 0;
  let meter = 60, combo = 0, bestCombo = 0, score = 0;
  let counts = { perfect: 0, good: 0, miss: 0 };
  const held = [false, false, false, false];
  const flashes = [0, 0, 0, 0];
  let popups = []; // { text, colour, t0, lane }
  let sparks = [];

  window.__rush = {
    notes, sections: SECTIONS, autoplay: false,
    get state() { return state; }, get meter() { return meter; }, set meter(v) { meter = v; },
    get combo() { return combo; }, get counts() { return counts; }, get section() { return section; },
    get time() { return songTime(); }, seek: (t) => seek(t),
  };

  // ---------- Audio ----------
  function audio() {
    if (!actx) {
      actx = Sound.unlock();
      out = actx.createGain();
      out.gain.value = 0.7;
      const comp = actx.createDynamicsCompressor();
      out.connect(comp).connect(actx.destination);
    }
    return actx;
  }
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function env(gain, t, peak, attack, decay) {
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function tone(type, freq, t, peak, attack, decay, cutoff) {
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.value = freq;
    let node = o;
    if (cutoff) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); node = f; }
    node.connect(gn).connect(out);
    env(gn, t, peak, attack, decay);
    o.start(t); o.stop(t + attack + decay + 0.05);
    return o;
  }
  function noise(t, peak, decay, type, freq) {
    const len = Math.ceil(actx.sampleRate * (decay + 0.02));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain();
    src.buffer = buf; f.type = type; f.frequency.value = freq;
    src.connect(f).connect(gn).connect(out);
    gn.gain.setValueAtTime(peak, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    src.start(t);
  }
  // The note you play: a bright pluck, loud enough to lead the band.
  function pluck(midi, t = actx.currentTime + 0.005) {
    tone('sawtooth', hz(midi), t, 0.16, 0.004, 0.45, 2600);
    tone('triangle', hz(midi + 12), t, 0.08, 0.004, 0.25);
  }
  function deadNote() { noise(actx.currentTime + 0.005, 0.18, 0.07, 'bandpass', 900); }

  // One 8th-note step of the band.
  function backing(step, t) {
    const bar = Math.floor(step / 8), i = step % 8;
    if (bar >= bars.length) return;
    const { chord, section: si } = bars[bar];
    if (!chord) { // count-in clicks
      if (i % 2 === 0) tone('square', i === 0 ? 1760 : 1320, t, 0.08, 0.002, 0.05);
      return;
    }
    const c = CHORDS[chord];
    if (SECTIONS[si].pattern === 'finale') {
      if (bar === SECTIONS[si].start / BAR && i === 0) {
        const k = tone('sine', 150, t, 0.9, 0.003, 0.5); k.frequency.exponentialRampToValueAtTime(40, t + 0.4);
        noise(t, 0.35, 1.6, 'highpass', 5000);
        [c.midi[0] - 24, c.midi[0] - 12].forEach((m) => tone('sawtooth', hz(m), t, 0.22, 0.01, 2.4, 600));
        c.midi.slice(0, 3).forEach((m) => tone('triangle', hz(m), t, 0.07, 0.05, 3.2, 2000));
      }
      return;
    }
    const busy = si >= 2;
    if (i === 0 || i === 4 || (busy && i === 7)) {
      const k = tone('sine', 150, t, 0.85, 0.003, 0.26); k.frequency.exponentialRampToValueAtTime(44, t + 0.2);
    }
    if (i === 2 || i === 6) { noise(t, 0.32, 0.15, 'bandpass', 1800); tone('triangle', 190, t, 0.18, 0.002, 0.09); }
    noise(t, i % 2 ? 0.07 : 0.11, 0.04, 'highpass', 7600);
    if (i === 0 || i === 3 || i === 4 || (busy && i === 6)) tone('sawtooth', hz(c.midi[0] - 24), t, 0.28, 0.005, STEP * 1.6, 520);
    if (i === 0) c.midi.slice(0, 3).forEach((m) => tone('triangle', hz(m - 12), t, 0.035, 0.08, BAR * 0.9, 1400));
  }

  function tick() {
    if (paused) return;
    while (songStart + nextStep * STEP < actx.currentTime + 0.12) {
      backing(nextStep, songStart + nextStep * STEP);
      nextStep++;
    }
  }

  // The song's time as you hear it: the audio clock, smoothed between its
  // updates and moved back by the delay before sound reaches the speakers.
  function heardTime() {
    if (actx.getOutputTimestamp) {
      const ts = actx.getOutputTimestamp();
      if (ts.contextTime > 0 && actx.state === 'running') {
        return Math.min(actx.currentTime, ts.contextTime + (performance.now() - ts.performanceTime) / 1000);
      }
    }
    return actx.currentTime - (actx.outputLatency || 0) - (actx.baseLatency || 0);
  }
  const songTime = () => (actx ? heardTime() - songStart : 0);

  // Jumps the song to time t. Notes before `from` are left out.
  function seek(t, from = t) {
    audio();
    songStart = actx.currentTime + 0.05 - t;
    nextStep = Math.max(0, Math.ceil((t - 0.01) / STEP));
    notes.forEach((n) => { n.judged = n.t < from - 0.001 ? 'skip' : null; });
    popups = []; sparks = [];
    section = sectionAt(Math.max(from, 0));
  }
  function sectionAt(t) {
    let s = 0;
    SECTIONS.forEach((sec, i) => { if (t >= sec.start - 0.001) s = i; });
    return s;
  }

  // ---------- Playing ----------
  function startSong(fromSection = 0) {
    audio();
    const sec = SECTIONS[fromSection];
    // A bar of run-up before a retried section, with its notes left out.
    seek(fromSection === 0 ? -0.3 : sec.start - BAR, sec.start);
    if (fromSection > 0) section = fromSection;
    meter = 60; combo = 0;
    if (fromSection === 0) { counts = { perfect: 0, good: 0, miss: 0 }; score = 0; bestCombo = 0; }
    state = 'playing';
    ui.ready.classList.remove('show');
    ui.failed.classList.remove('show');
    clearInterval(scheduler);
    scheduler = setInterval(tick, 25);
    tick();
  }

  const multiplier = () => Math.min(4, 1 + Math.floor(combo / 10));

  function judge(n, kind) {
    n.judged = kind;
    counts[kind]++;
    if (kind === 'miss') {
      combo = 0;
      meter -= 5;
      popups.push({ text: 'MISS', colour: '#e7a3b0', t0: performance.now(), lane: n.lane });
    } else {
      combo++;
      bestCombo = Math.max(bestCombo, combo);
      score += (kind === 'perfect' ? 100 : 60) * multiplier();
      meter = Math.min(100, meter + (kind === 'perfect' ? 3 : 2));
      popups.push({ text: kind === 'perfect' ? 'PERFECT' : 'GOOD', colour: kind === 'perfect' ? '#C8B8FF' : '#9A7FE0', t0: performance.now(), lane: n.lane });
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI - Math.PI;
        sparks.push({ x: laneX(n.lane), y: HIT_Y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.4, colour: LANE_COLOURS[n.lane] });
      }
    }
    if (meter <= 0) fail();
  }

  function press(lane) {
    if (state !== 'playing' || paused) return;
    flashes[lane] = performance.now();
    const now = songTime();
    let best = null;
    for (const n of notes) {
      if (n.judged || n.lane !== lane) continue;
      const dt = Math.abs(n.t - now);
      if (dt <= GOOD && (!best || dt < Math.abs(best.t - now))) best = n;
      if (n.t - now > GOOD) break;
    }
    if (!best) {
      // A press with nothing to hit: a dead string, and the streak ends.
      deadNote();
      combo = 0;
      meter -= 1;
      if (meter <= 0) fail();
      return;
    }
    pluck(best.midi);
    judge(best, Math.abs(best.t - now) <= PERFECT ? 'perfect' : 'good');
  }

  function fail() {
    meter = 0;
    state = 'failed';
    clearInterval(scheduler);
    Sound.buzz();
    ui.failedText.textContent = `You lost the crowd in the ${SECTIONS[section].name.toLowerCase()}.`;
    ui.retryBtn.textContent = `Retry the ${SECTIONS[section].name.toLowerCase()}`;
    ui.failed.classList.add('show');
  }

  function finish() {
    state = 'done';
    clearInterval(scheduler);
    const total = counts.perfect + counts.good + counts.miss;
    const accuracy = total ? Math.round(((counts.perfect + counts.good * 0.6) / total) * 100) : 100;
    ui.stats.innerHTML = [['Accuracy', `${accuracy}%`], ['Best streak', bestCombo], ['Perfect', counts.perfect], ['Missed', counts.miss]]
      .map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('');
    ui.done.classList.add('show');
  }

  function update() {
    if (state !== 'playing' || paused) return;
    const now = songTime();
    section = Math.max(section, sectionAt(now));
    for (const n of notes) {
      if (n.judged) continue;
      if (window.__rush.autoplay && now >= n.t - 0.005) { flashes[n.lane] = performance.now(); pluck(n.midi); judge(n, 'perfect'); continue; }
      if (now - n.t > LATE) judge(n, 'miss');
      if (state !== 'playing') return;
      if (n.t > now + 0.2) break;
    }
    if (now > SONG_END - BAR + 0.6) finish();
  }

  // ---------- Drawing ----------
  const laneX = (lane) => HX + LANE_W * lane + LANE_W / 2;
  const yAt = (t, now) => HIT_Y - (t - now) * SPEED;
  function chordAt(t) {
    const b = bars[Math.max(0, Math.min(bars.length - 1, Math.floor(t / BAR)))];
    return b && b.chord ? CHORDS[b.chord] : null;
  }

  function roundRect(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function draw() {
    const now = state === 'ready' ? -LEAD : songTime();
    const real = performance.now();
    g.clearRect(0, 0, W, H);

    // Highway
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#16141b'); grad.addColorStop(1, '#221e2a');
    g.fillStyle = grad;
    g.fillRect(HX, 0, LANE_W * 4, H);
    for (let l = 0; l <= 4; l++) {
      g.fillStyle = l === 0 || l === 4 ? '#5e3e84' : '#2c2934';
      g.fillRect(HX + l * LANE_W - 1, 0, 2, H);
    }
    for (let l = 0; l < 4; l++) {
      const age = (real - flashes[l]) / 1000;
      if (held[l] || age < 0.15) {
        const lg = g.createLinearGradient(0, HIT_Y - 220, 0, HIT_Y);
        lg.addColorStop(0, 'rgba(154,127,224,0)'); lg.addColorStop(1, LANE_COLOURS[l] + '44');
        g.fillStyle = lg;
        g.fillRect(HX + l * LANE_W + 1, HIT_Y - 220, LANE_W - 2, 220);
      }
    }

    // Beat lines and chord changes
    const firstBeat = Math.floor(now / BEAT) - 1;
    for (let b = firstBeat; b < firstBeat + 12; b++) {
      const t = b * BEAT;
      if (t < 0 || t > SONG_END) continue;
      const y = yAt(t, now);
      if (y < -10 || y > H) continue;
      const barStart = b % 4 === 0;
      g.fillStyle = barStart ? 'rgba(154,127,224,0.4)' : 'rgba(255,255,255,0.05)';
      g.fillRect(HX, y - (barStart ? 1 : 0.5), LANE_W * 4, barStart ? 2 : 1);
      if (barStart) {
        const c = bars[b / 4] && bars[b / 4].chord;
        if (c) {
          g.font = '600 18px Oswald, sans-serif';
          g.textAlign = 'right';
          g.fillStyle = '#C8B8FF';
          g.fillText(CHORDS[c].name, HX - 12, y + 6);
        }
      }
    }

    // The hit line: a slot in each lane that a note fills exactly when it's time to press.
    g.fillStyle = 'rgba(200,184,255,0.9)';
    g.shadowColor = '#C8B8FF';
    g.shadowBlur = 10;
    g.fillRect(HX, HIT_Y - 1.5, LANE_W * 4, 3);
    g.shadowBlur = 0;
    for (let l = 0; l < 4; l++) {
      const x = laneX(l);
      const lit = held[l] || (real - flashes[l]) < 120;
      roundRect(x - 38, HIT_Y - 14, 76, 28, 14);
      g.fillStyle = lit ? LANE_COLOURS[l] + '55' : '#16141b';
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = LANE_COLOURS[l];
      g.stroke();
    }

    // Notes
    g.textAlign = 'center';
    for (const n of notes) {
      if (n.judged && n.judged !== 'miss') continue;
      const y = yAt(n.t, now);
      if (y < -30) break;
      if (y > H + 30) continue;
      const x = laneX(n.lane);
      g.globalAlpha = n.judged === 'miss' ? 0.25 : 1;
      g.fillStyle = LANE_COLOURS[n.lane];
      g.shadowColor = LANE_COLOURS[n.lane];
      g.shadowBlur = 12;
      roundRect(x - 36, y - 12, 72, 24, 12);
      g.fill();
      g.shadowBlur = 0;
      g.fillStyle = '#181818';
      g.font = '600 14px Oswald, sans-serif';
      g.fillText(n.name, x, y + 5);
      g.globalAlpha = 1;
    }

    // The keys, under the line
    const current = chordAt(Math.max(now, 0));
    for (let l = 0; l < 4; l++) {
      const x = laneX(l);
      const lit = held[l] || (real - flashes[l]) < 120;
      g.beginPath();
      g.arc(x, KEY_Y, 20, 0, Math.PI * 2);
      g.fillStyle = lit ? LANE_COLOURS[l] : '#1d1b22';
      g.fill();
      g.lineWidth = 3;
      g.strokeStyle = LANE_COLOURS[l];
      g.stroke();
      g.fillStyle = lit ? '#181818' : LANE_COLOURS[l];
      g.font = '600 18px Oswald, sans-serif';
      g.fillText(LANE_LABELS[l], x, KEY_Y + 7);
      g.fillStyle = '#a49cad';
      g.font = '500 13px Oswald, sans-serif';
      g.fillText(current ? current.names[l] : '', x, KEY_Y + 40);
    }
    g.font = '500 10px Oswald, sans-serif';
    g.fillStyle = '#6f6879';
    ['ROOT', '3RD', '5TH', 'OCTAVE'].forEach((t, l) => g.fillText(t, laneX(l), KEY_Y + 56));

    // Sparks and judgements
    const dt = 1 / 60;
    sparks = sparks.filter((s) => (s.life -= dt) > 0);
    for (const s of sparks) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 400 * dt;
      g.globalAlpha = s.life / 0.4;
      g.fillStyle = s.colour;
      g.fillRect(s.x - 2, s.y - 2, 4, 4);
    }
    g.globalAlpha = 1;
    popups = popups.filter((p) => real - p.t0 < 600);
    for (const p of popups.slice(-4)) {
      const age = (real - p.t0) / 600;
      g.globalAlpha = 1 - age;
      g.fillStyle = p.colour;
      g.font = '600 16px Oswald, sans-serif';
      g.fillText(p.text, laneX(p.lane), HIT_Y - 40 - age * 30);
    }
    g.globalAlpha = 1;

    drawHud(now);
    if (paused && state === 'playing') {
      g.fillStyle = 'rgba(18,17,22,0.7)';
      g.fillRect(0, 0, W, H);
      g.fillStyle = '#C8B8FF';
      g.font = '600 30px Oswald, sans-serif';
      g.textAlign = 'center';
      g.fillText('PAUSED', W / 2, H / 2);
    }
  }

  function drawHud(now) {
    // Left: section, score, streak
    g.textAlign = 'left';
    g.fillStyle = '#9A7FE0';
    g.font = '500 12px Oswald, sans-serif';
    g.fillText('SECTION', 28, 40);
    g.fillText('SCORE', 28, 110);
    g.fillText('STREAK', 28, 180);
    g.fillStyle = '#f2eef7';
    g.font = '600 26px Oswald, sans-serif';
    g.fillText(SECTIONS[section].name, 28, 70);
    g.fillText(String(score), 28, 140);
    g.fillText(String(combo), 28, 210);
    if (multiplier() > 1) {
      g.fillStyle = '#d9c27a';
      g.font = '600 18px Oswald, sans-serif';
      g.fillText(`×${multiplier()}`, 28 + g.measureText(String(combo)).width + 60, 210);
    }

    // Song progress along the top of the highway
    g.fillStyle = '#2c2934';
    g.fillRect(HX, 6, LANE_W * 4, 4);
    g.fillStyle = '#C8B8FF';
    g.fillRect(HX, 6, LANE_W * 4 * Math.max(0, Math.min(1, now / SONG_END)), 4);

    // Right: the crowd meter
    const mx = W - 70, my = 60, mh = 380;
    g.textAlign = 'center';
    g.fillStyle = '#9A7FE0';
    g.font = '500 12px Oswald, sans-serif';
    g.fillText('CROWD', mx + 10, my - 14);
    g.fillStyle = '#121116';
    g.strokeStyle = '#2c2934';
    g.lineWidth = 1;
    roundRect(mx, my, 20, mh, 6);
    g.fill(); g.stroke();
    const fill = Math.max(0, meter) / 100 * mh;
    const mg = g.createLinearGradient(0, my + mh, 0, my);
    mg.addColorStop(0, '#ff5d7a'); mg.addColorStop(0.3, '#9A7FE0'); mg.addColorStop(1, '#C8B8FF');
    g.fillStyle = mg;
    roundRect(mx + 2, my + mh - fill + 2, 16, Math.max(0, fill - 4), 4);
    g.fill();
  }

  function frame() {
    update();
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Keys and focus ----------
  window.addEventListener('keydown', (e) => {
    const lane = LANE_KEYS.indexOf(e.code);
    if (lane < 0) return;
    e.preventDefault();
    if (e.repeat) return;
    held[lane] = true;
    press(lane);
  });
  window.addEventListener('keyup', (e) => {
    const lane = LANE_KEYS.indexOf(e.code);
    if (lane >= 0) held[lane] = false;
  });
  // Leaving the game pauses the song; coming back picks it up again.
  window.addEventListener('blur', () => {
    held.fill(false);
    if (state === 'playing' && actx) { paused = true; actx.suspend(); }
  });
  window.addEventListener('focus', () => {
    if (paused && actx) { actx.resume(); paused = false; }
  });

  Level.setup({
    description: 'Notes fall in B♭. Hit them on the line and keep the crowd with you.',
    piano: false,
    start(stage) {
      stage.innerHTML = `
        <div class="arena">
          <canvas id="rush" width="${W}" height="${H}"></canvas>
          <div class="overlay show" id="ready">
            <h2>Arpeggio Rush</h2>
            <p>Hit each note as it reaches the line. The four lanes are the chord’s root, 3rd, 5th and octave, so they change note when the chord does.</p>
            <div class="keys-help"><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></div>
            <p>Miss too many and you lose the crowd.</p>
            <div class="buttons"><button class="primary" id="goBtn">Play</button></div>
          </div>
          <div class="overlay" id="failed">
            <h2>The crowd’s gone quiet</h2>
            <p id="failedText"></p>
            <div class="buttons"><button class="primary" id="retryBtn">Retry</button><button id="restartBtn">Start the song again</button></div>
          </div>
          <div class="overlay" id="done">
            <h2>Encore!</h2>
            <div class="stats" id="stats"></div>
            <div class="buttons"><button class="primary" id="takeBtn">Take the key</button></div>
          </div>
        </div>`;
      const $ = (id) => stage.querySelector('#' + id);
      canvas = $('rush');
      g = canvas.getContext('2d');
      ui = { ready: $('ready'), failed: $('failed'), failedText: $('failedText'), retryBtn: $('retryBtn'), done: $('done'), stats: $('stats') };
      $('goBtn').onclick = (e) => { e.target.blur(); startSong(0); };
      $('retryBtn').onclick = (e) => { e.target.blur(); startSong(section); };
      $('restartBtn').onclick = (e) => { e.target.blur(); startSong(0); };
      $('takeBtn').onclick = (e) => { e.target.blur(); Level.win(); };
      requestAnimationFrame(frame);
    },
  });
</script>
</body>
</html>
