/* lib/keys.js */
// Facts about the 12 keys, shared by the embed boxes.
const KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

const KEY_INFO = {
  C:    { label: 'C',  minor: 'Am',  signature: 'No sharps or flats', level: 'Tutorial',           semitones: 0 },
  G:    { label: 'G',  minor: 'Em',  signature: '1 sharp',            level: 'Wrong Note',         semitones: 7 },
  D:    { label: 'D',  minor: 'Bm',  signature: '2 sharps',           level: 'Key Signature Lock', semitones: 2 },
  A:    { label: 'A',  minor: 'F♯m', signature: '3 sharps',           level: 'Feedback',           semitones: 9 },
  E:    { label: 'E',  minor: 'C♯m', signature: '4 sharps',           level: 'Melody Memory',      semitones: 4 },
  B:    { label: 'B',  minor: 'G♯m', signature: '5 sharps',           level: 'Fix the Mix',        semitones: 11 },
  'F#': { label: 'F♯', minor: 'D♯m', signature: '6 sharps (or 6 flats as G♭)', level: 'The Tritone', semitones: 6, alt: 'G♭' },
  Db:   { label: 'D♭', minor: 'B♭m', signature: '5 flats',            level: 'Chord Progression',  semitones: 1 },
  Ab:   { label: 'A♭', minor: 'Fm',  signature: '4 flats',            level: 'Survival Waves',     semitones: 8 },
  Eb:   { label: 'E♭', minor: 'Cm',  signature: '3 flats',            level: 'Beat Rebuild',       semitones: 3 },
  Bb:   { label: 'B♭', minor: 'Gm',  signature: '2 flats',            level: 'Arpeggio Rush',      semitones: 10 },
  F:    { label: 'F',  minor: 'Dm',  signature: '1 flat',             level: 'Final Boss',         semitones: 5 },
};

const keyLabel = (key) => KEY_INFO[key].label;

// Root note of a key as a MIDI number, kept between F#3 and F#4.
function rootMidi(key) {
  const s = KEY_INFO[key].semitones;
  return 60 + (s > 6 ? s - 12 : s);
}

<script>
/* lib/bridge.js */
// Talks to the Wix page code around this embed box.
// Keeps saying "ready" until the page answers, in case the page code
// starts listening after the box loads.
const Bridge = (() => {
  const handlers = {};
  const standalone = window.parent === window;
  let answered = false;

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message.type !== 'string' || message.type === 'ready') return;
    answered = true;
    if (handlers[message.type]) handlers[message.type](message);
  });

  function send(message) {
    if (!standalone) window.parent.postMessage(message, '*');
  }

  function start() {
    if (standalone) return;
    let tries = 0;
    const timer = setInterval(() => {
      if (answered || ++tries > 40) clearInterval(timer);
      else send({ type: 'ready' });
    }, 400);
    send({ type: 'ready' });
  }

  return { on: (type, fn) => { handlers[type] = fn; }, send, start, standalone };
})();

<script>
/* lib/sound.js */
// Sound engine. Plays your samples when SAMPLES lists them, otherwise a soft
// built-in synth. Samples only need one note every few semitones: the nearest
// one is pitched to fill the gaps.
const Sound = (() => {
  // MIDI note number → sample link, e.g. { 60: 'https://static.wixstatic.com/mp3/...' }
  // Piano: one note every 3 semitones from C2 to C6. Everything in between,
  // and above or below, is the nearest one repitched.
  const SAMPLES = {
    36: 'https://static.wixstatic.com/mp3/281301_c7acf76ee6704f4f8472746d60b6ba09.wav', // C2
    39: 'https://static.wixstatic.com/mp3/281301_653af0d7a1c84996a486e6a52876b9a6.wav', // E♭2
    42: 'https://static.wixstatic.com/mp3/281301_8b801a53be144a509820b74c399ee184.wav', // F♯2
    45: 'https://static.wixstatic.com/mp3/281301_28e36fb856ad4cc1b48521b37f857a23.wav', // A2
    48: 'https://static.wixstatic.com/mp3/281301_dd13ec2873f142e5920a3b701b24f858.wav', // C3
    51: 'https://static.wixstatic.com/mp3/281301_96e88d23eab648d394a5a73bca193f23.wav', // E♭3
    54: 'https://static.wixstatic.com/mp3/281301_88e72b881bae4d7a8f02593460b3195f.mp3', // F♯3
    57: 'https://static.wixstatic.com/mp3/281301_584c436cd10a444793c67398eab8fdb6.wav', // A3
    60: 'https://static.wixstatic.com/mp3/281301_1df549ca37574616afa90bc2727e6e4b.wav', // C4
    63: 'https://static.wixstatic.com/mp3/281301_f6ee58761130423fa01f5fd4b1c2311d.wav', // E♭4
    66: 'https://static.wixstatic.com/mp3/281301_4225b49d9e324fefa5b4eb80e23b2907.wav', // F♯4
    69: 'https://static.wixstatic.com/mp3/281301_fe73ec5600624c0491122f9f8fde20ef.wav', // A4
    72: 'https://static.wixstatic.com/mp3/281301_f061bdd378524749898625a5dfcae23e.wav', // C5
    75: 'https://static.wixstatic.com/mp3/281301_331a2181f06d45428bcf646539b1046e.wav', // E♭5
    78: 'https://static.wixstatic.com/mp3/281301_2ba56f64a7324ee7b340dd1501cd8070.wav', // F♯5
    81: 'https://static.wixstatic.com/mp3/281301_b5b475fd6e374154b62c12a7c61bd67c.wav', // A5
    84: 'https://static.wixstatic.com/mp3/281301_df0024f76ace48bb9d646668e6c85134.wav', // C6
  };

  // Named sounds, loaded only by the levels that ask for them (Sound.preload).
  // A link plays as it is; a { note: link } set is pitched like the piano,
  // from the nearest one. Lasers are root + tritone, recorded around octave 3.
  const SOUNDS = {
    'red-charge': 'https://static.wixstatic.com/mp3/281301_73faded223f74068b94682aa3bae63a5.wav',
    'red-hit': 'https://static.wixstatic.com/mp3/281301_5ac0974a5bb04217b924de8f7e8c13d9.wav',
    'red-beam': { // a seamless loop
      48: 'https://static.wixstatic.com/mp3/281301_3a422f96cb4743fd86cea5b237f74b8a.mp3', // C3 + F♯3
      51: 'https://static.wixstatic.com/mp3/281301_240233f4f3b4402c88fbb470eca3639f.wav', // E♭3 + A3
      54: 'https://static.wixstatic.com/mp3/281301_554c1af92c7d4964b0a2981953f9cfe4.mp3', // F♯3 + C4
      57: 'https://static.wixstatic.com/mp3/281301_8b9c715c68b2437cb69ef69dce882831.mp3', // A3 + E♭4
    },
    // 'violet-charge', 'violet-hit' and 'violet-beam' go here when they're ready.
  };
  const LASER_GAIN = 0.6; // the laser samples' level; tune by ear

  const SAMPLE_GAIN = 0.7; // samples' level next to the synth; tune once real sounds are in
  let ctx = null;
  let out = null;
  const buffers = {};
  const named = {}; // name → buffer, or { note: buffer }
  const wanted = new Set(); // named sounds a level asked for
  // How the samples are doing, for the Preview-only status line.
  const status = { total: Object.keys(SAMPLES).length, loaded: 0, blocked: 0, broken: 0, done: false };
  let pending = 0;
  let onStatus = () => {};

  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createDynamicsCompressor();
      out.connect(ctx.destination);
      Object.entries(SAMPLES).forEach(([midi, url]) => load(url, (b) => { buffers[midi] = b; }));
      wanted.forEach(loadNamed);
      if (!pending) finishLoad();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function finishLoad() { status.done = true; onStatus(status); }
  // Downloads and decodes one sound. A missing one just falls back to the synth.
  async function load(url, store) {
    pending++;
    try {
      let data;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        data = await res.arrayBuffer();
      } catch (err) {
        status.blocked++; // couldn't download it (blocked, or a bad link)
        return;
      }
      try {
        store(await ctx.decodeAudioData(data));
        status.loaded++;
      } catch (err) {
        status.broken++; // downloaded, but not a sound the browser can play
      }
    } finally {
      pending--;
      onStatus(status);
      if (!pending) finishLoad();
    }
  }
  function loadNamed(name) {
    const src = SOUNDS[name];
    if (!src) return;
    status.done = false;
    if (typeof src === 'string') { status.total++; load(src, (b) => { named[name] = b; }); return; }
    named[name] = {};
    for (const [midi, url] of Object.entries(src)) { status.total++; load(url, (b) => { named[name][midi] = b; }); }
  }

  // Loops skip the silence MP3s add at each end, so they don't stutter.
  function trimmed(buf) {
    if (buf.trim) return buf.trim;
    const d = buf.getChannelData(0);
    let a = 0, b = d.length - 1;
    while (a < b && Math.abs(d[a]) < 1e-4) a++;
    while (b > a && Math.abs(d[b]) < 1e-4) b--;
    buf.trim = [a / buf.sampleRate, (b + 1) / buf.sampleRate];
    return buf.trim;
  }
  // Plays a buffer; returns stop(fade). For loops, repeats the trimmed middle.
  function playBuffer(buf, { rate = 1, loop = false, volume = 1 } = {}) {
    const a = audio(), t = a.currentTime + 0.005;
    const src = a.createBufferSource(), gain = a.createGain();
    src.buffer = buf;
    src.playbackRate.value = rate;
    gain.gain.setValueAtTime(volume, t);
    src.connect(gain).connect(out);
    if (loop) {
      const [ls, le] = trimmed(buf);
      src.loop = true; src.loopStart = ls; src.loopEnd = le;
      src.start(t, ls);
    } else src.start(t);
    let stopped = false;
    return {
      stop(fade = 0.08) {
        if (stopped) return;
        stopped = true;
        const now = a.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + fade);
        src.stop(now + fade + 0.02);
      },
    };
  }
  // The nearest note in a pitched set, counting octaves either way.
  function nearestIn(set, midi) {
    let best = null;
    for (const m of Object.keys(set).map(Number)) {
      for (const o of [-12, 0, 12]) {
        if (best === null || Math.abs(midi - (m + o)) < Math.abs(midi - best.at)) best = { m, at: m + o };
      }
    }
    return best && { buf: set[best.m], rate: Math.pow(2, (midi - best.at) / 12) };
  }

  function nearestSample(midi) {
    let best = null;
    for (const m of Object.keys(buffers).map(Number)) {
      if (best === null || Math.abs(m - midi) < Math.abs(best - midi)) best = m;
    }
    return best;
  }

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

  // Starts a note that rings until stop() is called. Used for held keys.
  function voice(midi, t, volume, synthOnly = false) {
    const a = audio();
    const gain = a.createGain();
    gain.connect(out);
    const sources = [];

    const sample = synthOnly ? null : nearestSample(midi);
    if (sample !== null) {
      const src = a.createBufferSource();
      src.buffer = buffers[sample];
      src.playbackRate.value = Math.pow(2, (midi - sample) / 12);
      gain.gain.setValueAtTime(volume * SAMPLE_GAIN, t);
      src.connect(gain);
      src.start(t);
      sources.push(src);
    } else {
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2600;
      filter.connect(gain);
      for (const detune of [-7, 7]) {
        const osc = a.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = hz(midi);
        osc.detune.value = detune;
        osc.connect(filter);
        osc.start(t);
        sources.push(osc);
      }
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(volume * 0.5, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(volume * 0.25, t + 0.3);
    }

    let stopped = false;
    return {
      stop(at = a.currentTime) {
        if (stopped) return;
        stopped = true;
        const end = Math.max(at, a.currentTime);
        gain.gain.cancelScheduledValues(end);
        gain.gain.setTargetAtTime(0.0001, end, 0.12);
        sources.forEach((src) => src.stop(end + 1));
      },
    };
  }

  // One note of a set length. `when` is seconds from now.
  function note(midi, when = 0, length = 1.2, volume = 0.4) {
    const t = audio().currentTime + 0.03 + when;
    voice(midi, t, volume).stop(t + length);
  }

  // A held note: returns an object with stop().
  function hold(midi, volume = 0.4) {
    return voice(midi, audio().currentTime + 0.01, volume);
  }

  function chord(midis, when = 0, length = 1.2, volume = 0.4) {
    midis.forEach((m) => note(m, when, length, volume / Math.sqrt(midis.length)));
  }

  // Filtered noise, for thuds and whooshes.
  function noise(when, length, from, to, volume) {
    const a = audio();
    const t = a.currentTime + 0.03 + when;
    const buffer = a.createBuffer(1, Math.ceil(a.sampleRate * length), a.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource();
    const filter = a.createBiquadFilter();
    const gain = a.createGain();
    src.buffer = buffer;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + length);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + length);
    src.connect(filter).connect(gain).connect(out);
    src.start(t);
  }

  function thump(when, from, to, length, volume) {
    const a = audio();
    const t = a.currentTime + 0.03 + when;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + length);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + length);
    osc.connect(gain).connect(out);
    osc.start(t);
    osc.stop(t + length + 0.05);
  }

  // A laser's sound, in three parts: the charge while it warns, then (call
  // live()) the hit plus the beam loop underneath it. Any part without a
  // sample uses the old synth tritone instead. stop() fades everything.
  function laser(colour, root, synthVolume) {
    const charge = named[`${colour}-charge`], hit = named[`${colour}-hit`], beams = named[`${colour}-beam`];
    const loops = beams && Object.keys(beams).length ? beams : null;
    const synth = () => [root, root + 6].map((m) => voice(m, audio().currentTime + 0.01, synthVolume, true)); // a steady hum, not the piano
    const parts = [];
    let chargeParts = charge ? [playBuffer(charge, { volume: LASER_GAIN })] : loops ? synth() : null;
    // With no laser samples at all, the synth tritone carries straight through.
    if (!chargeParts) { const held = synth(); return { live() {}, stop() { held.forEach((v) => v.stop()); } }; }
    parts.push(...chargeParts);
    let isLive = false;
    return {
      live() {
        if (isLive) return;
        isLive = true;
        chargeParts.forEach((v) => v.stop(0.04));
        if (hit) parts.push(playBuffer(hit, { volume: LASER_GAIN }));
        if (loops) { const n = nearestIn(loops, root); parts.push(playBuffer(n.buf, { rate: n.rate, loop: true, volume: LASER_GAIN })); }
        else parts.push(...synth());
      },
      stop() { parts.forEach((v) => v.stop()); },
    };
  }

  return {
    unlock: audio,
    laser,
    // Levels list the named sounds they use, so others don't download them.
    preload(names) { names.forEach((n) => { if (!wanted.has(n)) { wanted.add(n); if (ctx) loadNamed(n); } }); },
    has: (name) => !!named[name],
    // Sample loading progress: { total, loaded, blocked, broken, done }.
    get samples() { return { ...status }; },
    onSamples(fn) { onStatus = fn; fn(status); },
    note,
    hold,
    chord,
    // A wrong note: a soft low buzz.
    buzz() {
      const a = audio();
      const t = a.currentTime + 0.02;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = 'square';
      osc.frequency.value = 98;
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(filter).connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.3);
    },
    // Locked door: two dull knocks.
    locked() {
      thump(0, 120, 55, 0.18, 0.5);
      noise(0, 0.08, 900, 200, 0.25);
      thump(0.11, 110, 50, 0.16, 0.35);
    },
    // Getting hit in a fight: a short, quiet feedback squeal.
    squeal() {
      const a = audio();
      const t = a.currentTime + 0.01;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, t);
      osc.frequency.exponentialRampToValueAtTime(3200, t + 0.25);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.06, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.32);
      noise(0, 0.12, 3000, 800, 0.12);
    },
    // A note landing on the boss.
    hit() { thump(0, 190, 90, 0.12, 0.28); },
    // Ear defenders blocking a note.
    block() { noise(0, 0.1, 5000, 1500, 0.18); },
    // A lock springing open: two clicks and a soft thud.
    unlocked() {
      noise(0, 0.03, 6000, 3000, 0.35);
      noise(0.07, 0.03, 7000, 3500, 0.3);
      thump(0.1, 160, 70, 0.2, 0.35);
    },
    // Door swinging open.
    whoosh() {
      noise(0, 0.6, 300, 2400, 0.12);
    },
    // A key going into the circle: its perfect fifth, then its major triad.
    insert(root) {
      chord([root, root + 7], 0, 0.9, 0.5);
      chord([root, root + 4, root + 7, root + 12], 0.55, 2.4, 0.55);
    },
    // Clicking a lit key once the circle is complete.
    fifth(root) {
      chord([root, root + 7], 0, 1.1, 0.45);
    },
    // Finding a key at the end of a level: a rising arpeggio.
    keyFound(root) {
      [0, 4, 7, 12, 16].forEach((step, i) => note(root + step, i * 0.12, 1.4, 0.35));
    },
  };
})();
</script>
<script>
/* lib/piano.js */
// On-screen piano, played with the computer keyboard (the same layout as
// Ableton's and FL Studio's computer-keyboard piano) or by clicking.
//   W E   T Y U   O P
//  A S D F G H J K L ; '      Z / X shift the octave
// Boss fights switch to scale mode: A S D F G H J K play the 8 notes of the
// level's scale, so one hand can play while the other moves.
// Levels listen with onNoteOn / onNoteOff and can mark keys with
// mark(midi, 'target' | 'good' | 'bad').
const Piano = (() => {
  const CHROMATIC_CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY',
    'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote'];
  const CHROMATIC_LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"];
  const SCALE_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK'];
  const SCALE_LETTERS = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K'];
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const BLACK = [1, 3, 6, 8, 10];

  const noteName = (midi) => NAMES[((midi % 12) + 12) % 12];
  const octaveOf = (midi) => Math.floor(midi / 12) - 1;

  function create(container, { octave: startOctave = 4 } = {}) {
    const listeners = { on: [], off: [] };
    const held = new Map(); // midi → sound
    const pressedCodes = new Map(); // keyboard code → midi
    const targetPitches = new Set();
    let enabled = true;
    let shift = 0; // octaves up or down from the starting layout
    let layout = []; // [{ code, letter, midi, black, el }]
    let scaleMode = false;
    let allowed = null; // null = every key works; otherwise a Set of note names (0–11)
    let names = null;   // optional names to show on the keys, e.g. spelled with flats
    let chromaticBase = (startOctave + 1) * 12;

    container.classList.add('piano');
    container.innerHTML = `
      <div class="piano-bar">
        <span class="piano-octave">Octave <b></b></span>
        <span class="piano-help">Z / X change octave</span>
      </div>
      <div class="piano-keys"></div>`;
    const keysEl = container.querySelector('.piano-keys');
    const octaveEl = container.querySelector('.piano-octave b');

    const midiOf = (entry) => entry.midi + shift * 12;
    const entryFor = (midi) => layout.find((k) => midiOf(k) === midi) || null;

    function render() {
      keysEl.innerHTML = '';
      let whiteIndex = 0;
      layout.forEach((k) => {
        const el = document.createElement('div');
        el.className = 'piano-key ' + (k.black ? 'black' : 'white');
        el.innerHTML = `<span class="piano-letter">${k.letter}</span><span class="piano-name"></span>`;
        if (k.black) el.style.left = `calc(${whiteIndex} * var(--white-w) - var(--black-w) / 2)`;
        else whiteIndex++;
        keysEl.appendChild(el);
        k.el = el;
      });
      container.style.setProperty('--whites', whiteIndex);
      container.classList.toggle('scale-mode', scaleMode);
      relabel();
    }

    function relabel() {
      octaveEl.textContent = octaveOf(midiOf(layout[0]));
      layout.forEach((k, i) => {
        const midi = midiOf(k);
        k.el.dataset.midi = midi;
        const name = names ? names[i] : scaleMode ? noteName(midi) : (midi % 12 === 0 ? `C${octaveOf(midi)}` : '');
        k.el.querySelector('.piano-name').textContent = name;
        k.el.classList.toggle('mark-target', targetPitches.has(midi % 12));
        k.el.classList.toggle('locked', allowed !== null && !allowed.has(midi % 12));
        k.el.classList.remove('mark-good', 'mark-bad');
      });
    }

    function chromatic() {
      scaleMode = false;
      layout = CHROMATIC_CODES.map((code, i) => ({
        code, letter: CHROMATIC_LETTERS[i], midi: chromaticBase + i, black: BLACK.includes(i % 12),
      }));
      render();
    }

    function down(midi, source) {
      if (!enabled || held.has(midi)) return;
      if (allowed !== null && !allowed.has(midi % 12)) return; // greyed out
      held.set(midi, Sound.hold(midi));
      const entry = entryFor(midi);
      if (entry) entry.el.classList.add('down');
      listeners.on.forEach((fn) => fn(midi, source));
    }

    function up(midi) {
      const sound = held.get(midi);
      if (!sound) return;
      sound.stop();
      held.delete(midi);
      const entry = entryFor(midi);
      if (entry) entry.el.classList.remove('down');
      listeners.off.forEach((fn) => fn(midi));
    }

    function releaseAll() {
      [...held.keys()].forEach(up);
      pressedCodes.clear();
    }

    function setOctave(n) {
      const nextShift = shift + (n - octaveOf(midiOf(layout[0])));
      const lowest = midiOf(layout[0]) + (nextShift - shift) * 12;
      if (lowest < 36 || lowest > 84) return; // keep between C2 and C6
      releaseAll();
      shift = nextShift;
      relabel();
    }

    // Computer keyboard
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === 'KeyZ' || e.code === 'KeyX') {
        e.preventDefault();
        if (!e.repeat) setOctave(octaveOf(midiOf(layout[0])) + (e.code === 'KeyZ' ? -1 : 1));
        return;
      }
      const entry = layout.find((k) => k.code === e.code);
      if (!entry) return;
      e.preventDefault();
      if (e.repeat || pressedCodes.has(e.code)) return;
      Sound.unlock();
      const midi = midiOf(entry);
      pressedCodes.set(e.code, midi);
      down(midi, 'keyboard');
    });
    window.addEventListener('keyup', (e) => {
      if (!pressedCodes.has(e.code)) return;
      up(pressedCodes.get(e.code));
      pressedCodes.delete(e.code);
    });
    window.addEventListener('blur', releaseAll);

    // Mouse and touch
    keysEl.addEventListener('pointerdown', (e) => {
      const key = e.target.closest('.piano-key');
      if (!key) return;
      e.preventDefault();
      Sound.unlock();
      const midi = Number(key.dataset.midi);
      down(midi, 'pointer');
      const release = () => {
        up(midi);
        window.removeEventListener('pointerup', release);
        window.removeEventListener('pointercancel', release);
      };
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
    });

    chromatic();

    return {
      onNoteOn: (fn) => listeners.on.push(fn),
      onNoteOff: (fn) => listeners.off.push(fn),
      held: () => [...held.keys()],
      // Marks a key: 'target' glows (play this), 'good' and 'bad' flash.
      mark(midi, kind) {
        const entry = entryFor(midi);
        if (!entry) return;
        const el = entry.el;
        if (kind === 'target') return el.classList.add('mark-target');
        el.classList.remove('mark-good', 'mark-bad');
        void el.offsetWidth;
        el.classList.add('mark-' + kind);
        setTimeout(() => el.classList.remove('mark-' + kind), 600);
      },
      // Marks every key with this note name (in any octave) as a target.
      markPitch(pitchClass) {
        targetPitches.add(((pitchClass % 12) + 12) % 12);
        relabel();
      },
      clearMarks() {
        targetPitches.clear();
        relabel();
      },
      // Scale mode: A S D F G H J K play root + each step (default: major scale).
      useScale(root, steps = [0, 2, 4, 5, 7, 9, 11, 12]) {
        releaseAll();
        scaleMode = true;
        shift = 0;
        layout = steps.map((step, i) => ({ code: SCALE_CODES[i], letter: SCALE_LETTERS[i], midi: root + step, black: false }));
        render();
      },
      useChromatic() { releaseAll(); shift = 0; names = null; chromatic(); },
      // Shows these names on the keys instead (scale mode), e.g. E♯ or G♭.
      setNames(list) { names = list; relabel(); },
      setEnabled(on) { enabled = on; if (!on) releaseAll(); },
      // Greys out every key except these note names (0–11). null unlocks all.
      setAllowed(pitchClasses) {
        allowed = pitchClasses ? new Set(pitchClasses.map((pc) => ((pc % 12) + 12) % 12)) : null;
        relabel();
      },
      get octave() { return octaveOf(midiOf(layout[0])); },
      setOctave,
    };
  }

  return { create, noteName, octaveOf };
})();
</script>
<script>
/* lib/level.js */
// The frame every level sits in: intro screen, play screen with the piano,
// the key-found screen and the phone message. A level calls Level.setup()
// with what to do when play starts, and Level.win() when it's beaten.
const Level = (() => {
  const $ = (id) => document.getElementById(id);
  let key = null;
  let testMode = false;
  let extraHearts = 0;
  let onStart = () => {};
  let usesPiano = true;
  let finishing = false;

  document.body.insertAdjacentHTML('beforeend', `
    <section class="screen" id="phone">
      <div class="eyebrow">Hidden level</div>
      <h1>Best played on a computer</h1>
      <p>This level needs a keyboard and a bigger screen. Come back on a laptop or desktop to play.</p>
    </section>
    <section class="screen" id="intro">
      <div class="eyebrow" id="introEyebrow"></div>
      <h1 id="introTitle"></h1>
      <p id="introText"></p>
      <p id="introBeaten" hidden>You've already found this key. Play again for fun.</p>
      <div class="buttons"><button class="primary" id="startBtn">Start</button></div>
    </section>
    <section class="screen" id="play">
      <div class="focus-banner" id="focusBanner">Click here to keep playing with your keyboard</div>
      <button class="skip" id="skipBtn" hidden>Skip level (test)</button>
      <div class="sample-status" id="sampleStatus" hidden></div>
      <div class="stage" id="stage"></div>
      <div id="piano"></div>
    </section>
    <section class="screen" id="found">
      <svg class="key-art" viewBox="0 0 120 240" aria-hidden="true">
        <defs>
          <linearGradient id="keyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C8B8FF"/><stop offset="1" stop-color="#9A7FE0"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="52" r="40" fill="none" stroke="url(#keyFill)" stroke-width="12"/>
        <text id="keyArtLabel" x="60" y="64" text-anchor="middle" fill="#C8B8FF" font-family="Oswald, sans-serif" font-weight="600" font-size="32"></text>
        <rect x="53" y="90" width="14" height="128" rx="4" fill="url(#keyFill)"/>
        <rect x="66" y="176" width="26" height="12" rx="3" fill="url(#keyFill)"/>
        <rect x="66" y="200" width="18" height="12" rx="3" fill="url(#keyFill)"/>
      </svg>
      <div class="text">
        <h1 id="foundTitle"></h1>
        <p class="lead" id="foundText"></p>
        <div class="heart-found" id="heartFound" hidden>
          <svg viewBox="-12 -12 24 20" aria-hidden="true"><path d="M0 6C-10-2-10-10-5-10C-2-10 0-8 0-6C0-8 2-10 5-10C10-10 10-2 0 6Z"/></svg>
          <span>You found a hidden heart. You’ll start every boss fight with one more.</span>
        </div>
        <div class="buttons" id="foundButtons"></div>
      </div>
    </section>`);

  const piano = Piano.create($('piano'));
  piano.setEnabled(false);

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('show', s.id === id));
    piano.setEnabled(id === 'play' && usesPiano);
  }

  function button(text, onClick, primary) {
    const b = document.createElement('button');
    b.textContent = text;
    if (primary) b.className = 'primary';
    b.onclick = onClick;
    return b;
  }

  // The game only hears the keyboard while it has focus.
  window.addEventListener('blur', () => $('focusBanner').classList.add('show'));
  window.addEventListener('focus', () => $('focusBanner').classList.remove('show'));
  $('focusBanner').onclick = () => { window.focus(); $('focusBanner').classList.remove('show'); };

  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

  Bridge.on('level', (message) => {
    key = message.key;
    testMode = message.testMode === true;
    extraHearts = Number(message.extraHearts) || 0;
    if (touchOnly) return show('phone');
    $('introEyebrow').textContent = `Level ${KEYS.indexOf(key) + 1} · Key of ${keyLabel(key)}`;
    $('introTitle').textContent = KEY_INFO[key].level;
    $('introBeaten').hidden = message.status !== 'beaten';
    show('intro');
  });

  $('startBtn').onclick = () => {
    Sound.unlock();
    window.focus();
    show('play');
    // Preview only: lets you skip a level while testing the site.
    $('skipBtn').hidden = !testMode;
    $('skipBtn').onclick = () => Level.win();
    // Preview only: whether your audio samples loaded.
    if (testMode) {
      Sound.onSamples((st) => {
        if (!st.total) return;
        const el = $('sampleStatus');
        el.hidden = false;
        el.className = 'sample-status' + (st.blocked || st.broken ? ' bad' : '');
        el.textContent = !st.done ? `Samples: loading ${st.loaded} / ${st.total}…`
          : st.blocked ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.blocked} blocked by the site (using the synth)`
          : st.broken ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.broken} not playable (check the file type)`
          : `Samples: ${st.loaded} / ${st.total} loaded`;
      });
    }
    onStart($('stage'));
  };

  Bridge.on('levelSaved', (message) => {
    const label = keyLabel(key);
    $('keyArtLabel').textContent = label;
    const buttons = $('foundButtons');
    buttons.innerHTML = '';
    $('foundTitle').textContent = message.gotKey ? `You found the key of ${label}.`
      : message.gotHeart ? 'Hidden heart found' : 'Level complete';
    if (message.gotKey) Sound.keyFound(rootMidi(key));
    $('heartFound').hidden = !message.gotHeart;
    if (message.gotHeart) Sound.chord([rootMidi(key) + 12, rootMidi(key) + 16, rootMidi(key) + 19], 1.2, 1.6, 0.35);

    // The tutorial is the only time the player is told what to do.
    if (message.firstKey) {
      $('foundText').textContent = 'You just discovered your first key. Take it to the circle of fifths to continue.';
      buttons.append(button('Go to the circle of fifths', () => Bridge.send({ type: 'navigate', to: 'circle' }), true));
    } else {
      $('foundText').textContent = message.gotKey || message.gotHeart ? '' : 'You already have this key.';
    }
    buttons.append(button('Back', () => Bridge.send({ type: 'navigate', to: 'back' }), !message.firstKey));
    show('found');
  });

  return {
    piano,
    get key() { return key; },
    // True in Wix Preview: levels may show test shortcuts.
    get testMode() { return testMode; },
    // Hidden hearts found so far: boss fights add these to the starting hearts.
    get extraHearts() { return extraHearts; },
    back() { Bridge.send({ type: 'navigate', to: 'back' }); },
    // description: the line under the title on the intro screen.
    // piano: false hides the on-screen piano for levels that don't use it.
    setup({ description, start, piano: showPiano = true }) {
      $('introText').textContent = description;
      onStart = start;
      usesPiano = showPiano;
      $('piano').hidden = !showPiano;
      Bridge.start();
    },
    // Reveals the piano partway through a level that started without it.
    showPiano() {
      usesPiano = true;
      $('piano').hidden = false;
      piano.setEnabled(true);
    },
    // win({ heart: true }) also reports finding this level's hidden heart.
    win(options = {}) {
      if (finishing) return;
      finishing = true;
      piano.setEnabled(false);
      Bridge.send({ type: 'levelComplete', heart: options.heart === true });
    },
  };
})();
</script>
<script>
  // Level 6, key of B: a 4-bar loop in B major with something wrong in the mix.
  // Three rounds, one problem each; fixes carry over between rounds.
  // Hidden: a fifth track, hidden and muted like a hidden track in a DAW. A
  // small + at the end of the desk shows it; blending it in finds a heart.
  const TRACKS = ['drums', 'bass', 'keys', 'lead'];   // the four the rounds are about
  const ALL = [...TRACKS, 'arp'];
  const LABELS = { drums: 'Drums', bass: 'Bass', keys: 'Keys', lead: 'Lead', arp: 'Arp' };
  let arpShown = false;

  // Each round sets some controls wrong, describes the problem, and says when it's fixed.
  const ROUNDS = [
    {
      problem: 'Something’s far too loud.',
      set: { lead: { fader: 9 } },
      fixed: (m) => m.lead.fader <= 2,
      hint: 'The lead is much louder than everything else. Pull its fader down.',
      done: 'Better. Balance comes first: if one part drowns the rest, nothing else matters.',
    },
    {
      problem: 'The low end is muddy.',
      set: { keys: { low: 10 } },
      fixed: (m) => m.keys.low <= 2 && m.bass.low >= -4,
      hint: 'The keys have a big boost in the lows, fighting the bass. Cut the keys’ LOW, and leave the bass alone.',
      done: 'Clean. Only one thing should own the low end, and here that’s the bass.',
    },
    {
      problem: 'The whole mix is lopsided.',
      set: { drums: { pan: -1 }, bass: { pan: -1 }, keys: { pan: -1 }, lead: { pan: -1 } },
      fixed: (m) => Math.abs(m.drums.pan) <= 0.2 && Math.abs(m.bass.pan) <= 0.2
        && Math.abs(TRACKS.reduce((sum, t) => sum + m[t].pan, 0) / TRACKS.length) <= 0.25,
      hint: 'Kick and bass usually sit in the middle. Centre them, then spread the keys and lead either side.',
      done: 'That’s a mix. Centre the low end, spread the rest.',
    },
  ];

  // The mix the player controls.
  const mix = {};
  ALL.forEach((t) => { mix[t] = { fader: 0, low: 0, high: 0, pan: 0, mute: false, solo: false }; });
  Object.assign(mix.arp, { mute: true, fader: -8, pan: 0.35 });
  let round = 0;
  let tries = 0;
  let ui = {};
  window.__mix = { mix, get round() { return round; }, get arpShown() { return arpShown; } };

  // ---------- Audio: four channels into a master bus ----------
  let ctx = null, channels = {}, master, analyser, scheduler = null, step = 0, nextTime = 0;
  const BPM = 100, STEP = 60 / BPM / 4; // 16th notes

  function buildAudio() {
    ctx = Sound.unlock();
    master = ctx.createGain();
    master.gain.value = 0.8;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    master.connect(analyser).connect(ctx.destination);
    ALL.forEach((t) => {
      const input = ctx.createGain();
      const low = ctx.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 220;
      const high = ctx.createBiquadFilter(); high.type = 'highshelf'; high.frequency.value = 3200;
      const pan = ctx.createStereoPanner();
      const fader = ctx.createGain();
      input.connect(low).connect(high).connect(pan).connect(fader).connect(master);
      channels[t] = { input, low, high, pan, fader };
    });
    applyMix();
  }

  const dbToGain = (db) => (db <= -30 ? 0 : Math.pow(10, db / 20));

  function applyMix() {
    if (!ctx) return;
    const soloing = ALL.some((t) => mix[t].solo);
    ALL.forEach((t) => {
      const c = channels[t], m = mix[t];
      const audible = !m.mute && (!soloing || m.solo);
      c.low.gain.setTargetAtTime(m.low, ctx.currentTime, 0.02);
      c.high.gain.setTargetAtTime(m.high, ctx.currentTime, 0.02);
      c.pan.pan.setTargetAtTime(m.pan, ctx.currentTime, 0.02);
      c.fader.gain.setTargetAtTime(audible ? dbToGain(m.fader) * 0.5 : 0, ctx.currentTime, 0.02);
    });
  }

  // Small synth voices, each into its channel.
  function env(node, t, peak, attack, decay) {
    node.gain.setValueAtTime(0.0001, t);
    node.gain.exponentialRampToValueAtTime(peak, t + attack);
    node.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function tone(track, type, freq, t, peak, attack, decay, filterFreq) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    let out = osc;
    if (filterFreq) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq; osc.connect(f); out = f; }
    out.connect(g).connect(channels[track].input);
    env(g, t, peak, attack, decay);
    osc.start(t); osc.stop(t + attack + decay + 0.05);
    return osc;
  }
  function noise(track, t, peak, decay, type, freq) {
    const len = Math.ceil(ctx.sampleRate * (decay + 0.05));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = type; f.frequency.value = freq;
    src.connect(f).connect(g).connect(channels[track].input);
    env(g, t, peak, 0.002, decay);
    src.start(t);
  }
  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

  // B major: B, G♯m, E, F♯, one bar each.
  const CHORDS = [[59, 63, 66], [56, 59, 63], [52, 56, 59], [54, 58, 61]];
  const BASS = [35, 32, 28, 30];
  const LEAD = [ // [step within 64, midi, length in steps]
    [0, 71, 2], [2, 73, 2], [4, 75, 4], [8, 73, 2], [10, 71, 2], [12, 68, 4],
    [16, 68, 2], [18, 71, 2], [20, 73, 6], [28, 75, 4],
    [32, 76, 2], [34, 75, 2], [36, 73, 4], [40, 71, 4], [44, 68, 4],
    [48, 70, 2], [50, 71, 2], [52, 73, 4], [56, 70, 8],
  ];

  function playStep(s, t) {
    const bar = Math.floor(s / 16), inBar = s % 16;
    if (inBar % 4 === 0) { // kick on every beat
      const k = tone('drums', 'sine', 150, t, 0.9, 0.003, 0.25);
      k.frequency.setValueAtTime(150, t); k.frequency.exponentialRampToValueAtTime(45, t + 0.2);
    }
    if (inBar === 4 || inBar === 12) { noise('drums', t, 0.45, 0.16, 'bandpass', 1800); tone('drums', 'triangle', 190, t, 0.25, 0.002, 0.1); }
    if (inBar % 2 === 0) noise('drums', t, inBar % 4 === 2 ? 0.16 : 0.09, 0.04, 'highpass', 7500);
    if (inBar % 2 === 0) tone('bass', 'sawtooth', hz(BASS[bar] + (inBar % 8 === 6 ? 12 : 0)), t, 0.35, 0.005, STEP * 1.8, 700);
    if (inBar === 0 || inBar === 8) CHORDS[bar].forEach((m) => tone('keys', 'triangle', hz(m), t, 0.12, 0.03, STEP * 7, 2400));
    for (const [at, midi, len] of LEAD) if (at === s) tone('lead', 'square', hz(midi), t, 0.07, 0.01, STEP * len * 0.9, 3000);
    // The hidden arp: the bar's chord, an octave up, rippling in 16ths.
    const arp = [...CHORDS[bar], CHORDS[bar][0] + 12];
    tone('arp', 'triangle', hz(arp[[0, 1, 2, 3, 2, 1][inBar % 6]] + 12), t, 0.08, 0.004, STEP * 0.9, 4200);
  }

  function startLoop() {
    if (!ctx) buildAudio();
    if (scheduler) return;
    step = 0;
    nextTime = ctx.currentTime + 0.08;
    scheduler = setInterval(() => {
      while (nextTime < ctx.currentTime + 0.12) {
        playStep(step, nextTime);
        nextTime += STEP;
        step = (step + 1) % 64;
      }
    }, 25);
    ui.playBtn.textContent = '■ Stop';
    meterLoop();
  }
  function stopLoop() {
    clearInterval(scheduler);
    scheduler = null;
    ui.playBtn.textContent = '▶ Play';
  }

  function meterLoop() {
    if (!scheduler) { ui.meter.style.height = '0'; return; }
    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);
    let peak = 0;
    for (const v of data) peak = Math.max(peak, Math.abs(v));
    ui.meter.style.height = `${Math.min(100, peak * 110)}%`;
    requestAnimationFrame(meterLoop);
  }

  // ---------- The desk ----------
  function drawDesk() {
    ui.desk.innerHTML = '';
    ALL.forEach((t) => {
      const strip = document.createElement('div');
      strip.className = 'strip' + (t === 'arp' ? ' hidden-track' : '');
      strip.hidden = t === 'arp' && !arpShown;
      strip.dataset.track = t;
      strip.innerHTML = `
        <h3>${LABELS[t].toUpperCase()}</h3>
        <label class="row"><span>HIGH</span><input type="range" data-ctl="high" min="-12" max="12" step="1"></label>
        <label class="row"><span>LOW</span><input type="range" data-ctl="low" min="-12" max="12" step="1"></label>
        <label class="row"><span>PAN</span><input type="range" data-ctl="pan" min="-1" max="1" step="0.05"></label>
        <div class="fader-wrap"><input class="fader" type="range" data-ctl="fader" min="-30" max="12" step="0.5"><span class="db"></span></div>
        <div class="ms"><button class="mute" data-ctl="mute">M</button><button class="solo" data-ctl="solo">S</button></div>`;
      strip.querySelectorAll('input').forEach((input) => {
        input.setAttribute('aria-label', `${LABELS[t]} ${input.dataset.ctl}`);
        input.oninput = () => { mix[t][input.dataset.ctl] = Number(input.value); refresh(); applyMix(); };
      });
      strip.querySelectorAll('button').forEach((b) => {
        b.onclick = () => { mix[t][b.dataset.ctl] = !mix[t][b.dataset.ctl]; b.blur(); refresh(); applyMix(); };
      });
      ui.desk.appendChild(strip);
    });
    // The hidden track's button: small and easy to miss, like in a DAW.
    const reveal = document.createElement('button');
    reveal.className = 'reveal';
    reveal.id = 'revealBtn';
    reveal.title = 'Show hidden tracks';
    reveal.setAttribute('aria-label', 'Show hidden tracks');
    reveal.textContent = '+';
    reveal.hidden = arpShown;
    reveal.onclick = () => {
      arpShown = true;
      reveal.hidden = true;
      ui.desk.querySelector('[data-track="arp"]').hidden = false;
    };
    ui.desk.appendChild(reveal);
    const m = document.createElement('div');
    m.className = 'master';
    m.innerHTML = '<div class="meter"><i></i></div><span>MASTER</span>';
    ui.desk.appendChild(m);
    ui.meter = m.querySelector('i');
    refresh();
  }

  // Shows the mix's values on the desk.
  function refresh() {
    const soloing = ALL.some((t) => mix[t].solo);
    ALL.forEach((t) => {
      const strip = ui.desk.querySelector(`[data-track="${t}"]`);
      strip.querySelectorAll('input').forEach((input) => { input.value = mix[t][input.dataset.ctl]; });
      strip.querySelector('.db').textContent = mix[t].fader <= -30 ? '−∞' : `${mix[t].fader > 0 ? '+' : ''}${mix[t].fader} dB`;
      strip.querySelector('.mute').classList.toggle('on', mix[t].mute);
      strip.querySelector('.solo').classList.toggle('on', mix[t].solo);
      strip.classList.toggle('dim', mix[t].mute || (soloing && !mix[t].solo));
    });
  }

  function say(text, bad) {
    ui.feedback.textContent = text;
    ui.feedback.className = bad ? 'bad' : '';
  }

  function startRound() {
    const r = ROUNDS[round];
    tries = 0;
    for (const [t, values] of Object.entries(r.set)) Object.assign(mix[t], values);
    ui.round.textContent = `Round ${round + 1} of ${ROUNDS.length}`;
    ui.problem.textContent = r.problem;
    ui.check.disabled = false;
    refresh();
    applyMix();
    say(round === 0 ? 'Press Play and listen. Use the desk to fix it, then check the mix.' : 'Press Check when it sounds right.');
  }

  // Muting or burying a part doesn't count as fixing it.
  function everythingHeard() {
    return TRACKS.every((t) => !mix[t].mute && mix[t].fader >= -15);
  }

  function check() {
    const r = ROUNDS[round];
    if (!everythingHeard()) return say('Every part still needs to be heard: unmute it, or bring its fader back up.', true);
    if (!r.fixed(mix)) {
      tries++;
      Sound.buzz();
      return say(tries >= 2 ? `Not yet. Hint: ${r.hint}` : 'Not yet. Listen again: what still sounds wrong?', true);
    }
    ui.check.disabled = true;
    Sound.chord([59, 63, 66, 71], 0, 1.2, 0.3);
    say(r.done);
    round++;
    if (round < ROUNDS.length) return setTimeout(startRound, 2600);
    setTimeout(() => {
      stopLoop();
      // The hidden heart: the hidden track found, unmuted and blended in.
      Level.win({ heart: arpShown && !mix.arp.mute && mix.arp.fader >= -15 });
    }, 2600);
  }

  Level.setup({
    description: 'A track in B major with a broken mix. Use the desk to make it sound right.',
    piano: false,
    start(stage) {
      stage.innerHTML = `
        <div class="top"><span class="round" id="round"></span><span id="problem"></span></div>
        <div class="desk" id="desk"></div>
        <div class="controls"><button id="playBtn">▶ Play</button><button class="primary" id="checkBtn">Check the mix</button></div>
        <p id="feedback"></p>`;
      ui = {
        round: stage.querySelector('#round'), problem: stage.querySelector('#problem'), desk: stage.querySelector('#desk'),
        playBtn: stage.querySelector('#playBtn'), check: stage.querySelector('#checkBtn'), feedback: stage.querySelector('#feedback'),
      };
      ui.playBtn.onclick = () => { ui.playBtn.blur(); scheduler ? stopLoop() : startLoop(); };
      ui.check.onclick = () => { ui.check.blur(); check(); };
      drawDesk();
      startRound();
    },
  });
</script>
</body>
</html>
