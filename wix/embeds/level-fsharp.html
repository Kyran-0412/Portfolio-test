/* lib/keys.js */
// Facts about the 12 keys, shared by the embed boxes.
const KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

const KEY_INFO = {
  C:    { label: 'C',  minor: 'Am',  signature: 'No sharps or flats', level: 'Tutorial',           semitones: 0 },
  G:    { label: 'G',  minor: 'Em',  signature: '1 sharp',            level: 'Wrong Note',         semitones: 7 },
  D:    { label: 'D',  minor: 'Bm',  signature: '2 sharps',           level: 'Key Signature Lock', semitones: 2 },
  A:    { label: 'A',  minor: 'F♯m', signature: '3 sharps',           level: 'Feedback',           semitones: 9 },
  E:    { label: 'E',  minor: 'C♯m', signature: '4 sharps',           level: 'Melody Memory',      semitones: 4 },
  B:    { label: 'B',  minor: 'G♯m', signature: '5 sharps',           level: 'Fix the Mix',        semitones: 11 },
  'F#': { label: 'F♯', minor: 'D♯m', signature: '6 sharps (or 6 flats as G♭)', level: 'The Tritone', semitones: 6, alt: 'G♭' },
  Db:   { label: 'D♭', minor: 'B♭m', signature: '5 flats',            level: 'Chord Progression',  semitones: 1 },
  Ab:   { label: 'A♭', minor: 'Fm',  signature: '4 flats',            level: 'Survival Waves',     semitones: 8 },
  Eb:   { label: 'E♭', minor: 'Cm',  signature: '3 flats',            level: 'Beat Rebuild',       semitones: 3 },
  Bb:   { label: 'B♭', minor: 'Gm',  signature: '2 flats',            level: 'Arpeggio Rush',      semitones: 10 },
  F:    { label: 'F',  minor: 'Dm',  signature: '1 flat',             level: 'Final Boss',         semitones: 5 },
};

const keyLabel = (key) => KEY_INFO[key].label;

// Root note of a key as a MIDI number, kept between F#3 and F#4.
function rootMidi(key) {
  const s = KEY_INFO[key].semitones;
  return 60 + (s > 6 ? s - 12 : s);
}

<script>
/* lib/bridge.js */
// Talks to the Wix page code around this embed box.
// Keeps saying "ready" until the page answers, in case the page code
// starts listening after the box loads.
const Bridge = (() => {
  const handlers = {};
  const standalone = window.parent === window;
  let answered = false;

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message.type !== 'string' || message.type === 'ready') return;
    answered = true;
    if (handlers[message.type]) handlers[message.type](message);
  });

  function send(message) {
    if (!standalone) window.parent.postMessage(message, '*');
  }

  function start() {
    if (standalone) return;
    let tries = 0;
    const timer = setInterval(() => {
      if (answered || ++tries > 40) clearInterval(timer);
      else send({ type: 'ready' });
    }, 400);
    send({ type: 'ready' });
  }

  return { on: (type, fn) => { handlers[type] = fn; }, send, start, standalone };
})();

    51: 'https://static.wixstatic.com/mp3/281301_e83debe4e7df44639c509240c71c396d.wav', // E♭ minor
    54: 'https://static.wixstatic.com/mp3/281301_011e9bd42a76417782a716fe8835238c.wav', // F♯ minor

    buzz() {
      const a = audio();
      const t = a.currentTime + 0.02;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = 'square';
      osc.frequency.value = 98;
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(filter).connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.3);
    },
    // Locked door: two dull knocks.
    locked() {
      thump(0, 120, 55, 0.18, 0.5);
      noise(0, 0.08, 900, 200, 0.25);
      thump(0.11, 110, 50, 0.16, 0.35);
    },
    // Getting hit in a fight: a short, quiet feedback squeal.
    squeal() {
      const a = audio();
      const t = a.currentTime + 0.01;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, t);
      osc.frequency.exponentialRampToValueAtTime(3200, t + 0.25);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.06, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.32);
      noise(0, 0.12, 3000, 800, 0.12);
    },
    // A note landing on the boss.
    hit() { thump(0, 190, 90, 0.12, 0.28); },
    // Ear defenders blocking a note.
    block() { noise(0, 0.1, 5000, 1500, 0.18); },
    // A lock springing open: two clicks and a soft thud.
    unlocked() {
      noise(0, 0.03, 6000, 3000, 0.35);
      noise(0.07, 0.03, 7000, 3500, 0.3);
      thump(0.1, 160, 70, 0.2, 0.35);
    },
    // Door swinging open.
    whoosh() {
      noise(0, 0.6, 300, 2400, 0.12);
    },
    // A key going into the circle: its perfect fifth, then its major triad.
    insert(root) {
      chord([root, root + 7], 0, 0.9, 0.5);
      chord([root, root + 4, root + 7, root + 12], 0.55, 2.4, 0.55);
    },
    // Clicking a lit key once the circle is complete.
    fifth(root) {
      chord([root, root + 7], 0, 1.1, 0.45);
    },
    // Finding a key at the end of a level: a rising arpeggio.
    keyFound(root) {
      [0, 4, 7, 12, 16].forEach((step, i) => note(root + step, i * 0.12, 1.4, 0.35));
    },
  };
})();
</script>
<script>
/* lib/piano.js */
// On-screen piano, played with the computer keyboard (the same layout as
// Ableton's and FL Studio's computer-keyboard piano) or by clicking.
//   W E   T Y U   O P
//  A S D F G H J K L ; '      Z / X shift the octave
// Boss fights switch to scale mode: A S D F G H J K play the 8 notes of the
// level's scale, so one hand can play while the other moves.
// Levels listen with onNoteOn / onNoteOff and can mark keys with
// mark(midi, 'target' | 'good' | 'bad').
const Piano = (() => {
  const CHROMATIC_CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY',
    'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote'];
  const CHROMATIC_LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"];
  const SCALE_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK'];
  const SCALE_LETTERS = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K'];
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const BLACK = [1, 3, 6, 8, 10];

  const noteName = (midi) => NAMES[((midi % 12) + 12) % 12];
  const octaveOf = (midi) => Math.floor(midi / 12) - 1;

  function create(container, { octave: startOctave = 4 } = {}) {
    const listeners = { on: [], off: [] };
    const held = new Map(); // midi → sound
    const pressedCodes = new Map(); // keyboard code → midi
    const targetPitches = new Set();
    let enabled = true;
    let shift = 0; // octaves up or down from the starting layout
    let layout = []; // [{ code, letter, midi, black, el }]
    let scaleMode = false;
    let allowed = null; // null = every key works; otherwise a Set of note names (0–11)
    let names = null;   // optional names to show on the keys, e.g. spelled with flats
    let chromaticBase = (startOctave + 1) * 12;

    container.classList.add('piano');
    container.innerHTML = `
      <div class="piano-bar">
        <span class="piano-octave">Octave <b></b></span>
        <span class="piano-help">Z / X change octave</span>
      </div>
      <div class="piano-keys"></div>`;
    const keysEl = container.querySelector('.piano-keys');
    const octaveEl = container.querySelector('.piano-octave b');

    const midiOf = (entry) => entry.midi + shift * 12;
    const entryFor = (midi) => layout.find((k) => midiOf(k) === midi) || null;

    function render() {
      keysEl.innerHTML = '';
      let whiteIndex = 0;
      layout.forEach((k) => {
        const el = document.createElement('div');
        el.className = 'piano-key ' + (k.black ? 'black' : 'white');
        el.innerHTML = `<span class="piano-letter">${k.letter}</span><span class="piano-name"></span>`;
        if (k.black) el.style.left = `calc(${whiteIndex} * var(--white-w) - var(--black-w) / 2)`;
        else whiteIndex++;
        keysEl.appendChild(el);
        k.el = el;
      });
      container.style.setProperty('--whites', whiteIndex);
      container.classList.toggle('scale-mode', scaleMode);
      relabel();
    }

    function relabel() {
      octaveEl.textContent = octaveOf(midiOf(layout[0]));
      layout.forEach((k, i) => {
        const midi = midiOf(k);
        k.el.dataset.midi = midi;
        const name = names ? names[i] : scaleMode ? noteName(midi) : (midi % 12 === 0 ? `C${octaveOf(midi)}` : '');
        k.el.querySelector('.piano-name').textContent = name;
        k.el.classList.toggle('mark-target', targetPitches.has(midi % 12));
        k.el.classList.toggle('locked', allowed !== null && !allowed.has(midi % 12));
        k.el.classList.remove('mark-good', 'mark-bad');
      });
    }

    function chromatic() {
      scaleMode = false;
      layout = CHROMATIC_CODES.map((code, i) => ({
        code, letter: CHROMATIC_LETTERS[i], midi: chromaticBase + i, black: BLACK.includes(i % 12),
      }));
      render();
    }

    function down(midi, source) {
      if (!enabled || held.has(midi)) return;
      if (allowed !== null && !allowed.has(midi % 12)) return; // greyed out
      held.set(midi, Sound.hold(midi));
      const entry = entryFor(midi);
      if (entry) entry.el.classList.add('down');
      listeners.on.forEach((fn) => fn(midi, source));
    }

    function up(midi) {
      const sound = held.get(midi);
      if (!sound) return;
      sound.stop();
      held.delete(midi);
      const entry = entryFor(midi);
      if (entry) entry.el.classList.remove('down');
      listeners.off.forEach((fn) => fn(midi));
    }

    function releaseAll() {
      [...held.keys()].forEach(up);
      pressedCodes.clear();
    }

    function setOctave(n) {
      const nextShift = shift + (n - octaveOf(midiOf(layout[0])));
      const lowest = midiOf(layout[0]) + (nextShift - shift) * 12;
      if (lowest < 36 || lowest > 84) return; // keep between C2 and C6
      releaseAll();
      shift = nextShift;
      relabel();
    }

    // Computer keyboard
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === 'KeyZ' || e.code === 'KeyX') {
        e.preventDefault();
        if (!e.repeat) setOctave(octaveOf(midiOf(layout[0])) + (e.code === 'KeyZ' ? -1 : 1));
        return;
      }
      const entry = layout.find((k) => k.code === e.code);
      if (!entry) return;
      e.preventDefault();
      if (e.repeat || pressedCodes.has(e.code)) return;
      Sound.unlock();
      const midi = midiOf(entry);
      pressedCodes.set(e.code, midi);
      down(midi, 'keyboard');
    });
    window.addEventListener('keyup', (e) => {
      if (!pressedCodes.has(e.code)) return;
      up(pressedCodes.get(e.code));
      pressedCodes.delete(e.code);
    });
    window.addEventListener('blur', releaseAll);

    // Mouse and touch
    keysEl.addEventListener('pointerdown', (e) => {
      const key = e.target.closest('.piano-key');
      if (!key) return;
      e.preventDefault();
      Sound.unlock();
      const midi = Number(key.dataset.midi);
      down(midi, 'pointer');
      const release = () => {
        up(midi);
        window.removeEventListener('pointerup', release);
        window.removeEventListener('pointercancel', release);
      };
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
    });

    chromatic();

    return {
      onNoteOn: (fn) => listeners.on.push(fn),
      onNoteOff: (fn) => listeners.off.push(fn),
      held: () => [...held.keys()],
      // Marks a key: 'target' glows (play this), 'good' and 'bad' flash.
      mark(midi, kind) {
        const entry = entryFor(midi);
        if (!entry) return;
        const el = entry.el;
        if (kind === 'target') return el.classList.add('mark-target');
        el.classList.remove('mark-good', 'mark-bad');
        void el.offsetWidth;
        el.classList.add('mark-' + kind);
        setTimeout(() => el.classList.remove('mark-' + kind), 600);
      },
      // Marks every key with this note name (in any octave) as a target.
      markPitch(pitchClass) {
        targetPitches.add(((pitchClass % 12) + 12) % 12);
        relabel();
      },
      clearMarks() {
        targetPitches.clear();
        relabel();
      },
      // Scale mode: A S D F G H J play root + each step of the major scale, one
      // key per note (no repeated octave on K, so nothing looks like a second root).
      useScale(root, steps = [0, 2, 4, 5, 7, 9, 11]) {
        releaseAll();
        scaleMode = true;
        shift = 0;
        layout = steps.map((step, i) => ({ code: SCALE_CODES[i], letter: SCALE_LETTERS[i], midi: root + step, black: false }));
        render();
      },
      useChromatic() { releaseAll(); shift = 0; names = null; chromatic(); },
      // Shows these names on the keys instead (scale mode), e.g. E♯ or G♭.
      setNames(list) { names = list; relabel(); },
      setEnabled(on) { enabled = on; if (!on) releaseAll(); },
      // Greys out every key except these note names (0–11). null unlocks all.
      setAllowed(pitchClasses) {
        allowed = pitchClasses ? new Set(pitchClasses.map((pc) => ((pc % 12) + 12) % 12)) : null;
        relabel();
      },
      get octave() { return octaveOf(midiOf(layout[0])); },
      setOctave,
    };
  }

  return { create, noteName, octaveOf };
})();
</script>
<script>
/* lib/level.js */
// The frame every level sits in: intro screen, play screen with the piano,
// the key-found screen and the phone message. A level calls Level.setup()
// with what to do when play starts, and Level.win() when it's beaten.
const Level = (() => {
  const $ = (id) => document.getElementById(id);
  let key = null;
  let testMode = false;
  let extraHearts = 0;
  let onStart = () => {};
  let usesPiano = true;
  let finishing = false;

  document.body.insertAdjacentHTML('beforeend', `
    <section class="screen" id="phone">
      <div class="eyebrow">Hidden level</div>
      <h1>Best played on a computer</h1>
      <p>This level needs a keyboard and a bigger screen. Come back on a laptop or desktop to play.</p>
    </section>
    <section class="screen" id="intro">
      <div class="eyebrow" id="introEyebrow"></div>
      <h1 id="introTitle"></h1>
      <p id="introText"></p>
      <p id="introBeaten" hidden>You've already found this key. Play again for fun.</p>
      <div class="buttons"><button class="primary" id="startBtn">Start</button></div>
    </section>
    <section class="screen" id="play">
      <div class="focus-banner" id="focusBanner">Click here to keep playing with your keyboard</div>
      <button class="skip" id="skipBtn" hidden>Skip level (test)</button>
      <div class="preview-tools">
        <div class="sample-status" id="sampleStatus" hidden></div>
        <button class="reverb-test" id="reverbTest" hidden>Reverb: normal</button>
      </div>
      <div class="stage" id="stage"></div>
      <div id="piano"></div>
    </section>
    <section class="screen" id="found">
      <svg class="key-art" viewBox="0 0 120 240" aria-hidden="true">
        <defs>
          <linearGradient id="keyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C8B8FF"/><stop offset="1" stop-color="#9A7FE0"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="52" r="40" fill="none" stroke="url(#keyFill)" stroke-width="12"/>
        <text id="keyArtLabel" x="60" y="64" text-anchor="middle" fill="#C8B8FF" font-family="Oswald, sans-serif" font-weight="600" font-size="32"></text>
        <rect x="53" y="90" width="14" height="128" rx="4" fill="url(#keyFill)"/>
        <rect x="66" y="176" width="26" height="12" rx="3" fill="url(#keyFill)"/>
        <rect x="66" y="200" width="18" height="12" rx="3" fill="url(#keyFill)"/>
      </svg>
      <div class="text">
        <h1 id="foundTitle"></h1>
        <p class="lead" id="foundText"></p>
        <div class="heart-found" id="heartFound" hidden>
          <svg viewBox="-12 -12 24 20" aria-hidden="true"><path d="M0 6C-10-2-10-10-5-10C-2-10 0-8 0-6C0-8 2-10 5-10C10-10 10-2 0 6Z"/></svg>
          <span>You found a hidden heart. You’ll start every boss fight with one more.</span>
        </div>
        <div class="buttons" id="foundButtons"></div>
      </div>
    </section>`);

  const piano = Piano.create($('piano'));
  piano.setEnabled(false);

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('show', s.id === id));
    piano.setEnabled(id === 'play' && usesPiano);
  }

  function button(text, onClick, primary) {
    const b = document.createElement('button');
    b.textContent = text;
    if (primary) b.className = 'primary';
    b.onclick = onClick;
    return b;
  }

  // The game only hears the keyboard while it has focus.
  window.addEventListener('blur', () => $('focusBanner').classList.add('show'));
  window.addEventListener('focus', () => $('focusBanner').classList.remove('show'));
  $('focusBanner').onclick = () => { window.focus(); $('focusBanner').classList.remove('show'); };

  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

  Bridge.on('level', (message) => {
    key = message.key;
    testMode = message.testMode === true;
    extraHearts = Number(message.extraHearts) || 0;
    if (touchOnly) return show('phone');
    $('introEyebrow').textContent = `Level ${KEYS.indexOf(key) + 1} · Key of ${keyLabel(key)}`;
    $('introTitle').textContent = KEY_INFO[key].level;
    $('introBeaten').hidden = message.status !== 'beaten';
    show('intro');
  });

  $('startBtn').onclick = () => {
    Sound.unlock();
    window.focus();
    show('play');
    // Preview only: lets you skip a level while testing the site.
    $('skipBtn').hidden = !testMode;
    $('skipBtn').onclick = () => Level.win();
    // Preview only: whether your audio samples loaded.
    if (testMode) {
      Sound.onSamples((st) => {
        if (!st.total) return;
        const el = $('sampleStatus');
        el.hidden = false;
        el.className = 'sample-status' + (st.blocked || st.broken ? ' bad' : '');
        el.textContent = !st.done ? `Samples: loading ${st.loaded} / ${st.total}…`
          : st.blocked ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.blocked} blocked by the site (using the synth)`
          : st.broken ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.broken} not playable (check the file type)`
          : `Samples: ${st.loaded} / ${st.total} loaded`;
      });
    }
    onStart($('stage'));
    // Preview only: hear the reverb on its own, or without it.
    if (testMode && Sound.hasReverb) { // the level has just turned its reverb on
      const modes = ['normal', 'wet', 'off'], labels = { normal: 'Reverb: normal', wet: 'Reverb: 100% wet', off: 'Reverb: off' };
      let m = 0;
      $('reverbTest').hidden = false;
      $('reverbTest').onclick = (e) => { e.currentTarget.blur(); m = (m + 1) % 3; Sound.reverbTest(modes[m]); $('reverbTest').textContent = labels[modes[m]]; };
    }
  };

  Bridge.on('levelSaved', (message) => {
    const label = keyLabel(key);
    $('keyArtLabel').textContent = label;
    const buttons = $('foundButtons');
    buttons.innerHTML = '';
    $('foundTitle').textContent = message.gotKey ? `You found the key of ${label}.`
      : message.gotHeart ? 'Hidden heart found' : 'Level complete';
    if (message.gotKey) Sound.keyFound(rootMidi(key));
    $('heartFound').hidden = !message.gotHeart;
    if (message.gotHeart) Sound.chord([rootMidi(key) + 12, rootMidi(key) + 16, rootMidi(key) + 19], 1.2, 1.6, 0.35);

    // The tutorial is the only time the player is told what to do.
    if (message.firstKey) {
      $('foundText').textContent = 'You just discovered your first key. Take it to the circle of fifths to continue.';
      buttons.append(button('Go to the circle of fifths', () => Bridge.send({ type: 'navigate', to: 'circle' }), true));
    } else {
      $('foundText').textContent = message.gotKey || message.gotHeart ? '' : 'You already have this key.';
    }
    buttons.append(button('Back', () => Bridge.send({ type: 'navigate', to: 'back' }), !message.firstKey));
    show('found');
  });

  return {
    piano,
    get key() { return key; },
    // True in Wix Preview: levels may show test shortcuts.
    get testMode() { return testMode; },
    // Hidden hearts found so far: boss fights add these to the starting hearts.
    get extraHearts() { return extraHearts; },
    back() { Bridge.send({ type: 'navigate', to: 'back' }); },
    // description: the line under the title on the intro screen.
    // piano: false hides the on-screen piano for levels that don't use it.
    setup({ description, start, piano: showPiano = true }) {
      $('introText').textContent = description;
      onStart = start;
      usesPiano = showPiano;
      $('piano').hidden = !showPiano;
      Bridge.start();
    },
    // Reveals the piano partway through a level that started without it.
    showPiano() {
      usesPiano = true;
      $('piano').hidden = false;
      piano.setEnabled(true);
    },
    // win({ heart: true }) also reports finding this level's hidden heart.
    win(options = {}) {
      if (finishing) return;
      finishing = true;
      piano.setEnabled(false);
      Bridge.send({ type: 'levelComplete', heart: options.heart === true });
    },
  };
})();
</script>

  // Your special: sus4 (F♯ + B + C♯), a shockwave that clears nearby notes.

  const DRONE = 'tritone-drone';

  function stopMusic(fade = 1.2) { if (drone) drone.stop(fade); drone = null; }
  window.__drone = () => drone; // for automatic tests

  const SHARP_NAMES = ['F♯', 'G♯', 'A♯', 'B', 'C♯', 'D♯', 'E♯', 'F♯'];
  const FLAT_NAMES = ['G♭', 'A♭', 'B♭', 'C♭', 'D♭', 'E♭', 'F', 'G♭'];
  const ROOT_PC = 6, THIRD_PC = 10, FOURTH_PC = 11, FIFTH_PC = 1;

  const PHASES = [

    { from: 65, speed: 320, warn: 0.65, gap: 1.3, fifths: 0.45, labels: false, lead: 0.25, drift: 125, laserGap: 8, sweep: 1.9, reverse: 0.45, ground: 0, name: 'Flipped to G♭! Sus4 unlocked: hold A + F + G for a shockwave' },
    { from: 30, speed: 370, warn: 0.55, gap: 1.1, fifths: 0.5, labels: false, lead: 0.55, drift: 155, laserGap: 8, sweep: 1.8, reverse: 0, ground: 0, name: 'Phase 3: these lasers can’t be resolved' },
  ];
  const UNLOCKS = [[ROOT_PC, THIRD_PC, FIFTH_PC], [ROOT_PC, THIRD_PC, FIFTH_PC, FOURTH_PC], [ROOT_PC, THIRD_PC, FIFTH_PC, FOURTH_PC]];
  const CHORD_WINDOW = 0.09;

  const nameOf = (midi) => {
    const i = SCALE.findIndex((m) => m % 12 === midi % 12);
    return i >= 0 ? (S && S.flipped ? FLAT_NAMES : SHARP_NAMES)[i] : Piano.noteName(midi);
  };

  Level.setup({
    description: 'The devil’s interval. It never resolves, so you’ll have to make it.',
    start(stage) {
      stage.innerHTML = `
        <div class="arena">
          <canvas id="arena" width="${W}" height="${H}"></canvas>
          <div class="overlay show" id="howTo">
            <h2>The Tritone</h2>
            <div class="how">
              <span><kbd>←</kbd> <kbd>→</kbd> <kbd>Space</kbd></span><span>Move and dash (dash through lasers)</span>
              <span><kbd>A</kbd> <kbd>D</kbd> <kbd>G</kbd></span><span>F♯ major: single notes, A + G power shot, A + D + G triad</span>
              <span><kbd>A</kbd> + <kbd>D</kbd></span><span>Resolve a violet laser while it charges or sweeps</span>
              <span>Sus4</span><span>Unlocks in phase 2: A + F + G, a shockwave that clears notes near you</span>
              <span>Hearts and volume</span><span>Hits take hearts; spamming makes you clip</span>
            </div>
            <div class="buttons"><button class="primary" id="fightBtn">Fight</button></div>
          </div>
          <div class="overlay" id="endCard">
            <h2 id="endTitle"></h2>
            <p id="endText"></p>
            <div class="buttons" id="endButtons"></div>
            <p class="hint" id="endHint" hidden></p>
          </div>
        </div>`;
      Sound.preload(['tritone', DRONE, 'red-charge', 'red-hit', 'red-beam', 'violet-charge', 'violet-hit', 'violet-beam']);
      Sound.reverb({ mix: 0.32, seconds: 2.2, piano: 1.7, instruments: 1 }); // as in Feedback
      canvas = stage.querySelector('#arena');
      ctx = canvas.getContext('2d');
      ui = {
        howTo: stage.querySelector('#howTo'), end: stage.querySelector('#endCard'),
        endTitle: stage.querySelector('#endTitle'), endText: stage.querySelector('#endText'),
        endButtons: stage.querySelector('#endButtons'), endHint: stage.querySelector('#endHint'),
      };
      Level.piano.useScale(ROOT);
      Level.piano.setNames(SHARP_NAMES);
      Level.piano.setAllowed(UNLOCKS[0]);
      stage.querySelector('#fightBtn').onclick = (e) => { e.currentTarget.blur(); ui.howTo.classList.remove('show'); begin(); };
      newState();
      requestAnimationFrame(loop);
    },
  });

  // ---------- State ----------
  function newState() {
    const hearts = HEARTS + Level.extraHearts;
    S = {
      phase: 0, running: false, over: false, time: 0, flipped: false,
      boss: { x: W / 2, y: 82, hp: 100, target: W / 2, stun: 0, flash: 0, warn: 0 },
      player: { x: W / 2, y: H - 34, dash: 0, dashCool: 0, safe: 0, shield: 0, dir: 0, stun: 0 },
      meter: 0, shake: 0, shotGap: 0, warnedClip: false, pending: null, sus4Cool: 0,
      hearts, maxHearts: hearts, hurtFlash: 0, heartPop: 0,
      unlocked: new Set(UNLOCKS[0]),
      shots: [], notes: [], warnings: [], pickups: [], sparks: [], texts: [], lasers: [], waves: [], rings: [],
      attackIn: 1.2, laserIn: 4, groundIn: 99, pickupIn: 9, transition: null, firstLaser: true,
      banner: null,
    };
    window.__boss = S; // for automatic tests
  }

  function begin() {
    if (S) S.lasers.forEach(endLaser); // nothing carries over into a new fight
    newState();
    S.running = true;
    startMusic();
    ui.end.classList.remove('show');
    Level.piano.setNames(SHARP_NAMES);
    Level.piano.setEnabled(true);
    Level.piano.setAllowed([...S.unlocked]);
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') {
      e.preventDefault();
      keys[e.code] = true;
      if (e.code === 'Space' && !e.repeat) dash();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('blur', () => { paused = true; keys = {}; });
  window.addEventListener('focus', () => { paused = false; last = performance.now(); });

  function dash() {
    const p = S && S.player;
    if (!p || !S.running || p.dashCool > 0 || p.stun > 0) return;
    p.dash = 0.18;
    p.dashCool = 0.9;
    p.safe = Math.max(p.safe, 0.3); // the untouchable moment that lets you cross a laser
    p.dashDir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0) || p.dir || 1;
    Sound.whoosh();
  }

  Level.piano.onNoteOn((midi) => {
    if (!S || !S.running || S.player.stun > 0) return;
    const pc = midi % 12;
    if (!S.unlocked.has(pc)) return;
    if (!S.pending) S.pending = { notes: new Map(), t: CHORD_WINDOW };
    S.pending.notes.set(pc, midi);
  });

  function release(notes) {
    const has = (pc) => notes.has(pc);
    const p = S.player;
    // Resolving a violet laser: A♯ + F♯ together (no C♯).
    if (has(ROOT_PC) && has(THIRD_PC) && !has(FIFTH_PC) && S.lasers.some((l) => l.cancellable)) return resolveLasers();
    // Sus4: F♯ + B + C♯.
    if (S.unlocked.has(FOURTH_PC) && has(ROOT_PC) && has(FOURTH_PC) && has(FIFTH_PC)) return sus4();
    if (S.shotGap > 0) return;
    let kind = 'single';
    if (has(ROOT_PC) && has(THIRD_PC) && has(FIFTH_PC)) kind = 'triad';
    else if (has(ROOT_PC) && has(FIFTH_PC)) kind = 'power';
    const a = ATTACKS[kind];
    const shot = (midi, angle, extra = {}) => S.shots.push({
      x: p.x, y: p.y - 22, vx: Math.sin(angle) * a.speed, vy: -Math.cos(angle) * a.speed,
      midi, pcs: [midi % 12], kind, damage: a.damage, refund: a.refund, ...extra,
    });
    let cost = a.cost;
    if (kind === 'power') shot(notes.get(ROOT_PC), 0, { pcs: [ROOT_PC, FIFTH_PC], label: `${nameOf(ROOT)}+${nameOf(ROOT + 7)}` });
    else if (kind === 'triad') [[ROOT_PC, -0.2], [THIRD_PC, 0], [FIFTH_PC, 0.2]].forEach(([pc, angle]) => shot(notes.get(pc), angle));
    else { cost = a.cost * notes.size; notes.forEach((midi) => shot(midi, 0)); }
    S.shotGap = SHOT_GAP;
    addVolume(cost);
  }

  function addVolume(amount) {
    S.meter = Math.min(100, S.meter + amount);
    if (S.meter >= 60 && !S.warnedClip) { S.warnedClip = true; playerText('Too much noise! Slow down.', 1.6); }
    if (S.meter >= 100) clip();
  }

  // Sus4 shockwave: clears every note and ground wave within reach. Not lasers.
  function sus4() {
    if (S.sus4Cool > 0) return playerText('Sus4 is recharging.', 1);
    const p = S.player;
    S.sus4Cool = SUS4.cooldown;
    S.rings.push({ x: p.x, y: p.y - 8, r: 10, t: 0.4 });
    let cleared = 0;
    for (const n of S.notes) if (Math.hypot(n.x - p.x, n.y - p.y) < SUS4.radius) { n.gone = true; cleared++; spark(n.x, n.y, '#E2D9FF'); }
    for (const w of S.waves) if (Math.abs(w.x - p.x) < SUS4.radius) { w.gone = true; cleared++; }
    Sound.chord([ROOT, ROOT + 5, ROOT + 7], 0, 0.9, 0.5);
    Sound.whoosh();
    playerText(cleared ? `Sus4! Cleared ${cleared}` : 'Sus4!', 1.1);
    addVolume(SUS4.cost);
  }

  // ---------- Boss attacks ----------
  function aimX() {
    const p = S.player, ph = PHASES[S.phase];
    return Math.min(W - 20, Math.max(20, p.x + p.dir * 300 * ph.lead));
  }
  const mirror = () => (S.flipped ? -1 : 1); // after the flip, patterns run the other way

  function attack() {
    const ph = PHASES[S.phase];
    const tx = aimX();
    if (Math.random() < ph.fifths) S.warnings.push({ t: ph.warn + 0.1, total: ph.warn + 0.1, tx, kind: 'fifth', notes: pick(FIFTHS) });
    else S.warnings.push({ t: ph.warn, total: ph.warn, tx, kind: 'note', midi: pick(SCALE.slice(0, 7)) });
  }

  function fire(w) {
    const ph = PHASES[S.phase];
    const ox = S.boss.x, oy = S.boss.y + MUZZLE;
    const base = Math.atan2(S.player.y - oy, w.tx - ox);
    const launch = (notes, kind, speed) => S.notes.push({
      x: ox, y: oy, vx: Math.cos(base) * speed, vy: Math.sin(base) * speed,
      midi: notes[0], pcs: notes.map((m) => m % 12), notes, kind, label: ph.labels,
    });
    if (w.kind === 'note') { launch([w.midi], 'note', ph.speed * NOTE_SPEED); BOSS.note(w.midi, 0, 0.45, 0.4); return; }
    // A perfect fifth: two notes as one bigger, faster shot.
    launch(w.notes, 'fifth', ph.speed * FIFTH_SPEED);
    BOSS.chord(w.notes, 0, 0.5, 0.5);
  }

  // Lasers: a warning line, then a sweep from one angle to another.
  function laserAngle(x) { return Math.atan2(S.player.y - (S.boss.y + MUZZLE), x - S.boss.x); }
  function startLasers() {
    const ph = PHASES[S.phase], p = S.player;
    // e counts up from 0: the first LASER_WARN seconds are the preview, then
    // the live beam carries on along the same path at the same speed.
    const make = (fromX, toX, cancellable, reverse, silent) => ({
      stage: 'warn', e: 0, dur: ph.sweep, a0: laserAngle(fromX), a1: laserAngle(toX), cancellable, reverse,
      sound: silent ? [] : [Sound.laser(cancellable ? 'violet' : 'red', ROOT, cancellable ? 0.09 : 0.12)], // F♯ + C: the tritone
    });
    if (S.phase === 2) {
      // Red double lasers closing in from both sides: dash through one.
      S.lasers.push(make(20, p.x + 30, false, false), make(W - 20, p.x - 30, false, false, true)); // one sound for the pair
    } else {
      const dir = (Math.random() < 0.5 ? 1 : -1) * mirror();
      const from = Math.min(W - 20, Math.max(20, p.x - dir * 280));
      const to = Math.min(W - 20, Math.max(20, p.x + dir * 280));
      S.lasers.push(make(from, to, true, Math.random() < ph.reverse));
    }
    if (S.firstLaser) {
      S.firstLaser = false;
      S.banner = { text: 'A tritone is charging. Resolve it with A + D, or dash through!', t: 2.8 };
    }
  }

  function endLaser(l) {
    l.gone = true;
    l.sound.forEach((s) => s.stop());
  }

  function resolveLasers() {
    const p = S.player;
    for (const l of S.lasers) {
      if (!l.cancellable || l.gone) continue;
      endLaser(l);
      const a = l.a ?? l.a0;
      for (let i = 0; i < 14; i++) spark(S.boss.x + Math.cos(a) * i * 24, S.boss.y + MUZZLE + Math.sin(a) * i * 24, '#C8B8FF');
      damage(RESOLVE_DAMAGE);
    }
    Sound.chord([ROOT + 4, ROOT + 12], 0, 1.2, 0.5); // A♯ + F♯: resolved
    playerText('Resolved!', 1.1);
  }

  // Power chords: a warning on the floor, then waves rolling out both ways.
  // Switched off for The Tritone (ground: 0 in every phase); kept for the Final Boss.
  function startGround() {
    const x = Math.min(W - 60, Math.max(60, aimX()));
    S.warnings.push({ t: 0.9, total: 0.9, kind: 'ground', x });
  }
  function slam(w) {
    S.waves.push({ x: w.x, dir: -1 }, { x: w.x, dir: 1 });
    Sound.chord([ROOT - 12, ROOT - 5], 0, 0.7, 0.55);
    Sound.hit();
    S.shake = Math.max(S.shake, 0.25);
  }

  // ---------- Damage ----------
  function damage(amount) {
    const b = S.boss;
    if (S.transition) return;
    b.hp = Math.max(0, b.hp - amount / BOSS_HEALTH);
    b.flash = 0.15;
    Sound.hit();
    if (b.hp <= 0) return win();
    const next = PHASES.findIndex((ph, i) => i > S.phase && b.hp <= ph.from);
    if (next > S.phase) startTransition(next);
  }

  function startTransition(next) {
    S.phase = next;
    S.transition = { t: TRANSITION, next };
    S.warnings = [];
    S.lasers.forEach(endLaser);
    for (const n of S.notes) for (let i = 0; i < 3; i++) spark(n.x, n.y, '#8fc4ff');
    S.notes = [];
    S.waves = [];
    S.banner = null;
    Sound.chord([ROOT - 12, ROOT - 6], 0, TRANSITION, 0.25);
  }

  function endTransition() {
    const next = S.transition.next;
    S.transition = null;
    S.banner = { text: PHASES[next].name, t: 3 };
    if (next === 1) {
      // The flip: same notes, spelled in G♭.
      S.flipped = true;
      Level.piano.setNames(FLAT_NAMES);
    }
    UNLOCKS[next].forEach((pc) => S.unlocked.add(pc));
    Level.piano.setAllowed([...S.unlocked]);
    S.attackIn = 1;
    S.laserIn = 3;
    S.groundIn = PHASES[next].ground ? 4 : 99;
  }

  function hurt() {
    const p = S.player;
    if (p.safe > 0) return;
    if (p.shield > 0) { Sound.block(); spark(p.x, p.y - 10, '#E2D9FF'); return; }
    S.hearts -= 1;
    p.safe = 1.1;
    S.shake = 0.4;
    S.hurtFlash = 0.5;
    S.heartPop = 0.6;
    Sound.squeal();
    for (let i = 0; i < 14; i++) spark(p.x, p.y - 8, '#ff5d7a');
    if (S.hearts <= 0) lose();
  }

  function clip() {
    const p = S.player;
    p.stun = CLIP_STUN;
    p.dash = 0;
    S.meter = CLIP_RESET;
    S.pending = null;
    S.shake = 0.35;
    S.banner = { text: 'You clipped!', t: 1.8, big: true };
    Sound.squeal();
    Level.piano.setEnabled(false);
    setTimeout(() => { if (S && S.running && S.player === p) Level.piano.setEnabled(true); }, CLIP_STUN * 1000);
  }

  function playerText(text, t = 1.4) {
    S.texts = S.texts.filter((x) => !x.player);
    S.texts.push({ x: S.player.x, y: S.player.y - 46, text, t, player: true });
  }

  function spark(x, y, color) {
    const a = rand(0, Math.PI * 2), v = rand(60, 220);
    S.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.3, 0.7), color });
  }

  // ---------- Endings ----------
  function finish(title, text, buttons, hint) {
    S.running = false;
    stopMusic();
    S.lasers.forEach(endLaser);
    Level.piano.setEnabled(false);
    ui.endTitle.textContent = title;
    ui.endText.textContent = text;
    ui.endButtons.innerHTML = '';
    buttons.forEach(([label, fn, primary]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (primary) b.className = 'primary';
      b.onclick = fn;
      ui.endButtons.append(b);
    });
    ui.endHint.hidden = !hint;
    ui.endHint.textContent = hint || '';
    ui.end.classList.add('show');
  }

  function lose() {
    // Players who haven't found both hidden hearts get a nudge.
    const hint = Level.extraHearts < 2 ? 'Hint: you can find extra hearts by exploring the levels.' : '';
    finish('Out of hearts', 'The tritone wins this time. The fight starts again from the top.', [
      ['Try again', () => begin(), true],
    ], hint);
  }

  function win() {
    stopMusic(2);
    S.over = true;
    S.running = false;
    S.lasers.forEach(endLaser);
    S.notes = []; S.warnings = []; S.waves = [];
    for (let i = 0; i < 40; i++) spark(S.boss.x, S.boss.y + 20, i % 2 ? '#C8B8FF' : '#9A7FE0');
    // The tritone finally resolves: C ♯ dominant to F♯ major.
    Sound.chord([49, 61, 65, 68], 0.1, 1, 0.5);
    Sound.chord([42, 54, 58, 61, 66], 1.1, 2.6, 0.6);
    setTimeout(() => finish('Resolved', 'The tritone finally resolves. F♯ major, at last.', []), 1200);
    setTimeout(() => Level.win(), 2900);
  }

  // ---------- Game loop ----------
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    if (S && S.running && !paused) update(dt);
    if (S) draw();
  }

  function distanceToBeam(l, x, y) {
    const ox = S.boss.x, oy = S.boss.y + MUZZLE;
    const dx = Math.cos(l.a), dy = Math.sin(l.a);
    const px = x - ox, py = y - oy;
    if (px * dx + py * dy < 0) return Infinity;
    return Math.abs(px * dy - py * dx);
  }

  function update(dt) {
    const ph = PHASES[S.phase];
    const b = S.boss, p = S.player;
    S.time += dt;

    p.stun = Math.max(0, p.stun - dt);
    p.dir = p.stun > 0 ? 0 : (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    const speed = p.dash > 0 ? 1300 : 380;
    const dir = p.dash > 0 ? p.dashDir : p.dir;
    p.x = Math.min(W - 24, Math.max(24, p.x + dir * speed * dt));
    p.dash = Math.max(0, p.dash - dt);
    p.dashCool = Math.max(0, p.dashCool - dt);
    p.safe = Math.max(0, p.safe - dt);
    p.shield = Math.max(0, p.shield - dt);
    S.sus4Cool = Math.max(0, S.sus4Cool - dt);

    // The boss drifts (the other way after the flip); in phase 3 it follows you.
    if (Math.abs(b.target - b.x) < 4 || Math.random() < dt * 0.5) b.target = rand(110, W - 110);
    if (S.phase === 2) b.target = b.target * 0.98 + p.x * 0.02;
    const holding = S.lasers.length > 0; // it holds still while a laser sweeps
    if (b.stun <= 0 && !holding) b.x += Math.sign(b.target - b.x) * Math.min(Math.abs(b.target - b.x), ph.drift * dt);
    b.stun = Math.max(0, b.stun - dt);
    b.flash = Math.max(0, b.flash - dt);

    if (S.transition) {
      S.transition.t -= dt;
      if (S.transition.t <= 0) endTransition();
    }
    if (!S.transition) {
      S.attackIn -= dt * (holding ? 0.4 : 1);
      if (S.attackIn <= 0) { attack(); S.attackIn = ph.gap * rand(0.85, 1.15); }
      S.laserIn -= dt;
      if (S.laserIn <= 0 && !holding) { startLasers(); S.laserIn = ph.laserGap * rand(0.85, 1.15); }
      S.groundIn -= dt;
      if (S.groundIn <= 0 && !holding) { startGround(); S.groundIn = ph.ground * rand(0.85, 1.15); }
    }
    S.pickupIn -= dt;
    if (S.pickupIn <= 0) { S.pickups.push({ x: rand(60, W - 60), y: -20 }); S.pickupIn = rand(12, 16); }

    // Chords pressed together fire together.
    S.shotGap = Math.max(0, S.shotGap - dt);
    if (S.pending) {
      S.pending.t -= dt;
      if (S.pending.t <= 0) { const notes = S.pending.notes; S.pending = null; release(notes); if (!S.running) return; }
    }

    // Warnings, then attacks
    S.warnings.forEach((w) => {
      w.t -= dt;
      if (TRACK.on && AIMED.includes(w.kind)) {
        if (w.miss === undefined) w.miss = rand(-TRACK.miss, TRACK.miss);
        const want = aimX() + w.miss - w.tx;
        const step = want * (1 - Math.exp(-TRACK.follow * dt));
        w.tx += Math.sign(step) * Math.min(Math.abs(step), TRACK.maxSpeed * dt);
      }
    });
    S.warnings.filter((w) => w.t <= 0).forEach((w) => (w.kind === 'ground' ? slam(w) : fire(w)));
    S.warnings = S.warnings.filter((w) => w.t > 0);
    b.warn = S.warnings.some((w) => w.kind !== 'ground') || S.lasers.length ? 1 - Math.min(...S.warnings.map((w) => w.t / w.total), 1) : 0;

    // Lasers: one continuous movement. It starts as a faint preview line,
    // already moving, then turns live and carries on from that point at the
    // same speed. k < 0 is the preview, 0 to 1 the live sweep (a0 to a1).
    for (const l of S.lasers) {
      if (l.gone) continue; // resolved or cleared earlier this frame
      l.e += dt;
      const k = (l.e - LASER_WARN) / l.dur;
      const along = l.reverse ? (k < 0.5 ? k * 2 : (1 - k) * 2) : k; // some sweeps turn back halfway
      l.a = l.a0 + (l.a1 - l.a0) * along;
      if (k >= 0 && l.stage === 'warn') l.sound.forEach((v) => v.live && v.live()); // the beam goes live
      l.stage = k < 0 ? 'warn' : 'sweep';
      if (k >= 1) { endLaser(l); continue; }
      if (l.stage === 'warn') continue;
      if (distanceToBeam(l, p.x, p.y - 6) < LASER_WIDTH) { hurt(); if (!S.running) return; }
    }
    S.lasers = S.lasers.filter((l) => !l.gone);

    // Ground waves roll along the floor
    for (const w of S.waves) {
      w.x += w.dir * 300 * dt;
      if (!w.gone && Math.abs(w.x - p.x) < 16) { w.gone = true; hurt(); if (!S.running) return; }
    }
    S.waves = S.waves.filter((w) => !w.gone && w.x > -20 && w.x < W + 20);

    S.notes.forEach((n) => { n.x += n.vx * dt; n.y += n.vy * dt; });
    S.shots.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; });
    S.pickups.forEach((k) => { k.y += 70 * dt; });
    S.sparks.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; });
    S.texts.forEach((t) => { t.y -= 30 * dt; t.t -= dt; });
    S.rings.forEach((r) => { r.t -= dt; r.r += (SUS4.radius / 0.4) * dt; });
    S.meter = Math.max(0, S.meter - 6 * dt);
    S.shake = Math.max(0, S.shake - dt);
    S.hurtFlash = Math.max(0, S.hurtFlash - dt);
    S.heartPop = Math.max(0, S.heartPop - dt);
    if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }

    for (const s of S.shots) {
      for (const n of S.notes) {
        const hitSize = (s.kind === 'power' ? 34 : 26) + (n.kind === 'fifth' ? 6 : 0);
        if (!n.gone && !s.gone && (n.pcs || [n.pc]).some((pc) => s.pcs.includes(pc)) && Math.hypot(n.x - s.x, n.y - s.y) < hitSize) {
          n.gone = s.gone = true;
          for (let i = 0; i < 8; i++) spark(n.x, n.y, '#C8B8FF');
          Sound.note(n.midi + 12, 0, 0.25, 0.18);
          S.meter = Math.max(0, S.meter - s.refund);
          damage(CANCEL_DAMAGE);
          if (!S.running) return;
        }
      }
      if (!s.gone && Math.abs(s.x - b.x) < 70 * BOSS_SIZE && s.y < b.y + 50 * BOSS_SIZE && s.y > b.y - 50 * BOSS_SIZE) {
        s.gone = true;
        damage(s.damage);
        spark(s.x, b.y + 30, '#9A7FE0');
        if (!S.running) return;
      }
    }

    for (const n of S.notes) {
      if (!n.gone && Math.hypot(n.x - p.x, n.y - (p.y - 6)) < (n.kind === 'fifth' ? 26 : 22)) { n.gone = true; hurt(); if (!S.running) return; }
    }
    for (const k of S.pickups) {
      if (!k.gone && Math.abs(k.x - p.x) < 30 && Math.abs(k.y - p.y) < 30) {
        k.gone = true;
        p.shield = 5;
        Sound.note(ROOT + 24, 0, 0.6, 0.25);
        playerText('Ear defenders!', 1.2);
      }
    }

    S.notes = S.notes.filter((n) => !n.gone && n.y < H + 20 && n.x > -20 && n.x < W + 20);
    S.shots = S.shots.filter((s) => !s.gone && s.y > -20 && s.x > -20 && s.x < W + 20);
    S.pickups = S.pickups.filter((k) => !k.gone && k.y < H + 20);
    S.sparks = S.sparks.filter((s) => s.t > 0);
    S.texts = S.texts.filter((t) => t.t > 0);
    S.rings = S.rings.filter((r) => r.t > 0);
  }

  // ---------- Drawing ----------
  function draw() {
    const b = S.boss, p = S.player;
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (S.shake > 0) ctx.translate(rand(-4, 4) * S.shake * 3, rand(-3, 3) * S.shake * 3);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, S.flipped ? '#1c1712' : '#16141c'); bg.addColorStop(1, '#0f0e13');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = S.flipped ? 'rgba(233, 184, 114, 0.14)' : 'rgba(94, 62, 132, 0.18)'; ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + (i - 4.5) * 40, H * 0.55); ctx.lineTo(W / 2 + (i - 4.5) * 150, H); ctx.stroke(); }

    // Note and chord warnings (dashed aim lines) and floor warnings
    for (const w of S.warnings) {
      const k = 1 - w.t / w.total;
      if (w.kind === 'ground') {
        ctx.fillStyle = `rgba(255, 93, 122, ${0.15 + 0.35 * k})`;
        ctx.fillRect(w.x - 40, H - 14, 80, 6);
        continue;
      }
      ctx.setLineDash([6, 8]);
      ctx.strokeStyle = `rgba(200, 184, 255, ${0.15 + k * 0.45})`;
      ctx.lineWidth = 2;
      const ox = b.x, oy = b.y + MUZZLE;
      const base = Math.atan2(p.y - oy, w.tx - ox);
      if (w.kind === 'fifth') ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + Math.cos(base) * 420, oy + Math.sin(base) * 420); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Lasers: a semi-transparent line while warning, then the beam
    for (const l of S.lasers) {
      const ox = b.x, oy = b.y + MUZZLE;
      const a = l.a ?? l.a0;
      const ex = ox + Math.cos(a) * 900, ey = oy + Math.sin(a) * 900;
      const color = l.cancellable ? '200, 184, 255' : '255, 70, 100';
      if (l.stage === 'warn') {
        const k = Math.min(1, l.e / LASER_WARN);
        ctx.strokeStyle = `rgba(${color}, ${0.15 + 0.25 * k})`;
        ctx.lineWidth = 6 + 10 * k;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
        continue;
      }
      ctx.shadowColor = `rgb(${color})`; ctx.shadowBlur = 24;
      ctx.strokeStyle = `rgba(${color}, 0.55)`; ctx.lineWidth = 16;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    drawBoss(b);

    for (const w of S.waves) {
      ctx.fillStyle = 'rgba(255, 93, 122, 0.85)'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(w.x - 12, H - 8); ctx.quadraticCurveTo(w.x, H - 46, w.x + 12, H - 8); ctx.fill();
      ctx.shadowBlur = 0;
    }

    for (const n of S.notes) {
      const fifth = n.kind === 'fifth';
      const color = !fifth ? '#8fc4ff' : S.flipped ? '#E9B872' : '#C8B8FF';
      ctx.shadowColor = color; ctx.shadowBlur = fifth ? 22 : 14; ctx.fillStyle = color;
      if (fifth) { roundRect(n.x - 22, n.y - 11, 44, 22, 11); ctx.fill(); } // a wide capsule, like your power shot
      else { ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI * 2); ctx.fill(); }
      ctx.shadowBlur = 0;
      if (n.label) {
        ctx.fillStyle = '#181818'; ctx.font = '600 10px Oswald, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText((n.notes || [n.midi]).map(nameOf).join('+'), n.x, n.y + 4);
      }
    }

    for (const s of S.shots) {
      const power = s.kind === 'power';
      const color = power ? '#E2D9FF' : s.kind === 'triad' ? '#C8B8FF' : '#9A7FE0';
      const w = power ? 50 : 24, h = power ? 24 : 18;
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = power ? 22 : 10;
      roundRect(s.x - w / 2, s.y - h / 2, w, h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#181818'; ctx.font = `600 ${power ? 12 : 11}px Oswald, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(s.label || nameOf(s.midi), s.x, s.y + 4);
    }

    for (const r of S.rings) {
      ctx.strokeStyle = `rgba(226, 217, 255, ${r.t / 0.4})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }

    for (const k of S.pickups) drawHeadphones(k.x, k.y, 0.7, '#E2D9FF', true);
    drawPlayer(p);

    for (const s of S.sparks) { ctx.globalAlpha = Math.max(0, s.t * 1.6); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, t.t * 2);
      ctx.fillStyle = '#C8B8FF'; ctx.font = '600 16px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawDistortion();
    drawHurt();
    drawTransition();
    drawHud();
  }

  // The Tritone: a crystal core with its two notes, F♯ and C, orbiting it.
  function drawBoss(b) {
    const glow = S.transition ? 0.6 + 0.4 * Math.sin(S.time * 14) : b.warn;
    const main = S.flipped ? '#E9B872' : '#9A7FE0';
    const pale = S.flipped ? '#fff1d6' : '#E2D9FF';
    ctx.save();
    ctx.translate(b.x + (b.stun > 0 ? Math.sin(S.time * 30) * 3 : 0), b.y);
    ctx.scale(BOSS_SIZE, BOSS_SIZE);
    // Crackle between the two orbiting notes
    const spin = S.time * (S.flipped ? -1.6 : 1.6);
    const o1 = [Math.cos(spin) * 78, Math.sin(spin) * 26], o2 = [-o1[0], -o1[1]];
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + glow * 0.5})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(o1[0], o1[1]);
    for (let i = 1; i < 8; i++) {
      const t = i / 8;
      ctx.lineTo(o1[0] + (o2[0] - o1[0]) * t + rand(-6, 6), o1[1] + (o2[1] - o1[1]) * t + rand(-6, 6));
    }
    ctx.lineTo(o2[0], o2[1]); ctx.stroke();
    // Core: a diamond, brighter as it charges
    ctx.fillStyle = b.flash > 0 ? pale : '#26232d';
    ctx.strokeStyle = main; ctx.lineWidth = 3;
    ctx.shadowColor = main; ctx.shadowBlur = 12 + glow * 30;
    ctx.beginPath(); ctx.moveTo(0, -52); ctx.lineTo(42, 0); ctx.lineTo(0, 52); ctx.lineTo(-42, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = main;
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(18, 0); ctx.lineTo(0, 22); ctx.lineTo(-18, 0); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    // The two notes of the tritone
    for (const [o, label] of [[o1, S.flipped ? 'G♭' : 'F♯'], [o2, 'C']]) {
      ctx.fillStyle = pale; ctx.shadowColor = main; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(o[0], o[1], 17, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#181818'; ctx.font = '600 16px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, o[0], o[1] + 6);
    }
    if (b.stun > 0) { ctx.fillStyle = pale; ctx.font = '600 16px Oswald, sans-serif'; ctx.fillText('STUNNED', 0, -64); }
    ctx.restore();
  }

  function drawPlayer(p) {
    const blink = p.safe > 0 && Math.floor(S.time * 20) % 2 === 0;
    if (blink) return;
    if (p.shield > 0) {
      ctx.strokeStyle = `rgba(226, 217, 255, ${0.4 + 0.3 * Math.sin(S.time * 10)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y - 6, 30, 0, Math.PI * 2); ctx.stroke();
    }
    // Sus4 cooldown: a ring that fills back up
    if (S.unlocked.has(FOURTH_PC)) {
      const ready = S.sus4Cool <= 0;
      ctx.strokeStyle = ready ? 'rgba(226, 217, 255, 0.7)' : 'rgba(154, 147, 163, 0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y - 6, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - S.sus4Cool / SUS4.cooldown)); ctx.stroke();
    }
    drawHeadphones(p.x, p.y - 4, 1, p.stun > 0 ? '#5d5866' : p.shield > 0 ? '#E2D9FF' : '#9A7FE0', p.shield > 0);
  }

  function drawTransition() {
    if (!S.transition) return;
    const k = 1 - S.transition.t / TRANSITION;
    ctx.globalAlpha = Math.min(1, (TRANSITION - S.transition.t) * 3, S.transition.t * 3);
    ctx.fillStyle = 'rgba(12, 11, 16, 0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#E6E1EC'; ctx.font = '600 40px Oswald, sans-serif';
    ctx.fillText(`PHASE ${S.transition.next + 1} COMMENCING`, W / 2, H / 2 - 8);
    ctx.fillStyle = '#9A93A3'; ctx.font = '500 12px Oswald, sans-serif';
    ctx.fillText(S.transition.next === 1 ? 'BOSS UPGRADING · RESPELLING IN G♭' : 'BOSS UPGRADING', W / 2, H / 2 + 22);
    ctx.fillStyle = '#26232d'; roundRect(W / 2 - 160, H / 2 + 34, 320, 10, 5); ctx.fill();
    const bar = ctx.createLinearGradient(W / 2 - 160, 0, W / 2 + 160, 0);
    bar.addColorStop(0, '#5E3E84'); bar.addColorStop(1, '#ff5d7a');
    ctx.fillStyle = bar; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 12;
    roundRect(W / 2 - 160, H / 2 + 34, 320 * k, 10, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    const b = S.boss;
    ctx.textAlign = 'left'; ctx.font = '600 14px Oswald, sans-serif';
    ctx.fillStyle = '#E6E1EC'; ctx.fillText('THE TRITONE', 16, 24);
    ctx.fillStyle = '#26232d'; roundRect(116, 13, 260, 12, 6); ctx.fill();
    ctx.fillStyle = S.flipped ? '#E9B872' : '#9A7FE0'; roundRect(116, 13, 260 * (b.hp / 100), 12, 6); ctx.fill();
    ctx.textAlign = 'right'; ctx.fillStyle = '#E6E1EC';
    ctx.fillText('VOLUME', W - 236, 24);
    ctx.fillStyle = '#26232d'; roundRect(W - 216, 13, 200, 12, 6); ctx.fill();
    const meter = ctx.createLinearGradient(W - 216, 0, W - 16, 0);
    meter.addColorStop(0, '#9A7FE0'); meter.addColorStop(0.7, '#c46a7a'); meter.addColorStop(1, '#ff5d7a');
    ctx.fillStyle = meter; roundRect(W - 216, 13, 200 * (S.meter / 100), 12, 6); ctx.fill();
    if (S.player.shield > 0) {
      ctx.fillStyle = '#E2D9FF'; ctx.font = '500 12px Oswald, sans-serif';
      ctx.fillText(`EAR DEFENDERS ${Math.ceil(S.player.shield)}`, W - 16, 42);
    }
    for (let i = 0; i < S.maxHearts; i++) {
      const lost = i === S.hearts && S.heartPop > 0;
      drawHeart(28 + i * 30, H - 22, lost ? 22 + 14 * (S.heartPop / 0.6) : 22, i < S.hearts || (lost && Math.floor(S.time * 16) % 2 === 0));
    }
    const moves = [['A+G', true], ['A+D+G', true], ['A+D resolve', true], ['A+F+G sus4', S.unlocked.has(FOURTH_PC)]];
    ctx.textAlign = 'right'; ctx.font = '600 12px Oswald, sans-serif';
    let mx = W - 16;
    for (const [label, on] of moves.reverse()) {
      const text = on ? label : `${label} (locked)`;
      ctx.fillStyle = on ? '#C8B8FF' : 'rgba(154, 147, 163, 0.35)';
      ctx.fillText(text, mx, H - 14);
      mx -= ctx.measureText(text).width + 16;
    }
    ctx.fillStyle = '#9A93A3'; ctx.fillText('MOVES', mx, H - 14);
    if (S.banner && S.running) {
      ctx.globalAlpha = Math.min(1, S.banner.t * 1.5);
      ctx.textAlign = 'center';
      ctx.font = S.banner.big ? '600 44px Oswald, sans-serif' : '600 24px Oswald, sans-serif';
      ctx.fillStyle = S.banner.big ? '#ff5d7a' : '#C8B8FF';
      ctx.fillText(S.banner.text, W / 2, H / 2 + 48);
      ctx.globalAlpha = 1;
    }
    if (paused && S.running) {
      ctx.textAlign = 'center'; ctx.font = '600 20px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText('Paused: click the game to carry on', W / 2, H / 2 + 90);
    }
  }

  // ---------- Shared drawing helpers (same as Feedback) ----------
  // Loudness you can see: past 40% the edges glitch and glow, stronger as the
  // meter rises; while clipped, the whole screen breaks up.
  function drawDistortion() {
    const clipped = S.player.stun > 0;
    // Rises quickly at first so it's noticeable early: 65% already shows clearly.
    const level = clipped ? 1 : Math.pow(Math.max(0, (S.meter - 40) / 60), 0.6);
    if (level <= 0) return;
    const pulse = S.meter > 85 || clipped ? 0.75 + 0.25 * Math.sin(S.time * 18) : 1;

    // Torn strips: copy slices of the picture back slightly out of place.
    const strips = clipped ? 14 : Math.round(2 + level * 6);
    for (let i = 0; i < strips; i++) {
      const h = rand(3, clipped ? 26 : 10);
      const y = clipped ? rand(0, H - h) : (Math.random() < 0.5 ? rand(0, 60 * level) : rand(H - 60 * level, H - h));
      const dx = rand(-1, 1) * (clipped ? 36 : 14 * level);
      ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
    }
    if (!clipped) {
      for (let i = 0; i < strips; i++) {
        const w = rand(3, 8 + 24 * level), y = rand(0, H);
        const x = Math.random() < 0.5 ? rand(0, 50 * level) : rand(W - 50 * level, W - w);
        ctx.drawImage(canvas, x, y, w, 40, x + rand(-6, 6) * level, y + rand(-8, 8) * level, w, 40);
      }
    }

    // Glow creeping in from the edges: violet static, turning pink just
    // before you clip (red is kept for getting hit).
    const hot = clipped ? 1 : Math.max(0, (level - 0.7) / 0.3);
    const [r, g, bl] = [200 + 55 * hot, 184 - 64 * hot, 255 - 95 * hot].map(Math.round);
    const edge = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
    edge.addColorStop(0, `rgba(${r}, ${g}, ${bl}, 0)`);
    edge.addColorStop(1, `rgba(${r}, ${g}, ${bl}, ${0.7 * level * pulse})`);
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, W, H);

    // Static lines
    ctx.fillStyle = `rgba(255, 255, 255, ${0.06 + 0.12 * level})`;
    for (let i = 0; i < (clipped ? 40 : 6 + 18 * level); i++) {
      const y = rand(0, H);
      const near = clipped ? 1 : 0.18;
      const x = Math.random() < 0.5 ? rand(0, W * near) : rand(W * (1 - near), W);
      ctx.fillRect(x, y, rand(10, clipped ? 160 : 50), 1);
    }
    if (clipped) {
      // Colour split across the whole screen
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.18;
      ctx.drawImage(canvas, 6, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(255, 120, 160, ${0.1 * pulse})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Getting hit: a red flash and a red rim.
  function drawHurt() {
    if (S.hurtFlash <= 0) return;
    const k = S.hurtFlash / 0.5;
    ctx.fillStyle = `rgba(255, 40, 70, ${0.28 * k})`;
    ctx.fillRect(0, 0, W, H);
    const rim = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.6);
    rim.addColorStop(0, 'rgba(255, 40, 70, 0)');
    rim.addColorStop(1, `rgba(255, 40, 70, ${0.7 * k})`);
    ctx.fillStyle = rim;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHeart(x, y, size, full) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 20, size / 20);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-10, -2, -10, -10, -5, -10);
    ctx.bezierCurveTo(-2, -10, 0, -8, 0, -6);
    ctx.bezierCurveTo(0, -8, 2, -10, 5, -10);
    ctx.bezierCurveTo(10, -10, 10, -2, 0, 6);
    ctx.closePath();
    if (full) {
      ctx.fillStyle = '#ff5d7a'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 8;
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255, 93, 122, 0.45)'; ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHeadphones(x, y, scale, color, defenders) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.strokeStyle = color; ctx.lineWidth = defenders ? 7 : 5; ctx.lineCap = 'round';
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(0, 0, 18, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    ctx.fillStyle = color;
    roundRect(-24, -6, 12, defenders ? 22 : 18, 4); ctx.fill();
    roundRect(12, -6, 12, defenders ? 22 : 18, 4); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, Math.max(0, h), r) : ctx.rect(x, y, w, Math.max(0, h));
  }
</script>
</body>
