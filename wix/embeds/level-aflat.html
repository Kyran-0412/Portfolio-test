/* lib/keys.js */
// Facts about the 12 keys, shared by the embed boxes.
const KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

const KEY_INFO = {
  C:    { label: 'C',  minor: 'Am',  signature: 'No sharps or flats', level: 'Tutorial',           semitones: 0 },
  G:    { label: 'G',  minor: 'Em',  signature: '1 sharp',            level: 'Wrong Note',         semitones: 7 },
  D:    { label: 'D',  minor: 'Bm',  signature: '2 sharps',           level: 'Key Signature Lock', semitones: 2 },
  A:    { label: 'A',  minor: 'F♯m', signature: '3 sharps',           level: 'Feedback',           semitones: 9 },
  E:    { label: 'E',  minor: 'C♯m', signature: '4 sharps',           level: 'Melody Memory',      semitones: 4 },
  B:    { label: 'B',  minor: 'G♯m', signature: '5 sharps',           level: 'Fix the Mix',        semitones: 11 },
  'F#': { label: 'F♯', minor: 'D♯m', signature: '6 sharps (or 6 flats as G♭)', level: 'The Tritone', semitones: 6, alt: 'G♭' },
  Db:   { label: 'D♭', minor: 'B♭m', signature: '5 flats',            level: 'Chord Progression',  semitones: 1 },
  Ab:   { label: 'A♭', minor: 'Fm',  signature: '4 flats',            level: 'Survival Waves',     semitones: 8 },
  Eb:   { label: 'E♭', minor: 'Cm',  signature: '3 flats',            level: 'Beat Rebuild',       semitones: 3 },
  Bb:   { label: 'B♭', minor: 'Gm',  signature: '2 flats',            level: 'Arpeggio Rush',      semitones: 10 },
  F:    { label: 'F',  minor: 'Dm',  signature: '1 flat',             level: 'Final Boss',         semitones: 5 },
};

const keyLabel = (key) => KEY_INFO[key].label;

// Root note of a key as a MIDI number, kept between F#3 and F#4.
function rootMidi(key) {
  const s = KEY_INFO[key].semitones;
  return 60 + (s > 6 ? s - 12 : s);
}

<script>
/* lib/bridge.js */
// Talks to the Wix page code around this embed box.
// Keeps saying "ready" until the page answers, in case the page code
// starts listening after the box loads.
const Bridge = (() => {
  const handlers = {};
  const standalone = window.parent === window;
  let answered = false;

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message.type !== 'string' || message.type === 'ready') return;
    answered = true;
    if (handlers[message.type]) handlers[message.type](message);
  });

  function send(message) {
    if (!standalone) window.parent.postMessage(message, '*');
  }

  function start() {
    if (standalone) return;
    let tries = 0;
    const timer = setInterval(() => {
      if (answered || ++tries > 40) clearInterval(timer);
      else send({ type: 'ready' });
    }, 400);
    send({ type: 'ready' });
  }

  return { on: (type, fn) => { handlers[type] = fn; }, send, start, standalone };
})();

<script>
/* lib/sound.js */
// Sound engine. Plays your samples when SAMPLES lists them, otherwise a soft
// built-in synth. Samples only need one note every few semitones: the nearest
// one is pitched to fill the gaps.
const Sound = (() => {
  // MIDI note number → sample link, e.g. { 60: 'https://static.wixstatic.com/mp3/...' }
  // Piano: one note every 3 semitones from C2 to C6. Everything in between,
  // and above or below, is the nearest one repitched.
  const SAMPLES = {
    36: 'https://static.wixstatic.com/mp3/281301_c7acf76ee6704f4f8472746d60b6ba09.wav', // C2
    39: 'https://static.wixstatic.com/mp3/281301_653af0d7a1c84996a486e6a52876b9a6.wav', // E♭2
    42: 'https://static.wixstatic.com/mp3/281301_8b801a53be144a509820b74c399ee184.wav', // F♯2
    45: 'https://static.wixstatic.com/mp3/281301_28e36fb856ad4cc1b48521b37f857a23.wav', // A2
    48: 'https://static.wixstatic.com/mp3/281301_dd13ec2873f142e5920a3b701b24f858.wav', // C3
    51: 'https://static.wixstatic.com/mp3/281301_96e88d23eab648d394a5a73bca193f23.wav', // E♭3
    54: 'https://static.wixstatic.com/mp3/281301_88e72b881bae4d7a8f02593460b3195f.mp3', // F♯3
    57: 'https://static.wixstatic.com/mp3/281301_584c436cd10a444793c67398eab8fdb6.wav', // A3
    60: 'https://static.wixstatic.com/mp3/281301_1df549ca37574616afa90bc2727e6e4b.wav', // C4
    63: 'https://static.wixstatic.com/mp3/281301_f6ee58761130423fa01f5fd4b1c2311d.wav', // E♭4
    66: 'https://static.wixstatic.com/mp3/281301_4225b49d9e324fefa5b4eb80e23b2907.wav', // F♯4
    69: 'https://static.wixstatic.com/mp3/281301_fe73ec5600624c0491122f9f8fde20ef.wav', // A4
    72: 'https://static.wixstatic.com/mp3/281301_f061bdd378524749898625a5dfcae23e.wav', // C5
    75: 'https://static.wixstatic.com/mp3/281301_331a2181f06d45428bcf646539b1046e.wav', // E♭5
    78: 'https://static.wixstatic.com/mp3/281301_2ba56f64a7324ee7b340dd1501cd8070.wav', // F♯5
    81: 'https://static.wixstatic.com/mp3/281301_b5b475fd6e374154b62c12a7c61bd67c.wav', // A5
    84: 'https://static.wixstatic.com/mp3/281301_df0024f76ace48bb9d646668e6c85134.wav', // C6
  };

  // Named sounds, loaded only by the levels that ask for them (Sound.preload).
  // A link plays as it is; a { note: link } set is pitched like the piano,
  // from the nearest one. Lasers are root + tritone, recorded around octave 3.
  const SOUNDS = {
    'red-charge': 'https://static.wixstatic.com/mp3/281301_73faded223f74068b94682aa3bae63a5.wav',
    'red-hit': 'https://static.wixstatic.com/mp3/281301_5ac0974a5bb04217b924de8f7e8c13d9.wav',
    'red-beam': { // a seamless loop
      48: 'https://static.wixstatic.com/mp3/281301_3a422f96cb4743fd86cea5b237f74b8a.mp3', // C3 + F♯3
      51: 'https://static.wixstatic.com/mp3/281301_240233f4f3b4402c88fbb470eca3639f.wav', // E♭3 + A3
      54: 'https://static.wixstatic.com/mp3/281301_554c1af92c7d4964b0a2981953f9cfe4.mp3', // F♯3 + C4
      57: 'https://static.wixstatic.com/mp3/281301_8b9c715c68b2437cb69ef69dce882831.mp3', // A3 + E♭4
    },
    'violet-charge': 'https://static.wixstatic.com/mp3/281301_4d8e6f555653447497e7add012050509.wav',
    'violet-hit': 'https://static.wixstatic.com/mp3/281301_2d0118c49d614b8baf6044615a3c7879.wav',
    'violet-beam': { // a seamless loop
      48: 'https://static.wixstatic.com/mp3/281301_4b65474ae8244c48a2ebbdb997f7ce7a.wav', // C3 + F♯3
      51: 'https://static.wixstatic.com/mp3/281301_4496e692b1074e73bd6a125a29c3c58c.wav', // E♭3 + A3
      54: 'https://static.wixstatic.com/mp3/281301_039b529511b54b01a5267f4929f7e0b7.wav', // F♯3 + C4
      57: 'https://static.wixstatic.com/mp3/281301_354f80533ef3488590d435576b2b7a6a.wav', // A3 + E♭4
    },
  };
  // Boss synths: one note every 3 semitones, each about 5 s with a steady sustain.
  Object.assign(SOUNDS, {
    feedback: {
      57: 'https://static.wixstatic.com/mp3/281301_41c9f10c6b284529912a82b172154267.wav', // A3
      60: 'https://static.wixstatic.com/mp3/281301_a601a30fb9364a829f8803244061bb7f.wav', // C4
      63: 'https://static.wixstatic.com/mp3/281301_95de0472ef904f55bb8541b0ae13c449.wav', // E♭4
      66: 'https://static.wixstatic.com/mp3/281301_408c18bbdc6d4f82a7a643ed8abf5ef5.wav', // F♯4
      69: 'https://static.wixstatic.com/mp3/281301_884f30e48b784781bc0896794f761aea.wav', // A4
      72: 'https://static.wixstatic.com/mp3/281301_8bef76fb25704355bb0396dbaa0762bd.wav', // C5
      75: 'https://static.wixstatic.com/mp3/281301_16f671b2217b41f598861eff6aebcff1.wav', // E♭5
    },
  });
  // Backing drones: seamless loops, one per fight.
  SOUNDS['feedback-drone'] = 'https://static.wixstatic.com/mp3/281301_c7a3733e0fac45d0be421666778cb5a2.wav'; // F♯ minor (A's relative minor)
  const MUSIC_GAIN = 0.2; // backing drones' level under everything else
  const LASER_GAIN = 0.6; // the laser samples' level; tune by ear
  const LASER_FADE = 0.5; // seconds a laser's sound takes to fade out when it ends

  const SAMPLE_GAIN = 0.7; // samples' level next to the synth; tune once real sounds are in
  let ctx = null;
  let out = null;
  const buffers = {};
  const named = {}; // name → buffer, or { note: buffer }
  const wanted = new Set(); // named sounds a level asked for
  // How the samples are doing, for the Preview-only status line.
  const status = { total: Object.keys(SAMPLES).length, loaded: 0, blocked: 0, broken: 0, done: false };
  let pending = 0;
  let onStatus = () => {};

  // An optional shared reverb for notes (piano and instruments). A level
  // turns it on with Sound.reverb({ mix, seconds, piano, instruments }), where
  // piano and instruments scale how much of each goes in; the rest stay dry.
  let reverbIn = null, reverbWanted = null;
  function buildReverb({ mix = 0.22, seconds = 2.2 } = {}) {
    const len = Math.round(ctx.sampleRate * seconds), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      const pre = Math.round(ctx.sampleRate * 0.015); // a short gap before the tail
      for (let i = pre; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const conv = ctx.createConvolver(), wet = ctx.createGain();
    conv.buffer = ir;
    wet.gain.value = mix;
    reverbIn = ctx.createGain();
    reverbIn.connect(conv).connect(wet).connect(out);
  }
  // send: how much of this sound goes to the reverb (1 = the level's mix).
  const toReverb = (node, send = 1) => {
    if (!reverbIn || send <= 0) return;
    const g = ctx.createGain();
    g.gain.value = send;
    node.connect(g).connect(reverbIn);
  };

  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createDynamicsCompressor();
      out.connect(ctx.destination);
      if (reverbWanted) buildReverb(reverbWanted);
      Object.entries(SAMPLES).forEach(([midi, url]) => load(url, (b) => { buffers[midi] = b; }));
      wanted.forEach(loadNamed);
      if (!pending) finishLoad();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function finishLoad() { status.done = true; onStatus(status); }
  // Downloads and decodes one sound. A missing one just falls back to the synth.
  async function load(url, store) {
    pending++;
    try {
      let data;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        data = await res.arrayBuffer();
      } catch (err) {
        status.blocked++; // couldn't download it (blocked, or a bad link)
        return;
      }
      try {
        store(await ctx.decodeAudioData(data));
        status.loaded++;
      } catch (err) {
        status.broken++; // downloaded, but not a sound the browser can play
      }
    } finally {
      pending--;
      onStatus(status);
      if (!pending) finishLoad();
    }
  }
  function loadNamed(name) {
    const src = SOUNDS[name];
    if (!src) return;
    status.done = false;
    if (typeof src === 'string') { status.total++; load(src, (b) => { named[name] = b; }); return; }
    named[name] = {};
    for (const [midi, url] of Object.entries(src)) { status.total++; load(url, (b) => { named[name][midi] = b; }); }
  }

  // Loops skip the silence MP3s add at each end, so they don't stutter.
  function trimmed(buf) {
    if (buf.trim) return buf.trim;
    const d = buf.getChannelData(0);
    let a = 0, b = d.length - 1;
    while (a < b && Math.abs(d[a]) < 1e-4) a++;
    while (b > a && Math.abs(d[b]) < 1e-4) b--;
    buf.trim = [a / buf.sampleRate, (b + 1) / buf.sampleRate];
    return buf.trim;
  }
  // Plays a buffer; returns stop(fade). For loops, repeats the trimmed middle.
  function playBuffer(buf, { rate = 1, loop = false, volume = 1 } = {}) {
    const a = audio(), t = a.currentTime + 0.005;
    const src = a.createBufferSource(), gain = a.createGain();
    src.buffer = buf;
    src.playbackRate.value = rate;
    gain.gain.setValueAtTime(volume, t);
    src.connect(gain).connect(out);
    if (loop) {
      const [ls, le] = trimmed(buf);
      src.loop = true; src.loopStart = ls; src.loopEnd = le;
      src.start(t, ls);
    } else src.start(t);
    let stopped = false;
    return {
      stop(fade = 0.08) {
        if (stopped) return;
        stopped = true;
        const now = a.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        if (fade > 0.2) gain.gain.setTargetAtTime(0.0001, now, fade / 4); // a smooth tail for long fades
        else gain.gain.linearRampToValueAtTime(0.0001, now + fade);
        src.stop(now + fade + 0.05);
      },
    };
  }
  // The nearest note in a pitched set, counting octaves either way.
  function nearestIn(set, midi) {
    let best = null;
    for (const m of Object.keys(set).map(Number)) {
      for (const o of [-12, 0, 12]) {
        if (best === null || Math.abs(midi - (m + o)) < Math.abs(midi - best.at)) best = { m, at: m + o };
      }
    }
    return best && { buf: set[best.m], rate: Math.pow(2, (midi - best.at) / 12) };
  }

  function nearestSample(midi) {
    let best = null;
    for (const m of Object.keys(buffers).map(Number)) {
      if (best === null || Math.abs(m - midi) < Math.abs(best - midi)) best = m;
    }
    return best;
  }

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

  // Starts a note that rings until stop() is called. Used for held keys.
  function voice(midi, t, volume, synthOnly = false) {
    const a = audio();
    const gain = a.createGain();
    gain.connect(out);
    toReverb(gain, reverbWanted ? reverbWanted.piano ?? 1 : 0); // the piano (your keys)
    const sources = [];

    const sample = synthOnly ? null : nearestSample(midi);
    if (sample !== null) {
      const src = a.createBufferSource();
      src.buffer = buffers[sample];
      src.playbackRate.value = Math.pow(2, (midi - sample) / 12);
      gain.gain.setValueAtTime(volume * SAMPLE_GAIN, t);
      src.connect(gain);
      src.start(t);
      sources.push(src);
    } else {
      const filter = a.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2600;
      filter.connect(gain);
      for (const detune of [-7, 7]) {
        const osc = a.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = hz(midi);
        osc.detune.value = detune;
        osc.connect(filter);
        osc.start(t);
        sources.push(osc);
      }
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(volume * 0.5, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(volume * 0.25, t + 0.3);
    }

    let stopped = false;
    return {
      fadeOut(seconds) {
        if (stopped) return;
        stopped = true;
        const now = a.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setTargetAtTime(0.0001, now, seconds / 4);
        sources.forEach((src) => src.stop(now + seconds + 0.1));
      },
      stop(at = a.currentTime) {
        if (stopped) return;
        stopped = true;
        const end = Math.max(at, a.currentTime);
        gain.gain.cancelScheduledValues(end);
        gain.gain.setTargetAtTime(0.0001, end, 0.12);
        sources.forEach((src) => src.stop(end + 1));
      },
    };
  }

  // One note of a set length. `when` is seconds from now.
  function note(midi, when = 0, length = 1.2, volume = 0.4) {
    const t = audio().currentTime + 0.03 + when;
    voice(midi, t, volume).stop(t + length);
  }

  // A held note: returns an object with stop().
  function hold(midi, volume = 0.4) {
    return voice(midi, audio().currentTime + 0.01, volume);
  }

  function chord(midis, when = 0, length = 1.2, volume = 0.4) {
    midis.forEach((m) => note(m, when, length, volume / Math.sqrt(midis.length)));
  }

  // Filtered noise, for thuds and whooshes.
  function noise(when, length, from, to, volume) {
    const a = audio();
    const t = a.currentTime + 0.03 + when;
    const buffer = a.createBuffer(1, Math.ceil(a.sampleRate * length), a.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource();
    const filter = a.createBiquadFilter();
    const gain = a.createGain();
    src.buffer = buffer;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + length);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + length);
    src.connect(filter).connect(gain).connect(out);
    src.start(t);
  }

  function thump(when, from, to, length, volume) {
    const a = audio();
    const t = a.currentTime + 0.03 + when;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(to, t + length);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + length);
    osc.connect(gain).connect(out);
    osc.start(t);
    osc.stop(t + length + 0.05);
  }

  // A pitched sample that rings until stop(). With sustain, a hold longer
  // than the sample repeats its steady middle (from 1 s to just before the
  // end), crossfading each time so there's no click.
  function sampledVoice(buf, rate, volume, sustain) {
    const a = audio();
    const master = a.createGain();
    master.gain.value = volume;
    master.connect(out);
    toReverb(master, reverbWanted ? reverbWanted.instruments ?? 1 : 0); // boss synths and other instruments
    const srcs = [];
    const play = (offset, at, fade) => {
      const src = a.createBufferSource(), g = a.createGain();
      src.buffer = buf; src.playbackRate.value = rate;
      src.connect(g).connect(master);
      if (fade) { g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(1, at + fade); }
      src.start(at, offset);
      srcs.push(src);
      return g;
    };
    let segStart = a.currentTime + 0.01, segOffset = 0, gain = play(0, segStart, 0), timer = null;
    const LOOP_FROM = 1, XF = 0.3, end = buf.duration - 0.6;
    if (sustain && end - LOOP_FROM > XF * 2) {
      const next = () => {
        const at = segStart + (end - XF - segOffset) / rate, fade = XF / rate;
        timer = setTimeout(() => {
          const old = gain;
          gain = play(LOOP_FROM, at, fade);
          old.gain.setValueAtTime(1, at); old.gain.linearRampToValueAtTime(0, at + fade);
          segStart = at; segOffset = LOOP_FROM;
          next();
        }, Math.max(0, (at - a.currentTime - 0.25) * 1000));
      };
      next();
    }
    let stopped = false;
    return {
      stop(release = 0.5) {
        if (stopped) return;
        stopped = true;
        clearTimeout(timer);
        const now = a.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(master.gain.value, now);
        master.gain.setTargetAtTime(0.0001, now, release / 4);
        srcs.forEach((src) => { try { src.stop(now + release + 0.1); } catch (e) { /* already ended */ } });
      },
    };
  }

  // A sampled instrument (like a boss synth) with the same note / chord / hold
  // calls as the piano. Until its samples load, it plays the piano instead.
  function instrument(name, { gain = 1, release = 0.5 } = {}) {
    const ready = () => named[name] && Object.keys(named[name]).length;
    const start = (midi, volume, sustain) => {
      const n = nearestIn(named[name], midi);
      return sampledVoice(n.buf, n.rate, volume * SAMPLE_GAIN * gain, sustain);
    };
    const inst = {
      note(midi, when = 0, length = 1.2, volume = 0.4) {
        if (!ready()) return note(midi, when, length, volume);
        setTimeout(() => { const v = start(midi, volume, length > 4); setTimeout(() => v.stop(release), length * 1000); }, when * 1000);
      },
      chord(midis, when = 0, length = 1.2, volume = 0.4) {
        midis.forEach((m) => inst.note(m, when, length, volume / Math.sqrt(midis.length)));
      },
      hold(midi, volume = 0.4) {
        if (!ready()) return hold(midi, volume);
        const v = start(midi, volume, true);
        return { stop: () => v.stop(release) };
      },
    };
    return inst;
  }

  // A backing track: loops the whole file. Returns null if its file isn't
  // loaded, so a fight with no music yet just carries on.
  function track(name, { volume = MUSIC_GAIN, fadeIn = 0, rate = 1 } = {}) {
    const buf = named[name];
    if (!buf || !buf.getChannelData) return null;
    const a = audio(), t = a.currentTime + 0.05;
    const src = a.createBufferSource(), gain = a.createGain();
    src.buffer = buf; src.loop = true; src.playbackRate.value = rate;
    gain.gain.setValueAtTime(fadeIn ? 0.0001 : volume, t);
    if (fadeIn) gain.gain.exponentialRampToValueAtTime(volume, t + fadeIn);
    src.connect(gain).connect(out);
    src.start(t);
    let stopped = false;
    return {
      start: t,
      stop(fade = 1) {
        if (stopped) return;
        stopped = true;
        const now = a.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
        gain.gain.setTargetAtTime(0.0001, now, fade / 4);
        src.stop(now + fade + 0.1);
      },
    };
  }

  // A laser's sound, in three parts: the charge while it warns, then (call
  // live()) the hit plus the beam loop underneath it. Any part without a
  // sample uses the old synth tritone instead. stop() fades everything.
  function laser(colour, root, synthVolume) {
    const charge = named[`${colour}-charge`], hit = named[`${colour}-hit`], beams = named[`${colour}-beam`];
    const loops = beams && Object.keys(beams).length ? beams : null;
    const synth = () => [root, root + 6].map((m) => voice(m, audio().currentTime + 0.01, synthVolume, true)); // a steady hum, not the piano
    const parts = [];
    let chargeParts = charge ? [playBuffer(charge, { volume: LASER_GAIN })] : loops ? synth() : null;
    // With no laser samples at all, the synth tritone carries straight through.
    if (!chargeParts) { const held = synth(); return { live() {}, stop() { held.forEach((v) => v.stop()); } }; }
    parts.push(...chargeParts);
    let isLive = false, stopped = false;
    return {
      live() {
        if (isLive || stopped) return; // a laser stopped already never comes back on
        isLive = true;
        chargeParts.forEach((v) => v.stop(0.04));
        if (hit) parts.push(playBuffer(hit, { volume: LASER_GAIN }));
        if (loops) { const n = nearestIn(loops, root); parts.push(playBuffer(n.buf, { rate: n.rate, loop: true, volume: LASER_GAIN })); }
        else parts.push(...synth());
      },
      stop() { stopped = true; parts.forEach((v) => (v.fadeOut ? v.fadeOut(LASER_FADE) : v.stop(LASER_FADE))); },
    };
  }

  return {
    unlock: audio,
    reverb(options) { reverbWanted = options || {}; if (ctx && !reverbIn) buildReverb(reverbWanted); },
    get hasReverb() { return !!reverbIn; },
    laser,
    instrument,
    track,
    // Levels list the named sounds they use, so others don't download them.
    preload(names) { names.forEach((n) => { if (!wanted.has(n)) { wanted.add(n); if (ctx) loadNamed(n); } }); },
    has: (name) => !!named[name],
    // Sample loading progress: { total, loaded, blocked, broken, done }.
    get samples() { return { ...status }; },
    onSamples(fn) { onStatus = fn; fn(status); },
    note,
    hold,
    chord,
    // A wrong note: a soft low buzz.
    buzz() {
      const a = audio();
      const t = a.currentTime + 0.02;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = 'square';
      osc.frequency.value = 98;
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(filter).connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.3);
    },
    // Locked door: two dull knocks.
    locked() {
      thump(0, 120, 55, 0.18, 0.5);
      noise(0, 0.08, 900, 200, 0.25);
      thump(0.11, 110, 50, 0.16, 0.35);
    },
    // Getting hit in a fight: a short, quiet feedback squeal.
    squeal() {
      const a = audio();
      const t = a.currentTime + 0.01;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, t);
      osc.frequency.exponentialRampToValueAtTime(3200, t + 0.25);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.06, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.32);
      noise(0, 0.12, 3000, 800, 0.12);
    },
    // A note landing on the boss.
    hit() { thump(0, 190, 90, 0.12, 0.28); },
    // Ear defenders blocking a note.
    block() { noise(0, 0.1, 5000, 1500, 0.18); },
    // A lock springing open: two clicks and a soft thud.
    unlocked() {
      noise(0, 0.03, 6000, 3000, 0.35);
      noise(0.07, 0.03, 7000, 3500, 0.3);
      thump(0.1, 160, 70, 0.2, 0.35);
    },
    // Door swinging open.
    whoosh() {
      noise(0, 0.6, 300, 2400, 0.12);
    },
    // A key going into the circle: its perfect fifth, then its major triad.
    insert(root) {
      chord([root, root + 7], 0, 0.9, 0.5);
      chord([root, root + 4, root + 7, root + 12], 0.55, 2.4, 0.55);
    },
    // Clicking a lit key once the circle is complete.
    fifth(root) {
      chord([root, root + 7], 0, 1.1, 0.45);
    },
    // Finding a key at the end of a level: a rising arpeggio.
    keyFound(root) {
      [0, 4, 7, 12, 16].forEach((step, i) => note(root + step, i * 0.12, 1.4, 0.35));
    },
  };
})();

<script>
/* lib/piano.js */
// On-screen piano, played with the computer keyboard (the same layout as
// Ableton's and FL Studio's computer-keyboard piano) or by clicking.
//   W E   T Y U   O P
//  A S D F G H J K L ; '      Z / X shift the octave
// Boss fights switch to scale mode: A S D F G H J K play the 8 notes of the
// level's scale, so one hand can play while the other moves.
// Levels listen with onNoteOn / onNoteOff and can mark keys with
// mark(midi, 'target' | 'good' | 'bad').
const Piano = (() => {
  const CHROMATIC_CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY',
    'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote'];
  const CHROMATIC_LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"];
  const SCALE_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK'];
  const SCALE_LETTERS = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K'];
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const BLACK = [1, 3, 6, 8, 10];

  const noteName = (midi) => NAMES[((midi % 12) + 12) % 12];
  const octaveOf = (midi) => Math.floor(midi / 12) - 1;

  function create(container, { octave: startOctave = 4 } = {}) {
    const listeners = { on: [], off: [] };
    const held = new Map(); // midi → sound
    const pressedCodes = new Map(); // keyboard code → midi
    const targetPitches = new Set();
    let enabled = true;
    let shift = 0; // octaves up or down from the starting layout
    let layout = []; // [{ code, letter, midi, black, el }]
    let scaleMode = false;
    let allowed = null; // null = every key works; otherwise a Set of note names (0–11)
    let names = null;   // optional names to show on the keys, e.g. spelled with flats
    let chromaticBase = (startOctave + 1) * 12;

    container.classList.add('piano');
    container.innerHTML = `
      <div class="piano-bar">
        <span class="piano-octave">Octave <b></b></span>
        <span class="piano-help">Z / X change octave</span>
      </div>
      <div class="piano-keys"></div>`;
    const keysEl = container.querySelector('.piano-keys');
    const octaveEl = container.querySelector('.piano-octave b');

    const midiOf = (entry) => entry.midi + shift * 12;
    const entryFor = (midi) => layout.find((k) => midiOf(k) === midi) || null;

    function render() {
      keysEl.innerHTML = '';
      let whiteIndex = 0;
      layout.forEach((k) => {
        const el = document.createElement('div');
        el.className = 'piano-key ' + (k.black ? 'black' : 'white');
        el.innerHTML = `<span class="piano-letter">${k.letter}</span><span class="piano-name"></span>`;
        if (k.black) el.style.left = `calc(${whiteIndex} * var(--white-w) - var(--black-w) / 2)`;
        else whiteIndex++;
        keysEl.appendChild(el);
        k.el = el;
      });
      container.style.setProperty('--whites', whiteIndex);
      container.classList.toggle('scale-mode', scaleMode);
      relabel();
    }

    function relabel() {
      octaveEl.textContent = octaveOf(midiOf(layout[0]));
      layout.forEach((k, i) => {
        const midi = midiOf(k);
        k.el.dataset.midi = midi;
        const name = names ? names[i] : scaleMode ? noteName(midi) : (midi % 12 === 0 ? `C${octaveOf(midi)}` : '');
        k.el.querySelector('.piano-name').textContent = name;
        k.el.classList.toggle('mark-target', targetPitches.has(midi % 12));
        k.el.classList.toggle('locked', allowed !== null && !allowed.has(midi % 12));
        k.el.classList.remove('mark-good', 'mark-bad');
      });
    }

    function chromatic() {
      scaleMode = false;
      layout = CHROMATIC_CODES.map((code, i) => ({
        code, letter: CHROMATIC_LETTERS[i], midi: chromaticBase + i, black: BLACK.includes(i % 12),
      }));
      render();
    }

    function down(midi, source) {
      if (!enabled || held.has(midi)) return;
      if (allowed !== null && !allowed.has(midi % 12)) return; // greyed out
      held.set(midi, Sound.hold(midi));
      const entry = entryFor(midi);
      if (entry) entry.el.classList.add('down');
      listeners.on.forEach((fn) => fn(midi, source));
    }

    function up(midi) {
      const sound = held.get(midi);
      if (!sound) return;
      sound.stop();
      held.delete(midi);
      const entry = entryFor(midi);
      if (entry) entry.el.classList.remove('down');
      listeners.off.forEach((fn) => fn(midi));
    }

    function releaseAll() {
      [...held.keys()].forEach(up);
      pressedCodes.clear();
    }

    function setOctave(n) {
      const nextShift = shift + (n - octaveOf(midiOf(layout[0])));
      const lowest = midiOf(layout[0]) + (nextShift - shift) * 12;
      if (lowest < 36 || lowest > 84) return; // keep between C2 and C6
      releaseAll();
      shift = nextShift;
      relabel();
    }

    // Computer keyboard
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === 'KeyZ' || e.code === 'KeyX') {
        e.preventDefault();
        if (!e.repeat) setOctave(octaveOf(midiOf(layout[0])) + (e.code === 'KeyZ' ? -1 : 1));
        return;
      }
      const entry = layout.find((k) => k.code === e.code);
      if (!entry) return;
      e.preventDefault();
      if (e.repeat || pressedCodes.has(e.code)) return;
      Sound.unlock();
      const midi = midiOf(entry);
      pressedCodes.set(e.code, midi);
      down(midi, 'keyboard');
    });
    window.addEventListener('keyup', (e) => {
      if (!pressedCodes.has(e.code)) return;
      up(pressedCodes.get(e.code));
      pressedCodes.delete(e.code);
    });
    window.addEventListener('blur', releaseAll);

    // Mouse and touch
    keysEl.addEventListener('pointerdown', (e) => {
      const key = e.target.closest('.piano-key');
      if (!key) return;
      e.preventDefault();
      Sound.unlock();
      const midi = Number(key.dataset.midi);
      down(midi, 'pointer');
      const release = () => {
        up(midi);
        window.removeEventListener('pointerup', release);
        window.removeEventListener('pointercancel', release);
      };
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
    });

    chromatic();

    return {
      onNoteOn: (fn) => listeners.on.push(fn),
      onNoteOff: (fn) => listeners.off.push(fn),
      held: () => [...held.keys()],
      // Marks a key: 'target' glows (play this), 'good' and 'bad' flash.
      mark(midi, kind) {
        const entry = entryFor(midi);
        if (!entry) return;
        const el = entry.el;
        if (kind === 'target') return el.classList.add('mark-target');
        el.classList.remove('mark-good', 'mark-bad');
        void el.offsetWidth;
        el.classList.add('mark-' + kind);
        setTimeout(() => el.classList.remove('mark-' + kind), 600);
      },
      // Marks every key with this note name (in any octave) as a target.
      markPitch(pitchClass) {
        targetPitches.add(((pitchClass % 12) + 12) % 12);
        relabel();
      },
      clearMarks() {
        targetPitches.clear();
        relabel();
      },
      // Scale mode: A S D F G H J K play root + each step (default: major scale).
      useScale(root, steps = [0, 2, 4, 5, 7, 9, 11, 12]) {
        releaseAll();
        scaleMode = true;
        shift = 0;
        layout = steps.map((step, i) => ({ code: SCALE_CODES[i], letter: SCALE_LETTERS[i], midi: root + step, black: false }));
        render();
      },
      useChromatic() { releaseAll(); shift = 0; names = null; chromatic(); },
      // Shows these names on the keys instead (scale mode), e.g. E♯ or G♭.
      setNames(list) { names = list; relabel(); },
      setEnabled(on) { enabled = on; if (!on) releaseAll(); },
      // Greys out every key except these note names (0–11). null unlocks all.
      setAllowed(pitchClasses) {
        allowed = pitchClasses ? new Set(pitchClasses.map((pc) => ((pc % 12) + 12) % 12)) : null;
        relabel();
      },
      get octave() { return octaveOf(midiOf(layout[0])); },
      setOctave,
    };
  }

  return { create, noteName, octaveOf };
})();
</script>
<script>
/* lib/level.js */
// The frame every level sits in: intro screen, play screen with the piano,
// the key-found screen and the phone message. A level calls Level.setup()
// with what to do when play starts, and Level.win() when it's beaten.
const Level = (() => {
  const $ = (id) => document.getElementById(id);
  let key = null;
  let testMode = false;
  let extraHearts = 0;
  let onStart = () => {};
  let usesPiano = true;
  let finishing = false;

  document.body.insertAdjacentHTML('beforeend', `
    <section class="screen" id="phone">
      <div class="eyebrow">Hidden level</div>
      <h1>Best played on a computer</h1>
      <p>This level needs a keyboard and a bigger screen. Come back on a laptop or desktop to play.</p>
    </section>
    <section class="screen" id="intro">
      <div class="eyebrow" id="introEyebrow"></div>
      <h1 id="introTitle"></h1>
      <p id="introText"></p>
      <p id="introBeaten" hidden>You've already found this key. Play again for fun.</p>
      <div class="buttons"><button class="primary" id="startBtn">Start</button></div>
    </section>
    <section class="screen" id="play">
      <div class="focus-banner" id="focusBanner">Click here to keep playing with your keyboard</div>
      <button class="skip" id="skipBtn" hidden>Skip level (test)</button>
      <div class="sample-status" id="sampleStatus" hidden></div>
      <div class="stage" id="stage"></div>
      <div id="piano"></div>
    </section>
    <section class="screen" id="found">
      <svg class="key-art" viewBox="0 0 120 240" aria-hidden="true">
        <defs>
          <linearGradient id="keyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C8B8FF"/><stop offset="1" stop-color="#9A7FE0"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="52" r="40" fill="none" stroke="url(#keyFill)" stroke-width="12"/>
        <text id="keyArtLabel" x="60" y="64" text-anchor="middle" fill="#C8B8FF" font-family="Oswald, sans-serif" font-weight="600" font-size="32"></text>
        <rect x="53" y="90" width="14" height="128" rx="4" fill="url(#keyFill)"/>
        <rect x="66" y="176" width="26" height="12" rx="3" fill="url(#keyFill)"/>
        <rect x="66" y="200" width="18" height="12" rx="3" fill="url(#keyFill)"/>
      </svg>
      <div class="text">
        <h1 id="foundTitle"></h1>
        <p class="lead" id="foundText"></p>
        <div class="heart-found" id="heartFound" hidden>
          <svg viewBox="-12 -12 24 20" aria-hidden="true"><path d="M0 6C-10-2-10-10-5-10C-2-10 0-8 0-6C0-8 2-10 5-10C10-10 10-2 0 6Z"/></svg>
          <span>You found a hidden heart. You’ll start every boss fight with one more.</span>
        </div>
        <div class="buttons" id="foundButtons"></div>
      </div>
    </section>`);

  const piano = Piano.create($('piano'));
  piano.setEnabled(false);

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('show', s.id === id));
    piano.setEnabled(id === 'play' && usesPiano);
  }

  function button(text, onClick, primary) {
    const b = document.createElement('button');
    b.textContent = text;
    if (primary) b.className = 'primary';
    b.onclick = onClick;
    return b;
  }

  // The game only hears the keyboard while it has focus.
  window.addEventListener('blur', () => $('focusBanner').classList.add('show'));
  window.addEventListener('focus', () => $('focusBanner').classList.remove('show'));
  $('focusBanner').onclick = () => { window.focus(); $('focusBanner').classList.remove('show'); };

  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

  Bridge.on('level', (message) => {
    key = message.key;
    testMode = message.testMode === true;
    extraHearts = Number(message.extraHearts) || 0;
    if (touchOnly) return show('phone');
    $('introEyebrow').textContent = `Level ${KEYS.indexOf(key) + 1} · Key of ${keyLabel(key)}`;
    $('introTitle').textContent = KEY_INFO[key].level;
    $('introBeaten').hidden = message.status !== 'beaten';
    show('intro');
  });

  $('startBtn').onclick = () => {
    Sound.unlock();
    window.focus();
    show('play');
    // Preview only: lets you skip a level while testing the site.
    $('skipBtn').hidden = !testMode;
    $('skipBtn').onclick = () => Level.win();
    // Preview only: whether your audio samples loaded.
    if (testMode) {
      Sound.onSamples((st) => {
        if (!st.total) return;
        const el = $('sampleStatus');
        el.hidden = false;
        el.className = 'sample-status' + (st.blocked || st.broken ? ' bad' : '');
        el.textContent = !st.done ? `Samples: loading ${st.loaded} / ${st.total}…`
          : st.blocked ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.blocked} blocked by the site (using the synth)`
          : st.broken ? `Samples: ${st.loaded} / ${st.total} loaded · ${st.broken} not playable (check the file type)`
          : `Samples: ${st.loaded} / ${st.total} loaded`;
      });
    }
    onStart($('stage'));
  };

  Bridge.on('levelSaved', (message) => {
    const label = keyLabel(key);
    $('keyArtLabel').textContent = label;
    const buttons = $('foundButtons');
    buttons.innerHTML = '';
    $('foundTitle').textContent = message.gotKey ? `You found the key of ${label}.`
      : message.gotHeart ? 'Hidden heart found' : 'Level complete';
    if (message.gotKey) Sound.keyFound(rootMidi(key));
    $('heartFound').hidden = !message.gotHeart;
    if (message.gotHeart) Sound.chord([rootMidi(key) + 12, rootMidi(key) + 16, rootMidi(key) + 19], 1.2, 1.6, 0.35);

    // The tutorial is the only time the player is told what to do.
    if (message.firstKey) {
      $('foundText').textContent = 'You just discovered your first key. Take it to the circle of fifths to continue.';
      buttons.append(button('Go to the circle of fifths', () => Bridge.send({ type: 'navigate', to: 'circle' }), true));
    } else {
      $('foundText').textContent = message.gotKey || message.gotHeart ? '' : 'You already have this key.';
    }
    buttons.append(button('Back', () => Bridge.send({ type: 'navigate', to: 'back' }), !message.firstKey));
    show('found');
  });

  return {
    piano,
    get key() { return key; },
    // True in Wix Preview: levels may show test shortcuts.
    get testMode() { return testMode; },
    // Hidden hearts found so far: boss fights add these to the starting hearts.
    get extraHearts() { return extraHearts; },
    back() { Bridge.send({ type: 'navigate', to: 'back' }); },
    // description: the line under the title on the intro screen.
    // piano: false hides the on-screen piano for levels that don't use it.
    setup({ description, start, piano: showPiano = true }) {
      $('introText').textContent = description;
      onStart = start;
      usesPiano = showPiano;
      $('piano').hidden = !showPiano;
      Bridge.start();
    },
    // Reveals the piano partway through a level that started without it.
    showPiano() {
      usesPiano = true;
      $('piano').hidden = false;
      piano.setEnabled(true);
    },
    // win({ heart: true }) also reports finding this level's hidden heart.
    win(options = {}) {
      if (finishing) return;
      finishing = true;
      piano.setEnabled(false);
      Bridge.send({ type: 'levelComplete', heart: options.heart === true });
    },
  };
})();
</script>
<script>
  // Level 9, key of A♭: Survival Waves. A top-down zombie rush. Pick a
  // musical weapon, survive 5 waves from 4 speaker-stack spawners, and pick an
  // upgrade between waves. Every shot and kill plays notes in A♭ major.
  // WASD to move, aim with the mouse, left click (or hold) to attack.
  const W = 900, H = 540;
  const AB_ARP = [56, 60, 63, 68, 72, 75];           // A♭ major arpeggio, rising
  const AB_PENTA = [68, 70, 72, 75, 77, 80];         // A♭ major pentatonic for kills
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  const WEAPONS = {
    arp: { name: 'Arpeggiator', icon: '♪♫', tag: 'Rapid fire',
      desc: 'Quick little notes that ripple up the A♭ arpeggio. 12 per clip, then a short reload.',
      rate: 0.16, damage: 1, speed: 450, size: 5, pierce: 0, clip: 12, reload: 1.6 },
    bass: { name: 'Sub Bass', icon: '〰', tag: 'Heavy, piercing',
      desc: 'A slow, wide wave of bass that rolls through every zombie in its path. 4 per clip.',
      rate: 0.8, damage: 4, speed: 300, size: 24, pierce: 99, clip: 4, reload: 2 },
    mic: { name: 'Mic Swing', icon: '🎤', tag: 'Melee',
      desc: 'Swing your mic in a wide arc: big damage, short reach. Special: hold E to charge a feedback blast from every speaker.',
      rate: 0.42, damage: 5, reach: 80, arc: 1.7 },
  };

  const ZOMBIES = {
    walker: { hp: 4, speed: 60, size: 14, damage: 10, body: '#7d7a8c', eye: '#ff8fa6' },
    brute: { hp: 18, speed: 42, size: 23, damage: 22, body: '#4a3566', eye: '#ff5d7a' },
    spitter: { hp: 6, speed: 55, size: 14, damage: 10, body: '#3f7a6e', eye: '#b9fff0', range: 230, fire: 2.2 },
    runner: { hp: 2, speed: 138, size: 11, damage: 8, body: '#a8566a', eye: '#ffe0e6' },
  };

  const WAVES = [
    { walker: 8, gap: 1.1 },
    { walker: 12, brute: 2, gap: 0.95 },
    { walker: 12, brute: 3, spitter: 3, gap: 0.85 },
    { walker: 14, brute: 3, spitter: 4, runner: 5, gap: 0.75 },
    { walker: 16, brute: 5, spitter: 5, runner: 8, gap: 0.6 },
  ];
  const SPAWNERS = [[60, 92], [W - 60, 92], [60, H - 58], [W - 60, H - 58]]; // clear of the HUD at the top

  // Mic Swing's special: Feedback. Hold E to charge (ear defenders go on),
  // release when the bar is full, and a moment later a shockwave rings out
  // of all four speaker stacks. Each ring hits every zombie once, for a share
  // of its health plus a little, so weak zombies drop and brutes survive.
  // The cooldown carries across waves.
  const FEEDBACK = {
    cooldown: 120,    // seconds between blasts
    readyAtStart: true,
    charge: 2,        // seconds of holding E to fill the bar
    windup: 1,        // seconds from release to the blast
    speed: 520,       // how fast the rings spread, pixels per second
    share: 0.14,      // each ring takes this share of a zombie's full health…
    flat: 0.6,        // …plus this much (raised by Louder)
    stun: 0.6,        // zombies stagger for this long when a ring hits
    push: 26,         // and get pushed back this far
  };
  const RING_END = Math.hypot(W, H) + 40;

  // Upgrades offered between waves (three at random). Some only suit one weapon.
  const UPGRADES = [
    { id: 'damage', name: 'Louder', desc: '+30% damage', apply: (s) => { s.mods.damage *= 1.3; } },
    { id: 'rate', name: 'Faster Tempo', desc: '+20% attack speed', apply: (s) => { s.mods.rate *= 0.8; } },
    { id: 'speed', name: 'Light Feet', desc: '+15% move speed', apply: (s) => { s.player.speed *= 1.15; } },
    { id: 'maxhp', name: 'Bigger Headroom', desc: '+25 max health, and heal 25', apply: (s) => { s.player.maxHp += 25; s.player.hp = Math.min(s.player.maxHp, s.player.hp + 25); } },
    { id: 'heal', name: 'Encore', desc: 'Heal to full health', apply: (s) => { s.player.hp = s.player.maxHp; } },
    { id: 'regen', name: 'Sustain', desc: 'Regain 2 health every second', apply: (s) => { s.player.regen += 2; } },
    { id: 'extra', name: 'Harmony', desc: 'Fire one more note each shot', only: 'arp', apply: (s) => { s.mods.extra += 1; } },
    { id: 'pierce', name: 'Ring Out', desc: 'Notes pass through one more zombie', only: 'arp', apply: (s) => { s.mods.pierce += 1; } },
    { id: 'clip', name: 'Bigger Clip', desc: '+6 notes per clip', only: 'arp', apply: (s) => { s.mods.clip += 6; s.ammo = WEAPONS.arp.clip + s.mods.clip; } },
    { id: 'quickreload', name: 'Quick Reload', desc: 'Reload 30% faster', only: ['arp', 'bass'], apply: (s) => { s.mods.reload *= 0.7; } },
    { id: 'wide', name: 'Wider Wave', desc: '+40% wave size', only: 'bass', apply: (s) => { s.mods.size *= 1.4; } },
    { id: 'reach', name: 'Longer Cable', desc: '+30% swing reach', only: 'mic', apply: (s) => { s.mods.reach *= 1.3; } },
  ];

  let canvas, ctx, ui = {};
  let S = null;
  let keys = {};
  let mouse = { x: W / 2, y: H / 2 - 80, down: false };
  let last = 0, paused = false;

  Level.setup({
    description: 'They’re coming out of the speakers. Pick a weapon and survive five waves.',
    piano: false,
    start(stage) {
      stage.innerHTML = `
        <div class="arena">
          <canvas id="arena" width="${W}" height="${H}"></canvas>
          <div class="overlay show" id="choose">
            <h2>Pick your weapon</h2>
            <div class="choices" id="weapons"></div>
            <p class="controls-help"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · aim with the mouse · left click (or hold) to attack · <kbd>R</kbd> reload · <kbd>E</kbd> hold for the mic’s special</p>
          </div>
          <div class="overlay" id="upgrade">
            <h2 id="upgradeTitle"></h2>
            <p class="controls-help">Pick an upgrade for the next wave.</p>
            <div class="choices" id="upgrades"></div>
          </div>
          <div class="overlay" id="endCard">
            <h2 id="endTitle"></h2>
            <p id="endText"></p>
            <div class="buttons" id="endButtons"></div>
          </div>
        </div>`;
      canvas = stage.querySelector('#arena');
      ctx = canvas.getContext('2d');
      ui = {
        choose: stage.querySelector('#choose'), weapons: stage.querySelector('#weapons'),
        upgrade: stage.querySelector('#upgrade'), upgradeTitle: stage.querySelector('#upgradeTitle'), upgrades: stage.querySelector('#upgrades'),
        end: stage.querySelector('#endCard'), endTitle: stage.querySelector('#endTitle'), endText: stage.querySelector('#endText'), endButtons: stage.querySelector('#endButtons'),
      };
      for (const [id, w] of Object.entries(WEAPONS)) {
        ui.weapons.appendChild(choiceCard(w.icon, w.name, w.desc, w.tag, () => chooseWeapon(id), `weapon-${id}`));
      }
      // Mouse aim, in canvas coordinates
      const toCanvas = (e) => {
        const r = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - r.left) * (W / r.width);
        mouse.y = (e.clientY - r.top) * (H / r.height);
      };
      canvas.addEventListener('pointermove', toCanvas);
      canvas.addEventListener('pointerdown', (e) => { toCanvas(e); if (e.button === 0) { mouse.down = true; Sound.unlock(); } });
      window.addEventListener('pointerup', () => { mouse.down = false; });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      newState();
      requestAnimationFrame(loop);
    },
  });

  function choiceCard(icon, name, desc, tag, onPick, id) {
    const b = document.createElement('button');
    b.className = 'choice';
    if (id) b.id = id;
    b.innerHTML = `<span class="icon">${icon}</span><strong>${name}</strong><span>${desc}</span>${tag ? `<em>${tag}</em>` : ''}`;
    b.onclick = () => { b.blur(); onPick(); };
    return b;
  }

  // ---------- State ----------
  function newState() {
    S = {
      mode: 'choose', weapon: null, wave: 0, time: 0,
      player: { x: W / 2, y: H / 2, hp: 100, maxHp: 100, speed: 200, regen: 0, aim: -Math.PI / 2 },
      mods: { damage: 1, rate: 1, extra: 0, pierce: 0, size: 1, reach: 1, clip: 0, reload: 1 },
      ammo: 0, reloading: 0, // the Arpeggiator's clip
      zombies: [], shots: [], spits: [], sparks: [], texts: [], swings: [],
      queue: [], spawnIn: 0, fireCool: 0, note: 0, shake: 0, hurtFlash: 0, banner: null, spawnerGlow: [0, 0, 0, 0],
      waveStart: null, // upgrades and health at the start of the wave, for retries
      fb: { state: 'idle', cool: FEEDBACK.readyAtStart ? 0 : FEEDBACK.cooldown, charge: 0, t: 0, rings: [], flash: 0 },
    };
    window.__zombie = S; // for automatic tests
  }

  function chooseWeapon(id) {
    S.weapon = id;
    S.ammo = clipSize();
    ui.choose.classList.remove('show');
    Sound.unlock();
    startWave(0);
  }

  function startWave(index) {
    S.wave = index;
    S.mode = 'fight';
    const w = WAVES[index];
    S.queue = [];
    for (const type of Object.keys(ZOMBIES)) for (let i = 0; i < (w[type] || 0); i++) S.queue.push(type);
    S.queue.sort(() => Math.random() - 0.5); // a random mix
    S.spawnIn = 1.5;
    S.zombies = []; S.spits = []; S.shots = [];
    S.banner = { text: `WAVE ${index + 1}${index === WAVES.length - 1 ? ' · FINAL WAVE' : ''}`, t: 2 };
    S.waveStart = { hp: S.player.hp, maxHp: S.player.maxHp, speed: S.player.speed, regen: S.player.regen, mods: { ...S.mods } };
    S.texts = S.texts.filter((t) => !t.big); // only one "New: …" label at a time
    const newType = { 1: 'Brutes', 2: 'Spitters', 3: 'Runners' }[index];
    if (newType) S.texts.push({ x: W / 2, y: H * 0.3 + 34, text: `New: ${newType}`, t: 2.2, big: true });
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && S && S.mode === 'fight') reload(); // reload early
    if (e.code === 'KeyE' && !e.repeat) startCharge();
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.code === 'KeyE') releaseCharge();
  });
  window.addEventListener('blur', () => { paused = true; keys = {}; mouse.down = false; cancelCharge(); });
  window.addEventListener('focus', () => { paused = false; last = performance.now(); });

  // ---------- Attacks ----------
  const clipSize = () => (WEAPONS[S.weapon].clip ? WEAPONS[S.weapon].clip + S.mods.clip : Infinity);
  function reload() {
    if (!WEAPONS[S.weapon].clip || S.reloading > 0 || S.ammo === clipSize()) return;
    S.reloading = WEAPONS[S.weapon].reload * S.mods.reload;
    Sound.whoosh();
  }
  function attack() {
    const p = S.player, w = WEAPONS[S.weapon], m = S.mods;
    if (S.reloading > 0) return;
    if (w.clip) {
      if (S.ammo <= 0) return reload();
      S.ammo -= 1;
      if (S.ammo === 0) reload(); // reload automatically when the clip runs dry
    }
    S.fireCool = w.rate * m.rate;
    const a = p.aim;
    if (S.weapon === 'mic') {
      S.swings.push({ a, t: 0.16 });
      const reach = w.reach * m.reach;
      let hit = false;
      for (const z of S.zombies) {
        const d = Math.hypot(z.x - p.x, z.y - p.y);
        let diff = Math.atan2(z.y - p.y, z.x - p.x) - a;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        if (d < reach + z.size && Math.abs(diff) < w.arc / 2) {
          hurtZombie(z, w.damage * m.damage);
          z.x += Math.cos(a) * 34; z.y += Math.sin(a) * 34; // knockback
          hit = true;
        }
      }
      Sound.whoosh();
      if (hit) Sound.hit();
      return;
    }
    const count = S.weapon === 'arp' ? 1 + m.extra : 1;
    for (let i = 0; i < count; i++) {
      const spread = (i - (count - 1) / 2) * 0.14;
      S.shots.push({
        x: p.x + Math.cos(a) * 18, y: p.y + Math.sin(a) * 18, a: a + spread,
        speed: w.speed, size: w.size * (S.weapon === 'bass' ? m.size : 1), damage: w.damage * m.damage,
        pierce: w.pierce + m.pierce, hits: new Set(), kind: S.weapon, life: S.weapon === 'bass' ? 1.4 : 1.2,
      });
    }
    if (S.weapon === 'arp') Sound.note(AB_ARP[S.note++ % AB_ARP.length] + 12, 0, 0.18, 0.18);
    else Sound.chord([44 - 12, 44 - 5], 0, 0.45, 0.45); // a low A♭ fifth
  }

  // ---------- Feedback (Mic Swing special) ----------
  let whine = null; // the rising feedback tone while charging
  function startCharge() {
    const f = S && S.fb;
    if (!f || S.mode !== 'fight' || S.weapon !== 'mic' || f.state !== 'idle') return;
    if (f.cool > 0) { S.texts.push({ x: S.player.x, y: S.player.y - 30, text: `Feedback in ${formatTime(f.cool)}`, t: 1 }); return; }
    f.state = 'charging';
    f.charge = 0;
    const a = Sound.unlock();
    const osc = a.createOscillator(), wob = a.createOscillator(), wobGain = a.createGain(), gain = a.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2200, a.currentTime + FEEDBACK.charge);
    wob.frequency.value = 7; wobGain.gain.value = 30;
    wob.connect(wobGain).connect(osc.frequency);
    gain.gain.setValueAtTime(0.0001, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.05, a.currentTime + FEEDBACK.charge);
    osc.connect(gain).connect(a.destination);
    osc.start(); wob.start();
    whine = { osc, wob, gain, a };
  }
  function stopWhine() {
    if (!whine) return;
    const { osc, wob, gain, a } = whine;
    gain.gain.cancelScheduledValues(a.currentTime);
    gain.gain.setTargetAtTime(0.0001, a.currentTime, 0.04);
    osc.stop(a.currentTime + 0.3); wob.stop(a.currentTime + 0.3);
    whine = null;
  }
  // Letting go early cancels it, with no cooldown.
  function cancelCharge() {
    if (!S || !S.fb || !['charging', 'full'].includes(S.fb.state)) return;
    S.fb.state = 'idle';
    S.fb.charge = 0;
    stopWhine();
  }
  function releaseCharge() {
    const f = S && S.fb;
    if (!f) return;
    if (f.state === 'charging') return cancelCharge();
    if (f.state !== 'full') return;
    f.state = 'windup';
    f.t = FEEDBACK.windup;
    f.cool = FEEDBACK.cooldown;
    stopWhine();
    // The speakers swell: a low rumble rising into the blast.
    const a = Sound.unlock(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(32, t); o.frequency.exponentialRampToValueAtTime(52, t + FEEDBACK.windup);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(120, t); lp.frequency.exponentialRampToValueAtTime(900, t + FEEDBACK.windup);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + FEEDBACK.windup); g.gain.exponentialRampToValueAtTime(0.0001, t + FEEDBACK.windup + 0.1);
    o.connect(lp).connect(g).connect(a.destination);
    o.start(t); o.stop(t + FEEDBACK.windup + 0.15);
  }
  function blast() {
    const f = S.fb;
    f.state = 'blast';
    f.flash = 0.25;
    f.rings = SPAWNERS.map(([x, y]) => ({ x, y, r: 0, hit: new Set() }));
    S.shake = Math.max(S.shake, 0.6);
    Sound.chord([32, 44, 51, 56], 0, 2, 0.7); // a huge low A♭ chord
    Sound.hit();
    Sound.whoosh();
  }
  function updateFeedback(dt) {
    const f = S.fb;
    if (f.state === 'idle' || f.state === 'charging' || f.state === 'full') f.cool = Math.max(0, f.cool - dt);
    f.flash = Math.max(0, f.flash - dt);
    if (f.state === 'charging') {
      f.charge = Math.min(FEEDBACK.charge, f.charge + dt);
      if (f.charge >= FEEDBACK.charge) { f.state = 'full'; Sound.note(80, 0, 0.25, 0.2); }
    } else if (f.state === 'windup') {
      f.t -= dt;
      if (f.t <= 0) blast();
    } else if (f.state === 'blast') {
      for (const ring of f.rings) {
        ring.r += FEEDBACK.speed * dt;
        for (const z of S.zombies) {
          if (z.dead || ring.hit.has(z)) continue;
          const d = Math.hypot(z.x - ring.x, z.y - ring.y);
          if (d > ring.r) continue;
          ring.hit.add(z);
          hurtZombie(z, z.maxHp * FEEDBACK.share + FEEDBACK.flat * S.mods.damage);
          z.stun = FEEDBACK.stun;
          z.x += ((z.x - ring.x) / (d || 1)) * FEEDBACK.push;
          z.y += ((z.y - ring.y) / (d || 1)) * FEEDBACK.push;
          for (let i = 0; i < 4; i++) spark(z.x, z.y, '#E2D9FF');
        }
        for (const sp of S.spits) if (Math.hypot(sp.x - ring.x, sp.y - ring.y) < ring.r) sp.gone = true;
      }
      if (f.rings.every((r) => r.r > RING_END)) { f.state = 'idle'; f.rings = []; }
    }
  }
  // Ear defenders stay on from the first moment of charging to the last ring.
  const defended = () => S.fb.state !== 'idle';
  const fbLevel = () => (S.fb.state === 'charging' ? S.fb.charge / FEEDBACK.charge : ['full', 'windup'].includes(S.fb.state) ? 1 : 0);
  const formatTime = (sec) => { const t = Math.ceil(sec); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

  function hurtZombie(z, amount) {
    z.hp -= amount;
    z.flash = 0.1;
    if (z.hp <= 0 && !z.dead) {
      z.dead = true;
      for (let i = 0; i < 12; i++) spark(z.x, z.y, ZOMBIES[z.type].body);
      Sound.note(pick(AB_PENTA), 0, 0.3, 0.16);
    }
  }

  function hurtPlayer(amount) {
    const p = S.player;
    p.hp = Math.max(0, p.hp - amount);
    S.hurtFlash = 0.35;
    S.shake = 0.25;
    Sound.squeal();
    if (p.hp <= 0) overrun();
  }

  function spark(x, y, color) {
    const a = rand(0, Math.PI * 2), v = rand(50, 200);
    S.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.25, 0.6), color });
  }

  // ---------- Between waves ----------
  function waveCleared() {
    S.spits = []; S.hurtFlash = 0; S.shake = 0; // nothing left frozen behind the menu
    cancelCharge();
    if (S.fb.state !== 'idle') { S.fb.state = 'idle'; S.fb.rings = []; }
    if (S.wave === WAVES.length - 1) return win();
    S.mode = 'upgrade';
    mouse.down = false;
    Sound.chord([56, 60, 63, 68], 0, 1.4, 0.4);
    ui.upgradeTitle.textContent = `Wave ${S.wave + 1} cleared`;
    ui.upgrades.innerHTML = '';
    const options = UPGRADES.filter((u) => !u.only || [].concat(u.only).includes(S.weapon)).sort(() => Math.random() - 0.5).slice(0, 3);
    for (const u of options) {
      ui.upgrades.appendChild(choiceCard('⬆', u.name, u.desc, '', () => {
        u.apply(S);
        ui.upgrade.classList.remove('show');
        startWave(S.wave + 1);
      }, `upgrade-${u.id}`));
    }
    ui.upgrade.classList.add('show');
  }

  // Overrun: retry the same wave at full health, keeping your upgrades.
  function overrun() {
    S.mode = 'over';
    cancelCharge();
    if (S.fb.state !== 'idle') { S.fb.state = 'idle'; S.fb.rings = []; }
    mouse.down = false;
    ui.endTitle.textContent = 'Overrun';
    ui.endText.textContent = `The horde got you on wave ${S.wave + 1}. Try the wave again: you keep your upgrades.`;
    ui.endButtons.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'primary';
    b.textContent = 'Retry wave';
    b.onclick = () => {
      b.blur();
      const start = S.waveStart;
      Object.assign(S.player, { hp: start.maxHp, maxHp: start.maxHp, speed: start.speed, regen: start.regen, x: W / 2, y: H / 2 });
      S.mods = { ...start.mods };
      S.ammo = clipSize(); S.reloading = 0;
      ui.end.classList.remove('show');
      startWave(S.wave);
    };
    ui.endButtons.append(b);
    ui.end.classList.add('show');
  }

  function win() {
    S.mode = 'won';
    mouse.down = false;
    Sound.chord([44, 56, 60, 63, 68], 0, 2.4, 0.55);
    ui.endTitle.textContent = 'Survived';
    ui.endText.textContent = 'Five waves, and the speakers have finally gone quiet.';
    ui.endButtons.innerHTML = '';
    ui.end.classList.add('show');
    setTimeout(() => Level.win(), 2200);
  }

  // ---------- Game loop ----------
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    if (S && S.mode === 'fight' && !paused) update(dt);
    if (S) draw();
  }

  function update(dt) {
    const p = S.player;
    S.time += dt;

    // Movement (WASD), kept inside the arena
    let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
    const slow = ['charging', 'full', 'windup'].includes(S.fb.state) ? 0.55 : 1; // charging slows you down
    p.x = Math.min(W - 16, Math.max(16, p.x + mx * p.speed * slow * dt));
    p.y = Math.min(H - 16, Math.max(16, p.y + my * p.speed * slow * dt));
    p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);
    p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);

    S.fireCool = Math.max(0, S.fireCool - dt);
    if (S.reloading > 0) {
      S.reloading -= dt;
      if (S.reloading <= 0) { S.reloading = 0; S.ammo = clipSize(); Sound.note(68, 0, 0.15, 0.2); }
    }
    updateFeedback(dt);
    if (mouse.down && S.fireCool <= 0 && slow === 1) attack();

    // Spawning
    S.spawnIn -= dt;
    if (S.queue.length && S.spawnIn <= 0) {
      const type = S.queue.shift();
      const i = Math.floor(Math.random() * SPAWNERS.length);
      const [sx, sy] = SPAWNERS[i];
      const z = ZOMBIES[type];
      S.zombies.push({ type, x: sx + rand(-10, 10), y: sy + rand(-10, 10), hp: z.hp, maxHp: z.hp, size: z.size, attackCool: 0, fireIn: rand(1, z.fire || 1), flash: 0, wobble: rand(0, 6) });
      S.spawnerGlow[i] = 0.5;
      S.spawnIn = WAVES[S.wave].gap * rand(0.7, 1.3);
    }
    S.spawnerGlow = S.spawnerGlow.map((g) => Math.max(0, g - dt));

    // Zombies: walk at you (spitters keep their distance), push apart a little
    for (const z of S.zombies) {
      const t = ZOMBIES[z.type];
      const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy) || 1;
      z.stun = Math.max(0, (z.stun || 0) - dt);
      let dir = z.stun > 0 ? 0 : 1; // staggered by the feedback blast
      if (t.range && !z.stun) dir = d < t.range - 30 ? -0.6 : d > t.range + 20 ? 1 : 0;
      z.x += (dx / d) * t.speed * dir * dt;
      z.y += (dy / d) * t.speed * dir * dt;
      for (const o of S.zombies) {
        if (o === z) continue;
        const ox = z.x - o.x, oy = z.y - o.y, od = Math.hypot(ox, oy);
        const min = z.size + o.size;
        if (od > 0 && od < min) { z.x += (ox / od) * (min - od) * 0.5; z.y += (oy / od) * (min - od) * 0.5; }
      }
      z.x = Math.min(W - 10, Math.max(10, z.x));
      z.y = Math.min(H - 10, Math.max(10, z.y));
      z.attackCool = Math.max(0, z.attackCool - dt);
      z.flash = Math.max(0, z.flash - dt);
      if (d < z.size + 14 && z.attackCool <= 0) { z.attackCool = 0.8; hurtPlayer(t.damage); if (S.mode !== 'fight') return; }
      if (t.fire) {
        z.fireIn -= dt;
        if (z.fireIn <= 0 && d < t.range + 80) {
          z.fireIn = t.fire * rand(0.85, 1.15);
          S.spits.push({ x: z.x, y: z.y, vx: (dx / d) * 170, vy: (dy / d) * 170, life: 3 });
          Sound.note(pick([57, 62, 67]), 0, 0.3, 0.14); // off-key notes: A, D, G aren't in A♭ major
        }
      }
    }

    // Your notes and waves
    for (const s of S.shots) {
      s.x += Math.cos(s.a) * s.speed * dt;
      s.y += Math.sin(s.a) * s.speed * dt;
      s.life -= dt;
      for (const z of S.zombies) {
        if (z.dead || s.hits.has(z) || s.gone) continue;
        if (Math.hypot(z.x - s.x, z.y - s.y) < z.size + s.size) {
          s.hits.add(z);
          hurtZombie(z, s.damage);
          if (s.hits.size > s.pierce) s.gone = true;
        }
      }
    }
    // Spitters' notes
    for (const sp of S.spits) {
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.life -= dt;
      if (Math.hypot(sp.x - p.x, sp.y - p.y) < 18) { sp.gone = true; hurtPlayer(ZOMBIES.spitter.damage); if (S.mode !== 'fight') return; }
    }

    S.sparks.forEach((s) => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; });
    S.texts.forEach((t) => { t.t -= dt; if (!t.big) t.y -= 30 * dt; });
    S.swings.forEach((w) => { w.t -= dt; });
    S.shake = Math.max(0, S.shake - dt);
    S.hurtFlash = Math.max(0, S.hurtFlash - dt);
    if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }

    S.zombies = S.zombies.filter((z) => !z.dead);
    S.shots = S.shots.filter((s) => !s.gone && s.life > 0 && s.x > -40 && s.x < W + 40 && s.y > -40 && s.y < H + 40);
    S.spits = S.spits.filter((s) => !s.gone && s.life > 0);
    S.sparks = S.sparks.filter((s) => s.t > 0);
    S.texts = S.texts.filter((t) => t.t > 0);
    S.swings = S.swings.filter((w) => w.t > 0);

    if (!S.queue.length && !S.zombies.length) waveCleared();
  }

  // ---------- Drawing ----------
  function draw() {
    const p = S.player;
    ctx.save();
    if (S.shake > 0) ctx.translate(rand(-3, 3) * S.shake * 4, rand(-3, 3) * S.shake * 4);
    ctx.fillStyle = '#141219'; ctx.fillRect(-10, -10, W + 20, H + 20);
    // Floor: a dark stage grid
    ctx.strokeStyle = 'rgba(94, 62, 132, 0.12)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    const vignette = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, W * 0.6);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);

    // Spawners: speaker stacks in the corners
    const level = S.fb ? fbLevel() : 0;
    const windup = S.fb && S.fb.state === 'windup' ? 1 - S.fb.t / FEEDBACK.windup : 0;
    SPAWNERS.forEach(([sx, sy], i) => {
      const g = Math.max(S.spawnerGlow[i], level * 0.6 + windup * 0.5);
      const jig = level * 2 + windup * 4; // the stacks shake as the feedback builds
      const x = sx + rand(-jig, jig), y = sy + rand(-jig, jig);
      ctx.fillStyle = '#211e28'; ctx.strokeStyle = '#5E3E84'; ctx.lineWidth = 2;
      roundRect(x - 26, y - 30, 52, 60, 6); ctx.fill(); ctx.stroke();
      for (const cy of [y - 13, y + 13]) {
        ctx.fillStyle = `rgba(154, 127, 224, ${0.35 + g})`;
        ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 6 + g * 40;
        ctx.beginPath(); ctx.arc(x, cy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    });

    drawRings();

    // Spitter notes
    for (const sp of S.spits) {
      ctx.fillStyle = '#7fe0c8'; ctx.shadowColor = '#7fe0c8'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Zombies
    for (const z of S.zombies) {
      const t = ZOMBIES[z.type];
      const bob = Math.sin(S.time * 8 + z.wobble) * 1.5;
      ctx.fillStyle = z.flash > 0 ? '#ffffff' : t.body;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y + bob, z.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (z.type === 'brute') { // headphones on the brutes
        ctx.strokeStyle = '#2a2236'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(z.x, z.y + bob, z.size + 2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      }
      // Eyes, looking at you
      const a = Math.atan2(p.y - z.y, p.x - z.x);
      ctx.fillStyle = t.eye; ctx.shadowColor = t.eye; ctx.shadowBlur = 6;
      for (const side of [-1, 1]) {
        const ex = z.x + Math.cos(a) * z.size * 0.45 + Math.cos(a + Math.PI / 2) * side * z.size * 0.35;
        const ey = z.y + bob + Math.sin(a) * z.size * 0.45 + Math.sin(a + Math.PI / 2) * side * z.size * 0.35;
        ctx.beginPath(); ctx.arc(ex, ey, Math.max(2, z.size * 0.16), 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (z.hp < z.maxHp) {
        ctx.fillStyle = '#26232d'; ctx.fillRect(z.x - z.size, z.y - z.size - 9, z.size * 2, 4);
        ctx.fillStyle = '#ff8fa6'; ctx.fillRect(z.x - z.size, z.y - z.size - 9, z.size * 2 * (z.hp / z.maxHp), 4);
      }
    }

    // Your notes: little notes for the arpeggiator, a wide arc for the bass
    for (const s of S.shots) {
      if (s.kind === 'bass') {
        ctx.strokeStyle = 'rgba(200, 184, 255, 0.85)'; ctx.lineWidth = 5; ctx.shadowColor = '#9A7FE0'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(s.x - Math.cos(s.a) * s.size, s.y - Math.sin(s.a) * s.size, s.size * 1.4, s.a - 0.9, s.a + 0.9); ctx.stroke();
      } else {
        ctx.fillStyle = '#C8B8FF'; ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    // Mic swings
    for (const w of S.swings) {
      const reach = WEAPONS.mic.reach * S.mods.reach;
      ctx.strokeStyle = `rgba(226, 217, 255, ${w.t / 0.16})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, reach, w.a - WEAPONS.mic.arc / 2, w.a + WEAPONS.mic.arc / 2); ctx.stroke();
    }

    drawPlayer(p);

    for (const s of S.sparks) { ctx.globalAlpha = Math.max(0, s.t * 1.8); ctx.fillStyle = s.color; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, t.t * 2);
      ctx.fillStyle = '#C8B8FF'; ctx.font = t.big ? '600 20px Oswald, sans-serif' : '600 15px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (S.hurtFlash > 0) {
      const k = S.hurtFlash / 0.35;
      const rim = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.6);
      rim.addColorStop(0, 'rgba(255, 40, 70, 0)'); rim.addColorStop(1, `rgba(255, 40, 70, ${0.6 * k})`);
      ctx.fillStyle = rim; ctx.fillRect(0, 0, W, H);
    }
    drawFeedbackScreen();
    drawHud();
    if (S.mode === 'fight') drawCrosshair();
  }

  // The shockwaves: a bright front with colour fringes, and the picture
  // behind it torn and pushed outwards, like the air is distorting.
  function drawRings() {
    if (!S.fb || S.fb.state !== 'blast') return;
    for (const ring of S.fb.rings) {
      if (ring.r > RING_END) continue;
      const fade = Math.max(0, 1 - ring.r / RING_END);
      // Distortion trailing behind the front
      for (let i = 0; i < 26; i++) {
        const a = rand(0, Math.PI * 2), back = rand(8, 70);
        const rr = ring.r - back;
        if (rr <= 0) continue;
        const x = ring.x + Math.cos(a) * rr, y = ring.y + Math.sin(a) * rr;
        if (x < 0 || y < 0 || x > W - 40 || y > H - 16) continue;
        const push = (1 - back / 70) * 9;
        ctx.drawImage(canvas, x, y, 40, 14, x + Math.cos(a) * push, y + Math.sin(a) * push, 40, 14);
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // where rings cross in the middle, they add up
      const grad = ctx.createRadialGradient(ring.x, ring.y, Math.max(0, ring.r - 60), ring.x, ring.y, ring.r);
      grad.addColorStop(0, 'rgba(154, 127, 224, 0)');
      grad.addColorStop(1, `rgba(154, 127, 224, ${0.22 * fade})`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.fill();
      for (const [off, color, width] of [[4, `rgba(255, 93, 122, ${0.5 * fade})`, 4], [-4, `rgba(127, 224, 200, ${0.45 * fade})`, 4], [0, `rgba(240, 235, 255, ${0.9 * fade})`, 6], [-22, `rgba(200, 184, 255, ${0.35 * fade})`, 3], [-44, `rgba(200, 184, 255, ${0.18 * fade})`, 2]]) {
        if (ring.r + off <= 0) continue;
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = off === 0 ? 18 : 0;
        ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r + off, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Charging: the edges hum and glitch, and a bar fills in the middle.
  function drawFeedbackScreen() {
    if (!S.fb) return;
    const f = S.fb, level = fbLevel();
    if (level > 0 || f.state === 'windup') {
      const pulse = 0.75 + 0.25 * Math.sin(S.time * (f.state === 'charging' ? 10 : 22));
      const k = f.state === 'windup' ? 1 : level;
      const edge = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.62);
      edge.addColorStop(0, 'rgba(200, 184, 255, 0)');
      edge.addColorStop(1, `rgba(200, 184, 255, ${0.5 * k * pulse})`);
      ctx.fillStyle = edge; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < Math.round(3 + k * 10); i++) {
        const h = rand(2, 7), y = Math.random() < 0.5 ? rand(0, 50 * k) : rand(H - 50 * k, H - h);
        ctx.drawImage(canvas, 0, y, W, h, rand(-8, 8) * k, y, W, h);
      }
    }
    if (f.flash > 0) { ctx.fillStyle = `rgba(240, 235, 255, ${f.flash * 2})`; ctx.fillRect(0, 0, W, H); }
    if (f.state === 'charging' || f.state === 'full') {
      const bw = 280, bx = W / 2 - bw / 2, by = H * 0.3;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E6E1EC'; ctx.font = '600 16px Oswald, sans-serif';
      ctx.fillText(f.state === 'full' ? 'RELEASE E' : 'CHARGING FEEDBACK', W / 2, by - 12);
      ctx.fillStyle = '#26232d'; roundRect(bx, by, bw, 14, 7); ctx.fill();
      const bar = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      bar.addColorStop(0, '#9A7FE0'); bar.addColorStop(1, f.state === 'full' ? '#ffffff' : '#C8B8FF');
      ctx.fillStyle = bar;
      ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = f.state === 'full' ? 10 + 10 * Math.sin(S.time * 16) : 6;
      roundRect(bx, by, bw * level, 14, 7); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawPlayer(p) {
    if (S.reloading > 0) {
      const k = 1 - S.reloading / (WEAPONS[S.weapon].reload * S.mods.reload);
      ctx.strokeStyle = 'rgba(200, 184, 255, 0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
    }
    // Top-down headphones, facing where you aim
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.aim + Math.PI / 2);
    ctx.fillStyle = '#2a2433'; ctx.strokeStyle = '#9A7FE0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#C8B8FF'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 2, 13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    const ear = S.fb && defended();
    ctx.fillStyle = ear ? '#E2D9FF' : '#9A7FE0';
    if (ear) { ctx.shadowColor = '#E2D9FF'; ctx.shadowBlur = 12; }
    // Ear defenders: bigger, padded cups while the feedback is going
    roundRect(ear ? -20 : -17, ear ? -5 : -2, ear ? 10 : 7, ear ? 17 : 12, 4); ctx.fill();
    roundRect(10, ear ? -5 : -2, ear ? 10 : 7, ear ? 17 : 12, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#E2D9FF';
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(5, -15); ctx.lineTo(-5, -15); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawCrosshair() {
    ctx.strokeStyle = 'rgba(226, 217, 255, 0.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x - 13, mouse.y); ctx.lineTo(mouse.x - 4, mouse.y); ctx.moveTo(mouse.x + 4, mouse.y); ctx.lineTo(mouse.x + 13, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 13); ctx.lineTo(mouse.x, mouse.y - 4); ctx.moveTo(mouse.x, mouse.y + 4); ctx.lineTo(mouse.x, mouse.y + 13); ctx.stroke();
  }

  function drawHud() {
    const p = S.player;
    ctx.textAlign = 'left'; ctx.font = '600 14px Oswald, sans-serif';
    ctx.fillStyle = '#E6E1EC'; ctx.fillText('HEALTH', 16, 24);
    ctx.fillStyle = '#26232d'; roundRect(74, 13, 220, 12, 6); ctx.fill();
    const hp = ctx.createLinearGradient(74, 0, 294, 0);
    hp.addColorStop(0, '#ff5d7a'); hp.addColorStop(1, '#ff8fa6');
    ctx.fillStyle = hp; roundRect(74, 13, 220 * (p.hp / p.maxHp), 12, 6); ctx.fill();
    ctx.fillStyle = '#9A93A3'; ctx.font = '500 12px Oswald, sans-serif';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, 302, 24);
    if (S.weapon && WEAPONS[S.weapon].clip) {
      const size = clipSize();
      for (let i = 0; i < size; i++) {
        ctx.fillStyle = i < S.ammo && S.reloading <= 0 ? '#C8B8FF' : '#2c2934';
        const big = size <= 6; // the bass's few big waves get bigger pips
        ctx.beginPath(); ctx.arc(80 + i * (big ? 16 : 11), 40, big ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.textAlign = 'left'; ctx.fillStyle = '#9A93A3'; ctx.font = '500 11px Oswald, sans-serif';
      ctx.fillText(S.reloading > 0 ? 'RELOADING' : S.weapon === 'bass' ? 'WAVES' : 'NOTES', 16, 44);
    }
    if (S.weapon === 'mic') {
      const f = S.fb, ready = f.cool <= 0 && f.state === 'idle';
      ctx.textAlign = 'left'; ctx.font = '500 11px Oswald, sans-serif';
      ctx.fillStyle = ready ? '#E2D9FF' : '#9A93A3';
      ctx.fillText('FEEDBACK', 16, 44);
      ctx.fillStyle = '#26232d'; roundRect(74, 36, 120, 8, 4); ctx.fill();
      ctx.fillStyle = ready ? '#E2D9FF' : '#5E3E84';
      if (ready) { ctx.shadowColor = '#C8B8FF'; ctx.shadowBlur = 8 + 6 * Math.sin(S.time * 4); }
      roundRect(74, 36, 120 * (1 - f.cool / FEEDBACK.cooldown), 8, 4); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = ready ? '#E2D9FF' : '#9A93A3';
      ctx.fillText(ready ? 'READY · HOLD E' : f.state !== 'idle' ? 'IN USE' : formatTime(f.cool), 202, 44);
    }
    if (S.weapon) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#E6E1EC'; ctx.font = '600 14px Oswald, sans-serif';
      ctx.fillText(`WAVE ${S.wave + 1} / ${WAVES.length}`, W - 16, 24);
      ctx.fillStyle = '#9A93A3'; ctx.font = '500 12px Oswald, sans-serif';
      ctx.fillText(`${S.zombies.length + S.queue.length} left · ${WEAPONS[S.weapon].name.toUpperCase()}`, W - 16, 42);
    }
    if (S.banner && S.mode === 'fight') {
      ctx.globalAlpha = Math.min(1, S.banner.t * 1.5);
      ctx.textAlign = 'center'; ctx.font = '600 40px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText(S.banner.text, W / 2, H * 0.3); // above the player, who starts in the middle
      ctx.globalAlpha = 1;
    }
    if (paused && S.mode === 'fight') {
      ctx.textAlign = 'center'; ctx.font = '600 20px Oswald, sans-serif'; ctx.fillStyle = '#E6E1EC';
      ctx.fillText('Paused: click the game to carry on', W / 2, H / 2 + 70);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, Math.max(0, h), r) : ctx.rect(x, y, w, Math.max(0, h));
  }
</script>
</body>
</html>
