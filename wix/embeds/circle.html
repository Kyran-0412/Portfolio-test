/* lib/keys.js */
// Facts about the 12 keys, shared by the embed boxes.
const KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Db', 'Ab', 'Eb', 'Bb', 'F'];

const KEY_INFO = {
  C:    { label: 'C',  minor: 'Am',  signature: 'No sharps or flats', level: 'Tutorial',           semitones: 0 },
  G:    { label: 'G',  minor: 'Em',  signature: '1 sharp',            level: 'Wrong Note',         semitones: 7 },
  D:    { label: 'D',  minor: 'Bm',  signature: '2 sharps',           level: 'Key Signature Lock', semitones: 2 },
  A:    { label: 'A',  minor: 'F♯m', signature: '3 sharps',           level: 'Feedback',           semitones: 9 },
  E:    { label: 'E',  minor: 'C♯m', signature: '4 sharps',           level: 'Melody Memory',      semitones: 4 },
  B:    { label: 'B',  minor: 'G♯m', signature: '5 sharps',           level: 'Fix the Mix',        semitones: 11 },
  'F#': { label: 'F♯', minor: 'D♯m', signature: '6 sharps (or 6 flats as G♭)', level: 'The Tritone', semitones: 6, alt: 'G♭' },
  Db:   { label: 'D♭', minor: 'B♭m', signature: '5 flats',            level: 'Chord Progression',  semitones: 1 },
  Ab:   { label: 'A♭', minor: 'Fm',  signature: '4 flats',            level: 'Survival Waves',     semitones: 8 },
  Eb:   { label: 'E♭', minor: 'Cm',  signature: '3 flats',            level: 'Beat Rebuild',       semitones: 3 },
  Bb:   { label: 'B♭', minor: 'Gm',  signature: '2 flats',            level: 'Arpeggio Rush',      semitones: 10 },
  F:    { label: 'F',  minor: 'Dm',  signature: '1 flat',             level: 'Final Boss',         semitones: 5 },
};

const keyLabel = (key) => KEY_INFO[key].label;

// Root note of a key as a MIDI number, kept between F#3 and F#4.
function rootMidi(key) {
  const s = KEY_INFO[key].semitones;
  return 60 + (s > 6 ? s - 12 : s);
}

<script>
/* lib/bridge.js */
// Talks to the Wix page code around this embed box.
// Keeps saying "ready" until the page answers, in case the page code
// starts listening after the box loads.
const Bridge = (() => {
  const handlers = {};
  const standalone = window.parent === window;
  let answered = false;

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message.type !== 'string' || message.type === 'ready') return;
    answered = true;
    if (handlers[message.type]) handlers[message.type](message);
  });

  function send(message) {
    if (!standalone) window.parent.postMessage(message, '*');
  }

  function start() {
    if (standalone) return;
    let tries = 0;
    const timer = setInterval(() => {
      if (answered || ++tries > 40) clearInterval(timer);
      else send({ type: 'ready' });
    }, 400);
    send({ type: 'ready' });
  }

  return { on: (type, fn) => { handlers[type] = fn; }, send, start, standalone };
})();
</script>

    const charge = named[`${colour}-charge`], hit = named[`${colour}-hit`], beams = named[`${colour}-beam`];
    const loops = beams && Object.keys(beams).length ? beams : null;
    const synth = () => [root, root + 6].map((m) => voice(m, audio().currentTime + 0.01, synthVolume, true)); // a steady hum, not the piano
    const parts = [];
    let chargeParts = charge ? [playBuffer(charge, { volume: LASER_GAIN })] : loops ? synth() : null;
    // With no laser samples at all, the synth tritone carries straight through.
    if (!chargeParts) { const held = synth(); return { live() {}, stop() { held.forEach((v) => v.stop()); } }; }
    parts.push(...chargeParts);
    let isLive = false, stopped = false;
    return {
      live() {
        if (isLive || stopped) return; // a laser stopped already never comes back on
        isLive = true;
        chargeParts.forEach((v) => v.stop(0.04));
        if (hit) parts.push(playBuffer(hit, { volume: LASER_GAIN }));
        if (loops) { const n = nearestIn(loops, root); parts.push(playBuffer(n.buf, { rate: n.rate, loop: true, volume: LASER_GAIN })); }
        else parts.push(...synth());
      },
      stop() { stopped = true; parts.forEach((v) => (v.fadeOut ? v.fadeOut(LASER_FADE) : v.stop(LASER_FADE))); },
    };
  }

  return {
    unlock: audio,
    play,
    // For pages with no piano: call before any sound plays.
    noPiano() { pianoWanted = false; status.total -= Object.keys(SAMPLES).length; },
    // Starts loading straight away, before the first click (it stays silent until then).
    warm() { audio(); },
    reverb(options) { reverbWanted = options || {}; if (ctx && !reverbIn) buildReverb(reverbWanted); },
    get hasReverb() { return !!reverbIn; },
    // Preview only: 'normal', 'wet' (just the reverb, loud enough to judge) or 'off'.
    reverbTest(mode) {
      if (!reverbIn) return;
      const t = ctx.currentTime, mix = (reverbWanted && reverbWanted.mix) || 0.22;
      dry.gain.setTargetAtTime(mode === 'wet' ? 0 : 1, t, 0.02);
      reverbWet.gain.setTargetAtTime(mode === 'off' ? 0 : mode === 'wet' ? 1 : mix, t, 0.02);
    },
    laser,
    instrument,
    track,
    trackNear,
    // A one-shot effect as recorded; null if it isn't loaded.
    sfx(name, volume = SFX_GAIN) { const b = named[name]; return b && b.getChannelData ? playBuffer(b, { volume }) : null; },
    // A seamless loop from a pitched set, shifted to `midi`; null if it isn't loaded.
    loopNear(name, midi, volume = SFX_GAIN) {
      const set = named[name];
      if (!set || set.getChannelData || !Object.keys(set).length) return null;
      const n = nearestIn(set, midi);
      return playBuffer(n.buf, { rate: n.rate, loop: true, volume });
    },
    // Levels list the named sounds they use, so others don't download them.
    preload(names) { names.forEach((n) => { if (!wanted.has(n)) { wanted.add(n); if (ctx) loadNamed(n); } }); },
    has: (name) => !!named[name],
    // Sample loading progress: { total, loaded, blocked, broken, done }.
    get samples() { return { ...status }; },
    onSamples(fn) { onStatus = fn; fn(status); },
    note,
    hold,
    chord,
    // A wrong note: a soft low buzz.
    buzz() {
      const a = audio();
      const t = a.currentTime + 0.02;
      const osc = a.createOscillator();
      const filter = a.createBiquadFilter();
      const gain = a.createGain();
      osc.type = 'square';
      osc.frequency.value = 98;
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(filter).connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.3);
    },
    // Locked door: two dull knocks.
    locked() {
      if (play('door-locked', { volume: 0.38 })) return; // about 2.5 dB under where it started
      thump(0, 120, 55, 0.18, 0.5);
      noise(0, 0.08, 900, 200, 0.25);
      thump(0.11, 110, 50, 0.16, 0.35);
    },
    // Getting hit in a fight: a short, quiet feedback squeal.
    squeal() {
      const a = audio();
      const t = a.currentTime + 0.01;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, t);
      osc.frequency.exponentialRampToValueAtTime(3200, t + 0.25);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.06, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(out);
      osc.start(t);
      osc.stop(t + 0.32);
      noise(0, 0.12, 3000, 800, 0.12);
    },
    // A note landing on the boss.
    hit() { thump(0, 190, 90, 0.12, 0.28); },
    // Ear defenders blocking a note.
    block() { noise(0, 0.1, 5000, 1500, 0.18); },
    // A lock springing open: two clicks and a soft thud.
    unlocked() {
      noise(0, 0.03, 6000, 3000, 0.35);
      noise(0.07, 0.03, 7000, 3500, 0.3);
      thump(0.1, 160, 70, 0.2, 0.35);
    },
    // Door swinging open.
    whoosh() {
      noise(0, 0.6, 300, 2400, 0.12);
    },
    // A key going into the circle: its perfect fifth, then its major triad.
    insert(root) {
      chord([root, root + 7], 0, 0.9, 0.5);
      chord([root, root + 4, root + 7, root + 12], 0.55, 2.4, 0.55);
    },
    // Clicking a lit key on the circle.
    fifth(root) {
      chord([root, root + 7], 0, 1.1, 0.45);
    },
    // Clicking a minor key on the finished circle: its minor triad.
    minor(root) {
      chord([root, root + 3, root + 7], 0, 1.3, 0.45);
    },
    // A low rumble that builds over `rise` seconds; returns stop(fade).
    rumble(rise = 4) {
      const a = audio(), t = a.currentTime + 0.02;
      const len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; } // brown noise
      const src = a.createBufferSource(), lp = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf; src.loop = true;
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(70, t); lp.frequency.linearRampToValueAtTime(160, t + rise);
      const sub = a.createOscillator(), sg = a.createGain();
      sub.frequency.value = 41; sg.gain.value = 0.25;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + rise);
      src.connect(lp).connect(g); sub.connect(sg).connect(g); g.connect(out);
      src.start(t); sub.start(t);
      let stopped = false;
      return {
        stop(fade = 1.5) {
          if (stopped) return;
          stopped = true;
          const now = a.currentTime;
          g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), now);
          g.gain.setTargetAtTime(0.0001, now, fade / 4);
          src.stop(now + fade + 0.2); sub.stop(now + fade + 0.2);
        },
      };
    },
    // Finding a key at the end of a level: a rising arpeggio.
    keyFound(root) {
      [0, 4, 7, 12, 16].forEach((step, i) => note(root + step, i * 0.12, 1.4, 0.35));
    },
  };
})();
</script>
<script>
  const SVG = 'http://www.w3.org/2000/svg';
  const CENTER = 320, OUTER = 236, INNER = 142;
  const $ = (id) => document.getElementById(id);

  const point = (i, r) => {
    const angle = (-90 + i * 30) * Math.PI / 180;
    return [CENTER + r * Math.cos(angle), CENTER + r * Math.sin(angle)];
  };

  function el(name, attrs, parent) {
    const node = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }

  // ---------- Draw the circle ----------
  // The trail runs clockwise from C all the way round (12 units long).
  const [cx0, cy0] = point(0, OUTER);
  const [cx6, cy6] = point(6, OUTER);
  $('trail').setAttribute('d',
    `M${cx0} ${cy0} A${OUTER} ${OUTER} 0 0 1 ${cx6} ${cy6} A${OUTER} ${OUTER} 0 0 1 ${cx0} ${cy0}`);

  const nodes = {};
  const minors = {};
  KEYS.forEach((key, i) => {
    const info = KEY_INFO[key];
    const [x1, y1] = point(i, INNER + 30);
    const [x2, y2] = point(i, OUTER - 44);
    el('line', { class: 'spoke', x1, y1, x2, y2 }, $('spokes'));

    const [mx, my] = point(i, INNER);
    const minor = el('g', { class: 'minor', transform: `translate(${mx} ${my})`, 'data-minor': key }, $('minors'));
    const mbody = el('g', { class: 'body' }, minor);
    el('circle', { class: 'disc', r: 25 }, mbody);
    el('text', { class: 'name', y: 5.5 }, mbody).textContent = info.minor;
    minors[key] = minor;
    // Once the game is beaten, the minor keys play too.
    minor.addEventListener('click', () => playMinor(key));

    const [x, y] = point(i, OUTER);
    const node = el('g', { class: 'node', transform: `translate(${x} ${y})`, 'data-key': key }, $('majors'));
    const body = el('g', { class: 'body' }, node);
    el('circle', { class: 'halo', r: 50, filter: 'url(#soft)' }, body);
    el('circle', { class: 'slot', r: 46 }, body);
    el('circle', { class: 'disc', r: 38 }, body);
    const name = el('text', { class: 'name', y: info.alt ? 3 : 9 }, body);
    name.textContent = info.label;
    if (info.alt) el('text', { class: 'alt', y: 22 }, body).textContent = info.alt;
    nodes[key] = node;

    node.addEventListener('mouseenter', () => showTip(key));
    node.addEventListener('mouseleave', hideTip);
    node.addEventListener('focus', () => showTip(key));
    node.addEventListener('blur', hideTip);
    node.addEventListener('click', () => activate(key));
    node.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(key); }
    });
  });

  // ---------- State ----------
  let progress = null;
  let placing = false;
  let inFinale = false;
  const isComplete = () => progress && progress.placed.length === KEYS.length;
  // For automatic tests: pace < 1 runs the finale faster.
  window.__circle = { pace: 1, get inFinale() { return inFinale; } };

  function render(justPlaced) {
    const placed = progress.placed;
    const next = KEYS[placed.length];
    const holding = Boolean(next) && progress.held.includes(next);

    KEYS.forEach((key) => {
      const node = nodes[key];
      const lit = placed.includes(key);
      const ready = holding && key === next;
      node.classList.toggle('lit', lit);
      node.classList.toggle('ready', ready);
      node.classList.toggle('inserting', key === justPlaced);
      const playable = ready || lit; // placed keys play as soon as they're in
      node.setAttribute('tabindex', playable ? '0' : '-1');
      node.setAttribute('role', playable ? 'button' : 'img');
      node.setAttribute('aria-label', `${KEY_INFO[key].label} major${lit ? ', lit' : ''}${ready ? ', place your key here' : ''}`);
    });

    // Trail joins the placed keys; it closes the loop once all 12 are in.
    const segments = isComplete() ? 12 : Math.max(0, placed.length - 1);
    $('trail').style.strokeDasharray = `${segments} 12`;
    $('trail').style.opacity = segments ? 1 : 0; // no stray dot when empty

    const started = placed.length > 0 || progress.held.length > 0;
    $('circle').classList.toggle('has-progress', started);
    $('count').textContent = `${placed.length} / 12`;
    $('reset').hidden = !started;

    if (isComplete() && !justPlaced) {
      $('circle').classList.add('complete');
      KEYS.forEach((k) => minors[k].classList.add('awake'));
      say('The circle is complete.');
    } else if (!isComplete()) {
      $('circle').classList.remove('complete');
      KEYS.forEach((k) => minors[k].classList.remove('awake'));
    }
  }

  function say(text) {
    const message = $('message');
    message.textContent = text;
    message.classList.toggle('show', Boolean(text));
  }

  Bridge.on('progress', (message) => {
    progress = message.progress;
    placing = false;
    const justPlaced = message.justPlaced || null;
    render(justPlaced);
    if (!justPlaced) return;

    Sound.insert(rootMidi(justPlaced));
    // The first key is the only time the player is pointed onwards.
    if (justPlaced === KEYS[0]) {
      setTimeout(() => say(`Somewhere on the site, a door in ${keyLabel(KEYS[1])} has opened.`), 1800);
    } else {
      say('');
    }
    if (isComplete()) finale();
  });

  // ---------- The finale ----------
  // The last key goes in. The cursor hides, a rumble builds and the circle
  // shakes; every major key plays round from C to F, then the minors play
  // back the other way from Dm to Am, and it all resolves on C major.
  const wait = (s) => new Promise((r) => setTimeout(r, s * 1000 * window.__circle.pace));
  function flare(node) {
    node.classList.remove('flare', 'ping');
    void node.getBBox();
    node.classList.add('flare');
  }
  async function finale() {
    inFinale = true;
    hideTip();
    document.documentElement.classList.add('finale');
    say('');
    await wait(2);
    const rumble = Sound.rumble(6);
    const wrap = $('wrap');
    wrap.classList.add('shaking');
    let shake = 0.6;
    const grow = setInterval(() => { shake = Math.min(4, shake + 0.12); wrap.style.setProperty('--shake', `${shake}px`); }, 250 * window.__circle.pace);
    await wait(1);
    for (const key of KEYS) {                   // C, G, D … F
      flare(nodes[key]);
      Sound.fifth(rootMidi(key));
      await wait(0.5);
    }
    await wait(0.6);
    const back = [...KEYS].reverse();           // Dm, Gm, Cm … Am
    for (const [i, key] of back.entries()) {
      minors[key].classList.add('awake');
      flare(minors[key]);
      Sound.minor(rootMidi(key) - 3);
      await wait(i === 0 ? 2.4 : 0.6);          // a long breath after Dm
    }
    await wait(0.5);
    // Home: C major.
    clearInterval(grow);
    wrap.classList.remove('shaking');
    rumble.stop(1.2);
    Sound.chord([36, 48, 55, 60, 64, 67, 72], 0, 4, 0.7);
    [0, 4, 7, 12, 16, 19, 24].forEach((st, i) => Sound.note(72 + st, 0.35 + i * 0.09, 1.6, 0.25));
    victoryBurst();
    $('circle').classList.add('complete');
    document.documentElement.classList.remove('finale');
    inFinale = false;
    await wait(1.2);
    $('victory').classList.add('show');
    say('The circle is complete.');
  }
  // Rings of light pulsing out from the centre.
  function victoryBurst() {
    for (let i = 0; i < 4; i++) {
      const ring = el('circle', { class: 'burst', cx: CENTER, cy: CENTER, r: 20, 'stroke-width': 6 }, $('circle'));
      ring.animate([{ r: 20, opacity: 0.9, strokeWidth: 8 }, { r: 330, opacity: 0, strokeWidth: 1 }],
        { duration: 1600, delay: i * 260, easing: 'ease-out', fill: 'forwards' }).onfinish = () => ring.remove();
    }
    KEYS.forEach((k) => { flare(nodes[k]); flare(minors[k]); });
  }
  $('victoryClose').onclick = () => $('victory').classList.remove('show');

  function playMinor(key) {
    if (!isComplete() || inFinale) return;
    Sound.unlock();
    Sound.minor(rootMidi(key) - 3);
    minors[key].classList.remove('ping'); void minors[key].getBBox(); minors[key].classList.add('ping');
  }

  function activate(key) {
    if (!progress || inFinale) return;
    const node = nodes[key];
    Sound.unlock();
    if (node.classList.contains('ready') && !placing) {
      placing = true;
      hideTip();
      Bridge.send({ type: 'placeKey', key });
    } else if (node.classList.contains('lit')) { // any placed key plays its fifth
      Sound.fifth(rootMidi(key));
      node.classList.remove('ping');
      void node.getBBox();
      node.classList.add('ping');
    }
  }

  $('reset').onclick = () => {
    if (confirm('Reset all game progress? Every key and door will start again.')) {
      say('');
      Bridge.send({ type: 'reset' });
    }
  };

  // ---------- Tooltip ----------
  function showTip(key) {
    const info = KEY_INFO[key];
    const i = KEYS.indexOf(key);
    const [x, y] = point(i, OUTER);
    const scale = $('circle').getBoundingClientRect().width / 640;
    const node = nodes[key];
    let html = `<strong>${info.label}${info.alt ? ' / ' + info.alt : ''} major</strong>`
      + `<span class="quiet">${info.signature} · relative minor ${info.minor}</span>`;
    if (node.classList.contains('lit')) html += `<br><span class="done">Level ${i + 1}: ${info.level} ✓</span>`;
    if (node.classList.contains('ready')) html += '<br><span class="done">Your key fits here.</span>';
    const tip = $('tip');
    tip.innerHTML = html;
    // Keys near the top show their tip underneath, so it isn't cut off.
    const below = y < 200;
    const half = tip.offsetWidth / 2 + 4;
    const width = $('wrap').clientWidth;
    tip.style.left = `${Math.min(Math.max(x * scale, half), width - half)}px`;
    tip.style.top = `${(below ? y + 52 : y - 52) * scale}px`;
    tip.style.transform = below ? 'translate(-50%, 0)' : '';
    tip.classList.add('show');
  }
  function hideTip() { $('tip').classList.remove('show'); }

  // Shown before the page answers (or when opened on its own): the plain circle.
  progress = { held: [], placed: [] };
  render(null);
  progress = null;
  Sound.warm(); // load the piano now, so the first key inserted already uses it
  Bridge.start();
</script>
</body>
</html>
